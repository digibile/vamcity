name: Deploy AqayeVam to Zilom with a separate restored database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aqayevam-zilom-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout AqayeVam source
        uses: actions/checkout@v4
        with:
          repository: digibile/aqayevam
          ref: main
          path: aqayevam
          persist-credentials: false

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish Linux release
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="aqayevam/recovered-source/LoanSystemAvizhe.Site/LoanSystemAvizhe.Site.csproj"
          test -f "$PROJECT"
          test -s aqayevam/wwwroot/ui/index.html
          cp -a aqayevam/wwwroot/ui aqayevam/recovered-source/LoanSystemAvizhe.Site/wwwroot/ui
          dotnet publish "$PROJECT" -c Release -o "$RUNNER_TEMP/aqayevam-publish" --verbosity minimal
          cp aqayevam/recovered-source/LoanSystemAvizhe.Site/LoanSystem.Site/nlog.config "$RUNNER_TEMP/aqayevam-publish/nlog.config"
          test -s "$RUNNER_TEMP/aqayevam-publish/LoanSystemAvizhe.Site.dll"
          tar -C "$RUNNER_TEMP/aqayevam-publish" -czf "$RUNNER_TEMP/aqayevam-release.tar.gz" .

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          : "$DEPLOY_HOST"
          : "$DEPLOY_USER"
          : "$DEPLOY_SSH_KEY"
          PORT="$DEPLOY_PORT"; [ -n "$PORT" ] || PORT=22
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/aqayevam_key
          chmod 600 ~/.ssh/aqayevam_key
          ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "DEPLOY_PORT_EFFECTIVE=$PORT" >> "$GITHUB_ENV"
          echo "DEPLOY_HOST_EFFECTIVE=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_USER_EFFECTIVE=$DEPLOY_USER" >> "$GITHUB_ENV"

      - name: Copy release
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/aqayevam_key -P "$DEPLOY_PORT_EFFECTIVE" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/aqayevam-release.tar.gz" \
            "$DEPLOY_USER_EFFECTIVE@$DEPLOY_HOST_EFFECTIVE:/tmp/aqayevam-publish-$SHA.tar.gz"

      - name: Restore separate database and route Zilom safely
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/aqayevam_key -p "$DEPLOY_PORT_EFFECTIVE" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER_EFFECTIVE@$DEPLOY_HOST_EFFECTIVE" "bash -s -- '$SHA'" <<'REMOTE'
          set -Eeuo pipefail
          SHA="$1"
          DOMAIN_ROOT=/home/roofixo/domains/roofixo.ir
          OLD_PRIVATE="$DOMAIN_ROOT/vamcity-app/private"
          BASE="$DOMAIN_ROOT/aqayevam-app"
          PRIVATE="$BASE/private"
          RELEASE="$BASE/releases/$SHA"
          SQL_CONTAINER=vamcity-stage-sql
          NETWORK=vamcity-stage-net
          APP_CONTAINER=aqayevam-live-app
          DB_NAME=aqayevam_live
          TAR="/tmp/aqayevam-publish-$SHA.tar.gz"
          SOURCE_BAK="$OLD_PRIVATE/backup/source.bak"
          SQL_ENV="$OLD_PRIVATE/sql.env"
          test -s "$TAR"
          test -s "$SOURCE_BAK" || { echo "SOURCE_DATABASE_BACKUP_MISSING"; exit 1; }
          test -s "$SQL_ENV" || { echo "SQL_ENV_MISSING"; exit 1; }
          docker inspect "$SQL_CONTAINER" >/dev/null
          docker inspect -f '{{.State.Running}}' "$SQL_CONTAINER" | grep -qx true
          docker network inspect "$NETWORK" >/dev/null
          mkdir -p "$PRIVATE" "$BASE/releases" "$PRIVATE/logs" "$RELEASE"
          chmod 700 "$BASE" "$PRIVATE" "$PRIVATE/logs"
          tar -xzf "$TAR" -C "$RELEASE"
          rm -f "$TAR"
          SQL_PASSWORD="$(sed -n 's/^MSSQL_SA_PASSWORD=//p' "$SQL_ENV" | head -1)"
          test -n "$SQL_PASSWORD"
          SQLCMD="$(docker exec "$SQL_CONTAINER" bash -lc 'if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then echo /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then echo /opt/mssql-tools/bin/sqlcmd; fi' | tail -1)"
          test -n "$SQLCMD"
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "SELECT 1" >/dev/null
          docker exec -u 0 "$SQL_CONTAINER" mkdir -p /var/opt/mssql/backup
          docker cp "$SOURCE_BAK" "$SQL_CONTAINER:/var/opt/mssql/backup/aqayevam-source.bak"
          docker exec -u 0 "$SQL_CONTAINER" chown 10001:0 /var/opt/mssql/backup/aqayevam-source.bak
          docker exec -u 0 "$SQL_CONTAINER" chmod 640 /var/opt/mssql/backup/aqayevam-source.bak
          DB_EXISTS="$(docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name = N'$DB_NAME';" | tr -d '[:space:]')"
          if [ "$DB_EXISTS" != "1" ]; then
            FILELIST="$(docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -h -1 -W -s "|" -Q "RESTORE FILELISTONLY FROM DISK = N'/var/opt/mssql/backup/aqayevam-source.bak';" | awk -F'|' 'NF>=3 {gsub(/^[ \t]+|[ \t]+$/, "", $1); gsub(/^[ \t]+|[ \t]+$/, "", $3); if ($1 != "" && ($3 == "D" || $3 == "L")) print $1 "|" $3}')"
            test -n "$FILELIST" || { echo "DATABASE_BACKUP_FILELIST_INVALID"; exit 1; }
            MOVE_ARGS=""
            DATA_N=0
            LOG_N=0
            while IFS='|' read -r LOGICAL TYPE; do
              [ -n "$LOGICAL" ] || continue
              SAFE_LOGICAL="$(printf '%s' "$LOGICAL" | sed "s/'/''/g")"
              if [ "$TYPE" = "D" ]; then
                DATA_N=$((DATA_N+1))
                EXT=ndf; [ "$DATA_N" -ne 1 ] || EXT=mdf
                TARGET="/var/opt/mssql/data/aqayevam_live_data$DATA_N.$EXT"
              else
                LOG_N=$((LOG_N+1))
                TARGET="/var/opt/mssql/data/aqayevam_live_log$LOG_N.ldf"
              fi
              if [ -z "$MOVE_ARGS" ]; then MOVE_ARGS="MOVE N'$SAFE_LOGICAL' TO N'$TARGET"; else MOVE_ARGS="$MOVE_ARGS, MOVE N'$SAFE_LOGICAL' TO N'$TARGET"; fi
            done <<< "$FILELIST"
            RESTORE_SQL="RESTORE DATABASE [$DB_NAME] FROM DISK = N'/var/opt/mssql/backup/aqayevam-source.bak' WITH $MOVE_ARGS, RECOVERY, STATS=5"
            docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "$RESTORE_SQL"
          else
            DB_STATE="$(docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -h -1 -W -Q "SET NOCOUNT ON; SELECT state_desc FROM sys.databases WHERE name = N'$DB_NAME';" | tr -d '[:space:]')"
            [ "$DB_STATE" = ONLINE ] || { echo "EXISTING_DATABASE_NOT_ONLINE=$DB_STATE; refusing to overwrite"; exit 1; }
          fi
          TENANT_COUNT="$(docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT_BIG(*) FROM [$DB_NAME].dbo.Customers;" | tr -d '[:space:]')"
          CUSTOMER_CODE="$(docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -h -1 -W -Q "SET NOCOUNT ON; SELECT TOP (1) Code FROM [$DB_NAME].dbo.Customers;" | tr -d '[:space:]')"
          if [ "$TENANT_COUNT" != "1" ] || ! [[ "$CUSTOMER_CODE" =~ ^[0-9]+$ ]] || [ "$CUSTOMER_CODE" -le 0 ]; then
            echo "DATABASE_TENANT_VALIDATION_FAILED tenant_count=$TENANT_COUNT customer_code=$CUSTOMER_CODE"
            exit 1
          fi
          APP_SECRET="$(sed -n 's/^AppConfig__JwtSecretKey=//p' "$PRIVATE/app.env" 2>/dev/null | head -1)"
          [ -n "$APP_SECRET" ] || APP_SECRET="$(openssl rand -hex 32)"
          umask 077
          printf 'ASPNETCORE_URLS=http://+:8080\nASPNETCORE_ENVIRONMENT=Production\nConnectionStrings__DefaultConnection=Server=%s,1433;Database=%s;User Id=sa;Password=%s;Encrypt=False;TrustServerCertificate=True;\nAppConfig__JwtSecretKey=%s\nAppConfig__IsCloud=false\nAppConfig__CustomerCode=%s\nAppConfig__BaseUrl=https://zilom.ir\nAppConfig__FrontUrl=https://zilom.ir\n' \
            "$SQL_CONTAINER" "$DB_NAME" "$SQL_PASSWORD" "$APP_SECRET" "$CUSTOMER_CODE" > "$PRIVATE/app.env"
          chmod 600 "$PRIVATE/app.env"
          mkdir -p "$OLD_PRIVATE/uploads"
          if docker inspect "$APP_CONTAINER" >/dev/null 2>&1; then docker rm -f "$APP_CONTAINER" >/dev/null; fi
          docker pull mcr.microsoft.com/dotnet/aspnet:10.0
          docker run -d --name "$APP_CONTAINER" --restart unless-stopped --network "$NETWORK" --memory=1g --memory-swap=1g \
            --env-file "$PRIVATE/app.env" --publish=127.0.0.1:5188:8080 \
            -v "$RELEASE:/app" -v "$OLD_PRIVATE/uploads:/app/uploads" -v "$PRIVATE/logs:/app/logs" \
            -w /app --entrypoint dotnet mcr.microsoft.com/dotnet/aspnet:10.0 LoanSystemAvizhe.Site.dll >/dev/null
          HEALTH=000
          for ATTEMPT in $(seq 1 36); do
            HEALTH="$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:5188/login/ || true)"
            case "$HEALTH" in 200|301|302|307|308) break ;; esac
            sleep 5
          done
          echo "AQAYEVAM_LOCAL_LOGIN_HTTP=$HEALTH"
          if ! [[ "$HEALTH" =~ ^(200|301|302|307|308)$ ]]; then docker logs --tail 180 "$APP_CONTAINER" || true; exit 1; fi

          CUSTOM=/usr/local/directadmin/data/users/roofixo/domains/zilom.ir.cust_nginx
          GENERATED=/usr/local/directadmin/data/users/roofixo/nginx.conf
          DOMAIN_CONF=/usr/local/directadmin/data/users/roofixo/domains/zilom.ir.conf
          test -s "$DOMAIN_CONF"; test -s "$GENERATED"
          DOMAIN_IP="$(awk -F= '$1=="ip" {print $2; exit}' "$DOMAIN_CONF")"
          test -n "$DOMAIN_IP"
          BACKUP_DIR="$PRIVATE/nginx-backups/$SHA"
          mkdir -p "$BACKUP_DIR"; chmod 700 "$PRIVATE/nginx-backups" "$BACKUP_DIR"
          if [ -f "$CUSTOM" ]; then cp -p "$CUSTOM" "$BACKUP_DIR/custom.before"; echo existing > "$BACKUP_DIR/custom.state"; else : > "$BACKUP_DIR/custom.before"; echo absent > "$BACKUP_DIR/custom.state"; fi
          cp -p "$GENERATED" "$BACKUP_DIR/generated.before"
          rollback_nginx() {
            if [ "$(cat "$BACKUP_DIR/custom.state")" = existing ]; then cp -p "$BACKUP_DIR/custom.before" "$CUSTOM"; else rm -f "$CUSTOM"; fi
            cp -p "$BACKUP_DIR/generated.before" "$GENERATED"
            printf 'action=rewrite&value=nginx&user=roofixo\n' >> /usr/local/directadmin/data/task.queue
            /usr/local/directadmin/dataskq d >/dev/null 2>&1 || true
            nginx -t && systemctl reload nginx || true
          }
          python3 - "$CUSTOM" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          old = p.read_text() if p.exists() else ""
          begin, end = "# VAMCITY_ZILOM_PROXY_BEGIN", "# VAMCITY_ZILOM_PROXY_END"
          if begin in old and end in old:
              a = old.index(begin); b = old.index(end, a) + len(end)
              old = old[:a] + old[b:]
          if re.search(r'(?m)^\s*location\s+(?:=\s*)?/(?:\s|\{)', old):
              raise SystemExit("STOP: existing unmarked root location; config preserved")
          block = '''
          # VAMCITY_ZILOM_PROXY_BEGIN
          location / {
              proxy_pass http://127.0.0.1:5188;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 180s;
          }
          # VAMCITY_ZILOM_PROXY_END
          '''
          p.write_text(old.rstrip() + "\n" + block.lstrip())
          PY
          chown roofixo:roofixo "$CUSTOM"; chmod 644 "$CUSTOM"
          printf 'action=rewrite&value=nginx&user=roofixo\n' >> /usr/local/directadmin/data/task.queue
          /usr/local/directadmin/dataskq d
          if ! nginx -t || ! grep -Fq 'proxy_pass http://127.0.0.1:5188;' "$GENERATED"; then rollback_nginx; echo "NGINX_VALIDATION_FAILED_ROLLED_BACK"; exit 1; fi
          systemctl reload nginx
          LOCAL_LOGIN="$(curl -k -sS --max-time 20 --resolve "zilom.ir:443:127.0.0.1" -o "/tmp/aqayevam-login-local-$SHA.html" -w '%{http_code}' https://zilom.ir/login/ || true)"
          PUBLIC_LOGIN="$(curl -k -sS --max-time 20 --resolve "zilom.ir:443:$DOMAIN_IP" -o "/tmp/aqayevam-login-public-$SHA.html" -w '%{http_code}' https://zilom.ir/login/ || true)"
          LOCAL_ROOT="$(curl -k -sS --max-time 20 --resolve "zilom.ir:443:127.0.0.1" -o "/tmp/aqayevam-root-local-$SHA.html" -w '%{http_code}' https://zilom.ir/ || true)"
          echo "ZILOM_LOGIN_LOCAL_HTTP=$LOCAL_LOGIN"
          echo "ZILOM_LOGIN_PUBLIC_HTTP=$PUBLIC_LOGIN"
          echo "ZILOM_ROOT_LOCAL_HTTP=$LOCAL_ROOT"
          if ! [[ "$LOCAL_LOGIN" =~ ^(200|301|302|307|308)$ ]] || ! [[ "$PUBLIC_LOGIN" =~ ^(200|301|302|307|308)$ ]] || ! [[ "$LOCAL_ROOT" =~ ^(200|301|302|307|308)$ ]]; then
            rollback_nginx
            echo "PUBLIC_CHECK_FAILED; previous Zilom route restored"
            exit 1
          fi
          echo "AQAYEVAM_ZILOM_DEPLOYMENT_OK"
          REMOTE
