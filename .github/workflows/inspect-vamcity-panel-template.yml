name: Inspect VamCity panel template and auth integration
run-name: Inspect panel template and existing login session

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-vamcity-panel-template.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"; test -n "$DEPLOY_USER"; test -n "$DEPLOY_SSH_KEY"
          PORT="${DEPLOY_PORT:-22}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          ssh-keyscan -T 10 -p "$PORT" "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "DEPLOY_PORT_EFFECTIVE=$PORT" >> "$GITHUB_ENV"
          echo "DEPLOY_HOST_EFFECTIVE=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_USER_EFFECTIVE=$DEPLOY_USER" >> "$GITHUB_ENV"
      - name: Read-only template and auth inspection
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/deploy_key" -p "$DEPLOY_PORT_EFFECTIVE" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes "$DEPLOY_USER_EFFECTIVE@$DEPLOY_HOST_EFFECTIVE" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE=/home/roofixo/domains/roofixo.ir/public_html
          for f in "$BASE/vamcity-template-preview/index.html" "$BASE/vamcity-template-management/index.html" "$BASE/vamcity-template-management.html"; do
            if [ -f "$f" ]; then
              echo "=== FILE $f ==="
              stat -c 'BYTES=%s MTIME=%y' "$f"
              grep -oE '<title>[^<]*</title>' "$f" | head -1 || true
              echo "-- external and local scripts/styles --"
              grep -oE '(src|href)="[^"]+\.(js|css)(\?[^"]*)?"' "$f" | head -30 || true
              echo "-- auth and api markers --"
              grep -oiE '.{0,80}(localStorage|sessionStorage|accessToken|refreshToken|Authorization|Bearer|/api/|login|logout|role|admin).{0,120}' "$f" | head -35 || true
            else
              echo "MISSING_FILE=$f"
            fi
          done
          echo "=== LIVE APP LOGIN STORAGE MARKERS ==="
          APP="$BASE/vamcity-app/current/wwwroot/ui/js/app.e76ab352.js"
          if [ -f "$APP" ]; then
            grep -oE '.{0,70}(localStorage|sessionStorage|accessToken|refreshToken|Authorization|Bearer|token|login).{0,100}' "$APP" | head -45 || true
          else
            echo "APP_BUNDLE_NOT_FOUND_AT_CURRENT_SYMLINK"
          fi
          echo "READ_ONLY_TEMPLATE_INSPECTION_COMPLETE=1"
          REMOTE
