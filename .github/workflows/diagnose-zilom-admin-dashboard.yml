name: Diagnose zilom admin dashboard blank page

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-zilom-admin-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture browser errors and asset failures
        run: |
          set -euo pipefail
          cat > /tmp/diagnose.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1000}});
            const failed = [];
            const consoleErrors = [];
            const pageErrors = [];
            page.on('requestfailed', r => failed.push({url:r.url(), error:r.failure()?.errorText}));
            page.on('response', r => { if (r.status() >= 400) failed.push({url:r.url(), status:r.status()}); });
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('pageerror', e => pageErrors.push(e.stack || e.message));
            const url = 'https://zilom.ir/admin/dashboard/';
            const response = await page.goto(url,{waitUntil:'networkidle',timeout:60000}).catch(e => { consoleErrors.push('NAVIGATION: '+e.message); return null; });
            await page.waitForTimeout(5000);
            await page.screenshot({path:'/tmp/zilom-admin-dashboard.png',fullPage:true}).catch(()=>{});
            console.log('URL='+page.url());
            console.log('HTTP='+(response ? response.status() : 'none'));
            console.log('TITLE='+await page.title());
            console.log('BODY_TEXT='+JSON.stringify((await page.locator('body').innerText().catch(()=>'' )).slice(0,4000)));
            console.log('ROOT_HTML='+JSON.stringify((await page.locator('#app').innerHTML().catch(()=>'' )).slice(0,3000)));
            console.log('PAGE_ERRORS='+JSON.stringify(pageErrors,null,2));
            console.log('CONSOLE_ERRORS='+JSON.stringify(consoleErrors,null,2));
            console.log('FAILED_REQUESTS='+JSON.stringify(failed,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/diagnose.cjs 2>&1 | tee /tmp/zilom-dashboard-diagnostics.txt

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zilom-admin-dashboard-diagnostics
          path: |
            /tmp/zilom-dashboard-diagnostics.txt
            /tmp/zilom-admin-dashboard.png
          if-no-files-found: warn
