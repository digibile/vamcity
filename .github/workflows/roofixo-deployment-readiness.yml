name: Roofixo deployment readiness check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/roofixo-deployment-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Roofixo host without changing it
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/roofixo_key
          chmod 600 ~/.ssh/roofixo_key
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/roofixo_key -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "=== IDENTITY / PERMISSIONS ==="
          id
          printf 'HOME=%s\n' "$HOME"
          for p in /home/roofixo /home/roofixo/domains/roofixo.ir /home/roofixo/domains/roofixo.ir/public_html /home/roofixo/domains/roofixo.ir/vamcity-app /usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.cust_nginx; do
            if [ -e "$p" ]; then
              ls -ld "$p"
              [ -w "$p" ] && echo "WRITABLE=yes $p" || echo "WRITABLE=no $p"
            else
              echo "EXISTS=no $p"
              parent="$(dirname "$p")"
              [ -w "$parent" ] && echo "PARENT_WRITABLE=yes $parent" || echo "PARENT_WRITABLE=no $parent"
            fi
          done
          echo "=== SUDO ==="
          sudo -n -l 2>&1 | head -25
          echo "=== RUNTIMES ==="
          dotnet --list-runtimes 2>&1
          echo "=== DATABASE PORT CHECK ==="
          for h in 127.0.0.1 localhost; do timeout 2 bash -c ":</dev/tcp/$h/1433" 2>/dev/null && echo "SQLSERVER_1433_$h=reachable" || echo "SQLSERVER_1433_$h=unreachable"; done
          echo "=== SITE STATUS ==="
          for u in https://roofixo.ir http://roofixo.ir; do curl -k -L -sS -o /dev/null --max-time 8 -w "$u HTTP=%{http_code}\n" "$u" || true; done
          echo "=== ZIP CONFIG FILE NAMES (VALUES NEVER PRINTED) ==="
          ZIP=/home/roofixo/domains/roofixo.ir/public_html/vamcity.zip
          if [ -f "$ZIP" ]; then
            unzip -Z1 "$ZIP" | grep -Ei '(^|/)(appsettings[^/]*\.json|.*\.runtimeconfig\.json)$' | head -40
            echo "=== ZIP APPSETTINGS KEY NAMES ==="
            for f in $(unzip -Z1 "$ZIP" | grep -E '(^|/)appsettings[^/]*\.json$' | head -10); do
              echo "FILE=$f"
              unzip -p "$ZIP" "$f" 2>/dev/null | python3 -c 'import json,sys; 
try:
 d=json.load(sys.stdin)
 def walk(x,p=""):
  if isinstance(x,dict):
   for k,v in x.items():
    q=(p+"__"+k) if p else k
    if isinstance(v,(dict,list)): walk(v,q)
    else: print(q+"="+("[configured]" if v not in (None,"") else "[empty]"))
  elif isinstance(x,list):
   for v in x: walk(v,p)
 walk(d)
except Exception: print("[invalid json]")' | sed -E 's/((Password|Pwd|Secret|Token|ApiKey|ConnectionString)[^=]*)=.*/\1=[redacted]/I' | head -100
            done
          else
            echo "ZIP_MISSING"
          fi
          echo "=== PROCESS / PORTS ==="
          ps -eo user,pid,args | grep -E '[d]otnet|[k]estrel|[n]ginx' | head -40
          ss -ltn 2>/dev/null | grep -E ':(80|443|1433|5187)\b' || true
          echo "=== END READ-ONLY CHECK ==="
          REMOTE
