name: Diagnose VamCity login, HTTP 400 and admin routes
run-name: Trace live login 400 responses and admin routes
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-vamcity-login.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vamcity-login-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          PORT="${DEPLOY_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/vamcity-diagnostic-key"
          chmod 600 "$RUNNER_TEMP/vamcity-diagnostic-key"
          ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "PORT=$PORT" >> "$GITHUB_ENV"
          echo "HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "USER=$DEPLOY_USER" >> "$GITHUB_ENV"
      - name: Diagnose routes and login API safely
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/vamcity-diagnostic-key" -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -u
          echo "=== SERVICE STATE ==="
          docker inspect -f 'APP_RUNNING={{.State.Running}} APP_STATUS={{.State.Status}}' vamcity-stage-app 2>/dev/null || true
          docker inspect -f 'SQL_RUNNING={{.State.Running}} SQL_STATUS={{.State.Status}}' vamcity-stage-sql 2>/dev/null || true
          nginx -t 2>&1 | tail -3
          echo "=== PUBLIC GET ROUTES ==="
          for route in / /login/ /register/0/ /admin/dashboard /vamcity-template-preview/ /plans.html /cl/plans/; do
            status="$(curl -k -sS -L -o /dev/null --max-time 15 -w '%{http_code}' "https://roofixo.ir$route" 2>/dev/null || echo CURL_ERROR)"
            printf 'PUBLIC_ROUTE %s HTTP=%s\n' "$route" "$status"
          done
          echo "=== AUTH API RESPONSES FOR A NONEXISTENT DIAGNOSTIC USER ==="
          for path in /api/token /api/token/; do
            body="$(mktemp)"
            status="$(curl -sS -o "$body" --max-time 12 -w '%{http_code}' -X POST -H 'Host: roofixo.ir' -H 'Content-Type: application/x-www-form-urlencoded' --data 'username=__diagnostic_invalid_user__&password=__diagnostic_invalid_password__' "http://127.0.0.1:5187$path" 2>/dev/null || echo CURL_ERROR)"
            printf 'AUTH_API %s HTTP=%s ' "$path" "$status"
            python3 - "$body" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          raw = p.read_text(errors="replace")[:3000]
          try:
              obj = json.loads(raw)
              print("JSON_KEYS=" + ",".join(sorted(obj.keys())[:20]))
              for k in ("error", "message", "title", "status", "detail"):
                  v = obj.get(k)
                  if isinstance(v, (str, int, float)):
                      print(k.upper() + "=" + str(v).replace("\\n", " ")[:180], end=" ")
              print()
          except Exception:
              print("BODY_TYPE=non-json BODY_BYTES=" + str(p.stat().st_size))
          PY
            rm -f "$body"
          done
          echo "=== RECENT HTTP 400 ROUTE COUNTS (PATH ONLY; QUERY STRIPPED) ==="
          for LOG in /var/log/nginx/domains/roofixo.ir.log /var/log/nginx/access.log /var/log/nginx/domains/roofixo.ir.ssl.log; do
            if [ -r "$LOG" ]; then
              echo "ACCESS_LOG=$LOG"
              python3 - "$LOG" <<'PY'
          import collections, pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          lines = path.read_text(errors="replace").splitlines()[-4000:]
          counts = collections.Counter()
          pattern = re.compile(r'"(?:GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD) ([^ ?" ]+)(?:\\?[^ "]*?)? HTTP/[^"]+" (\\d{3})')
          for line in lines:
              match = pattern.search(line)
              if match and match.group(2) == "400":
                  counts[match.group(1)] += 1
          for route, count in sorted(counts.items()):
              print(f"HTTP400_PATH={route} COUNT={count}")
          PY
            fi
          done
          echo "=== API TOKEN NORMALIZATION CHECK ==="
          for API_PATH in /api/token /api/token/; do
            BODY="$(mktemp)"
            STATUS="$(curl -sS -o "$BODY" --max-time 12 -w '%{http_code}' -X POST -H 'Host: roofixo.ir' -H 'Content-Type: application/x-www-form-urlencoded;charset=utf-8' --data 'username=__diagnostic_invalid_user__&password=__diagnostic_invalid_password__' "http://127.0.0.1:5187$API_PATH" 2>/dev/null || echo CURL_ERROR)"
            printf 'LOGIN_ENDPOINT=%s HTTP=%s BODY_BYTES=%s\\n' "$API_PATH" "$STATUS" "$(wc -c < "$BODY")"
            rm -f "$BODY"
          done
          echo "=== RECENT APP HTTP400 SIGNAL COUNT (NO RAW LOGS) ==="
          docker logs --since 90m vamcity-stage-app 2>&1 | grep -Eic '400|BadRequest|ModelState|invalid model|validation failed' | awk '{print "APP_HTTP400_SIGNAL_LINES=" $1}' || true
          echo "=== RECENT ERROR SIGNAL COUNTS (NO LOG CONTENT EXPOSED) ==="
          docker logs --since 30m vamcity-stage-app 2>&1 | grep -Eic 'exception|unhandled|error|failed|login' | awk '{print "APP_ERROR_SIGNAL_LINES=" $1}' || true
          echo "=== DATABASE CONTAINER STATE ==="
          docker inspect -f 'SQL_STATUS={{.State.Status}}' vamcity-stage-sql 2>/dev/null || true
          echo "DIAGNOSTICS_COMPLETE"
          REMOTE
