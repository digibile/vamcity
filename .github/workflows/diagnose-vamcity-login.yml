name: Diagnose VamCity login and admin routes
run-name: Diagnose Roofixo login and admin access
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-vamcity-login.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vamcity-login-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          PORT="${DEPLOY_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/vamcity-diagnostic-key"
          chmod 600 "$RUNNER_TEMP/vamcity-diagnostic-key"
          ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "PORT=$PORT" >> "$GITHUB_ENV"
          echo "HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "USER=$DEPLOY_USER" >> "$GITHUB_ENV"
      - name: Check live login, app health, and admin route without changing data
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/vamcity-diagnostic-key" -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -u
          echo "=== CONTAINER STATE ==="
          docker inspect -f 'APP_RUNNING={{.State.Running}} APP_STATUS={{.State.Status}}' vamcity-stage-app 2>/dev/null || true
          docker inspect -f 'SQL_RUNNING={{.State.Running}} SQL_STATUS={{.State.Status}}' vamcity-stage-sql 2>/dev/null || true
          echo "=== NGINX CONFIG ==="
          nginx -t 2>&1 | tail -3
          echo "=== LOCAL APP ROUTES ==="
          for route in / /login/ /register/0/ /api/token /admin/dashboard /cl/plans/ /plans.html; do
            status="$(curl -sS -o /dev/null --max-time 12 -w '%{http_code}' -H 'Host: roofixo.ir' "http://127.0.0.1:5187$route" 2>/dev/null || echo CURL_ERROR)"
            printf 'LOCAL_ROUTE %s HTTP=%s\n' "$route" "$status"
          done
          echo "=== PUBLIC ROUTES ==="
          for route in / /login/ /register/0/ /admin/dashboard /vamcity-template-preview/ /plans.html; do
            status="$(curl -k -sS -L -o /dev/null --max-time 15 -w '%{http_code}' "https://roofixo.ir$route" 2>/dev/null || echo CURL_ERROR)"
            printf 'PUBLIC_ROUTE %s HTTP=%s\n' "$route" "$status"
          done
          echo "=== APP API AUTH ENDPOINT (NO CREDENTIALS, NO DATA CHANGES) ==="
          for path in /api/token /api/token/; do
            status="$(curl -sS -o /dev/null --max-time 12 -w '%{http_code}' -X POST -H 'Host: roofixo.ir' -H 'Content-Type: application/x-www-form-urlencoded' --data 'username=__diagnostic_invalid_user__&password=__diagnostic_invalid_password__' "http://127.0.0.1:5187$path" 2>/dev/null || echo CURL_ERROR)"
            printf 'AUTH_API %s HTTP=%s\n' "$path" "$status"
          done
          echo "=== DATABASE CONNECTIVITY SUMMARY ==="
          docker inspect -f 'SQL_HEALTH={{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' vamcity-stage-sql 2>/dev/null || true
          echo "DIAGNOSTICS_COMPLETE"
          REMOTE
