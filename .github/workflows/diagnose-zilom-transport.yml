name: Inspect zilom runtime deployment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-zilom-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Identify container and deployment configuration for zilom
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"; test -n "$DEPLOY_USER"; test -n "$DEPLOY_SSH_KEY"
          PORT="${DEPLOY_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/diag_key
          chmod 600 ~/.ssh/diag_key
          ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/diag_key -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "=== RUNNING CONTAINERS ==="
          sudo docker ps --no-trunc --format 'NAME={{.Names}} IMAGE={{.Image}} PORTS={{.Ports}} STATUS={{.Status}}'
          echo "=== CONTAINER BINDING 5187 ==="
          CID=$(sudo docker ps -q --filter publish=5187 | head -1)
          if [ -n "$CID" ]; then
            sudo docker inspect "$CID" --format 'NAME={{.Name}} IMAGE={{.Config.Image}} ENTRYPOINT={{json .Config.Entrypoint}} CMD={{json .Config.Cmd}} PORTS={{json .HostConfig.PortBindings}} RESTART={{.HostConfig.RestartPolicy.Name}}'
            sudo docker inspect "$CID" --format 'MOUNTS={{json .Mounts}}'
            sudo docker inspect "$CID" --format 'ENV={{json .Config.Env}}' | sed -E 's/(PASSWORD|PASS|TOKEN|SECRET|KEY|CONNECTIONSTRING)=[^",}]*/\1=[REDACTED]/Ig'
          else
            echo "No container published on 5187"
          fi
          echo "=== COMPOSE AND SERVICE FILES ==="
          sudo find /home/roofixo/domains/zilom.ir /home/roofixo/domains/roofixo.ir/vamcity-app /opt /etc/systemd/system /usr/local/directadmin/data/users/roofixo -maxdepth 5 -type f \( -iname '*compose*.yml' -o -iname '*compose*.yaml' -o -name 'Dockerfile' -o -iname '*vamcity*.service' -o -iname '*zilom*.service' -o -iname '*deploy*.sh' \) -print 2>/dev/null | head -160
          echo "=== DOMAIN FILE HASH AND PUBLIC ASSET TRANSPORT ==="
          sha256sum /home/roofixo/domains/zilom.ir/public_html/LoanSystemAvizhe.Site.dll /home/roofixo/domains/zilom.ir/public_html/js/app.e76ab352.js 2>/dev/null
          for proto in --http1.1 --http2; do
            for p in /js/app.e76ab352.js /js/chunk-vendors.0d0536ea.js; do
              curl "$proto" -k -sS -o /dev/null -w "$proto $p HTTP=%{http_code} bytes=%{size_download} version=%{http_version}\n" --max-time 12 "https://zilom.ir$p" 2>&1
            done
          done
          REMOTE
          rm -f ~/.ssh/diag_key
