name: Inspect zilom dashboard routing and runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-zilom-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-zilom:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect zilom dashboard and app routing
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"; test -n "$DEPLOY_USER"; test -n "$DEPLOY_SSH_KEY"
          PORT="${DEPLOY_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/diag_key
          chmod 600 ~/.ssh/diag_key
          ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/diag_key -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "=== ZILOM CUSTOM NGINX ==="
          sudo sed -n '1,240p' /usr/local/directadmin/data/users/roofixo/domains/zilom.ir.cust_nginx 2>&1
          echo "=== ZILOM DOMAIN CONFIG ==="
          sudo sed -n '1,220p' /usr/local/directadmin/data/users/roofixo/domains/zilom.ir.conf 2>&1
          echo "=== VAMCITY APP DIR ==="
          sudo find /home/roofixo/domains/zilom.ir -maxdepth 4 -type f \( -name '*.dll' -o -name '*.runtimeconfig.json' -o -name 'appsettings*.json' -o -name 'package.json' -o -name 'docker-compose*.yml' -o -name 'Dockerfile' \) -printf '%p\n' 2>/dev/null | head -160
          echo "=== LISTENING APP PORTS ==="
          sudo ss -lntp 2>&1 | grep -E ':(3040|5187)\b' || true
          echo "=== APP RESPONSE 5187 ==="
          curl --http1.1 -sS -o /tmp/zilom-app-page.html -w 'HTTP=%{http_code} bytes=%{size_download}\n' --max-time 10 http://127.0.0.1:5187/admin/dashboard/ 2>&1
          grep -Eo '<script[^>]+src="[^"]+"|<base[^>]+>|<title>[^<]*' /tmp/zilom-app-page.html | head -50
          echo "=== LOCAL STATIC AND API ==="
          for p in /js/app.e76ab352.js /js/chunk-vendors.0d0536ea.js /admin/appSettings/get; do
            curl --http1.1 -sS -o /dev/null -w "$p HTTP=%{http_code} bytes=%{size_download}\n" --max-time 8 "http://127.0.0.1:5187$p" 2>&1
          done
          echo "=== NGINX TEST ==="
          sudo nginx -t 2>&1
          REMOTE
          rm -f ~/.ssh/diag_key
