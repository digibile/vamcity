name: VamCity browser parity check
run-name: Verify deployed VamCity page on reference and Roofixo
# This workflow is rerun after publishing to validate the live release.

on:
  workflow_run:
    workflows: ["Deploy VamCity Linux staging on Roofixo"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify deployed customer and plan UI assets
        run: |
          set -euo pipefail
          HTML="$(curl -fsSL --retry 3 --max-time 30 https://roofixo.ir/)"
          APP_PATH="$(printf '%s' "$HTML" | grep -oE '/js/app\.[a-f0-9]+\.js(\?[^"]*)?' | tail -1)"
          VENDORS_PATH="$(printf '%s' "$HTML" | grep -oE '/js/chunk-vendors\.[a-f0-9]+\.js' | tail -1)"
          CUSTOMER_PATH="$(printf '%s' "$HTML" | grep -oE '/js/views-superAdmin-Customers\.[a-f0-9]+\.js' | head -1)"
          test -n "$APP_PATH"
          test -n "$VENDORS_PATH"
          test -n "$CUSTOMER_PATH"
          for ASSET in "$APP_PATH" "$VENDORS_PATH" "$CUSTOMER_PATH" /css/app.65501a28.css /css/chunk-vendors.c0d350b3.css /myStyle.css; do
            CODE="$(curl -sS -o /dev/null --max-time 30 -w '%{http_code}' "https://roofixo.ir$ASSET")"
            echo "ASSET_HTTP=$CODE PATH=$ASSET"
            test "$CODE" = "200"
          done
          APP="$(curl -fsSL --retry 3 --max-time 30 "https://roofixo.ir$APP_PATH")"
          CUSTOMERS="$(curl -fsSL --retry 3 --max-time 30 "https://roofixo.ir$CUSTOMER_PATH")"
          printf '%s' "$CUSTOMERS" | grep -Fq 'superadmin/customer/list/'
          if printf '%s' "$CUSTOMERS" | grep -Fq 'value:"affCode"},,{text:"آمار"'; then
            echo "CUSTOMER_LIST_HAS_BROKEN_HEADER"
            exit 1
          fi
          PLANS="$(curl -fsSL --retry 3 --max-time 30 https://roofixo.ir/cl/plans/)"
          printf '%s' "$PLANS" | grep -Fq 'وام سیتی'
          LEGACY_HEADERS="$(mktemp)"
          LEGACY_CODE="$(curl -sS -L --max-time 30 -D "$LEGACY_HEADERS" -o /dev/null -w '%{http_code}' https://roofixo.ir/plans/0/)"
          echo "LEGACY_PLANS_ROUTE_HTTP=$LEGACY_CODE"
          grep -Eqi '^location: */cl/plans/' "$LEGACY_HEADERS"
          rm -f "$LEGACY_HEADERS"
          test "$LEGACY_CODE" = "200"
          echo "CUSTOMER_LIST_ASSET_OK"
          echo "PLAN_PAGE_HTTP_AND_CONTENT_OK"

      - name: Compare the real rendered plans pages
        run: |
          mkdir -p artifacts
          cat > browser-check.cjs <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const targets = [
              { name: 'reference', url: 'https://vamcity.com/cl/plans/' },
              { name: 'roofixo', url: 'https://roofixo.ir/plans/0/' }
            ];
            let failed = false;

            for (const target of targets) {
              const page = await browser.newPage({ viewport: { width: 1440, height: 1100 }, deviceScaleFactor: 1 });
              const errors = [];
              page.on('pageerror', error => errors.push('PAGEERROR ' + error.message));
              page.on('requestfailed', request => errors.push('REQUEST_FAILED ' + request.url() + ' ' + (request.failure()?.errorText || 'unknown')));
              page.on('response', response => { if (response.status() >= 400 && new URL(response.url()).hostname === 'roofixo.ir') errors.push('HTTP_' + response.status() + ' ' + response.url()); });
              page.on('console', message => {
                if (message.type() === 'error') errors.push('CONSOLE ' + message.text());
              });

              try {
                const response = await page.goto(target.url, { waitUntil: 'domcontentloaded', timeout: 45000 });
                await page.waitForTimeout(9000);
                const title = await page.title();
                const appText = await page.locator('#app').innerText().catch(() => '');
                const appHtmlLength = await page.locator('#app').innerHTML().then(s => s.length).catch(() => 0);
                const headings = await page.locator('h1,h2,h3').allInnerTexts().catch(() => []);
                const bodyText = (await page.locator('body').innerText().catch(() => '')).replace(/\\s+/g, ' ').trim();

                console.log('=== ' + target.name.toUpperCase() + ' ===');
                console.log('REQUESTED_URL=' + target.url);
                console.log('FINAL_URL=' + page.url());
                console.log('HTTP=' + (response ? response.status() : 'no-response'));
                console.log('TITLE=' + title);
                console.log('APP_HTML_LENGTH=' + appHtmlLength);
                console.log('APP_TEXT_LENGTH=' + appText.length);
                console.log('HEADINGS=' + JSON.stringify(headings.slice(0, 20)));
                console.log('BODY_TEXT_SAMPLE=' + bodyText.slice(0, 1200));
                console.log('BROWSER_ERRORS=' + JSON.stringify(errors.slice(0, 20)));
                await page.screenshot({ path: 'artifacts/' + target.name + '-plans.png', fullPage: true }).catch(() => {});

                if (target.name === 'roofixo') {
                  if (!response || response.status() !== 200 || bodyText.length < 300 || !bodyText.includes('وام سیتی') || !page.url().includes('/cl/plans/')) {
                    console.error('ROOFIXO_RENDER_CHECK_FAILED');
                    failed = true;
                  }
                  if (errors.length) {
                    console.error('ROOFIXO_BROWSER_ERRORS_PRESENT');
                    failed = true;
                  }
                }
              } catch (error) {
                console.error(target.name.toUpperCase() + '_NAVIGATION_ERROR=' + error.message);
                if (target.name === 'roofixo') failed = true;
              } finally {
                await page.close();
              }
            }

            await browser.close();
            if (failed) process.exit(1);
          })();
          NODE
          node browser-check.cjs

      - name: Upload page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vamcity-plans-browser-check
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
