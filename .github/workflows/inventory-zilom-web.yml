name: Inventory zilom web files for safe repository import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inventory-zilom-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect web archive contents and extracted source candidates
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"; test -n "$DEPLOY_USER"; test -n "$DEPLOY_SSH_KEY"
          PORT="${DEPLOY_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/inventory_key
          chmod 600 ~/.ssh/inventory_key
          ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/inventory_key -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set +e
          ZIP=/home/roofixo/domains/zilom.ir/public_html/web.zip
          echo "=== ZIP VALIDATION ==="
          if [ -f "$ZIP" ]; then
            sudo file "$ZIP"
            sudo unzip -t "$ZIP" 2>&1 | tail -8
            echo "=== ZIP CONTENTS (PATH AND SIZE ONLY, FIRST 500) ==="
            sudo zipinfo -1 "$ZIP" 2>/dev/null | head -500
            echo "=== ZIP RISKY FILE PATHS ==="
            sudo zipinfo -1 "$ZIP" 2>/dev/null | grep -Ei '(^|/)(\.env[^/]*|appsettings[^/]*\.json|.*secret.*|.*credential.*|.*password.*|.*\.pem|.*\.key|.*\.pfx|.*\.p12|.*\.sql|.*\.bak|.*\.backup|.*\.mdf|.*\.ldf|.*id_rsa|.*\.pdb)$|(^|/)(App_Data|certs|backups?|database|db)(/|$)' | head -200
            echo "=== ZIP SOURCE INDICATORS ==="
            sudo zipinfo -1 "$ZIP" 2>/dev/null | grep -Ei '(^|/)(package\.json|vite\.config\.[^/]+|next\.config\.[^/]+|webpack\.config\.[^/]+|tsconfig\.json|\.csproj|\.sln|Program\.cs|Startup\.cs|index\.html|README[^/]*|src/|source/|client/|frontend/|web/)' | head -240
          else
            echo "web.zip missing"
          fi
          echo "=== EXTRACTED SOURCE/WEB DIRECTORIES ==="
          for d in /home/roofixo/domains/zilom.ir/public_html/web /home/roofixo/domains/zilom.ir/public_html/www /home/roofixo/domains/zilom.ir/public_html/ui /home/roofixo/domains/zilom.ir/public_html/statics /home/roofixo/domains/zilom.ir/public_html/vamcity-template-preview /home/roofixo/domains/zilom.ir/public_html; do
            if [ -d "$d" ]; then
              echo "--- $d ---"
              sudo find "$d" -maxdepth 3 -type f \( -iname 'package.json' -o -iname '*.csproj' -o -iname '*.sln' -o -iname 'index.html' -o -iname '*.js' -o -iname '*.css' -o -iname '*.html' -o -iname '*.tsx' -o -iname '*.ts' -o -iname '*.vue' -o -iname '*.json' \) ! -iname 'appsettings*.json' -printf '%p\t%s bytes\t%TY-%Tm-%Td %TH:%TM\n' 2>/dev/null | head -180
            fi
          done
          echo "=== POSSIBLE SENSITIVE FILES OUTSIDE ZIP (PATH ONLY) ==="
          sudo find /home/roofixo/domains/zilom.ir -maxdepth 6 -type f \( -iname '*.env*' -o -iname '*secret*' -o -iname '*credential*' -o -iname '*.pem' -o -iname '*.key' -o -iname '*.pfx' -o -iname '*.p12' -o -iname '*.bak' -o -iname '*.backup' -o -iname '*.sql' -o -iname '*.mdf' -o -iname '*.ldf' \) -printf '%p\t%s bytes\n' 2>/dev/null | head -180
          REMOTE
          rm -f ~/.ssh/inventory_key
