name: Inventory zilom web files for safe repository import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inventory-zilom-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect uploaded web archives and extracted files (metadata only)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"; test -n "$DEPLOY_USER"; test -n "$DEPLOY_SSH_KEY"
          PORT="${DEPLOY_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/inventory_key
          chmod 600 ~/.ssh/inventory_key
          ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/inventory_key -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "=== ZILOM DOMAIN ROOTS ==="
          for d in /home/roofixo/domains/zilom.ir /home/roofixo/domains/zilom.ir/public_html /home/roofixo/domains/zilom.ir/private_html /home/roofixo/domains/zilom.ir/public_html/web; do
            if [ -e "$d" ]; then
              echo "--- $d ---"
              sudo find "$d" -maxdepth 3 -type f -printf '%p\t%s bytes\t%TY-%Tm-%Td %TH:%TM\n' 2>/dev/null | sort | head -350
            fi
          done
          echo "=== ARCHIVES / WEB SOURCE CANDIDATES UNDER ROOFIXO ACCOUNT ==="
          sudo find /home/roofixo/domains/zilom.ir /home/roofixo/domains/roofixo.ir/public_html -maxdepth 5 -type f \( -iname '*.zip' -o -iname '*.tar' -o -iname '*.tar.gz' -o -iname '*.tgz' -o -iname '*.7z' -o -iname '*.html' -o -iname 'package.json' -o -iname 'vite.config.*' -o -iname 'next.config.*' -o -iname 'webpack.config.*' \) -printf '%p\t%s bytes\t%TY-%Tm-%Td %TH:%TM\n' 2>/dev/null | sort | head -350
          echo "=== PUBLIC_HTML TOP LEVEL ==="
          sudo ls -lah /home/roofixo/domains/zilom.ir/public_html 2>/dev/null | head -160
          echo "=== EXCLUSION COUNTS (NO CONTENT READ) ==="
          sudo find /home/roofixo/domains/zilom.ir -type f \( -iname '*.env' -o -iname '*secret*' -o -iname '*credential*' -o -iname '*.pem' -o -iname '*.key' -o -iname '*.pfx' -o -iname '*.p12' -o -iname '*.bak' -o -iname '*.backup' -o -iname '*.sql' -o -iname '*.mdf' -o -iname '*.ldf' -o -iname '*.zip' \) -printf '%p\t%s bytes\n' 2>/dev/null | head -160
          REMOTE
          rm -f ~/.ssh/inventory_key
