name: Diagnose VamCity login route behavior
run-name: Trace login routes without changing production configuration
# Read-only diagnostic refresh 2026-10-15: investigate browser smoke-test finding that login/register HTML returns empty visible text.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-vamcity-auth-routes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect direct app and public route responses
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -T 10 -p "$PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          ssh -i "$RUNNER_TEMP/deploy_key" -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== APP ROUTES WITH FORWARDED HOST HEADERS ==="
          for ROUTE in /login/ /cl/login /cl/register; do
            BODY="$(mktemp)"
            HEADERS="$(mktemp)"
            STATUS="$(curl -sS -D "$HEADERS" -H 'Host: roofixo.ir' -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-Host: roofixo.ir' -o "$BODY" --max-time 15 -w '%{http_code}' "http://127.0.0.1:5187$ROUTE" || true)"
            LOCATION="$(grep -i '^location:' "$HEADERS" | tail -1 | tr -d '\r' || true)"
            TITLE="$(grep -oE '<title>[^<]*</title>' "$BODY" | head -1 || true)"
            BUNDLE="$(grep -Eo '/js/app\.[a-f0-9]+\.js' "$BODY" | head -1 || true)"
            echo "APP_FORWARDED_ROUTE=$ROUTE HTTP=$STATUS LOCATION=${LOCATION:-none} TITLE=${TITLE:-none} BUNDLE=${BUNDLE:-missing} BYTES=$(wc -c < "$BODY")"
            rm -f "$BODY" "$HEADERS"
          done
          echo "=== ACTIVE AUTH LOCATION RULES ==="
          grep -n -E -A3 -B2 'location = /(login|cl/login|cl/register)' /usr/local/directadmin/data/users/roofixo/nginx.conf /usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.cust_nginx 2>/dev/null || true
          echo "=== NGINX LOADED AUTH RULES ==="
          nginx -T 2>/dev/null | grep -n -E -A3 -B2 'location = /(login|cl/login|cl/register)|return 302 /;' || true
          echo "=== ALL DOMAIN CONFIGS WITH LOGIN REDIRECTS ==="
          grep -R -n -E 'location = /(login|cl/login|cl/register)|return 302 /;' /usr/local/directadmin/data/users/roofixo /etc/nginx 2>/dev/null | head -100 || true
          echo "=== CUSTOM NGINX AUTH RULES ==="
          grep -n -E -A3 -B2 'location = /(login|cl/login|cl/register)' /usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.cust_nginx 2>/dev/null || true
          for ROUTE in / /login/ /cl/login /cl/register /cl/plans/; do
            BODY="$(mktemp)"
            HEADERS="$(mktemp)"
            STATUS="$(curl -sS -D "$HEADERS" -L -o "$BODY" --max-time 15 -w '%{http_code}' "http://127.0.0.1:5187$ROUTE" || true)"
            FINAL_URL="$(grep -i '^location:' "$HEADERS" | tail -1 | tr -d '\r' || true)"
            TITLE="$(grep -oE '<title>[^<]*</title>' "$BODY" | head -1 || true)"
            BUNDLE="$(grep -Eo '/js/app\.[a-f0-9]+\.js' "$BODY" | head -1 || true)"
            echo "DIRECT_APP_ROUTE=$ROUTE HTTP=$STATUS LAST_LOCATION=${FINAL_URL:-none} TITLE=${TITLE:-none} BUNDLE=${BUNDLE:-missing} BYTES=$(wc -c < "$BODY")"
            rm -f "$BODY" "$HEADERS"
          done
          for ROUTE in / /login/ /cl/login /cl/register /cl/plans/; do
            BODY="$(mktemp)"
            HEADERS="$(mktemp)"
            STATUS="$(curl -k -sS -D "$HEADERS" -L -o "$BODY" --max-time 15 -w '%{http_code}' "https://roofixo.ir$ROUTE" || true)"
            FINAL_URL="$(grep -i '^location:' "$HEADERS" | tail -1 | tr -d '\r' || true)"
            TITLE="$(grep -oE '<title>[^<]*</title>' "$BODY" | head -1 || true)"
            BUNDLE="$(grep -Eo '/js/app\.[a-f0-9]+\.js' "$BODY" | head -1 || true)"
            echo "PUBLIC_ROUTE=$ROUTE HTTP=$STATUS LAST_LOCATION=${FINAL_URL:-none} TITLE=${TITLE:-none} BUNDLE=${BUNDLE:-missing} BYTES=$(wc -c < "$BODY")"
            rm -f "$BODY" "$HEADERS"
          done
          echo "=== PUBLIC SPA ASSET STATUS AND CONTENT TYPES ==="
          for ASSET in /js/chunk-vendors.0d0536ea.js /js/app.e76ab352.js /css/chunk-vendors.c0d350b3.css /css/app.65501a28.css /css/vamcity-modern-theme.css?v=11; do
            BODY="$(mktemp)"
            HEADERS="$(mktemp)"
            STATUS="$(curl -k -sS -D "$HEADERS" -o "$BODY" --max-time 20 -w '%{http_code}' "https://roofixo.ir$ASSET" || true)"
            TYPE="$(grep -i '^content-type:' "$HEADERS" | tail -1 | tr -d '\r' || true)"
            echo "PUBLIC_ASSET=$ASSET HTTP=$STATUS TYPE=${TYPE:-none} BYTES=$(wc -c < "$BODY")"
            if [[ "$ASSET" == *.js* ]]; then
              head -c 100 "$BODY" | tr '\n' ' ' | sed 's/^/ASSET_PREFIX=/'
              echo
            fi
            rm -f "$BODY" "$HEADERS"
          done
          echo "=== APP SCRIPT HASH IN DEPLOYED HTML ==="
          curl -k -sS --max-time 15 https://roofixo.ir/login/ | grep -Eo 'src="[^"]*app\.[a-f0-9]+\.js[^"]*"' | tail -1 || true
          REMOTE
