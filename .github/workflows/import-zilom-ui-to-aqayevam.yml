name: Import full VamCity baseline into AqayeVam # refreshed 2026-10-18 for Zilom login rollout; deploy restored DB to zilom.ir

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-zilom-ui-to-aqayevam.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: import-vamcity-baseline-to-aqayevam
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout VamCity recovery source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Import source and existing Zilom UI into AqayeVam
        env:
          AQAYEVAM_TOKEN: ${{ secrets.AQAYEVAM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "$AQAYEVAM_TOKEN"
          git clone "https://x-access-token:$AQAYEVAM_TOKEN@github.com/digibile/aqayevam.git" "$RUNNER_TEMP/aqayevam"
          TARGET="$RUNNER_TEMP/aqayevam"
          test -d recovered-source
          test -s wwwroot/ui/index.html
          rm -rf "$TARGET/recovered-source"
          cp -a recovered-source "$TARGET/recovered-source"
          find . -maxdepth 1 -type f -name '*.dll' -exec cp -f {} "$TARGET/recovered-source/" \;
          mkdir -p "$TARGET/recovered-source/LoanSystemAvizhe.Site/LoanSystem.Site"
          cp nlog.config "$TARGET/recovered-source/LoanSystemAvizhe.Site/LoanSystem.Site/nlog.config"
          mkdir -p "$TARGET/wwwroot"
          rm -rf "$TARGET/wwwroot/ui"
          cp -a wwwroot/ui "$TARGET/wwwroot/ui"
          mkdir -p "$TARGET/recovered-source/LoanSystemAvizhe.Site/wwwroot"
          rm -rf "$TARGET/recovered-source/LoanSystemAvizhe.Site/wwwroot/ui"
          cp -a wwwroot/ui "$TARGET/recovered-source/LoanSystemAvizhe.Site/wwwroot/ui"
          cat > "$TARGET/.gitignore" <<'EOF'
          **/appsettings*.json
          **/.env
          **/.env.*
          **/*.pfx
          **/*.p12
          **/*.pem
          **/*.key
          **/*.bak
          **/*.mdf
          **/*.ldf
          **/*.sql
          **/logs/
          **/uploads/
          **/private/
          **/secrets/
          EOF
          cat > "$TARGET/README.md" <<'EOF'
          # AqayeVam / Zilom

          Recovery baseline for the existing VamCity application. The existing login and frontend assets are retained.

          - Runtime target: .NET 10.
          - Database: a separate SQL Server database is provisioned on the server. Backups and credentials are never stored in this repository.
          - Never commit appsettings, credentials, private certificates, uploads, logs, or database files.
          - The recovered C# code was decompiled from published assemblies and must pass build/runtime checks before being treated as fully validated.
          EOF
          cd "$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore README.md recovered-source wwwroot/ui
          if ! git diff --cached --quiet; then
            git commit -m "Import VamCity source and existing Zilom UI baseline"
            git push origin HEAD:main
          else
            echo "AQAYEVAM_BASELINE_ALREADY_CURRENT"
          fi

      - name: Dispatch deployment from the verified AqayeVam main branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-aqayevam-zilom.yml --repo digibile/vamcity --ref main
          echo "AQAYEVAM_DEPLOYMENT_DISPATCHED"
