name: Import safe Zilom UI files into aqayevam

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-zilom-ui
  cancel-in-progress: false

jobs:
  import-safe-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate required secrets and prepare SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY secret}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/import_key
          chmod 600 ~/.ssh/import_key
          ssh-keyscan -T 10 -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Fetch allowlisted static UI assets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/import/ui
          ssh -i ~/.ssh/import_key -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'test -d /home/roofixo/domains/zilom.ir/public_html/wwwroot/ui'
          ssh -i ~/.ssh/import_key -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo tar -C /home/roofixo/domains/zilom.ir/public_html -cf - \
              --wildcards --exclude='*appsettings*' --exclude='*.env' \
              --exclude='*.pfx' --exclude='*.p12' --exclude='*.pem' \
              --exclude='*.key' --exclude='*.pdb' --exclude='*.dll' \
              --exclude='*.exe' --exclude='*.zip' --exclude='*.rar' \
              --exclude='*.bak' --exclude='*.sql' --exclude='*.mdf' \
              --exclude='*.ldf' --exclude='*.config' --exclude='*.json' \
              --exclude='*.xml' wwwroot/ui" \
            | tar -xf - -C /tmp/import/ui
          find /tmp/import/ui -type f -size +15M -delete
          if find /tmp/import/ui -type f | grep -Ei '(appsettings|\.env($|\.)|\.pfx$|\.p12$|\.pem$|\.key$|\.pdb$|\.dll$|\.exe$|\.zip$|\.rar$|\.bak$|\.sql$|\.mdf$|\.ldf$|\.config$|\.json$|\.xml$)'; then
            echo "Blocked potentially sensitive or non-static files"
            exit 1
          fi
          find /tmp/import/ui -type f -print
          test "$(find /tmp/import/ui -type f | wc -l)" -gt 0
          echo "Prepared $(find /tmp/import/ui -type f | wc -l) static UI files"

      - name: Commit imported files to aqayevam
        env:
          AQAYEVAM_TOKEN: ${{ secrets.AQAYEVAM_TOKEN }}
        run: |
          set -euo pipefail
          : "${AQAYEVAM_TOKEN:?Missing AQAYEVAM_TOKEN secret; grant Contents read/write access to digibile/aqayevam}"
          git clone "https://x-access-token:${AQAYEVAM_TOKEN}@github.com/digibile/aqayevam.git" /tmp/aqayevam
          mkdir -p /tmp/aqayevam/server-import/zilom-ui
          cp -a /tmp/import/ui/wwwroot/ui/. /tmp/aqayevam/server-import/zilom-ui/
          cat > /tmp/aqayevam/server-import/zilom-ui/IMPORT-NOTES.md <<'NOTES'
          # Zilom UI import

          Static UI assets copied from the deployed Zilom public UI directory.

          This is deployed/build output, not the original editable frontend source. Application binaries, configuration, certificates, database files, archives, and debug symbols are excluded.

          Importing UI assets does not repair dashboard/API behavior. Authenticated API responses and server logs must be validated separately.
          NOTES
          cd /tmp/aqayevam
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server-import/zilom-ui
          if git diff --cached --quiet; then
            echo "No changes to import; repository already has these assets."
            exit 0
          fi
          git commit -m "Import safe Zilom UI assets from server"
          git push origin HEAD:main
