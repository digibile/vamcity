name: Deploy guarded legacy VamCity page chunks
run-name: Publish null-safe dashboard, customer, loan and backup pages

on:
  workflow_run:
    workflows: ["Deploy VamCity UI only (preserve app and database)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vamcity-guarded-legacy-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate runtime mappings and patched bundles
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"views-superAdmin-Customers":"e95d8253"' wwwroot/ui/js/app.e76ab352.js
          grep -Fq '"views-admin-Dashboard":"7e68aa0f"' wwwroot/ui/js/app.e76ab352.js
          grep -Fq '"views-superAdmin-Dashboard":"d97bc32f"' wwwroot/ui/js/app.e76ab352.js
          grep -Fq '"views-admin-Users":"e167c344"' wwwroot/ui/js/app.e76ab352.js
          grep -Fq '"views-admin-Loans":"89862ce8"' wwwroot/ui/js/app.e76ab352.js
          grep -Fq '"views-admin-ManageLoan":"0ac19cc6"' wwwroot/ui/js/app.e76ab352.js
          grep -Fq '"views-admin-AppBackup":"c3ec96a4"' wwwroot/ui/js/app.e76ab352.js
          for f in \
            wwwroot/ui/js/views-superAdmin-Customers.e95d8253.js \
            wwwroot/ui/js/views-admin-Dashboard.7e68aa0f.js \
            wwwroot/ui/js/views-superAdmin-Dashboard.d97bc32f.js \
            wwwroot/ui/js/views-admin-Users.e167c344.js \
            wwwroot/ui/js/views-admin-Loans.89862ce8.js \
            wwwroot/ui/js/views-admin-ManageLoan.0ac19cc6.js \
            wwwroot/ui/js/views-admin-AppBackup.c3ec96a4.js; do
            test -s "$f"
            node --check "$f"
          done
          for asset in \
            /js/views-superAdmin-Customers.e95d8253.js \
            /js/views-admin-Dashboard.7e68aa0f.js \
            /js/views-superAdmin-Dashboard.d97bc32f.js \
            /js/views-admin-Users.e167c344.js \
            /js/views-admin-Loans.89862ce8.js \
            /js/views-admin-ManageLoan.0ac19cc6.js \
            /js/views-admin-AppBackup.c3ec96a4.js; do
            grep -Fq "$asset" wwwroot/ui/index.html
          done
          echo "GUARDED_PAGE_BUNDLES_VALID=1"

      - name: Package guarded page chunks
        run: |
          set -euo pipefail
          tar -czf /tmp/vamcity-page-guards.tar.gz \
            wwwroot/ui/js/views-superAdmin-Customers.e95d8253.js \
            wwwroot/ui/js/views-admin-Dashboard.7e68aa0f.js \
            wwwroot/ui/js/views-superAdmin-Dashboard.d97bc32f.js \
            wwwroot/ui/js/views-admin-Users.e167c344.js \
            wwwroot/ui/js/views-admin-Loans.89862ce8.js \
            wwwroot/ui/js/views-admin-ManageLoan.0ac19cc6.js \
            wwwroot/ui/js/views-admin-AppBackup.c3ec96a4.js
          tar -tzf /tmp/vamcity-page-guards.tar.gz

      - name: Configure SSH and upload
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          PORT="${DEPLOY_PORT:-22}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/vamcity-pages-key"
          chmod 600 "$RUNNER_TEMP/vamcity-pages-key"
          ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "DEPLOY_PORT_EFFECTIVE=$PORT" >> "$GITHUB_ENV"
          echo "DEPLOY_HOST_EFFECTIVE=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_USER_EFFECTIVE=$DEPLOY_USER" >> "$GITHUB_ENV"
          scp -i "$RUNNER_TEMP/vamcity-pages-key" -P "$PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            /tmp/vamcity-page-guards.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/vamcity-page-guards-$GITHUB_SHA.tar.gz"

      - name: Atomically install chunks and verify live URLs
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/vamcity-pages-key" -p "$DEPLOY_PORT_EFFECTIVE" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER_EFFECTIVE@$DEPLOY_HOST_EFFECTIVE" \
            "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          SHA="$1"
          BASE=/home/roofixo/domains/roofixo.ir/vamcity-app
          ARCHIVE="/tmp/vamcity-page-guards-$SHA.tar.gz"
          APP_ROOT="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/app"}}{{.Source}}{{end}}{{end}}' vamcity-stage-app)"
          test -n "$APP_ROOT"
          test -s "$APP_ROOT/wwwroot/index.html"
          test -s "$APP_ROOT/wwwroot/js/app.e76ab352.js"
          test -s "$ARCHIVE"
          TMP="$(mktemp -d)"
          BACKUP="$BASE/private/ui-backups/page-guards-$SHA"
          install -d -m 700 "$BACKUP" "$TMP"
          tar -xzf "$ARCHIVE" -C "$TMP"
          files=(
            views-superAdmin-Customers.e95d8253.js
            views-admin-Dashboard.7e68aa0f.js
            views-superAdmin-Dashboard.d97bc32f.js
            views-admin-Users.e167c344.js
            views-admin-Loans.89862ce8.js
            views-admin-ManageLoan.0ac19cc6.js
            views-admin-AppBackup.c3ec96a4.js
          )
          for f in "${files[@]}"; do
            src="$TMP/wwwroot/ui/js/$f"
            dst="$APP_ROOT/wwwroot/js/$f"
            test -s "$src"
            if [ -s "$dst" ]; then cp -p "$dst" "$BACKUP/$f.before"; echo existing > "$BACKUP/$f.state"; else echo absent > "$BACKUP/$f.state"; fi
          done
          rollback() {
            for f in "${files[@]}"; do
              dst="$APP_ROOT/wwwroot/js/$f"
              if [ -f "$BACKUP/$f.state" ] && [ "$(cat "$BACKUP/$f.state")" = existing ]; then
                cp -p "$BACKUP/$f.before" "$dst"
              else
                rm -f "$dst"
              fi
            done
          }
          started=0
          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$started" = 1 ]; then echo "ROLLING_BACK_GUARDED_PAGE_CHUNKS=1"; rollback || true; fi
            rm -rf "$TMP"
            rm -f "$ARCHIVE"
            exit "$rc"
          }
          trap on_exit EXIT
          started=1
          for f in "${files[@]}"; do
            install -m 644 "$TMP/wwwroot/ui/js/$f" "$APP_ROOT/wwwroot/js/.$f.$SHA.tmp"
            mv -f "$APP_ROOT/wwwroot/js/.$f.$SHA.tmp" "$APP_ROOT/wwwroot/js/$f"
          done
          for f in "${files[@]}"; do
            test -s "$APP_ROOT/wwwroot/js/$f"
            code="$(curl -sS --max-time 12 -o /dev/null -w '%{http_code}' "http://127.0.0.1:5187/js/$f")"
            echo "GUARDED_CHUNK_HTTP=$code FILE=$f"
            test "$code" = 200
          done
          echo "GUARDED_LEGACY_PAGES_DEPLOYED=1"
          echo "DATABASE_TOUCHED=0"
          echo "APP_CONTAINER_RESTARTED=0"
          REMOTE
