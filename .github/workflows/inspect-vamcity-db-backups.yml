name: Inspect VamCity database backups on server

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/inspect-vamcity-db-backups.yml

permissions:
  contents: read

jobs:
  inspect-server-backups:
    runs-on: ubuntu-latest
    steps:
      - name: Validate SSH configuration
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing repository secret: $name"; exit 1; fi
          done

      - name: Inspect backups and target database read-only
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            ROOT="/home/digibail/domains/digebail.ir"
            echo "=== SERVER ==="
            hostname
            date -Is

            echo "=== ARCHIVE CONTENT AND SIGNATURES (READ ONLY) ==="
            for f in \
              "$ROOT/vamcityc_vamcity_2026-10-29_19-20-04.zip" \
              "$ROOT/vamcityc_bluvamdb_2026-10-29_19-19-45.zip" \
              "$ROOT/vamcityc_transferDb_2026-10-29_19-19-51.zip"; do
              if [ ! -f "$f" ]; then echo "MISSING=$f"; continue; fi
              echo "FILE=$f"
              stat -c 'SIZE_BYTES=%s MODIFIED=%y OWNER=%U:%G MODE=%a' "$f"
              sha256sum "$f"
              echo "-- ZIP ENTRY DETAILS --"
              unzip -l "$f" 2>&1 | tail -n 8
              unzip -Z -v "$f" 2>&1 | grep -E 'compressed size|uncompressed size|file security status|compression method|file name:' | head -n 12 || true
              echo "-- INNER FILE TYPE --"
              unzip -p "$f" | file -
              echo "-- FIRST 32 BYTES --"
              unzip -p "$f" | dd bs=1 count=32 2>/dev/null | od -An -tx1c
              echo "-- ARCHIVE INTEGRITY --"
              unzip -t "$f" 2>&1 | tail -n 3
            done

            echo "=== HOST CAPACITY ==="
            df -h "$ROOT" /var/lib/mysql 2>&1 || df -h
            df -i "$ROOT" /var/lib/mysql 2>&1 || true
            free -h

            echo "=== MARIADB SERVICE AND VERSION ==="
            if command -v mariadb >/dev/null 2>&1; then mariadb --version; elif command -v mysql >/dev/null 2>&1; then mysql --version; else echo "MARIADB_CLIENT=NOT_INSTALLED"; fi
            for svc in mariadb mysql; do
              if command -v systemctl >/dev/null 2>&1; then echo "$svc=$(systemctl is-active "$svc" 2>/dev/null || true)"; fi
            done
            if [ -S /var/lib/mysql/mysql.sock ]; then echo "MYSQL_SOCKET=present"; else echo "MYSQL_SOCKET=missing"; fi
            echo "-- LOCAL ROOT SOCKET READ-ONLY CHECK --"
            if command -v mariadb >/dev/null 2>&1; then
              mariadb --protocol=socket -uroot --batch --skip-column-names -e "SELECT VERSION(); SHOW DATABASES;" 2>&1 | sed -E 's/(password|passwd)=([^ ]+)/\1=[REDACTED]/Ig' || true
            elif command -v mysql >/dev/null 2>&1; then
              mysql --protocol=socket -uroot --batch --skip-column-names -e "SELECT VERSION(); SHOW DATABASES;" 2>&1 || true
            fi

            echo "=== DIRECTADMIN MYSQL CONFIG FIELDS (VALUES REDACTED) ==="
            CONF="/usr/local/directadmin/conf/mysql.conf"
            if [ -r "$CONF" ]; then
              stat -c 'CONFIG_OWNER=%U:%G MODE=%a' "$CONF"
              sed -nE 's/^[[:space:]]*([A-Za-z_]+)[[:space:]]*=.*/CONFIG_FIELD=\\1/p' "$CONF"
              DBUSER="$(awk -F= '$1=="user"{print substr($0,index($0,"=")+1); exit}' "$CONF")"
              DBPASS="$(awk -F= '$1=="passwd" || $1=="password"{print substr($0,index($0,"=")+1); exit}' "$CONF")"
              if [ -n "$DBUSER" ] && [ -n "$DBPASS" ]; then
                echo "DIRECTADMIN_DB_AUTH=attempting"
                MYSQL_PWD="$DBPASS" mariadb --protocol=socket -u "$DBUSER" --batch --skip-column-names -e "SELECT VERSION(); SHOW DATABASES;" 2>&1 || true
              else
                echo "DIRECTADMIN_DB_AUTH=credential_fields_missing"
              fi
              unset DBPASS MYSQL_PWD
            else
              echo "DIRECTADMIN_MYSQL_CONF=unreadable"
            fi
            MIGCFG="$ROOT/database/migration/config.php"
            if [ -r "$MIGCFG" ] && command -v php >/dev/null 2>&1; then
              echo "=== MIGRATION CONFIG STRUCTURE (VALUES REDACTED) ==="
              php -r '$c=require $argv[1]; $walk=function($v,$p="") use (&$walk){if(is_array($v)){foreach($v as $k=>$x){$q=$p===""?(string)$k:$p.".".$k; if(is_array($x)){$walk($x,$q);} else {echo "CONFIG_KEY=".$q." TYPE=".gettype($x).PHP_EOL;}}}}; if(is_array($c))$walk($c); else echo "CONFIG_RETURN_TYPE=".gettype($c).PHP_EOL;' "$MIGCFG"
            else
              echo "MIGRATION_CONFIG=NOT_FOUND_OR_PHP_UNAVAILABLE"
            fi

            echo "=== MARIADB PROCESS AND LISTENERS ==="
            ps -eo pid,user,comm,args | grep -E '[m]ariadbd|[m]ysqld' | sed -E 's/(--password=)[^ ]+/\\1[REDACTED]/g' || true
            if command -v ss >/dev/null 2>&1; then ss -lntp 2>/dev/null | grep -E ':3306\\b' || true; fi

            echo "=== RELATED CONTAINERS AND MOUNTS ==="
            if command -v docker >/dev/null 2>&1; then
              docker ps --format '{{.Names}}|{{.Image}}|{{.Status}}|{{.Ports}}' | grep -Ei 'vamcity|sql|mssql|maria|mysql|transfer|bluvam' || true
              for c in vamcity-stage-sql public_html-db-1; do
                if docker inspect "$c" >/dev/null 2>&1; then
                  echo "CONTAINER=$c"
                  docker inspect --format '{{range .Mounts}}{{println .Source "=>" .Destination}}{{end}}' "$c"
                  docker exec "$c" bash -lc '
                    set -eu
                    P="${MSSQL_SA_PASSWORD:-${SA_PASSWORD:-}}"
                    if [ -z "$P" ]; then echo "SQLCMD_AUTH=SA_PASSWORD_NOT_AVAILABLE"; exit 0; fi
                    if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then S=/opt/mssql-tools18/bin/sqlcmd
                    elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then S=/opt/mssql-tools/bin/sqlcmd
                    else echo "SQLCMD=NOT_INSTALLED"; exit 0; fi
                    "$S" -S localhost -U sa -P "$P" -C -W -s "|" -Q "SET NOCOUNT ON; SELECT name,state_desc,compatibility_level FROM sys.databases ORDER BY name;"
                  ' 2>&1 || true
                fi
              done

              echo "=== SQL SERVER BACKUP HEADER METADATA (TEMPORARY COPY ONLY) ==="
              C="vamcity-stage-sql"
              if docker inspect "$C" >/dev/null 2>&1; then
                T="$(mktemp -d /tmp/vamcity-header.XXXXXX)"
                trap 'rm -rf "$T"; docker exec "$C" rm -f /tmp/vamcity-header-*.bak >/dev/null 2>&1 || true' EXIT
                for pair in \
                  "vamcityc_vamcity_2026-10-29_19-20-04.zip|vamcity-main" \
                  "vamcityc_bluvamdb_2026-10-29_19-19-45.zip|vamcity-bluvamdb" \
                  "vamcityc_transferDb_2026-10-29_19-19-51.zip|vamcity-transfer"; do
                  z="${pair%%|*}"
                  n="${pair##*|}"
                  f="$ROOT/$z"
                  [ -f "$f" ] || continue
                  echo "BACKUP_HEADER=$n"
                  unzip -p "$f" > "$T/$n.bak"
                  docker cp "$T/$n.bak" "$C:/tmp/vamcity-header-$n.bak" >/dev/null
                  docker exec -u 0 "$C" chmod 644 "/tmp/vamcity-header-$n.bak"
                  docker exec "$C" bash -lc '
                    set -eu
                    P="${MSSQL_SA_PASSWORD:-${SA_PASSWORD:-}}"
                    if [ -z "$P" ]; then echo "SQLCMD_AUTH=SA_PASSWORD_NOT_AVAILABLE"; exit 0; fi
                    if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then S=/opt/mssql-tools18/bin/sqlcmd
                    elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then S=/opt/mssql-tools/bin/sqlcmd
                    else echo "SQLCMD=NOT_INSTALLED"; exit 0; fi
                    "$S" -S localhost -U sa -P "$P" -C -W -s "|" -Q "$1"

                  ' _ "RESTORE HEADERONLY FROM DISK = N'/tmp/vamcity-header-$n.bak';" 2>&1 || true
                  rm -f "$T/$n.bak"
                done
                echo "=== EXISTING SQL SERVER SOURCE DATABASE TABLE INVENTORY ==="
                for db in vamcityc_vamcity vamcityc_bluvamdb vamcityc_transferDb vamcityc_vamcity_import_20261028 vamcityc_bluvamdb_import_20261028 vamcityc_transferDb_import_20261028; do
                  Q="USE [$db]; SET NOCOUNT ON; SELECT DB_NAME(), SCHEMA_NAME(t.schema_id), t.name, SUM(p.rows) FROM sys.tables t JOIN sys.partitions p ON p.object_id=t.object_id WHERE p.index_id IN (0,1) GROUP BY t.schema_id,t.name ORDER BY t.name;"
                  echo "SOURCE_DATABASE=$db"
                  docker exec "$C" bash -lc '
                    set -eu
                    P="${MSSQL_SA_PASSWORD:-${SA_PASSWORD:-}}"
                    if [ -z "$P" ]; then echo "SQLCMD_AUTH=SA_PASSWORD_NOT_AVAILABLE"; exit 0; fi
                    if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then S=/opt/mssql-tools18/bin/sqlcmd
                    elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then S=/opt/mssql-tools/bin/sqlcmd
                    else echo "SQLCMD=NOT_INSTALLED"; exit 0; fi
                    "$S" -S localhost -U sa -P "$P" -C -W -s "|" -Q "$1"
                  ' _ "$Q" 2>&1 || true
                done
                docker exec "$C" rm -f /tmp/vamcity-header-*.bak >/dev/null 2>&1 || true
                rm -rf "$T"
                trap - EXIT
              else
                echo "VAMCITY_SQL_CONTAINER_NOT_FOUND"
              fi
            else
              echo "DOCKER=NOT_INSTALLED"
            fi
            echo "READ_ONLY_INSPECTION_COMPLETE=1"
