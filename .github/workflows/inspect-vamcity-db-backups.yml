name: Inspect VamCity database backups on server

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/inspect-vamcity-db-backups.yml

permissions:
  contents: read

jobs:
  inspect-server-backups:
    runs-on: ubuntu-latest
    steps:
      - name: Validate SSH configuration
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing repository secret: $name"; exit 1; fi
          done

      - name: Inspect backups and target database read-only
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            ROOT="/home/digibail/domains/digebail.ir"
            echo "=== SERVER ==="
            hostname
            date -Is

            echo "=== ARCHIVE CONTENT AND SIGNATURES (READ ONLY) ==="
            for f in \
              "$ROOT/vamcityc_vamcity_2026-10-29_19-20-04.zip" \
              "$ROOT/vamcityc_bluvamdb_2026-10-29_19-19-45.zip" \
              "$ROOT/vamcityc_transferDb_2026-10-29_19-19-51.zip"; do
              if [ ! -f "$f" ]; then echo "MISSING=$f"; continue; fi
              echo "FILE=$f"
              stat -c 'SIZE_BYTES=%s MODIFIED=%y OWNER=%U:%G MODE=%a' "$f"
              sha256sum "$f"
              echo "-- ZIP ENTRY DETAILS --"
              unzip -l "$f" 2>&1 | tail -n 8
              unzip -Z -v "$f" 2>&1 | grep -E 'compressed size|uncompressed size|file security status|compression method|file name:' | head -n 12 || true
              echo "-- INNER FILE TYPE --"
              unzip -p "$f" | file -
              echo "-- FIRST 32 BYTES --"
              unzip -p "$f" | dd bs=1 count=32 2>/dev/null | od -An -tx1c
              echo "-- ARCHIVE INTEGRITY --"
              unzip -t "$f" 2>&1 | tail -n 3
            done

            echo "=== HOST CAPACITY ==="
            df -h "$ROOT" /var/lib/mysql 2>&1 || df -h
            df -i "$ROOT" /var/lib/mysql 2>&1 || true
            free -h

            echo "=== MARIADB SERVICE AND VERSION ==="
            if command -v mariadb >/dev/null 2>&1; then mariadb --version; elif command -v mysql >/dev/null 2>&1; then mysql --version; else echo "MARIADB_CLIENT=NOT_INSTALLED"; fi
            for svc in mariadb mysql; do
              if command -v systemctl >/dev/null 2>&1; then echo "$svc=$(systemctl is-active "$svc" 2>/dev/null || true)"; fi
            done
            if [ -S /var/lib/mysql/mysql.sock ]; then echo "MYSQL_SOCKET=present"; else echo "MYSQL_SOCKET=missing"; fi
            echo "-- LOCAL ROOT SOCKET READ-ONLY CHECK --"
            if command -v mariadb >/dev/null 2>&1; then
              mariadb --protocol=socket -uroot --batch --skip-column-names -e "SELECT VERSION(); SHOW DATABASES;" 2>&1 | sed -E 's/(password|passwd)=([^ ]+)/\1=[REDACTED]/Ig' || true
            elif command -v mysql >/dev/null 2>&1; then
              mysql --protocol=socket -uroot --batch --skip-column-names -e "SELECT VERSION(); SHOW DATABASES;" 2>&1 || true
            fi

            echo "=== RELATED CONTAINERS ==="
            if command -v docker >/dev/null 2>&1; then
              docker ps --format '{{.Names}}|{{.Image}}|{{.Status}}|{{.Ports}}' | grep -Ei 'vamcity|sql|mssql|maria|mysql|transfer|bluvam' || true
            else
              echo "DOCKER=NOT_INSTALLED"
            fi
            echo "READ_ONLY_INSPECTION_COMPLETE=1"
