name: VamCity roofixo.ir live smoke test
# Diagnostic refresh: compare public DNS routing with the local DirectAdmin vhost after homepage rollout.
run-name: Verify VamCity HTML and assets on roofixo.ir
# Post-vhost-repair smoke run 2026-10-18: confirm legacy loan pages and lazy-loaded assets remain reachable.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/roofixo-live-smoke-test.yml"
      - "wwwroot/ui/myStyle.css"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          PORT="${DEPLOY_PORT:-22}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          ssh-keyscan -T 10 -p "$PORT" "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "DEPLOY_PORT_EFFECTIVE=$PORT" >> "$GITHUB_ENV"
          echo "DEPLOY_HOST_EFFECTIVE=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_USER_EFFECTIVE=$DEPLOY_USER" >> "$GITHUB_ENV"
      - name: Verify live HTML, assets, TLS and app container
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/deploy_key" -p "$DEPLOY_PORT_EFFECTIVE" \
            -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER_EFFECTIVE@$DEPLOY_HOST_EFFECTIVE" 'bash -s' <<'REMOTE'
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          echo "=== DNS ANSWERS ==="
          getent ahostsv4 roofixo.ir | awk '!seen[$1]++ {print "ROOFIXO_A=" $1}' || true
          echo "=== SERVER PUBLIC ADDRESS ==="
          curl -4 -sS --max-time 8 https://api.ipify.org | sed 's/^/SERVER_EGRESS_IP=/' || true
          echo
          echo "=== FORCE LOCAL SERVER VHOST ==="
          STATUS="$(curl -L --resolve roofixo.ir:443:127.0.0.1 -k -sS -o "$TMP/home.html" --max-time 15 -w '%{http_code}' https://roofixo.ir/)"
          echo "ROOFIXO_LOCAL_TLS_HTTP=$STATUS"
          echo "LOCAL_BODY_BYTES=$(wc -c < "$TMP/home.html")"
          echo "LOCAL_BODY_PREFIX=$(head -c 500 "$TMP/home.html" | tr "\n" " " | cut -c1-500)"
          test "$STATUS" = 200
          echo "=== PUBLIC DNS ROUTE ==="
          PUBLIC_STATUS="$(curl -L -k -sS -o "$TMP/public.html" --max-time 15 -w '%{http_code}' https://roofixo.ir/)"
          echo "ROOFIXO_PUBLIC_HTTPS_HTTP=$PUBLIC_STATUS"
          echo "PUBLIC_BODY_BYTES=$(wc -c < "$TMP/public.html")"
          echo "PUBLIC_BODY_PREFIX=$(head -c 500 "$TMP/public.html" | tr "\n" " " | cut -c1-500)"
          echo "=== REFERENCE PLANS ROUTE ==="
          PLANS_STATUS="$(curl -k -sS -D "$TMP/plans.headers" -o "$TMP/plans.html" --max-time 15 -w '%{http_code}' https://roofixo.ir/cl/plans/)"
          PLANS_LOCATION="$(awk 'tolower($1)=="location:" {print $2}' "$TMP/plans.headers" | tail -1 | tr -d '\r')"
          echo "VAMCITY_PLANS_HTTP=$PLANS_STATUS LOCATION=$PLANS_LOCATION"
          echo "VAMCITY_PLANS_BODY_BYTES=$(wc -c < "$TMP/plans.html")"
          if [ "$PLANS_STATUS" = 302 ]; then
            case "$PLANS_LOCATION" in /plans.html|https://roofixo.ir/plans.html) ;; *) echo "UNEXPECTED_PLANS_REDIRECT=$PLANS_LOCATION"; exit 1 ;; esac
          elif [ "$PLANS_STATUS" = 200 ]; then
            grep -q 'id="app"' "$TMP/plans.html"
          else
            echo "VAMCITY_PLANS_HTTP_FAILED=$PLANS_STATUS"; exit 1
          fi
          PLANS_PAGE_STATUS="$(curl -k -sS -o "$TMP/plans-page.html" --max-time 15 -w '%{http_code}' https://roofixo.ir/plans.html)"
          echo "VAMCITY_PLANS_HTML_HTTP=$PLANS_PAGE_STATUS"
          test "$PLANS_PAGE_STATUS" = 200
          grep -q 'طرح‌های تسهیلات' "$TMP/plans-page.html"
          echo "=== PAGE TITLE ==="
          TITLE="$(grep -oE '<title>[^<]*</title>' "$TMP/home.html" | head -1 || true)"
          echo "LIVE_PAGE_TITLE=$TITLE"
          echo "LIVE_HTML_BYTES=$(wc -c < "$TMP/home.html")"
          if [ -z "$TITLE" ]; then echo "LIVE_HTML_PREFIX=$(head -c 500 "$TMP/home.html" | tr "\\n" " " | cut -c1-500)"; fi
          echo "=== CONTENT TYPE ==="
          curl -k -sSI --max-time 10 https://roofixo.ir/ | grep -iE "^(HTTP/|content-type:|content-length:|server:)" | head -6 || true
          echo "=== FIRST JAVASCRIPT ASSET ==="
          ASSET="$(grep -oE '(src|href)="[^"]+\.js([?][^"]*)?"' "$TMP/home.html" | head -1 | sed -E 's/^(src|href)="([^"]+)"$/\2/' || true)"
          if [ -n "$ASSET" ]; then
            case "$ASSET" in http*) ASSET_URL="$ASSET" ;; /*) ASSET_URL="https://roofixo.ir$ASSET" ;; *) ASSET_URL="https://roofixo.ir/$ASSET" ;; esac
            ASSET_STATUS="$(curl -k -sS -o /dev/null --max-time 15 -w '%{http_code}' "$ASSET_URL")"
            echo "FIRST_JS_ASSET_HTTP=$ASSET_STATUS"
            test "$ASSET_STATUS" = 200
          else
            echo "NO_DIRECT_JS_SRC_FOUND; checking known Vue app entry"
            ASSET_STATUS="$(curl -k -sS -o /dev/null --max-time 15 -w '%{http_code}' https://roofixo.ir/js/app.js)"
            echo "FALLBACK_APP_JS_HTTP=$ASSET_STATUS"
          fi
          echo "=== ADMIN SPA ROUTES AND REQUIRED LAZY CHUNKS ==="
          for ROUTE in /admin/loans/ /admin/userLoanRequests/ /login/; do
            BODY="$TMP/route-$(echo "$ROUTE" | tr '/ ' '__').html"
            CODE="$(curl -k -sS -L --max-time 20 -o "$BODY" -w '%{http_code}' "https://roofixo.ir$ROUTE" || true)"
            BUNDLE="$(grep -Fom1 'app.e76ab352.js' "$BODY" || true)"
            echo "ADMIN_ROUTE_HTTP=$CODE PATH=$ROUTE BYTES=$(wc -c < "$BODY" 2>/dev/null || echo 0) APP_BUNDLE=$BUNDLE"
            if [ "$CODE" != 200 ] || [ -z "$BUNDLE" ]; then echo "ADMIN_ROUTE_RENDER_FAILED=$ROUTE"; exit 1; fi
          done
          for ASSET in /js/app.e76ab352.js?fix=20261018-3 /js/views-admin-Dashboard.7e68aa0f.js /js/views-admin-Loans.89862ce8.js /js/views-admin-UserLoanRequests.8e3264fe.js /js/views-admin-Users.e167c344.js /js/views-admin-ManageLoan.0ac19cc6.js; do
            CODE="$(curl -k -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://roofixo.ir$ASSET" || true)"
            echo "ADMIN_ASSET_HTTP=$CODE PATH=$ASSET"
            test "$CODE" = 200
          done
          echo "=== LIVE PUBLIC LOAN DATA API ==="
          API_FILE="$TMP/public-loans.json"
          API_CODE="$(curl -k -sS --max-time 20 -o "$API_FILE" -w '%{http_code}' https://roofixo.ir/Loan/List/100 || true)"
          echo "PUBLIC_LOAN_API_HTTP=$API_CODE"
          if [ "$API_CODE" = 200 ]; then
            python3 - "$API_FILE" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1], encoding="utf-8"))
          data=payload.get("data", payload.get("Data"))
          ok=payload.get("success", payload.get("Success"))
          count=len(data) if isinstance(data,list) else -1
          print(f"PUBLIC_LOAN_API_SUCCESS={ok} LOAN_DEFINITION_COUNT={count}")
          if ok is not True or count < 1: raise SystemExit("Public loan API returned no loan definitions")
          PY
          else
            echo "PUBLIC_LOAN_API_FAILED=$API_CODE"
            exit 1
          fi
          echo "=== TLS CERTIFICATE SUMMARY ==="
          echo | openssl s_client -connect roofixo.ir:443 -servername roofixo.ir 2>/dev/null | openssl x509 -noout -subject -issuer -dates
          echo "=== CONTAINER HEALTH ==="
          docker inspect -f 'VAMCITY_APP_RUNNING={{.State.Running}}' vamcity-stage-app
          docker inspect -f 'VAMCITY_SQL_RUNNING={{.State.Running}}' vamcity-stage-sql
          curl -sS -o /dev/null --max-time 8 -w 'VAMCITY_LOOPBACK_HTTP=%{http_code}\n' http://127.0.0.1:5187/
          echo "LIVE_SMOKE_TEST_FINISHED"
          REMOTE
