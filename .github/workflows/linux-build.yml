name: Linux build validation

on:
  push:
    branches: [main]
    paths:
      - "recovered-source/**"
      - ".github/workflows/linux-build.yml"
  pull_request:
    paths:
      - "recovered-source/**"
      - ".github/workflows/linux-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show SDK
        run: dotnet --info

      - name: Copy frontend assets into web project
        run: |
          test -f wwwroot/ui/index.html
          mkdir -p recovered-source/LoanSystemAvizhe.Site/wwwroot
          cp -a wwwroot/ui recovered-source/LoanSystemAvizhe.Site/wwwroot/

      - name: Publish Linux application
        run: dotnet publish recovered-source/LoanSystemAvizhe.Site/LoanSystemAvizhe.Site.csproj --configuration Release --output ./artifacts/vamcity --verbosity minimal

      - name: Verify publish output
        run: |
          test -f ./artifacts/vamcity/LoanSystemAvizhe.Site.dll
          test -f ./artifacts/vamcity/LoanSystemAvizhe.Site.runtimeconfig.json
          cat ./artifacts/vamcity/LoanSystemAvizhe.Site.runtimeconfig.json

      - name: Upload Linux publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: vamcity-linux-publish
          path: ./artifacts/vamcity/
          if-no-files-found: error
          retention-days: 7
