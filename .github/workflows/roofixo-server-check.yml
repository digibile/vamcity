name: Check Roofixo server connection
run-name: Read-only Roofixo server preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/roofixo-server-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate deployment secrets are available
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT DEPLOY_SSH_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Required repository/organization Actions secret is missing: $key"
              exit 2
            fi
          done
          echo "DEPLOY_SECRETS_PRESENT=true"
      - name: Prepare SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 10 -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only server and Roofixo checks
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/deploy_key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo "SSH_CONNECTION_OK"
          echo "HOST=$(hostname)"
          echo "USER=$(id -un)"
          echo "ROOFIXO_HOME_EXISTS=$([ -d /home/roofixo/domains/roofixo.ir ] && echo yes || echo no)"
          echo "ROOFIXO_PUBLIC_HTML_EXISTS=$([ -d /home/roofixo/domains/roofixo.ir/public_html ] && echo yes || echo no)"
          echo "VAMCITY_ZIP_EXISTS=$([ -f /home/roofixo/domains/roofixo.ir/public_html/vamcity.zip ] && echo yes || echo no)"
          echo "DIRECTADMIN_DOMAIN_CONFIG_EXISTS=$([ -f /usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.conf ] && echo yes || echo no)"
          echo "DIRECTADMIN_CUSTOM_NGINX_EXISTS=$([ -f /usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.cust_nginx ] && echo yes || echo no)"
          if command -v dotnet >/dev/null 2>&1; then dotnet --list-runtimes; else echo "DOTNET_NOT_INSTALLED"; fi
          if command -v nginx >/dev/null 2>&1; then nginx -t 2>&1 || true; else echo "NGINX_NOT_INSTALLED"; fi
          echo "=== DOMAIN ROUTING FLAGS ==="
          grep -E '^(ip|ssl|nginx)=' /usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.conf 2>/dev/null || true
          echo "=== CUSTOM NGINX CONFIG ==="
          if [ -f /usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.cust_nginx ]; then
            sed -n '1,100p' /usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.cust_nginx
          else
            echo "CUSTOM_NGINX_FILE_MISSING"
          fi
          echo "=== GENERATED CONFIG FILES ==="
          ls -l /usr/local/directadmin/data/users/roofixo/nginx*.conf 2>/dev/null || true
          for cfg in /usr/local/directadmin/data/users/roofixo/nginx.conf /usr/local/directadmin/data/users/roofixo/nginx_secure.conf /usr/local/directadmin/data/users/roofixo/nginx_ssl.conf; do
            if [ -f "$cfg" ]; then
              echo "CONFIG_FILE=$cfg"
              grep -n -B 8 -A 18 'proxy_pass http://127.0.0.1:5187' "$cfg" | head -80 || true
            fi
          done
          echo "=== DISK / MEMORY / SWAP / CONTAINERS ==="
          df -h /
          free -h
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | grep -E 'NAMES|vamcity|roofixo' || true
          DOMAIN_IP="$(awk -F= '$1=="ip" {print $2; exit}' /usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.conf)"
          echo "DOMAIN_IP=$DOMAIN_IP"
          echo "=== CANONICAL VHOST ROUTES ON DOMAIN IP ==="
          for path in / /admin/dashboard /admin/Dashboard /vamcity-template-preview/ /plans.html /login/ /register/0/; do
            status="$(curl --resolve "roofixo.ir:443:$DOMAIN_IP" -k -sS -o /tmp/vamcity-check-body --max-time 10 -w '%{http_code}' "https://roofixo.ir$path" || true)"
            bytes="$(wc -c < /tmp/vamcity-check-body 2>/dev/null || echo 0)"
            title="$(grep -oE '<title>[^<]*</title>' /tmp/vamcity-check-body | head -1 || true)"
            echo "DOMAIN_VHOST https $status $path BODY_BYTES=$bytes TITLE=$title"
          done
          echo "=== APP LOOPBACK ROUTES ==="
          for path in / /cl/plans/ /login/ /cl/login/ /cl/register/; do
            status="$(curl -sS -o /tmp/vamcity-check-body --max-time 8 -w '%{http_code}' "http://127.0.0.1:5187$path" || true)"
            echo "APP_LOCAL $status $path BODY_BYTES=$(wc -c < /tmp/vamcity-check-body 2>/dev/null || echo 0)"
          done
          echo "=== LOCAL HTTP/HTTPS VHOST ROUTES ==="
          for spec in "80 http" "443 https"; do
            set -- $spec; port="$1"; scheme="$2"
            for path in / /cl/plans/ /login/ /cl/login/ /cl/register/; do
              status="$(curl --resolve "roofixo.ir:$port:127.0.0.1" -k -sS -o /tmp/vamcity-check-body --max-time 8 -w '%{http_code}' "$scheme://roofixo.ir$path" || true)"
              prefix="$(head -c 160 /tmp/vamcity-check-body 2>/dev/null | tr '\n' ' ' || true)"
              echo "VHOST_LOCAL $scheme $status $path BODY_BYTES=$(wc -c < /tmp/vamcity-check-body 2>/dev/null || echo 0) BODY_PREFIX=$prefix"
            done
          done
          echo "=== RECENT NGINX ERRORS ==="
          tail -n 40 /var/log/nginx/error_log 2>/dev/null || true
          rm -f /tmp/vamcity-check-body
          echo "RUNNING_VAMCITY_PROCESSES:"
          pgrep -af 'LoanSystemAvizhe.Site|LoanSystem.Site.dll|vamcity' || true
          echo "READ_ONLY_PREFLIGHT_FINISHED"
          REMOTE

