name: Diagnose VamCity staging containers
# Triggered read-only status snapshot; validates app runtime, API routes, database schema and role assignments
# Read-only rerun 2026-10-17: verify Linux runtime, reverse proxy, SQL Server health, API authorization and logs after admin identity-header fix.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-vamcity-stage.yml"
      - ".github/workflows/restore-vamcity-source-database.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only container diagnostics
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/key -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "=== CONTAINER STATES ==="
          docker ps -a --filter name=vamcity-stage --format 'NAME={{.Names}} STATUS={{.Status}} IMAGE={{.Image}}'
          for c in vamcity-stage-sql vamcity-stage-app; do
            echo "=== INSPECT $c ==="
            docker inspect -f 'STATUS={{.State.Status}} RUNNING={{.State.Running}} EXIT={{.State.ExitCode}} RESTARTS={{.RestartCount}} ERROR={{.State.Error}}' "$c" 2>&1
            docker inspect -f 'MOUNTS={{range .Mounts}}{{.Name}}:{{.Destination}};{{end}}' "$c" 2>&1
            echo "=== LAST LOGS $c ==="
            docker logs --tail 100 "$c" 2>&1
          done
          echo "=== VOLUME / DISK / MEMORY ==="
          docker volume inspect vamcity_stage_sql_data 2>&1
          df -h / /home/roofixo 2>&1
          free -h 2>&1
          echo "=== APP CONTAINER NETWORK / PORTS ==="
          docker inspect -f 'PORTS={{json .NetworkSettings.Ports}} NETWORKS={{json .NetworkSettings.Networks}}' vamcity-stage-app 2>&1
          echo "=== HOST LOOPBACK AND CONTAINER-IP PROBES ==="
          curl -sv --max-time 5 http://127.0.0.1:5187/ -o /dev/null 2>&1 | tail -25
          APP_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' vamcity-stage-app 2>/dev/null)"
          echo "APP_CONTAINER_IP=$APP_IP"
          if [ -n "$APP_IP" ]; then curl -sv --max-time 5 "http://$APP_IP:8080/" -o /dev/null 2>&1 | tail -25; fi
          echo "=== APP PROCESS / LISTENER ==="
          docker exec vamcity-stage-app sh -lc 'ps -ef; (command -v ss >/dev/null && ss -lntp) || true; (command -v netstat >/dev/null && netstat -lntp) || true' 2>&1
          echo "=== ACTIVE NGINX ROOFIXO VHOST AND VAMCITY PROXY LOCATIONS ==="
          nginx -T 2>&1 | grep -n -i -B 12 -A 24 -E 'server_name .*roofixo|VAMCITY REVERSE PROXY|proxy_pass http://127.0.0.1:5187' | head -220 || true
          SERVER_INTERFACE_IPV4="$(ip route get 1.1.1.1 2>/dev/null | awk '{for (i=1;i<=NF;i++) if ($i=="src") {print $(i+1); exit}}')"
          DOMAIN_IPV4="$(sed -n 's/^ip=//p' /usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.conf 2>/dev/null | head -1)"
          VHOST_TEST_IPV4="$DOMAIN_IPV4"
          if [ -z "$VHOST_TEST_IPV4" ] || ! ip -o -4 addr show 2>/dev/null | grep -Fq "$VHOST_TEST_IPV4"; then VHOST_TEST_IPV4="$SERVER_INTERFACE_IPV4"; fi
          echo "ROOFIXO_VHOST_TEST_IP_ASSIGNED=$([ -n "$VHOST_TEST_IPV4" ] && ip -o -4 addr show 2>/dev/null | grep -Fq "$VHOST_TEST_IPV4" && echo yes || echo no)"
          echo "=== LOCAL HTTPS VHOST PROBES (NO PUBLIC DNS DEPENDENCY) ==="
          for path in / /superadmin/dashboard/get /admin/appSettings/get /superadmin/customer/list/ /admin/CustomerPurchasePlan/list/; do
            printf 'LOCAL_VHOST path=%s ' "$path"
            curl -k -sS --max-time 8 --resolve "roofixo.ir:443:$VHOST_TEST_IPV4" -H 'Accept: application/json' -o /tmp/vamcity-probe-body -D /tmp/vamcity-probe-headers -w 'HTTP=%{http_code} SIZE=%{size_download}\\n' "https://roofixo.ir$path" || true
            sed -n '1,4p' /tmp/vamcity-probe-headers 2>/dev/null || true
            grep -Eio '<title>[^<]*|Response.data is undefined|404 Not Found|Unauthorized|Not Found' /tmp/vamcity-probe-body 2>/dev/null | head -3 || true
          done
          echo "=== NGINX ERROR LOG FOR ROOFIXO (RECENT LINES) ==="
          tail -n 100 /var/log/nginx/domains/roofixo.ir.error.log 2>/dev/null | tail -80 || true
          echo "=== NGINX ACCESS LOG FOR VAMCITY ROUTES (RECENT LINES) ==="
          grep -E 'superadmin/dashboard/get|admin/appSettings/get|superadmin/customer/list' /var/log/nginx/domains/roofixo.ir.log 2>/dev/null | tail -20 || true
          echo "=== DOMAIN DNS VS THIS SERVER ==="
          echo "ROOFIXO_DNS_IPV4:"
          getent ahostsv4 roofixo.ir | awk '!seen[$1]++ {print $1}' || true
          echo "SERVER_INTERFACE_IPV4:"
          ip route get 1.1.1.1 2>/dev/null | awk '{for (i=1;i<=NF;i++) if ($i=="src") {print $(i+1); exit}}' || true
          echo "=== HOST / DOMAIN STATUS ==="
          curl -sS -o /dev/null --max-time 5 -w 'ROOFIXO_HTTPS=%{http_code}\n' https://roofixo.ir || true
          echo "=== PUBLIC SITE CONFIG AND PLAN API ==="
          SITE_CONFIG="$(curl -fsS --max-time 15 -X POST -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{}' https://roofixo.ir/Site/SiteConfig 2>/dev/null || true)"
          printf '%s' "$SITE_CONFIG" | python3 -c 'import json,sys; d=json.load(sys.stdin); x=d.get("data") or {}; print("SITE_CONFIG_SUCCESS=",d.get("success",d.get("Success"))); print("SITE_CONFIG_IS_CLOUD=",x.get("isCloud",x.get("IsCloud"))); print("SITE_CONFIG_CUSTOMER_CODE=",x.get("customerCode",x.get("CustomerCode")))' 2>&1 || echo "SITE_CONFIG_PARSE_FAILED"
          CUSTOMER_CODE="$(printf '%s' "$SITE_CONFIG" | python3 -c 'import json,sys; d=json.load(sys.stdin); x=d.get("data") or {}; print(x.get("customerCode",x.get("CustomerCode",0)) or 0)' 2>/dev/null || echo 0)"
          PLANS_RESPONSE="$(curl -sS --max-time 15 -H 'Accept: application/json' "https://roofixo.ir/Loan/List/$CUSTOMER_CODE" 2>/dev/null || true)"
          printf '%s' "$PLANS_RESPONSE" | python3 -c 'import json,sys; d=json.load(sys.stdin); data=d.get("data",d.get("Data")); print("PUBLIC_PLANS_SUCCESS=",d.get("success",d.get("Success"))); print("PUBLIC_PLANS_COUNT=",len(data) if isinstance(data,list) else "NOT_LIST"); print("PUBLIC_PLANS_ERROR=",d.get("message",d.get("Message","")) if d.get("success",d.get("Success")) is False else "")' 2>&1 || echo "PUBLIC_PLANS_PARSE_FAILED"
          echo "=== DATABASE HEALTH SUMMARY ==="
          SQL_PASSWORD="$(sed -n 's/^MSSQL_SA_PASSWORD=//p' /home/roofixo/domains/roofixo.ir/vamcity-app/private/sql.env | head -1)"
          SQLCMD="$(docker exec vamcity-stage-sql bash -lc 'if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then echo /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then echo /opt/mssql-tools/bin/sqlcmd; fi' 2>/dev/null | tail -1)"
          if [ -n "$SQLCMD" ] && [ -n "$SQL_PASSWORD" ]; then
            echo "=== DATABASE SAFE SUMMARY ONLY ==="
            docker exec vamcity-stage-sql "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "SET NOCOUNT ON;
              SELECT name,state_desc FROM sys.databases WHERE name=N'vamcity_stage';
              SELECT COUNT(*) AS table_count FROM [vamcity_stage].sys.tables;
              SELECT COUNT(*) AS active_plan_count FROM [vamcity_stage].dbo.Loans WHERE Disable=0;
              SELECT 'customers' AS metric, COUNT_BIG(*) AS value FROM [vamcity_stage].dbo.Customers
              UNION ALL SELECT 'app_settings', COUNT_BIG(*) FROM [vamcity_stage].dbo.AppSettings
              UNION ALL SELECT 'users', COUNT_BIG(*) FROM [vamcity_stage].dbo.AspNetUsers
              UNION ALL SELECT 'user_roles', COUNT_BIG(*) FROM [vamcity_stage].dbo.AspNetUserRoles
              UNION ALL SELECT 'customer_purchase_plans', COUNT_BIG(*) FROM [vamcity_stage].dbo.CustomerPurchasePlan
              UNION ALL SELECT 'purchases', COUNT_BIG(*) FROM [vamcity_stage].dbo.Purchases
              UNION ALL SELECT 'migration_records', COUNT_BIG(*) FROM [vamcity_stage].dbo.__EFMigrationsHistory;
              SELECT 'AppSettings.CustomerId' AS expected_column, CASE WHEN COL_LENGTH('vamcity_stage.dbo.AppSettings','CustomerId') IS NULL THEN 'MISSING' ELSE 'OK' END AS status
              UNION ALL SELECT 'AppSettings.DashboardSettingsJson', CASE WHEN COL_LENGTH('vamcity_stage.dbo.AppSettings','DashboardSettingsJson') IS NULL THEN 'MISSING' ELSE 'OK' END
              UNION ALL SELECT 'AspNetUsers.CustomerId', CASE WHEN COL_LENGTH('vamcity_stage.dbo.AspNetUsers','CustomerId') IS NULL THEN 'MISSING' ELSE 'OK' END
              UNION ALL SELECT 'AspNetUsers.IsActive', CASE WHEN COL_LENGTH('vamcity_stage.dbo.AspNetUsers','IsActive') IS NULL THEN 'MISSING' ELSE 'OK' END
              UNION ALL SELECT 'Loans.Disable', CASE WHEN COL_LENGTH('vamcity_stage.dbo.Loans','Disable') IS NULL THEN 'MISSING' ELSE 'OK' END;
              SELECT 'active_superadmin_users' AS metric, COUNT_BIG(*) AS value
              FROM [vamcity_stage].dbo.AspNetUsers u
              JOIN [vamcity_stage].dbo.AspNetUserRoles ur ON ur.UserId=u.Id
              JOIN [vamcity_stage].dbo.AspNetRoles r ON r.Id=ur.RoleId
              WHERE r.NormalizedName=N'SUPERADMIN' AND u.IsActive=1;
              SELECT r.Name AS role_name, COUNT_BIG(*) AS assigned_users,
                     SUM(CASE WHEN u.IsActive=1 THEN CONVERT(bigint,1) ELSE CONVERT(bigint,0) END) AS active_users
              FROM [vamcity_stage].dbo.AspNetRoles r
              LEFT JOIN [vamcity_stage].dbo.AspNetUserRoles ur ON ur.RoleId=r.Id
              LEFT JOIN [vamcity_stage].dbo.AspNetUsers u ON u.Id=ur.UserId
              GROUP BY r.Name ORDER BY r.Name;
              SELECT 'users_without_customer' AS metric, COUNT_BIG(*) AS value FROM [vamcity_stage].dbo.AspNetUsers WHERE CustomerId IS NULL
              UNION ALL SELECT 'active_users', COUNT_BIG(*) FROM [vamcity_stage].dbo.AspNetUsers WHERE IsActive=1
              UNION ALL SELECT 'customers_with_settings', COUNT_BIG(*) FROM [vamcity_stage].dbo.Customers c JOIN [vamcity_stage].dbo.AppSettings s ON s.CustomerId=c.Id;
              SELECT 'role_claims' AS metric, COUNT_BIG(*) AS value FROM [vamcity_stage].dbo.AspNetRoleClaims
              UNION ALL SELECT 'user_claims', COUNT_BIG(*) FROM [vamcity_stage].dbo.AspNetUserClaims
              UNION ALL SELECT 'users_without_roles', COUNT_BIG(*) FROM [vamcity_stage].dbo.AspNetUsers u WHERE NOT EXISTS (SELECT 1 FROM [vamcity_stage].dbo.AspNetUserRoles ur WHERE ur.UserId=u.Id);
              SELECT ClaimType, COUNT_BIG(*) AS claim_count
              FROM [vamcity_stage].dbo.AspNetUserClaims
              WHERE ClaimType NOT LIKE '%userdata%' AND ClaimType NOT LIKE '%email%' AND ClaimType NOT LIKE '%mobile%' AND ClaimType NOT LIKE '%name%'
              GROUP BY ClaimType ORDER BY ClaimType;
              SELECT ClaimValue AS permission_name, COUNT_BIG(*) AS assignments
              FROM [vamcity_stage].dbo.AspNetUserClaims
              WHERE ClaimType=N'Permission'
              GROUP BY ClaimValue ORDER BY ClaimValue;
              SELECT r.Name AS role_name, COUNT(DISTINCT u.Id) AS active_users,
                     COUNT(uc.Id) AS permission_assignments
              FROM [vamcity_stage].dbo.AspNetRoles r
              LEFT JOIN [vamcity_stage].dbo.AspNetUserRoles ur ON ur.RoleId=r.Id
              LEFT JOIN [vamcity_stage].dbo.AspNetUsers u ON u.Id=ur.UserId AND u.IsActive=1
              LEFT JOIN [vamcity_stage].dbo.AspNetUserClaims uc ON uc.UserId=u.Id AND uc.ClaimType=N'Permission'
              GROUP BY r.Name ORDER BY r.Name;" 2>&1
          fi
          echo "=== ONE-SHOT APP DIAGNOSTIC (isolated network, no host port) ==="
          BASE=/home/roofixo/domains/roofixo.ir/vamcity-app
          PRIVATE="$BASE/private"
          RELEASE="$(find "$BASE/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          echo "RELEASE_DIR=$RELEASE"
          if [ -n "$RELEASE" ] && [ -f "$RELEASE/LoanSystemAvizhe.Site.dll" ]; then
            timeout 25 docker run --rm --network vamcity-stage-net --memory=1g \
              --env-file "$PRIVATE/app.env" \
              -v "$RELEASE:/app" -v "$PRIVATE/uploads:/app/uploads" \
              -w /app --entrypoint dotnet \
              mcr.microsoft.com/dotnet/aspnet:9.0 LoanSystemAvizhe.Site.dll 2>&1 || true
          fi
          echo "=== END DIAGNOSTICS ==="
          REMOTE
