name: Diagnose VamCity staging containers
# Triggered read-only status snapshot for the current staging attempt
# Include the newest startup probe after the NLog config fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-vamcity-stage.yml"
      - ".github/workflows/restore-vamcity-source-database.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only container diagnostics
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/key -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "=== CONTAINER STATES ==="
          docker ps -a --filter name=vamcity-stage --format 'NAME={{.Names}} STATUS={{.Status}} IMAGE={{.Image}}'
          for c in vamcity-stage-sql vamcity-stage-app; do
            echo "=== INSPECT $c ==="
            docker inspect -f 'STATUS={{.State.Status}} RUNNING={{.State.Running}} EXIT={{.State.ExitCode}} RESTARTS={{.RestartCount}} ERROR={{.State.Error}}' "$c" 2>&1
            docker inspect -f 'MOUNTS={{range .Mounts}}{{.Name}}:{{.Destination}};{{end}}' "$c" 2>&1
            echo "=== LAST LOGS $c ==="
            docker logs --tail 100 "$c" 2>&1
          done
          echo "=== VOLUME / DISK / MEMORY ==="
          docker volume inspect vamcity_stage_sql_data 2>&1
          df -h / /home/roofixo 2>&1
          free -h 2>&1
          echo "=== APP CONTAINER NETWORK / PORTS ==="
          docker inspect -f 'PORTS={{json .NetworkSettings.Ports}} NETWORKS={{json .NetworkSettings.Networks}}' vamcity-stage-app 2>&1
          echo "=== HOST LOOPBACK AND CONTAINER-IP PROBES ==="
          curl -sv --max-time 5 http://127.0.0.1:5187/ -o /dev/null 2>&1 | tail -25
          APP_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' vamcity-stage-app 2>/dev/null)"
          echo "APP_CONTAINER_IP=$APP_IP"
          if [ -n "$APP_IP" ]; then curl -sv --max-time 5 "http://$APP_IP:8080/" -o /dev/null 2>&1 | tail -25; fi
          echo "=== APP PROCESS / LISTENER ==="
          docker exec vamcity-stage-app sh -lc 'ps -ef; (command -v ss >/dev/null && ss -lntp) || true; (command -v netstat >/dev/null && netstat -lntp) || true' 2>&1
          echo "=== ACTIVE NGINX ROOFIXO VHOST AND VAMCITY PROXY LOCATIONS ==="
          nginx -T 2>&1 | grep -n -i -B 12 -A 24 -E 'server_name .*roofixo|VAMCITY REVERSE PROXY|proxy_pass http://127.0.0.1:5187' | head -220 || true
          SERVER_INTERFACE_IPV4="$(ip route get 1.1.1.1 2>/dev/null | awk '{for (i=1;i<=NF;i++) if ($i=="src") {print $(i+1); exit}}')"
          DOMAIN_IPV4="$(sed -n 's/^ip=//p' /usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.conf 2>/dev/null | head -1)"
          VHOST_TEST_IPV4="$DOMAIN_IPV4"
          if [ -z "$VHOST_TEST_IPV4" ] || ! ip -o -4 addr show 2>/dev/null | grep -Fq "$VHOST_TEST_IPV4"; then VHOST_TEST_IPV4="$SERVER_INTERFACE_IPV4"; fi
          echo "ROOFIXO_VHOST_TEST_IP_ASSIGNED=$([ -n "$VHOST_TEST_IPV4" ] && ip -o -4 addr show 2>/dev/null | grep -Fq "$VHOST_TEST_IPV4" && echo yes || echo no)"
          echo "=== LOCAL HTTPS VHOST PROBES (NO PUBLIC DNS DEPENDENCY) ==="
          for path in / /superadmin/dashboard/get /admin/appSettings/get /superadmin/customer/list/; do
            printf 'LOCAL_VHOST path=%s ' "$path"
            curl -k -sS --max-time 8 --resolve "roofixo.ir:443:$VHOST_TEST_IPV4" -H 'Accept: application/json' -o /tmp/vamcity-probe-body -D /tmp/vamcity-probe-headers -w 'HTTP=%{http_code} SIZE=%{size_download}\\n' "https://roofixo.ir$path" || true
            sed -n '1,4p' /tmp/vamcity-probe-headers 2>/dev/null || true
            grep -Eio '<title>[^<]*|Response.data is undefined|404 Not Found|Unauthorized|Not Found' /tmp/vamcity-probe-body 2>/dev/null | head -3 || true
          done
          echo "=== NGINX ERROR LOG FOR ROOFIXO (RECENT LINES) ==="
          tail -n 100 /var/log/nginx/domains/roofixo.ir.error.log 2>/dev/null | tail -80 || true
          echo "=== NGINX ACCESS LOG FOR VAMCITY ROUTES (RECENT LINES) ==="
          grep -E 'superadmin/dashboard/get|admin/appSettings/get|superadmin/customer/list' /var/log/nginx/domains/roofixo.ir.log 2>/dev/null | tail -20 || true
          echo "=== DOMAIN DNS VS THIS SERVER ==="
          echo "ROOFIXO_DNS_IPV4:"
          getent ahostsv4 roofixo.ir | awk '!seen[$1]++ {print $1}' || true
          echo "SERVER_INTERFACE_IPV4:"
          ip route get 1.1.1.1 2>/dev/null | awk '{for (i=1;i<=NF;i++) if ($i=="src") {print $(i+1); exit}}' || true
          echo "=== HOST / DOMAIN STATUS ==="
          curl -sS -o /dev/null --max-time 5 -w 'ROOFIXO_HTTPS=%{http_code}\n' https://roofixo.ir || true
          echo "=== DATABASE HEALTH SUMMARY ==="
          SQL_PASSWORD="$(sed -n 's/^MSSQL_SA_PASSWORD=//p' /home/roofixo/domains/roofixo.ir/vamcity-app/private/sql.env | head -1)"
          SQLCMD="$(docker exec vamcity-stage-sql bash -lc 'if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then echo /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then echo /opt/mssql-tools/bin/sqlcmd; fi' 2>/dev/null | tail -1)"
          if [ -n "$SQLCMD" ] && [ -n "$SQL_PASSWORD" ]; then
            echo "=== DATABASE SAFE SUMMARY ONLY ==="
            docker exec vamcity-stage-sql "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "SET NOCOUNT ON; SELECT name,state_desc FROM sys.databases WHERE name=N'vamcity_stage'; SELECT COUNT(*) AS table_count FROM [vamcity_stage].sys.tables; SELECT COUNT(*) AS active_plan_count FROM [vamcity_stage].dbo.Loans WHERE Disable=0;" 2>&1
          fi
          echo "=== ONE-SHOT APP DIAGNOSTIC (isolated network, no host port) ==="
          BASE=/home/roofixo/domains/roofixo.ir/vamcity-app
          PRIVATE="$BASE/private"
          RELEASE="$(find "$BASE/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          echo "RELEASE_DIR=$RELEASE"
          if [ -n "$RELEASE" ] && [ -f "$RELEASE/LoanSystemAvizhe.Site.dll" ]; then
            timeout 25 docker run --rm --network vamcity-stage-net --memory=1g \
              --env-file "$PRIVATE/app.env" \
              -v "$RELEASE:/app" -v "$PRIVATE/uploads:/app/uploads" \
              -w /app --entrypoint dotnet \
              mcr.microsoft.com/dotnet/aspnet:9.0 LoanSystemAvizhe.Site.dll 2>&1 || true
          fi
          echo "=== END DIAGNOSTICS ==="
          REMOTE
