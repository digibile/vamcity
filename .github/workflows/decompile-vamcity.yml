name: Recover VamCity source from published assemblies

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install ILSpy
        run: dotnet tool install --global ilspycmd
      - name: Decompile assemblies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vamcity-recovered"
          for dll in LoanSystemAvizhe.Site.dll LoanSystemAvizhe.Core.dll LoanSystemAvizhe.Data.dll LoanSystemAvizhe.Services.dll; do
            if [[ -f "$dll" ]]; then
              ilspycmd -p -o "$RUNNER_TEMP/vamcity-recovered/${dll%.dll}" "$dll"
            fi
          done
          test -n "$(find "$RUNNER_TEMP/vamcity-recovered" -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: vamcity-decompiled-source
          path: ${{ runner.temp }}/vamcity-recovered/
          retention-days: 7
