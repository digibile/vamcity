name: Restore original VamCity uploads and certificate
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-vamcity-static-files.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore-static-files:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Restore missing runtime files from original VamCity package
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -T 10 -p "$PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i "$RUNNER_TEMP/key" -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/home/roofixo/domains/roofixo.ir
          BASE="$ROOT/vamcity-app"
          ZIP="$ROOT/public_html/vamcity.zip"
          PRIVATE="$BASE/private"
          APP=vamcity-stage-app
          test -s "$ZIP"
          test -s "$PRIVATE/app.env"
          test -d "$BASE/releases"
          RELEASE="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/app"}}{{.Source}}{{end}}{{end}}' "$APP")"
          test -d "$RELEASE"
          echo "ACTIVE_RELEASE=$RELEASE"
          echo "=== TEST UPLOAD ENTRIES IN ORIGINAL ARCHIVE (NON-FATAL FOR UNRELATED FILES) ==="
          set +e
          unzip -t "$ZIP" 'uploads/*' 2>&1 | tail -10
          ZIP_TEST_STATUS=${PIPESTATUS[0]}
          set -e
          echo "UPLOAD_ARCHIVE_TEST_EXIT=$ZIP_TEST_STATUS"
          echo "=== ESTIMATE MISSING UPLOAD PAYLOAD ==="
          unzip -l "$ZIP" | awk '$4 ~ /^uploads\// && $4 !~ /\/$/ {bytes+=$1; files++} END {printf "UPLOAD_FILES=%d\nUPLOAD_UNCOMPRESSED_BYTES=%d\n",files,bytes}'
          UPLOAD_COUNT="$(unzip -Z1 "$ZIP" | grep -Ec '^uploads/[^/].*[^/]$' || true)"
          test "$UPLOAD_COUNT" -gt 0
          NEED_BYTES="$(unzip -l "$ZIP" | awk '$4 ~ /^uploads\// && $4 !~ /\/$/ {bytes+=$1} END {printf "%.0f",bytes}')"
          FREE_BYTES="$(df -PB1 "$BASE" | awk 'NR==2 {print $4}')"
          echo "FREE_BYTES=$FREE_BYTES"
          if [ "$FREE_BYTES" -lt "$((NEED_BYTES + 2147483648))" ]; then
            echo "INSUFFICIENT_DISK_SPACE_FOR_SAFE_RESTORE; no files changed"
            exit 1
          fi
          mkdir -p "$PRIVATE/uploads"
          chmod 700 "$PRIVATE" "$PRIVATE/uploads"
          EXISTING="$(find "$PRIVATE/uploads" -type f | wc -l)"
          echo "EXISTING_UPLOAD_FILES=$EXISTING"
          if [ "$EXISTING" -gt 0 ]; then
            BACKUP="$PRIVATE/backup/uploads-before-restore-$(date -u +%Y%m%dT%H%M%SZ).tar.gz"
            mkdir -p "$PRIVATE/backup"
            tar -czf "$BACKUP" -C "$PRIVATE" uploads
            chmod 600 "$BACKUP"
            echo "EXISTING_UPLOAD_BACKUP=$BACKUP"
          fi
          echo "=== RESTORE ONLY MISSING ORIGINAL UPLOAD FILES (NEVER OVERWRITE EXISTING) ==="
          unzip -n -q "$ZIP" 'uploads/*' -d "$PRIVATE"
          echo "RESTORED_UPLOAD_FILE_COUNT=$(find "$PRIVATE/uploads" -type f | wc -l)"
          echo "=== RESTORE ORIGINAL CERTIFICATE TO PRIVATE APP DIRECTORY ==="
          mkdir -p "$RELEASE/App_Data/certs"
          if [ ! -s "$RELEASE/App_Data/certs/orgCertificate.pfx" ]; then
            unzip -p "$ZIP" 'App_Data/certs/orgCertificate.pfx' > "$RELEASE/App_Data/certs/orgCertificate.pfx"
          fi
          test -s "$RELEASE/App_Data/certs/orgCertificate.pfx"
          chmod 600 "$RELEASE/App_Data/certs/orgCertificate.pfx"
          echo "CERTIFICATE_PRESENT=true"
          echo "=== VERIFY KEY STATIC FILES AND RESTART ==="
          find "$PRIVATE/uploads" -type f | sed -n '1,5p'
          docker restart "$APP" >/dev/null
          HEALTH=000
          for i in $(seq 1 36); do
            HEALTH="$(curl -sS -o /dev/null --max-time 5 -w '%{http_code}' http://127.0.0.1:5187/cl/plans/ || true)"
            case "$HEALTH" in 200|301|302|307|308) break ;; esac
            sleep 5
          done
          echo "VAMCITY_PLANS_HTTP=$HEALTH"
          test "$HEALTH" = 200
          echo "RESTORE_ORIGINAL_UPLOADS_COMPLETE=true"
          REMOTE
