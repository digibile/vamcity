name: Deploy integrated VamCity public homepage
run-name: Publish VamCity homepage with live plans and working account links
# Release refresh 2026-10-13: republish the canonical homepage, plans page, and shared entry links with a fresh live smoke test.
# Trigger the production publish after the management-template refresh.
# 2026-10-13: retry publish of full-width public homepage; deployment includes backup and live browser verification.

on:
  push:
    branches: [main]
    paths:
      - "vamcity-public-home.html"
      - "public-site/plans/index.html"
      - ".github/workflows/deploy-vamcity-public-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vamcity-roofixo-public-home
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate homepage links and real plans integration
        shell: bash
        run: |
          set -euo pipefail
          test -s vamcity-public-home.html
          grep -q 'href="/login/"' vamcity-public-home.html
          grep -q 'href="/register/0/"' vamcity-public-home.html
          grep -q 'href="/plans.html"' vamcity-public-home.html
          grep -q 'id="plans"' vamcity-public-home.html
          grep -q "fetch('/Loan/List/100'" vamcity-public-home.html
          grep -q "const href='/plan/0/'" vamcity-public-home.html
          test -s public-site/plans/index.html
          grep -q "fetch('/Loan/List/100'" public-site/plans/index.html
          grep -q "const href='/plan/0/'" public-site/plans/index.html
          grep -q 'طرح‌های تسهیلات | وام‌سیتی' public-site/plans/index.html
          ! grep -q '/cl/plan/' vamcity-public-home.html
          echo "PUBLIC_HOME_SOURCE_VALID"

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          PORT="${DEPLOY_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/vamcity_public_home_key
          chmod 600 ~/.ssh/vamcity_public_home_key
          ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "PORT=$PORT" >> "$GITHUB_ENV"
          echo "HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "USER=$DEPLOY_USER" >> "$GITHUB_ENV"

      - name: Upload homepage
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vamcity_public_home_key -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            vamcity-public-home.html "$USER@$HOST:/tmp/vamcity-public-home-$GITHUB_SHA.html"
          scp -i ~/.ssh/vamcity_public_home_key -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            public-site/plans/index.html "$USER@$HOST:/tmp/vamcity-public-plans-$GITHUB_SHA.html"

      - name: Backup and atomically publish homepage
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vamcity_public_home_key -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          SHA="$1"
          DOMAIN_ROOT=/home/roofixo/domains/roofixo.ir
          PUBLIC="$DOMAIN_ROOT/public_html"
          DOMAIN_CONF=/usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.conf
          DOMAIN_IP="$(awk -F= '$1=="ip" {print $2; exit}' "$DOMAIN_CONF")"
          test -n "$DOMAIN_IP"
          PRIVATE="$DOMAIN_ROOT/vamcity-app/private"
          CUSTOM=/usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.cust_nginx
          GENERATED=/usr/local/directadmin/data/users/roofixo/nginx.conf
          SRC="/tmp/vamcity-public-home-$SHA.html"
          PLANS_SRC="/tmp/vamcity-public-plans-$SHA.html"
          DEST="$PUBLIC/vamcity-public-home.html"
          PLANS_DEST="$PUBLIC/plans.html"
          BACKUP="$PRIVATE/rollback/public-home-$SHA"
          mkdir -p "$BACKUP"
          chmod 700 "$PRIVATE" "$PRIVATE/rollback" "$BACKUP"
          test -s "$SRC"
          test -s "$PLANS_SRC"
          test -s "$DEST"
          grep -q 'href="/login/"' "$SRC"
          grep -q 'href="/register/0/"' "$SRC"
          grep -q 'href="/plans.html"' "$SRC"
          grep -q 'طرح‌های تسهیلات | وام‌سیتی' "$PLANS_SRC"
          grep -q "fetch('/Loan/List/100'" "$SRC"
          cp -p "$DEST" "$BACKUP/vamcity-public-home.html.before"
          echo existing > "$BACKUP/home.state"
          chmod 600 "$BACKUP/vamcity-public-home.html.before" "$BACKUP/home.state"
          cp -p "$CUSTOM" "$BACKUP/roofixo.ir.cust_nginx.before"
          if [ -e "$PLANS_DEST" ]; then cp -p "$PLANS_DEST" "$BACKUP/plans.html.before"; echo existing > "$BACKUP/plans.state"; else echo absent > "$BACKUP/plans.state"; fi
          chmod 600 "$BACKUP/roofixo.ir.cust_nginx.before" "$BACKUP"/*.state
          install -m 644 "$SRC" "$PUBLIC/.vamcity-public-home-$SHA.tmp"
          install -m 644 "$PLANS_SRC" "$PUBLIC/.plans-$SHA.tmp"
          mv -f "$PUBLIC/.vamcity-public-home-$SHA.tmp" "$DEST"
          mv -f "$PUBLIC/.plans-$SHA.tmp" "$PLANS_DEST"
          rm -f "$SRC" "$PLANS_SRC"
          python3 - "$CUSTOM" "$PUBLIC" <<'PY'
          import pathlib, re, sys
          config = pathlib.Path(sys.argv[1])
          public = sys.argv[2]
          text = config.read_text()
          begin = "# VAMCITY_PUBLIC_HOME_BEGIN"
          end = "# VAMCITY_PUBLIC_HOME_END"
          plans_begin = "# VAMCITY_PUBLIC_PLANS_BEGIN"
          plans_end = "# VAMCITY_PUBLIC_PLANS_END"
          if plans_begin in text and plans_end in text:
              a = text.index(plans_begin)
              b = text.index(plans_end, a) + len(plans_end)
              text = text[:a] + text[b:]
          if begin in text and end in text:
              a = text.index(begin)
              b = text.index(end, a) + len(end)
              text = text[:a] + text[b:]
          # Remove legacy exact-match plan routes from earlier deployments before adding
          # the single canonical managed block below. This avoids duplicate nginx locations.
          text = re.sub(
              r'(?ms)^[ \t]*location\s*=\s*(?:/plans\.html|/plans/|/plans|/cl/plans/|/cl/plans)\s*\{\n.*?^[ \t]*\}[ \t]*\n?',
              '',
              text,
          )
          lines = text.splitlines()
          out = []
          inside_root = False
          for line in lines:
              if line.strip() == "location = / {":
                  inside_root = True
                  continue
              if inside_root:
                  if line.strip() == "}":
                      inside_root = False
                  continue
              out.append(line)
          text = chr(10).join(out)
          block = f'''# VAMCITY_PUBLIC_HOME_BEGIN
          location = / {{
              root {public};
              try_files /vamcity-public-home.html =404;
              default_type text/html;
              add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
              add_header Pragma "no-cache" always;
              expires -1;
          }}
          # VAMCITY_PUBLIC_HOME_END
          '''
          plans_block = f'''# VAMCITY_PUBLIC_PLANS_BEGIN
          location = /plans.html {{
              alias {public}/plans.html;
              default_type text/html;
              add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
              add_header Pragma "no-cache" always;
              expires -1;
          }}
          location = /plans {{
              return 302 /plans.html;
          }}
          location = /plans/ {{
              return 302 /plans.html;
          }}
          location = /cl/plans {{
              return 302 /plans.html;
          }}
          location = /cl/plans/ {{
              return 302 /plans.html;
          }}
          # VAMCITY_PUBLIC_PLANS_END
          '''
          config.write_text(text.rstrip() + chr(10) + block + chr(10) + plans_block + chr(10))
          PY
          chown roofixo:roofixo "$CUSTOM"
          chmod 644 "$CUSTOM"
          printf 'action=rewrite&value=nginx&user=roofixo\n' >> /usr/local/directadmin/data/task.queue
          /usr/local/directadmin/dataskq d
          nginx -t
          grep -Fq 'location = / {' "$GENERATED"
          grep -Fq 'location = /plans.html' "$GENERATED"
          grep -Fq 'location = /cl/plans/' "$GENERATED"
          systemctl reload nginx
          STATUS="$(curl -k -sS --resolve roofixo.ir:443:185.8.174.167 -o "/tmp/vamcity-home-check-$SHA.html" -w '%{http_code}' https://roofixo.ir/)"
          PLANS_STATUS="$(curl -k -sS --resolve roofixo.ir:443:185.8.174.167 -o "/tmp/vamcity-plans-check-$SHA.html" -w '%{http_code}' https://roofixo.ir/plans.html)"
          echo "LOCAL_HOME_HTTP=$STATUS"
          echo "LOCAL_PLANS_HTTP=$PLANS_STATUS"
          echo "PLANS_BYTES=$(wc -c < "/tmp/vamcity-plans-check-$SHA.html")"
          echo "PLANS_TITLE=$(grep -oE '<title>[^<]*</title>' "/tmp/vamcity-plans-check-$SHA.html" | head -1 || true)"
          echo "PLANS_PREFIX=$(head -c 400 "/tmp/vamcity-plans-check-$SHA.html" | tr '\\n' ' ' || true)"
          echo "PLANS_ROUTE_BLOCK=$(grep -n -A10 -B1 'VAMCITY_PUBLIC_PLANS_BEGIN' "$GENERATED" | head -15 || true)"
          test "$PLANS_STATUS" = 200
          grep -q 'طرح‌های تسهیلات | وام‌سیتی' "/tmp/vamcity-plans-check-$SHA.html"
          echo "HOME_BYTES=$(wc -c < "/tmp/vamcity-home-check-$SHA.html")"
          echo "HOME_TITLE=$(grep -oE '<title>[^<]*</title>' "/tmp/vamcity-home-check-$SHA.html" | head -1 || true)"
          echo "HOME_LINKS=$(grep -oE 'href="[^"]+"' "/tmp/vamcity-home-check-$SHA.html" | head -12 | tr '\\n' ' ' || true)"
          echo "HOME_PREFIX=$(head -c 320 "/tmp/vamcity-home-check-$SHA.html" | tr '\\n' ' ' || true)"
          echo "CUSTOM_HOME_ROUTE=$(grep -n -A9 -B1 'VAMCITY_PUBLIC_HOME_BEGIN' "$CUSTOM" || true)"
          echo "GENERATED_HOME_ROUTE=$(grep -n -A9 -B1 'location = / {' "$GENERATED" | head -20 || true)"
          test "$STATUS" = 200
          grep -q 'href="/login/"' "/tmp/vamcity-home-check-$SHA.html"
          grep -q 'href="/register/0/"' "/tmp/vamcity-home-check-$SHA.html"
          grep -q 'href="/plans.html"' "/tmp/vamcity-home-check-$SHA.html"
          grep -q 'id="plans"' "/tmp/vamcity-home-check-$SHA.html"
          rm -f "/tmp/vamcity-home-check-$SHA.html" "/tmp/vamcity-plans-check-$SHA.html"
          echo "PUBLIC_HOME_DEPLOY_OK"
          echo "HOME_FILE=$DEST"
          echo "PLANS_FILE=$PLANS_DEST"
          echo "BACKUP=$BACKUP"
          echo "DATABASE_UNTOUCHED=1"
          echo "APP_CONTAINER_RESTARTED=0"
          REMOTE

      - name: Verify public homepage, account routes, and live plans API
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://roofixo.ir
          HOME_CODE="$(curl --retry 3 --retry-delay 2 -sS -L --max-time 25 -o /tmp/vamcity-home.html -w '%{http_code}' "$BASE/")"
          echo "PUBLIC_HOME_HTTP=$HOME_CODE"
          test "$HOME_CODE" = 200
          grep -q 'href="/login/"' /tmp/vamcity-home.html
          grep -q 'href="/register/0/"' /tmp/vamcity-home.html
          grep -q 'href="/plans.html"' /tmp/vamcity-home.html
          PLANS_CODE="$(curl --retry 3 --retry-delay 2 -sS -L --max-time 25 -o /tmp/vamcity-plans.html -w '%{http_code}' "$BASE/plans.html")"
          echo "PUBLIC_PLANS_HTTP=$PLANS_CODE"
          test "$PLANS_CODE" = 200
          grep -q 'طرح‌های تسهیلات | وام‌سیتی' /tmp/vamcity-plans.html
          for LEGACY_ROUTE in /cl/plans/ /plans/; do
            LEGACY_FINAL_URL="$(curl --retry 2 --retry-delay 1 -sS -L --max-time 20 -o /tmp/vamcity-legacy-plans.html -w '%{url_effective}' "$BASE$LEGACY_ROUTE")"
            echo "LEGACY_PLANS_ROUTE=$LEGACY_ROUTE FINAL_URL=$LEGACY_FINAL_URL"
            test "$LEGACY_FINAL_URL" = "$BASE/plans.html"
            grep -q 'طرح‌های تسهیلات | وام‌سیتی' /tmp/vamcity-legacy-plans.html
          done
          for ROUTE in /login/ /register/0/; do
            CODE="$(curl --retry 2 --retry-delay 1 -sS -L --max-time 20 -o /dev/null -w '%{http_code}' "$BASE$ROUTE")"
            echo "ACCOUNT_ROUTE=$ROUTE HTTP=$CODE"
            test "$CODE" = 200
          done
          API_CODE="$(curl --retry 3 --retry-delay 2 -sS --max-time 25 -o /tmp/vamcity-plans-api.json -w '%{http_code}' "$BASE/Loan/List/100")"
          echo "LIVE_PLANS_API_HTTP=$API_CODE"
          test "$API_CODE" = 200
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/vamcity-plans-api.json', encoding='utf-8'))
          ok=p.get('success',p.get('Success'))
          d=p.get('data',p.get('Data'))
          if ok is not True or not isinstance(d,list) or not d:
              raise SystemExit("Live plans API did not return successful non-empty data")
          print("LIVE_PLANS_API_OK count="+str(len(d)))
          PY

      - name: Browser check desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const errors = [];
            const page = await browser.newPage({viewport:{width:1440,height:1000}});
            page.on('pageerror', e => errors.push(e.message));
            const response = await page.goto('https://roofixo.ir/', {waitUntil:'networkidle',timeout:45000});
            if (!response || response.status() !== 200) throw new Error('Homepage did not return HTTP 200');
            for (const href of ['/login/','/register/0/','/plans.html']) {
              if (await page.locator('a[href="'+href+'"]').count() === 0) throw new Error('Homepage missing link '+href);
            }
            const homeCards = await page.locator('#plans .plan').count();
            if (homeCards < 1) throw new Error('No live plans rendered in homepage preview');
            await page.locator('a[href="/plans.html"]').first().click();
            await page.waitForLoadState('networkidle');
            if (!(await page.title()).includes('طرح‌های تسهیلات')) throw new Error('Dedicated plans page title missing');
            const cards = await page.locator('.card').count();
            if (cards < 1) throw new Error('No live plans rendered on dedicated page');
            const detailLinks = await page.locator('.card a[href^="/plan/0/"]').count();
            if (detailLinks < 1) throw new Error('Dedicated plan cards are missing real detail links');
            console.log('DESKTOP_DEDICATED_PLAN_CARDS='+cards+' DETAIL_LINKS='+detailLinks);
            await page.goto('https://roofixo.ir/cl/plans/', {waitUntil:'networkidle',timeout:45000});
            if (!page.url().endsWith('/plans.html')) throw new Error('Legacy plans URL did not redirect to the modern page');
            if ((await page.locator('.card').count()) < 1) throw new Error('Legacy plans URL did not show modern plan cards');
            await page.setViewportSize({width:390,height:844});
            await page.reload({waitUntil:'networkidle',timeout:45000});
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth > window.innerWidth + 1);
            console.log('MOBILE_HORIZONTAL_OVERFLOW='+overflow);
            if (overflow) throw new Error('Mobile horizontal overflow detected');
            const mobileCards = await page.locator('.card').count();
            if (mobileCards < 1) throw new Error('No live plans rendered on mobile');
            if (errors.length) throw new Error('Browser JavaScript errors: '+JSON.stringify(errors));
            console.log('BROWSER_ERRORS='+JSON.stringify(errors));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          echo "VAMCITY_PUBLIC_HOME_BROWSER_CHECK_OK"
