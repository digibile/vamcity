name: Deploy integrated VamCity public homepage and plans
run-name: Publish VamCity homepage and modern live plans page

on:
  push:
    branches: [main]
    paths:
      - "vamcity-public-home.html"
      - "public-site/plans/index.html"
      - ".github/workflows/deploy-vamcity-public-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vamcity-roofixo-public-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public pages and route targets
        shell: bash
        run: |
          set -euo pipefail
          test -s vamcity-public-home.html
          test -s public-site/plans/index.html
          grep -q 'href="/login/"' vamcity-public-home.html
          grep -q 'href="/register/0/"' vamcity-public-home.html
          grep -q 'href="/plans.html"' vamcity-public-home.html
          grep -q "fetch('/Loan/List/100'" vamcity-public-home.html
          grep -q "fetch('/Loan/List/100'" public-site/plans/index.html
          grep -q "const href='/plan/0/'" vamcity-public-home.html
          grep -q "const href='/plan/0/'" public-site/plans/index.html
          ! grep -q '/cl/plan/' vamcity-public-home.html
          ! grep -q '/cl/plan/' public-site/plans/index.html
          echo "PUBLIC_HOME_AND_PLANS_SOURCE_VALID"

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          PORT="${DEPLOY_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/vamcity_public_site_key
          chmod 600 ~/.ssh/vamcity_public_site_key
          ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "PORT=$PORT" >> "$GITHUB_ENV"
          echo "HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "USER=$DEPLOY_USER" >> "$GITHUB_ENV"

      - name: Upload validated public pages
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vamcity_public_site_key -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            vamcity-public-home.html "$USER@$HOST:/tmp/vamcity-public-home-$GITHUB_SHA.html"
          scp -i ~/.ssh/vamcity_public_site_key -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            public-site/plans/index.html "$USER@$HOST:/tmp/vamcity-public-plans-$GITHUB_SHA.html"

      - name: Backup, publish pages, and install precise plans routes
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vamcity_public_site_key -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          SHA="$1"
          DOMAIN_ROOT=/home/roofixo/domains/roofixo.ir
          PUBLIC="$DOMAIN_ROOT/public_html"
          PRIVATE="$DOMAIN_ROOT/vamcity-app/private"
          APP_CONTAINER=vamcity-stage-app
          APP_ROOT="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/app"}}{{.Source}}{{end}}{{end}}' "$APP_CONTAINER")"
          HOME_SRC="/tmp/vamcity-public-home-$SHA.html"
          PLANS_SRC="/tmp/vamcity-public-plans-$SHA.html"
          PLANS_DEST="$APP_ROOT/wwwroot/plans.html"
          BACKUP="$PRIVATE/rollback/public-site-$SHA"
          mkdir -p "$BACKUP"
          chmod 700 "$PRIVATE" "$PRIVATE/rollback" "$BACKUP"
          test -s "$HOME_SRC"
          test -s "$PLANS_SRC"
          test -s "$PUBLIC/vamcity-public-home.html"
          test -n "$APP_ROOT"
          test -s "$APP_ROOT/wwwroot/index.html"
          grep -q 'href="/login/"' "$HOME_SRC"
          grep -q 'href="/register/0/"' "$HOME_SRC"
          grep -q 'href="/plans.html"' "$HOME_SRC"
          grep -q "fetch('/Loan/List/100'" "$PLANS_SRC"
          grep -q "const href='/plan/0/'" "$PLANS_SRC"

          if [ -e "$PUBLIC/vamcity-public-home.html" ]; then cp -p "$PUBLIC/vamcity-public-home.html" "$BACKUP/vamcity-public-home.html.before"; echo existing > "$BACKUP/home.state"; else echo absent > "$BACKUP/home.state"; fi
          if [ -e "$PLANS_DEST" ]; then cp -p "$PLANS_DEST" "$BACKUP/plans.html.before"; echo existing > "$BACKUP/plans.state"; else echo absent > "$BACKUP/plans.state"; fi
          chmod 600 "$BACKUP"/*.before "$BACKUP"/*.state

          rollback() {
            echo "ROLLING_BACK_VAMCITY_PUBLIC_SITE"
            if [ "$(cat "$BACKUP/home.state")" = existing ]; then cp -p "$BACKUP/vamcity-public-home.html.before" "$PUBLIC/vamcity-public-home.html"; else rm -f "$PUBLIC/vamcity-public-home.html"; fi
            if [ "$(cat "$BACKUP/plans.state")" = existing ]; then cp -p "$BACKUP/plans.html.before" "$PLANS_DEST"; else rm -f "$PLANS_DEST"; fi
          }
          STARTED=0
          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$STARTED" = 1 ]; then rollback || true; fi
            rm -f "$HOME_SRC" "$PLANS_SRC"
            exit "$rc"
          }
          trap on_exit EXIT

          install -m 644 "$HOME_SRC" "$PUBLIC/.vamcity-public-home-$SHA.tmp"
          install -m 644 "$PLANS_SRC" "$APP_ROOT/wwwroot/.plans-$SHA.tmp"
          STARTED=1
          mv -f "$PUBLIC/.vamcity-public-home-$SHA.tmp" "$PUBLIC/vamcity-public-home.html"
          mv -f "$APP_ROOT/wwwroot/.plans-$SHA.tmp" "$PLANS_DEST"

          APP_PLANS_STATUS="$(curl -sS -H 'Host: roofixo.ir' -o /tmp/vamcity-app-plans-$SHA.html -w '%{http_code}' --max-time 15 http://127.0.0.1:5187/plans.html)"
          echo "APP_STATIC_PLANS_HTTP=$APP_PLANS_STATUS"
          test "$APP_PLANS_STATUS" = 200
          grep -q 'طرح‌های تسهیلات | وام‌سیتی' /tmp/vamcity-app-plans-$SHA.html
          rm -f /tmp/vamcity-app-plans-$SHA.html

          HOME_STATUS="$(curl -k -sS --resolve roofixo.ir:443:127.0.0.1 -o /tmp/vamcity-home-check-$SHA.html -w '%{http_code}' https://roofixo.ir/)"
          PLANS_STATUS="$(curl -k -sS --resolve roofixo.ir:443:127.0.0.1 -o /tmp/vamcity-plans-check-$SHA.html -w '%{http_code}' https://roofixo.ir/plans.html)"
          echo "LOCAL_HOME_HTTP=$HOME_STATUS"
          echo "LOCAL_PLANS_HTTP=$PLANS_STATUS"
          test "$HOME_STATUS" = 200
          test "$PLANS_STATUS" = 200
          grep -q 'href="/login/"' /tmp/vamcity-home-check-$SHA.html
          grep -q 'href="/register/0/"' /tmp/vamcity-home-check-$SHA.html
          grep -q 'href="/plans.html"' /tmp/vamcity-home-check-$SHA.html
          grep -q 'طرح‌های تسهیلات | وام‌سیتی' /tmp/vamcity-plans-check-$SHA.html
          rm -f /tmp/vamcity-home-check-$SHA.html /tmp/vamcity-plans-check-$SHA.html
          echo "PUBLIC_SITE_DEPLOY_OK"
          echo "HOME_FILE=$PUBLIC/vamcity-public-home.html"
          echo "PLANS_FILE=$PLANS_DEST"
          echo "BACKUP=$BACKUP"
          echo "DATABASE_UNTOUCHED=1"
          echo "APP_CONTAINER_RESTARTED=0"
          REMOTE

      - name: Verify public URLs and live API
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://roofixo.ir
          HOME_CODE="$(curl --retry 3 --retry-delay 2 -sS -L --max-time 25 -o /tmp/vamcity-home.html -w '%{http_code}' "$BASE/")"
          PLANS_CODE="$(curl --retry 3 --retry-delay 2 -sS -L --max-time 25 -o /tmp/vamcity-plans.html -w '%{http_code}' "$BASE/plans.html")"
          echo "PUBLIC_HOME_HTTP=$HOME_CODE"
          echo "PUBLIC_PLANS_HTTP=$PLANS_CODE"
          test "$HOME_CODE" = 200
          test "$PLANS_CODE" = 200
          grep -q 'href="/login/"' /tmp/vamcity-home.html
          grep -q 'href="/register/0/"' /tmp/vamcity-home.html
          grep -q 'href="/plans.html"' /tmp/vamcity-home.html
          grep -q 'طرح‌های تسهیلات | وام‌سیتی' /tmp/vamcity-plans.html
          API_CODE="$(curl --retry 3 --retry-delay 2 -sS --max-time 25 -o /tmp/vamcity-plans-api.json -w '%{http_code}' "$BASE/Loan/List/100")"
          echo "LIVE_PLANS_API_HTTP=$API_CODE"
          test "$API_CODE" = 200
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/vamcity-plans-api.json', encoding='utf-8'))
          ok=p.get('success',p.get('Success'))
          d=p.get('data',p.get('Data'))
          if ok is not True or not isinstance(d,list) or not d:
              raise SystemExit("Live plans API did not return successful non-empty data")
          print("LIVE_PLANS_API_OK count="+str(len(d)))
          PY

      - name: Browser check desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const errors = [];
            const page = await browser.newPage({viewport:{width:1440,height:1000}});
            page.on('pageerror', e => errors.push(e.message));
            let response = await page.goto('https://roofixo.ir/', {waitUntil:'networkidle',timeout:45000});
            if (!response || response.status() !== 200) throw new Error('Homepage did not return HTTP 200');
            for (const href of ['/login/','/register/0/','/plans.html']) {
              if (await page.locator('a[href="'+href+'"]').count() === 0) throw new Error('Homepage missing link '+href);
            }
            await page.goto('https://roofixo.ir/plans.html', {waitUntil:'networkidle',timeout:45000});
            if (!(await page.title()).includes('طرح‌های تسهیلات')) throw new Error('Modern plans title missing');
            await page.waitForTimeout(1500);
            const cards = await page.locator('.card').count();
            const bodyText = await page.locator('body').innerText();
            if (!bodyText.includes('طرح‌های تسهیلات')) throw new Error('Plans page body is empty');
            console.log('DESKTOP_PLANS_CARD_COUNT='+cards);
            console.log('DESKTOP_BROWSER_ERRORS='+JSON.stringify(errors));
            await page.setViewportSize({width:390,height:844});
            await page.reload({waitUntil:'networkidle',timeout:45000});
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth > window.innerWidth + 1);
            if (overflow) throw new Error('Mobile horizontal overflow detected');
            for (const href of ['/login/','/register/0/']) {
              if (await page.locator('a[href="'+href+'"]').count() === 0) throw new Error('Mobile plans page missing '+href);
            }
            console.log('MOBILE_HORIZONTAL_OVERFLOW='+overflow);
            if (errors.length) throw new Error('Browser JS errors: '+JSON.stringify(errors));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          echo "VAMCITY_PUBLIC_SITE_BROWSER_CHECK_OK"
