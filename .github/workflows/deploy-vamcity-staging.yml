name: Deploy VamCity Linux staging on Roofixo
# Rebuild/redeploy current recovered source and frontend after validating the supplied source database; private DB backups stay on the server.
# Verify generated DirectAdmin vhosts route Roofixo HTTP and HTTPS to the recovered Linux app.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-vamcity-landing.yml"
      - "recovered-source/**"
      - "docs/linux-migration.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vamcity-roofixo-staging
  cancel-in-progress: true

jobs:
  build-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Prepare frontend and publish
        run: |
          set -euo pipefail
          test -f wwwroot/ui/index.html
          mkdir -p recovered-source/LoanSystemAvizhe.Site/wwwroot
          # Preserve original root assets (logos) and publish Vue assets at /js and /css.
          find wwwroot -mindepth 1 -maxdepth 1 ! -name ui -exec cp -a {} recovered-source/LoanSystemAvizhe.Site/wwwroot/ \;
          cp -a wwwroot/ui/. recovered-source/LoanSystemAvizhe.Site/wwwroot/
          test -s recovered-source/LoanSystemAvizhe.Site/wwwroot/index.html
          test -s recovered-source/LoanSystemAvizhe.Site/wwwroot/js/app.e76ab352.js
          test -s recovered-source/LoanSystemAvizhe.Site/wwwroot/logo-wide.png
          test -s recovered-source/LoanSystemAvizhe.Site/wwwroot/iranyekanweb.ttf
          dotnet publish recovered-source/LoanSystemAvizhe.Site/LoanSystemAvizhe.Site.csproj \
            --configuration Release --output ./artifacts/vamcity --verbosity minimal
          cp deployment/linux-postgresql/nlog.staging.config ./artifacts/vamcity/nlog.config
          test -f ./artifacts/vamcity/nlog.config
          test -f ./artifacts/vamcity/LoanSystemAvizhe.Site.dll
          test -f ./artifacts/vamcity/LoanSystemAvizhe.Site.runtimeconfig.json
          tar -czf ./artifacts/vamcity-publish.tar.gz -C ./artifacts/vamcity .

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/vamcity_deploy_key
          chmod 600 ~/.ssh/vamcity_deploy_key
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "DEPLOY_PORT_EFFECTIVE=$PORT" >> "$GITHUB_ENV"
          echo "DEPLOY_HOST_EFFECTIVE=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_USER_EFFECTIVE=$DEPLOY_USER" >> "$GITHUB_ENV"

      - name: Copy release artifact to Roofixo
        run: |
          set -euo pipefail
          scp -i ~/.ssh/vamcity_deploy_key -P "$DEPLOY_PORT_EFFECTIVE" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            ./artifacts/vamcity-publish.tar.gz \
            "$DEPLOY_USER_EFFECTIVE@$DEPLOY_HOST_EFFECTIVE:/tmp/vamcity-publish-$GITHUB_SHA.tar.gz"

      - name: Restore backup in isolated SQL Server and start Linux app
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vamcity_deploy_key -p "$DEPLOY_PORT_EFFECTIVE" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER_EFFECTIVE@$DEPLOY_HOST_EFFECTIVE" \
            "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          SHA="$1"
          DOMAIN_ROOT=/home/roofixo/domains/roofixo.ir
          BASE="$DOMAIN_ROOT/vamcity-app"
          PRIVATE="$BASE/private"
          RELEASE="$BASE/releases/$SHA"
          APP_ZIP="$DOMAIN_ROOT/public_html/vamcity.zip"
          DB_ZIP="$DOMAIN_ROOT/public_html/vamcityc_aqayevamdb_2026-10-11_15-51-44.zip"
          SQL_CONTAINER=vamcity-stage-sql
          APP_CONTAINER=vamcity-stage-app
          NETWORK=vamcity-stage-net
          DB_NAME=vamcity_stage

          test -f "$APP_ZIP"
          test -f "$DB_ZIP"
          mkdir -p "$RELEASE" "$PRIVATE/backup" "$PRIVATE/sql-data" "$PRIVATE/uploads"
          chmod 700 "$BASE" "$PRIVATE" "$PRIVATE/backup" "$PRIVATE/sql-data" "$PRIVATE/uploads"
          tar -xzf "/tmp/vamcity-publish-$SHA.tar.gz" -C "$RELEASE"
          rm -f "/tmp/vamcity-publish-$SHA.tar.gz"
          mkdir -p "$RELEASE/uploads" "$RELEASE/logs/nlog"
          chmod 700 "$RELEASE" "$RELEASE/logs" "$RELEASE/logs/nlog"

          echo "=== RESTORE ORIGINAL UPLOADS AND CERTIFICATE WHEN MISSING ==="
          UPLOAD_FILES="$(find "$PRIVATE/uploads" -type f | wc -l)"
          if [ "$UPLOAD_FILES" -eq 0 ]; then
            unzip -n -q "$APP_ZIP" 'uploads/*' -d "$PRIVATE"
            UPLOAD_FILES="$(find "$PRIVATE/uploads" -type f | wc -l)"
          fi
          echo "ORIGINAL_UPLOAD_FILES=$UPLOAD_FILES"
          test "$UPLOAD_FILES" -gt 0
          mkdir -p "$RELEASE/App_Data/certs"
          if [ ! -s "$RELEASE/App_Data/certs/orgCertificate.pfx" ]; then
            unzip -p "$APP_ZIP" 'App_Data/certs/orgCertificate.pfx' > "$RELEASE/App_Data/certs/orgCertificate.pfx"
          fi
          test -s "$RELEASE/App_Data/certs/orgCertificate.pfx"
          chmod 600 "$RELEASE/App_Data/certs/orgCertificate.pfx"
          if [ -e "$BASE/current" ] && [ ! -L "$BASE/current" ]; then
            mv "$BASE/current" "$BASE/current.pre-symlink-$(date -u +%Y%m%dT%H%M%SZ)"
          fi
          ln -sfn "$RELEASE" "$BASE/current"

          echo "=== EXTRACT CURRENT SOURCE DATABASE BACKUP PRIVATELY ==="
          DB_ENTRY="$(unzip -Z1 "$DB_ZIP" | head -1)"
          test -n "$DB_ENTRY"
          unzip -p "$DB_ZIP" "$DB_ENTRY" > "$PRIVATE/backup/source.new.bak"
          test -s "$PRIVATE/backup/source.new.bak"
          chmod 600 "$PRIVATE/backup/source.new.bak"
          NEW_DB_SHA="$(sha256sum "$PRIVATE/backup/source.new.bak" | awk '{print $1}')"
          OLD_DB_SHA=""
          if [ -s "$PRIVATE/backup/source.bak" ]; then OLD_DB_SHA="$(sha256sum "$PRIVATE/backup/source.bak" | awk '{print $1}')"; fi
          DB_BACKUP_CHANGED=0
          if [ "$NEW_DB_SHA" != "$OLD_DB_SHA" ]; then
            if [ -s "$PRIVATE/backup/source.bak" ]; then
              cp -p "$PRIVATE/backup/source.bak" "$PRIVATE/backup/source.previous.bak"
              chmod 600 "$PRIVATE/backup/source.previous.bak"
            fi
            mv "$PRIVATE/backup/source.new.bak" "$PRIVATE/backup/source.bak"
            DB_BACKUP_CHANGED=1
          else
            rm -f "$PRIVATE/backup/source.new.bak"
          fi
          echo "SOURCE_DATABASE_BACKUP_CHANGED=$DB_BACKUP_CHANGED"
          echo "SOURCE_DATABASE_BACKUP_SHA256=$NEW_DB_SHA"
          if [ ! -s "$PRIVATE/sql.env" ]; then
            SQL_PASSWORD="$(openssl rand -hex 24)Aa1!"
            umask 077
            printf 'ACCEPT_EULA=Y\nMSSQL_PID=Developer\nMSSQL_SA_PASSWORD=%s\nMSSQL_MEMORY_LIMIT_MB=1024\n' "$SQL_PASSWORD" > "$PRIVATE/sql.env"
          fi
          sed -i '/^HOME=/d' "$PRIVATE/sql.env"
          printf 'HOME=/var/opt/mssql\n' >> "$PRIVATE/sql.env"
          SQL_PASSWORD="$(sed -n 's/^MSSQL_SA_PASSWORD=//p' "$PRIVATE/sql.env" | head -1)"
          test -n "$SQL_PASSWORD"

          if docker network inspect "$NETWORK" >/dev/null 2>&1; then
            INTERNAL="$(docker network inspect -f '{{.Internal}}' "$NETWORK" 2>/dev/null || echo false)"
            if [ "$INTERNAL" = "true" ]; then
              echo "STAGING_NETWORK_WAS_INTERNAL; rebuilding isolated bridge so host loopback publishing can work"
              docker rm -f "$APP_CONTAINER" "$SQL_CONTAINER" >/dev/null 2>&1 || true
              docker network rm "$NETWORK" >/dev/null
            fi
          fi
          if ! docker network inspect "$NETWORK" >/dev/null 2>&1; then
            docker network create "$NETWORK" >/dev/null
          fi
          docker image inspect mcr.microsoft.com/mssql/server:2022-latest >/dev/null 2>&1 || docker pull mcr.microsoft.com/mssql/server:2022-latest
          docker pull mcr.microsoft.com/dotnet/aspnet:10.0
          docker run --rm --entrypoint dotnet mcr.microsoft.com/dotnet/aspnet:10.0 --list-runtimes | grep -E '^Microsoft\.NETCore\.App 10\.'

          if docker container inspect "$SQL_CONTAINER" >/dev/null 2>&1; then
            STATUS="$(docker inspect -f '{{.State.Status}}' "$SQL_CONTAINER" 2>/dev/null || echo missing)"
            if [ "$STATUS" != "running" ]; then docker rm -f "$SQL_CONTAINER" >/dev/null; fi
          fi
          docker volume create vamcity_stage_sql_data >/dev/null
          if ! docker container inspect "$SQL_CONTAINER" >/dev/null 2>&1; then
            docker run -d --name "$SQL_CONTAINER" --restart unless-stopped \
              --network "$NETWORK" --memory=2g --memory-swap=2g \
              --env-file "$PRIVATE/sql.env" \
              -v vamcity_stage_sql_data:/var/opt/mssql \
              mcr.microsoft.com/mssql/server:2022-latest >/dev/null
          else
            docker network connect "$NETWORK" "$SQL_CONTAINER" >/dev/null 2>&1 || true
          fi

          SQLCMD="$(docker exec "$SQL_CONTAINER" bash -lc 'if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then echo /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then echo /opt/mssql-tools/bin/sqlcmd; fi' | tail -1)"
          if [ -z "$SQLCMD" ]; then
            echo "SQLCMD_NOT_FOUND_IN_SQL_SERVER_CONTAINER"
            docker logs --tail 80 "$SQL_CONTAINER" || true
            exit 1
          fi

          READY=0
          for i in $(seq 1 60); do
            if docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then READY=1; break; fi
            sleep 5
          done
          if [ "$READY" -ne 1 ]; then
            echo "SQL_SERVER_DID_NOT_BECOME_READY"
            docker logs --tail 100 "$SQL_CONTAINER" || true
            exit 1
          fi

          docker exec -u 0 "$SQL_CONTAINER" mkdir -p /var/opt/mssql/backup
          docker exec -u 0 "$SQL_CONTAINER" chown 10001:0 /var/opt/mssql/backup
          docker exec -u 0 "$SQL_CONTAINER" chmod 770 /var/opt/mssql/backup
          if [ "$DB_BACKUP_CHANGED" = "1" ] || ! docker exec "$SQL_CONTAINER" test -s /var/opt/mssql/backup/source.bak; then
            docker cp "$PRIVATE/backup/source.bak" "$SQL_CONTAINER:/var/opt/mssql/backup/source.bak"
            docker exec -u 0 "$SQL_CONTAINER" chown 10001:0 /var/opt/mssql/backup/source.bak
            docker exec -u 0 "$SQL_CONTAINER" chmod 640 /var/opt/mssql/backup/source.bak
          fi

          DB_EXISTS="$(docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name = N'$DB_NAME';" | tr -d '[:space:]')"
          if [ "$DB_EXISTS" != "1" ] || [ "$DB_BACKUP_CHANGED" = "1" ]; then
            echo "=== READ BACKUP FILELIST ==="
            FILELIST="$(docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -h -1 -W -s "|" -Q "RESTORE FILELISTONLY FROM DISK = N'/var/opt/mssql/backup/source.bak';" | awk -F'|' 'NF>=3 {gsub(/^[ \t]+|[ \t]+$/, "", $1); gsub(/^[ \t]+|[ \t]+$/, "", $3); if ($1 != "" && ($3 == "D" || $3 == "L")) print $1 "|" $3}')"
            test -n "$FILELIST" || { echo "BACKUP_FILELIST_EMPTY_OR_UNREADABLE"; exit 1; }
            RESTORE_SQL="RESTORE DATABASE [$DB_NAME] FROM DISK = N'/var/opt/mssql/backup/source.bak' WITH REPLACE, RECOVERY, STATS=5"
            if [ "$DB_EXISTS" = "1" ]; then
              PRE_RESTORE_FILE="/var/opt/mssql/backup/pre-restore-$SHA.bak"
              echo "Backing up current staging database before replacing it"
              docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "BACKUP DATABASE [$DB_NAME] TO DISK = N'$PRE_RESTORE_FILE' WITH COPY_ONLY, INIT, COMPRESSION;"
              docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "RESTORE VERIFYONLY FROM DISK = N'$PRE_RESTORE_FILE';"
              docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "ALTER DATABASE [$DB_NAME] SET SINGLE_USER WITH ROLLBACK IMMEDIATE;"
            fi
            DATA_N=0
            LOG_N=0
            while IFS='|' read -r LOGICAL TYPE; do
              [ -n "$LOGICAL" ] || continue
              if ! printf "%s" "$LOGICAL" | grep -Eq "^[A-Za-z0-9_. -]+$"; then
                echo "UNEXPECTED_LOGICAL_FILE_NAME; stopping safely"
                exit 1
              fi
              if [ "$TYPE" = "D" ]; then
                DATA_N=$((DATA_N + 1))
                if [ "$DATA_N" -eq 1 ]; then EXT=mdf; else EXT=ndf; fi
                DEST="/var/opt/mssql/data/vamcity_stage_data${DATA_N}.$EXT"
              else
                LOG_N=$((LOG_N + 1))
                DEST="/var/opt/mssql/data/vamcity_stage_log${LOG_N}.ldf"
              fi
              RESTORE_SQL="$RESTORE_SQL, MOVE N'$LOGICAL' TO N'$DEST'"
            done <<EOF
          $FILELIST
          EOF
            echo "=== RESTORE DATABASE INTO ISOLATED STAGING INSTANCE ==="
            docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "$RESTORE_SQL"
            docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "ALTER DATABASE [$DB_NAME] SET MULTI_USER;"
          else
            echo "SOURCE_DATABASE_UNCHANGED; preserving current staged data"
          fi

          echo "=== VALIDATE RESTORED BUSINESS SCHEMA BEFORE STARTING APP ==="
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "USE [$DB_NAME]; SET NOCOUNT ON; DECLARE @missing nvarchar(max)=N''; SELECT @missing=@missing+name+N', ' FROM (VALUES (N'Customers'),(N'AppSettings'),(N'AspNetUsers'),(N'AspNetRoles'),(N'Loans'),(N'UserLoans')) AS required(name) WHERE OBJECT_ID(N'dbo.'+name,N'U') IS NULL; IF @missing<>N'' THROW 51001, @missing, 1; SELECT N'Customers' AS Entity, COUNT_BIG(*) AS TotalRows FROM dbo.Customers UNION ALL SELECT N'AppSettings', COUNT_BIG(*) FROM dbo.AppSettings UNION ALL SELECT N'AspNetUsers', COUNT_BIG(*) FROM dbo.AspNetUsers UNION ALL SELECT N'AspNetRoles', COUNT_BIG(*) FROM dbo.AspNetRoles UNION ALL SELECT N'Loans', COUNT_BIG(*) FROM dbo.Loans UNION ALL SELECT N'UserLoans', COUNT_BIG(*) FROM dbo.UserLoans UNION ALL SELECT N'CustomerPurchasePlan', COUNT_BIG(*) FROM dbo.CustomerPurchasePlan UNION ALL SELECT N'Purchases', COUNT_BIG(*) FROM dbo.Purchases; SELECT N'EF_Migration_History_Rows' AS CheckName, COUNT_BIG(*) AS TotalRows FROM dbo.__EFMigrationsHistory;" 

          # Resolve the dedicated installation's tenant from the restored database.
          # CustomerCode=0 silently empties tenant-specific panels and breaks settings/plans lookup.
          TENANT_COUNT="$(docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT_BIG(*) FROM [$DB_NAME].dbo.Customers;" | tr -d '[:space:]')"
          if [ "$TENANT_COUNT" != "1" ]; then
            echo "EXPECTED_EXACTLY_ONE_TENANT_FOR_DEDICATED_ROOFIXO_INSTALLATION; TENANT_COUNT=$TENANT_COUNT"
            exit 1
          fi
          CUSTOMER_CODE="$(docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -h -1 -W -Q "SET NOCOUNT ON; SELECT TOP (1) Code FROM [$DB_NAME].dbo.Customers;" | tr -d '[:space:]')"
          if ! [[ "$CUSTOMER_CODE" =~ ^[0-9]+$ ]] || [ "$CUSTOMER_CODE" -le 0 ]; then
            echo "INVALID_TENANT_CUSTOMER_CODE=$CUSTOMER_CODE"
            exit 1
          fi
          echo "VAMCITY_CONFIGURED_CUSTOMER_CODE=$CUSTOMER_CODE"

          # Keep the JWT signing key stable across releases so existing login tokens remain valid.
          APP_SECRET=""
          if [ -s "$PRIVATE/app.env" ]; then
            APP_SECRET="$(sed -n 's/^AppConfig__JwtSecretKey=//p' "$PRIVATE/app.env" | head -1)"
          fi
          if [ -z "$APP_SECRET" ]; then APP_SECRET="$(openssl rand -hex 32)"; fi
          umask 077
          printf 'ASPNETCORE_URLS=http://+:8080\nASPNETCORE_ENVIRONMENT=Production\nConnectionStrings__DefaultConnection=Server=%s,1433;Database=%s;User Id=sa;Password=%s;Encrypt=False;TrustServerCertificate=True;\nAppConfig__JwtSecretKey=%s\nAppConfig__IsCloud=false\nAppConfig__CustomerCode=%s\nAppConfig__BaseUrl=https://roofixo.ir\nAppConfig__FrontUrl=https://roofixo.ir\n' \
            "$SQL_CONTAINER" "$DB_NAME" "$SQL_PASSWORD" "$APP_SECRET" "$CUSTOMER_CODE" > "$PRIVATE/app.env"
          chmod 600 "$PRIVATE/app.env"

          if docker container inspect "$APP_CONTAINER" >/dev/null 2>&1; then docker rm -f "$APP_CONTAINER" >/dev/null; fi
          docker run -d --name "$APP_CONTAINER" --restart unless-stopped \
            --network "$NETWORK" --memory=1g --memory-swap=1g \
            --env-file "$PRIVATE/app.env" \
            --publish=127.0.0.1:5187:8080 \
            -v "$RELEASE:/app" -v "$PRIVATE/uploads:/app/uploads" \
            -w /app --entrypoint dotnet \
            mcr.microsoft.com/dotnet/aspnet:10.0 LoanSystemAvizhe.Site.dll >/dev/null

          echo "=== VERIFY EXPLICIT HOST PORT PUBLISHING ==="
          docker port "$APP_CONTAINER" 8080/tcp || true
          PORT_BINDING="$(docker inspect -f '{{with index .HostConfig.PortBindings "8080/tcp"}}{{range .}}{{.HostIp}}:{{.HostPort}}{{end}}{{end}}' "$APP_CONTAINER")"
          if [ "$PORT_BINDING" != "127.0.0.1:5187" ]; then
            echo "PORT_BINDING_MISSING_OR_WRONG=$PORT_BINDING; recreating app container once"
            docker rm -f "$APP_CONTAINER" >/dev/null 2>&1 || true
            docker run -d --name "$APP_CONTAINER" --restart unless-stopped \
              --network "$NETWORK" --memory=1g --memory-swap=1g \
              --env-file "$PRIVATE/app.env" \
              --publish=127.0.0.1:5187:8080 \
              -v "$RELEASE:/app" -v "$PRIVATE/uploads:/app/uploads" \
              -w /app --entrypoint dotnet \
              mcr.microsoft.com/dotnet/aspnet:10.0 LoanSystemAvizhe.Site.dll >/dev/null
          fi
          docker port "$APP_CONTAINER" 8080/tcp
          HEALTH=000
          for i in $(seq 1 36); do
            HEALTH="$(curl -sS -o /dev/null --max-time 4 -w '%{http_code}' http://127.0.0.1:5187/ || true)"
            case "$HEALTH" in 200|301|302|307|308) break ;; esac
            sleep 5
          done
          echo "VAMCITY_STAGE_HTTP=$HEALTH"
          echo "=== DATABASE SUMMARY (no customer data printed) ==="
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -Q "SET NOCOUNT ON; SELECT name, state_desc FROM sys.databases WHERE name = N'$DB_NAME'; SELECT COUNT(*) AS user_tables FROM [$DB_NAME].sys.tables;" -h -1 -W || true
          echo "=== SITE ROUTING PRECHECK ==="
          for host in vamcity.com www.vamcity.com agayevam.com www.agayevam.com; do
            printf '%s ' "$host"
            getent ahostsv4 "$host" | awk 'NR==1 {print $1}' || true
          done
          for host in vamcity.com agayevam.com; do
            if [ -d "/home/roofixo/domains/$host" ]; then echo "DIRECTADMIN_DOMAIN_PRESENT=$host"; else echo "DIRECTADMIN_DOMAIN_NOT_UNDER_ROOFIXO=$host"; fi
          done

          if ! [[ "$HEALTH" =~ ^(200|301|302|307|308)$ ]]; then
            echo "APPLICATION_HEALTH_CHECK_FAILED; last logs follow"
            docker logs --tail 120 "$APP_CONTAINER" || true
            exit 1
          fi

          echo "=== VERIFY TENANT CONFIG AND PUBLIC PLAN API BEFORE MARKING DEPLOYMENT HEALTHY ==="
          SITE_CONFIG_JSON="$(curl -fsS --max-time 15 -X POST -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:5187/Site/SiteConfig)"
          ACTUAL_CUSTOMER_CODE="$(printf '%s' "$SITE_CONFIG_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); x=d.get("data",d.get("Data")) or {}; print(x.get("customerCode",x.get("CustomerCode",0)))')"
          if [ "$ACTUAL_CUSTOMER_CODE" != "$CUSTOMER_CODE" ]; then
            echo "SITE_CONFIG_CUSTOMER_CODE_MISMATCH expected=$CUSTOMER_CODE actual=$ACTUAL_CUSTOMER_CODE"
            exit 1
          fi
          PLAN_JSON="$(curl -fsS --max-time 20 -H 'Accept: application/json' "http://127.0.0.1:5187/Loan/List/$CUSTOMER_CODE")"
          printf '%s' "$PLAN_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); ok=d.get("success",d.get("Success")); data=d.get("data",d.get("Data")); assert ok is True, "public plan API returned unsuccessful response"; assert isinstance(data,list), "public plan API data is not a list"; print("VAMCITY_PUBLIC_PLAN_API_OK count=%d" % len(data))'
          LANDING_JSON="$(curl -fsS --max-time 15 -H 'Accept: application/json' "http://127.0.0.1:5187/appSettings/GetLandingSettings/0")"
          printf '%s' "$LANDING_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); ok=d.get("success",d.get("Success")); assert ok is True, "landing settings API returned unsuccessful response"; print("VAMCITY_LANDING_SETTINGS_API_OK")'
          for ASSET_PATH in /logo-wide.png /iranyekanweb.ttf; do
            ASSET_CODE="$(curl -sS -o /dev/null --max-time 8 -w '%{http_code}' "http://127.0.0.1:5187$ASSET_PATH")"
            echo "VAMCITY_STATIC_ASSET path=$ASSET_PATH http=$ASSET_CODE"
            [ "$ASSET_CODE" = "200" ] || { echo "VAMCITY_STATIC_ASSET_FAILED path=$ASSET_PATH"; exit 1; }
          done
          echo "VAMCITY_TENANT_CONFIG_OK customer_code=$CUSTOMER_CODE"

          echo "=== CONFIGURE ROOFIXO.IR AS VAMCITY PRIMARY DOMAIN ==="
          DA_USER=roofixo
          DOMAIN=roofixo.ir
          CUSTOM="/usr/local/directadmin/data/users/$DA_USER/domains/$DOMAIN.cust_nginx"
          CUSTOM_DIR="$(dirname "$CUSTOM")"
          BACKUP="$CUSTOM.before-vamcity-$(date -u +%Y%m%dT%H%M%SZ)"
          HAD_CUSTOM=0
          mkdir -p "$CUSTOM_DIR"
          if [ -f "$CUSTOM" ]; then
            cp -a "$CUSTOM" "$BACKUP"
            HAD_CUSTOM=1
            echo "EXISTING_CUSTOM_NGINX_BACKUP=$BACKUP"
          fi
          rollback_domain_config() {
            if [ "$HAD_CUSTOM" = "1" ]; then cp -a "$BACKUP" "$CUSTOM"; else rm -f "$CUSTOM"; fi
            /usr/local/directadmin/custombuild/build rewrite_confs >/dev/null 2>&1 || true
          }
          cat > "$CUSTOM.tmp" <<'NGINX'
          location / {
              proxy_pass http://127.0.0.1:5187;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header X-Forwarded-Host $host;
              proxy_read_timeout 300s;
              proxy_send_timeout 300s;
          }
          NGINX
          mv "$CUSTOM.tmp" "$CUSTOM"
          if ! /usr/local/directadmin/custombuild/build rewrite_confs; then
            echo "DIRECTADMIN_REWRITE_FAILED; restoring previous domain configuration"
            rollback_domain_config
            exit 1
          fi
          # DirectAdmin on this host does not inject *.cust_nginx into the generated vhost.
          # Install the proxy location into the generated Roofixo vhosts after each rewrite.
          GENERATED="/usr/local/directadmin/data/users/$DA_USER/nginx.conf"
          GENERATED_BACKUP="$GENERATED.before-vamcity-$(date -u +%Y%m%dT%H%M%SZ)"
          cp -a "$GENERATED" "$GENERATED_BACKUP"
          if ! python3 - "$GENERATED" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          begin = "\t# BEGIN VAMCITY REVERSE PROXY"
          end = "\t# END VAMCITY REVERSE PROXY"
          while begin in s and end in s:
              a = s.index(begin)
              b = s.index(end, a) + len(end)
              s = s[:a] + s[b:]
          needle = "\tinclude /usr/local/directadmin/data/users/roofixo/nginx_php.conf;"
          if s.count(needle) < 2:
              print("ERROR: expected both generated Roofixo HTTP/HTTPS vhost insertion points")
              raise SystemExit(2)
          block = """\n\t# BEGIN VAMCITY REVERSE PROXY
          \t# The requested legacy landing URL must route to the real Vue plans page.
          \tlocation = /clplans/0/ { return 302 /cl/plans/; }
          \tlocation = /clplans/0 { return 302 /cl/plans/; }
          \tlocation = /plans/0/ { return 302 /cl/plans/; }
          \tlocation = /plans/0 { return 302 /cl/plans/; }
          \tlocation / {
          \t\tproxy_pass http://127.0.0.1:5187;
          \t\tproxy_http_version 1.1;
          \t\tproxy_set_header Host $host;
          \t\tproxy_set_header X-Real-IP $remote_addr;
          \t\tproxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          \t\tproxy_set_header X-Forwarded-Proto $scheme;
          \t\tproxy_set_header X-Forwarded-Host $host;
          \t\tproxy_read_timeout 300s;
          \t\tproxy_send_timeout 300s;
          \t}
          \t# END VAMCITY REVERSE PROXY"""
          s = s.replace(needle, needle + block)
          p.write_text(s)
          print("VAMCITY_PROXY_INSERTED_IN_GENERATED_VHOSTS=2")
          PY
          then
            cp -a "$GENERATED_BACKUP" "$GENERATED"
            rollback_domain_config
            exit 1
          fi
          if ! nginx -t; then
            echo "NGINX_TEST_FAILED; restoring previous generated and domain configuration"
            cp -a "$GENERATED_BACKUP" "$GENERATED"
            rollback_domain_config
            nginx -t || true
            exit 1
          fi
          systemctl reload nginx
          SERVER_INTERFACE_IP="$(ip route get 1.1.1.1 2>/dev/null | awk '{for (i=1;i<=NF;i++) if ($i=="src") {print $(i+1); exit}}')"
          DOMAIN_IP="$(sed -n 's/^ip=//p' /usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.conf 2>/dev/null | head -1)"
          VHOST_TEST_IP="$DOMAIN_IP"
          if [ -z "$VHOST_TEST_IP" ] || ! ip -o -4 addr show 2>/dev/null | grep -Fq "$VHOST_TEST_IP"; then VHOST_TEST_IP="$SERVER_INTERFACE_IP"; fi
          test -n "$VHOST_TEST_IP" || { echo "ROOFIXO_VHOST_TEST_IP_UNAVAILABLE"; exit 1; }
          echo "ROOFIXO_LOCAL_VHOST_TEST_IP_ASSIGNED=yes"
          echo "=== API TRANSPORT CHECK (local Roofixo vhost; anonymous protected routes should return 401/403) ==="
          for API_PATH in /superadmin/dashboard/get /superadmin/customer/list/ /admin/appSettings/get /admin/customerpurchaseplan/list/; do
            API_CODE="000"
            # ASP.NET may still be applying EF migrations immediately after the container starts.
            # Retry transient 000/404/5xx responses instead of racing application startup.
            for ATTEMPT in $(seq 1 24); do
              API_CODE="$(curl -k -sS --max-time 8 --resolve "roofixo.ir:443:$VHOST_TEST_IP" -H 'Accept: application/json' -o /dev/null -w '%{http_code}' "https://roofixo.ir$API_PATH" 2>/dev/null || true)"
              echo "API_TRANSPORT_ATTEMPT path=$API_PATH attempt=$ATTEMPT http=$API_CODE"
              case "$API_CODE" in
                200|204|301|302|307|308|401|403) break ;;
              esac
              sleep 3
            done
            echo "API_TRANSPORT_FINAL path=$API_PATH http=$API_CODE"
            case "$API_CODE" in
              000|404|5??) echo "API_TRANSPORT_FAILED path=$API_PATH"; docker logs --tail 160 "$APP_CONTAINER" || true; exit 1 ;;
            esac
            if [ "$API_CODE" = "401" ] || [ "$API_CODE" = "403" ]; then
              API_BODY="$(curl -k -sS --max-time 8 --resolve "roofixo.ir:443:$VHOST_TEST_IP" -H 'Accept: application/json' "https://roofixo.ir$API_PATH" 2>/dev/null || true)"
              if ! printf '%s' "$API_BODY" | grep -Eq '"success"[[:space:]]*:[[:space:]]*false'; then
                echo "API_AUTH_RESPONSE_ENVELOPE_INVALID path=$API_PATH"
                printf '%s\n' "$API_BODY" | head -c 600
                docker logs --tail 120 "$APP_CONTAINER" || true
                exit 1
              fi
              echo "API_AUTH_RESPONSE_ENVELOPE_OK path=$API_PATH"
            fi
          done
          echo "=== NGINX LISTENING ADDRESSES AND ROOFIXO VHOST ==="
          ip -br -4 address 2>/dev/null || ip -4 address 2>/dev/null || true
          echo "=== SOCKET LISTENERS ==="
          ss -ltnp 2>/dev/null | grep -E ':(80|443|5187)([[:space:]]|$)' || true
          echo "=== ALL GENERATED ROOFIXO VHOST LINES ==="
          nginx -T 2>&1 | grep -n -i -B 8 -A 20 'roofixo' | head -180 || true
          echo "=== NGINX VHOST DEFAULT SERVER LINES ==="
          nginx -T 2>&1 | grep -n -E 'listen .*default_server|server_name _|listen .*:443|listen .*:80' | head -100 || true
          echo "=== DIRECTADMIN ROOFIXO DOMAIN METADATA ==="
          ls -l /usr/local/directadmin/data/users/roofixo/domains/roofixo.ir* 2>/dev/null || true
          grep -n -E '^(ip|domain|ssl|nginx|php|private_html|force_ssl)=' /usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.conf 2>/dev/null || true
          echo "=== DOMAIN IP MAPPING COMPARISON (NO IP VALUES) ==="
          ETH0_IP="$(ip -o -4 addr show dev eth0 2>/dev/null | awk '{split($4,a,"/"); print a[1]; exit}')"
          DOMAIN_IP="$(sed -n 's/^ip=//p' /usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.conf 2>/dev/null | head -1)"
          echo "DOMAIN_IP_MATCHES_ETH0=$([ -n "$ETH0_IP" ] && [ "$ETH0_IP" = "$DOMAIN_IP" ] && echo yes || echo no)"
          echo "DOMAIN_IP_IS_LISTED_IN_DA_IPS=$([ -n "$DOMAIN_IP" ] && grep -Fqx "$DOMAIN_IP" /usr/local/directadmin/data/admin/ip.list 2>/dev/null && echo yes || echo no)"
          echo "DOMAIN_IP_LIST_FILE:"
          cat /usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.ip_list 2>/dev/null || true
          SERVER_INTERFACE_IP="$(ip route get 1.1.1.1 2>/dev/null | awk '{for (i=1;i<=NF;i++) if ($i=="src") {print $(i+1); exit}}')"
          echo "SERVER_INTERFACE_IP=$SERVER_INTERFACE_IP"
          echo "=== TEST HOSTNAME AGAINST EACH LOCAL IPV4 ADDRESS ==="
          for IP in $(ip -o -4 addr show scope global 2>/dev/null | awk '{split($4,a,"/"); print a[1]}'); do
            CODE="$(curl -k -sS --max-time 8 --resolve "roofixo.ir:443:$IP" -o /dev/null -w '%{http_code}' https://roofixo.ir/ || true)"
            echo "LOCAL_INTERFACE_VHOST_TEST_IP=$IP HTTP=$CODE"
          done
          DOMAIN_HTTP="$(curl -k -sS -o /dev/null --max-time 12 -w '%{http_code}' --resolve "roofixo.ir:443:$VHOST_TEST_IP" https://roofixo.ir/ || true)"
          echo "ROOFIXO_HTTPS_LOCAL_HTTP=$DOMAIN_HTTP"
          case "$DOMAIN_HTTP" in
            200|301|302|307|308) echo "ROOFIXO_PRIMARY_DOMAIN_PROXY_OK" ;;
            *) echo "WARNING: Nginx config applied but local HTTPS host check returned $DOMAIN_HTTP; inspect certificate/vhost and app logs" ;;
          esac
          echo "=== DIRECT PUBLIC-IP VHOST TEST ==="
          DIRECT_HTTP="$(curl -4 -k -sS --max-time 15 --resolve "roofixo.ir:443:$SERVER_INTERFACE_IP" -o /tmp/roofixo-direct-body.html -D /tmp/roofixo-direct-headers.txt -w '%{http_code}' https://roofixo.ir/ || true)"
          echo "ROOFIXO_DIRECT_SERVER_IP_HTTP=$DIRECT_HTTP"
          sed -n '1,8p' /tmp/roofixo-direct-headers.txt 2>/dev/null || true
          grep -Eio '<title>[^<]*|404 Not Found|nginx' /tmp/roofixo-direct-body.html 2>/dev/null | head -8 || true
          echo "=== PUBLIC DNS AND ROUTING DIAGNOSTICS ==="
          echo "SERVER_RESOLVES_ROOFIXO_IR:"
          getent ahostsv4 roofixo.ir | awk '!seen[$1]++ {print $1}' || true
          echo "SERVER_PUBLIC_IPS:"
          curl -4 -fsS --max-time 8 https://api.ipify.org || true
          echo
          echo "PUBLIC_DNS_LOOKUP:"
          if command -v dig >/dev/null 2>&1; then
            dig +short A roofixo.ir
            dig +short AAAA roofixo.ir
          fi
          echo "PUBLIC_HTTPS_RESPONSE:"
          PUBLIC_HTTP="$(curl -4 -k -sS --max-time 15 -D /tmp/roofixo-public-headers.txt -o /tmp/roofixo-public-body.html -w '%{http_code}' https://roofixo.ir/ || true)"
          echo "PUBLIC_ROOFIXO_HTTP=$PUBLIC_HTTP"
          sed -n '1,12p' /tmp/roofixo-public-headers.txt 2>/dev/null || true
          grep -Eio '<title>[^<]*|404 Not Found|nginx' /tmp/roofixo-public-body.html 2>/dev/null | head -8 || true
          case "$PUBLIC_HTTP" in
            200|301|302|307|308) echo "ROOFIXO_PUBLIC_HTTP_OK" ;;
            *) echo "ROOFIXO_PUBLIC_HTTP_FAILED=$PUBLIC_HTTP; deployment must not report success"; exit 1 ;;
          esac
          echo "VAMCITY_DEPLOYMENT_OK; roofixo.ir configured as primary domain; app bound only to 127.0.0.1:5187"
          REMOTE

      - name: Verify public Roofixo URL from GitHub runner
        run: |
          set +e
          echo "=== DIRECT SERVER IP FROM GITHUB RUNNER ==="
          DNS_TARGET_IP="$(getent ahostsv4 roofixo.ir | awk 'NR==1 {print $1}')"
          echo "DNS_TARGET_IP=$DNS_TARGET_IP"
          curl -4 -k -sS --max-time 20 --resolve "roofixo.ir:443:$DNS_TARGET_IP" -D /tmp/roofixo-direct-headers.txt -o /tmp/roofixo-direct-body.html -w 'DNS_TARGET_VHOST_HTTP=%{http_code} REMOTE_IP=%{remote_ip}\n' https://roofixo.ir/ || true
          sed -n '1,8p' /tmp/roofixo-direct-headers.txt 2>/dev/null || true
          grep -Eio '<title>[^<]*|404 Not Found|nginx' /tmp/roofixo-direct-body.html 2>/dev/null | head -8 || true
          echo "=== PUBLIC DNS FROM OUTSIDE SERVER ==="
          getent ahostsv4 roofixo.ir | awk '!seen[$1]++ {print $1}'
          getent ahostsv4 www.roofixo.ir | awk '!seen[$1]++ {print $1}'
          echo "=== PUBLIC HTTPS RESPONSE ==="
          PUBLIC_HTTP="$(curl -4 -k -sS --max-time 20 -D /tmp/roofixo-headers.txt -o /tmp/roofixo-body.html -w '%{http_code}' https://roofixo.ir/)"
          echo "PUBLIC_ROOFIXO_HTTP=$PUBLIC_HTTP"
          sed -n '1,12p' /tmp/roofixo-headers.txt
          grep -Eio '<title>[^<]*|404 Not Found|nginx' /tmp/roofixo-body.html | head -8 || true
          case "$PUBLIC_HTTP" in
            200|301|302|307|308) echo "PUBLIC_ROOFIXO_CHECK_OK" ;;
            *) echo "PUBLIC_ROOFIXO_CHECK_FAILED=$PUBLIC_HTTP"; exit 1 ;;
          esac
          echo "=== WWW HTTPS RESPONSE ==="
          curl -4 -k -sS --max-time 20 -D /tmp/roofixo-www-headers.txt -o /tmp/roofixo-www-body.html -w 'PUBLIC_WWW_HTTP=%{http_code} REMOTE_IP=%{remote_ip} FINAL_URL=%{url_effective}\n' https://www.roofixo.ir/
          sed -n '1,8p' /tmp/roofixo-www-headers.txt
