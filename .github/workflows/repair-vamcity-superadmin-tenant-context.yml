name: Repair dedicated VamCity admin tenant context
run-name: Bind the single active SuperAdmin to the only Roofixo tenant

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-vamcity-superadmin-tenant-context.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vamcity-superadmin-tenant-context-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Guarded database repair with a pre-change backup
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          PORT="${DEPLOY_PORT:-22}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/vamcity-key"
          chmod 600 "$RUNNER_TEMP/vamcity-key"
          ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$RUNNER_TEMP/vamcity-key" -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_CONFIG="$(docker inspect vamcity-stage-app --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -i '^AppConfig__IsCloud=' | tail -1 | cut -d= -f2- || true)"
          if [[ "$APP_CONFIG" != "false" ]]; then
            echo "STOPPED_UNSAFE_OR_CLOUD_MODE: AppConfig__IsCloud is not explicitly false"
            exit 2
          fi
          PRIVATE_DIR="/home/roofixo/domains/roofixo.ir/vamcity-app/private"
          SQL_PASSWORD="$(sed -n 's/^MSSQL_SA_PASSWORD=//p' "$PRIVATE_DIR/sql.env" | head -1)"
          SQLCMD="$(docker exec vamcity-stage-sql bash -lc 'if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then echo /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then echo /opt/mssql-tools/bin/sqlcmd; fi' 2>/dev/null | tail -1)"
          test -n "$SQL_PASSWORD"
          test -n "$SQLCMD"
          BACKUP="/home/roofixo/domains/roofixo.ir/vamcity-app/backups/admin-tenant-context-$(date -u +%Y%m%dT%H%M%SZ)"
          install -d -m 700 "$BACKUP"
          docker exec vamcity-stage-sql "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "SET NOCOUNT ON;
            SELECT u.Id AS UserId, u.CustomerId AS PreviousCustomerId, u.IsActive,
                   STRING_AGG(r.Name, ',') AS PreviousRoles
            FROM [vamcity_stage].dbo.AspNetUsers u
            JOIN [vamcity_stage].dbo.AspNetUserRoles ur ON ur.UserId=u.Id
            JOIN [vamcity_stage].dbo.AspNetRoles r ON r.Id=ur.RoleId
            WHERE r.NormalizedName=N'SUPERADMIN' AND u.IsActive=1
            GROUP BY u.Id,u.CustomerId,u.IsActive;" > "$BACKUP/identity-before.txt"
          chmod 600 "$BACKUP/identity-before.txt"
          cat "$BACKUP/identity-before.txt"
          docker exec vamcity-stage-sql "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "
            SET NOCOUNT ON;
            SET XACT_ABORT ON;
            DECLARE @TenantCount bigint=(SELECT COUNT_BIG(*) FROM [vamcity_stage].dbo.Customers);
            DECLARE @AdminCount bigint=(SELECT COUNT_BIG(*) FROM [vamcity_stage].dbo.AspNetUsers u
              JOIN [vamcity_stage].dbo.AspNetUserRoles ur ON ur.UserId=u.Id
              JOIN [vamcity_stage].dbo.AspNetRoles r ON r.Id=ur.RoleId
              WHERE r.NormalizedName=N'SUPERADMIN' AND u.IsActive=1);
            IF @TenantCount <> 1 THROW 51001, 'Expected exactly one tenant; no changes made.', 1;
            IF @AdminCount <> 1 THROW 51002, 'Expected exactly one active SuperAdmin; no changes made.', 1;
            DECLARE @CustomerId uniqueidentifier=(SELECT TOP(1) Id FROM [vamcity_stage].dbo.Customers);
            DECLARE @AdminRoleId nvarchar(450)=(SELECT TOP(1) Id FROM [vamcity_stage].dbo.AspNetRoles WHERE NormalizedName=N'ADMIN');
            IF @AdminRoleId IS NULL THROW 51003, 'Admin role is missing; no changes made.', 1;
            BEGIN TRANSACTION;
              UPDATE u SET CustomerId=@CustomerId
              FROM [vamcity_stage].dbo.AspNetUsers u
              JOIN [vamcity_stage].dbo.AspNetUserRoles ur ON ur.UserId=u.Id
              JOIN [vamcity_stage].dbo.AspNetRoles r ON r.Id=ur.RoleId
              WHERE r.NormalizedName=N'SUPERADMIN' AND u.IsActive=1 AND u.CustomerId IS NULL;
              INSERT INTO [vamcity_stage].dbo.AspNetUserRoles(UserId,RoleId)
              SELECT u.Id,@AdminRoleId
              FROM [vamcity_stage].dbo.AspNetUsers u
              JOIN [vamcity_stage].dbo.AspNetUserRoles ur ON ur.UserId=u.Id
              JOIN [vamcity_stage].dbo.AspNetRoles r ON r.Id=ur.RoleId
              WHERE r.NormalizedName=N'SUPERADMIN' AND u.IsActive=1
                AND NOT EXISTS(SELECT 1 FROM [vamcity_stage].dbo.AspNetUserRoles existing
                               WHERE existing.UserId=u.Id AND existing.RoleId=@AdminRoleId);
            COMMIT TRANSACTION;
            SELECT 'REPAIR_RESULT' AS result,
              (SELECT COUNT_BIG(*) FROM [vamcity_stage].dbo.AspNetUsers u
               JOIN [vamcity_stage].dbo.AspNetUserRoles ur ON ur.UserId=u.Id
               JOIN [vamcity_stage].dbo.AspNetRoles r ON r.Id=ur.RoleId
               WHERE r.NormalizedName=N'SUPERADMIN' AND u.IsActive=1 AND u.CustomerId=@CustomerId) AS BoundSuperAdminCount,
              (SELECT COUNT_BIG(*) FROM [vamcity_stage].dbo.AspNetUsers u
               JOIN [vamcity_stage].dbo.AspNetUserRoles ur ON ur.UserId=u.Id
               JOIN [vamcity_stage].dbo.AspNetRoles r ON r.Id=ur.RoleId
               WHERE r.NormalizedName=N'SUPERADMIN' AND r.Name=N'SuperAdmin'
                 AND u.IsActive=1 AND u.CustomerId=@CustomerId) AS SuperAdminRoleCount,
              (SELECT COUNT_BIG(*) FROM [vamcity_stage].dbo.AspNetUsers u
               JOIN [vamcity_stage].dbo.AspNetUserRoles ur ON ur.UserId=u.Id
               JOIN [vamcity_stage].dbo.AspNetRoles r ON r.Id=ur.RoleId
               WHERE r.NormalizedName=N'ADMIN' AND u.IsActive=1 AND u.CustomerId=@CustomerId) AS ActiveAdminInTenantCount;
            "
          echo "BACKUP_DIR=$BACKUP"
          echo "DATABASE_CHANGED=tenant binding and Admin role only for the sole active SuperAdmin"
          echo "APP_CONTAINER_RESTARTED=0"
          REMOTE
