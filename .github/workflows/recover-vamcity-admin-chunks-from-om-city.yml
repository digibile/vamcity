name: Recover missing VamCity admin assets from OM City
run-name: Audit and restore only missing hashed JS and CSS assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-vamcity-admin-chunks-from-om-city.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vamcity-om-city-asset-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Configure existing server SSH access
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          PORT="${DEPLOY_PORT:-22}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/vamcity-om-city-key"
          chmod 600 "$RUNNER_TEMP/vamcity-om-city-key"
          ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          {
            echo "DEPLOY_HOST=$DEPLOY_HOST"
            echo "DEPLOY_USER=$DEPLOY_USER"
            echo "DEPLOY_PORT=$PORT"
          } >> "$GITHUB_ENV"

      - name: Audit missing assets from the live bundle manifest
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/vamcity-om-city-key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE' | tee "$RUNNER_TEMP/remote-asset-audit.txt"
          set -euo pipefail
          APP_ROOT="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/app"}}{{.Source}}{{end}}{{end}}' vamcity-stage-app)"
          test -n "$APP_ROOT"
          APP_JS="$APP_ROOT/wwwroot/js/app.e76ab352.js"
          test -s "$APP_JS"
          python3 - "$APP_JS" "$APP_ROOT/wwwroot/js" "$APP_ROOT/wwwroot/css" <<'PY'
          import pathlib, re, sys
          app = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          js_root, css_root = pathlib.Path(sys.argv[2]), pathlib.Path(sys.argv[3])
          hashes = {}
          for name, digest in re.findall(r'"((?:views|layout|default|chunk)-[^"]+)":"([a-f0-9]{8})"', app):
              hashes.setdefault(name, []).append(digest)
          if not hashes:
              raise SystemExit("LIVE_RUNTIME_CHUNK_MAP_NOT_FOUND")
          js_expected = {name: values[0] for name, values in hashes.items()}
          css_expected = {name: values[1] for name, values in hashes.items() if len(values) > 1}
          missing_js = [f"{n}.{d}.js" for n,d in js_expected.items() if not (js_root/f"{n}.{d}.js").is_file() or (js_root/f"{n}.{d}.js").stat().st_size == 0]
          missing_css = [f"{n}.{d}.css" for n,d in css_expected.items() if not (css_root/f"{n}.{d}.css").is_file() or (css_root/f"{n}.{d}.css").stat().st_size == 0]
          print(f"EXPECTED_JS_CHUNKS={len(js_expected)}")
          print(f"EXPECTED_CSS_CHUNKS={len(css_expected)}")
          print(f"MISSING_JS_COUNT={len(missing_js)}")
          print(f"MISSING_CSS_COUNT={len(missing_css)}")
          for filename in missing_js: print("MISSING_ASSET=js:"+filename)
          for filename in missing_css: print("MISSING_ASSET=css:"+filename)
          PY
          REMOTE
          grep '^MISSING_ASSET=' "$RUNNER_TEMP/remote-asset-audit.txt" | cut -d= -f2- > "$RUNNER_TEMP/missing-assets.txt" || true
          echo "MISSING_ASSETS=$(wc -l < "$RUNNER_TEMP/missing-assets.txt" | tr -d ' ')"

      - name: Download only matching assets from imported OM City
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/om-city-assets/js" "$RUNNER_TEMP/om-city-assets/css"
          found=0
          absent=0
          while IFS= read -r item; do
            [[ -n "$item" ]] || continue
            kind="${item%%:*}"
            filename="${item#*:}"
            if [[ "$kind" != "js" && "$kind" != "css" ]]; then echo "REJECTED_ASSET_TYPE=$kind"; exit 2; fi
            if [[ ! "$filename" =~ ^[A-Za-z0-9._-]+\.$kind$ ]]; then echo "REJECTED_UNSAFE_FILENAME=$filename"; exit 2; fi
            source_url="https://raw.githubusercontent.com/digibile/vamcity/main/OM%20City/wwwroot/ui/$kind/$filename"
            target="$RUNNER_TEMP/om-city-assets/$kind/$filename"
            if curl --fail --silent --show-error --location --retry 2 --max-time 45 "$source_url" -o "$target" && [[ -s "$target" ]]; then
              found=$((found + 1))
            else
              rm -f "$target"
              echo "NO_IMPORTED_MATCH=$kind/$filename"
              absent=$((absent + 1))
            fi
          done < "$RUNNER_TEMP/missing-assets.txt"
          echo "MATCHING_IMPORTED_ASSETS=$found"
          echo "MISSING_FROM_IMPORTED_ASSETS=$absent"
          if [[ "$found" -eq 0 ]]; then
            if [[ ! -s "$RUNNER_TEMP/missing-assets.txt" ]]; then echo "ALL_REFERENCED_JS_AND_CSS_PRESENT=1"; exit 0; fi
            echo "NO_RECOVERABLE_ASSETS_IN_OM_CITY=1"
            exit 2
          fi
          tar -czf "$RUNNER_TEMP/om-city-missing-assets.tar.gz" -C "$RUNNER_TEMP/om-city-assets" .

      - name: Install missing files without overwriting live assets
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s "$RUNNER_TEMP/om-city-missing-assets.tar.gz" ]]; then echo "NO_DEPLOYMENT_NEEDED=1"; exit 0; fi
          scp -i "$RUNNER_TEMP/vamcity-om-city-key" -P "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/om-city-missing-assets.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/vamcity-om-city-missing-assets.tar.gz"
          ssh -i "$RUNNER_TEMP/vamcity-om-city-key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_ROOT="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/app"}}{{.Source}}{{end}}{{end}}' vamcity-stage-app)"
          test -n "$APP_ROOT"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP" /tmp/vamcity-om-city-missing-assets.tar.gz' EXIT
          tar -xzf /tmp/vamcity-om-city-missing-assets.tar.gz -C "$TMP"
          installed=0
          skipped=0
          while IFS= read -r -d '' source; do
            kind="$(basename "$(dirname "$source")")"
            filename="$(basename "$source")"
            if [[ "$kind" != "js" && "$kind" != "css" ]]; then echo "REJECTED_ASSET_TYPE=$kind"; exit 2; fi
            if [[ ! "$filename" =~ ^[A-Za-z0-9._-]+\.$kind$ ]]; then echo "REJECTED_UNSAFE_FILENAME=$filename"; exit 2; fi
            target="$APP_ROOT/wwwroot/$kind/$filename"
            if [[ -s "$target" ]]; then echo "SKIPPED_ALREADY_PRESENT=$kind/$filename"; skipped=$((skipped + 1)); continue; fi
            install -m 0644 "$source" "$TMP/.$filename.tmp"
            mv "$TMP/.$filename.tmp" "$target"
            echo "RECOVERED_ASSET=$kind/$filename BYTES=$(wc -c < "$target")"
            installed=$((installed + 1))
          done < <(find "$TMP" -type f \( -name '*.js' -o -name '*.css' \) -print0)
          echo "INSTALLED_COUNT=$installed"
          echo "SKIPPED_COUNT=$skipped"
          echo "DATABASE_TOUCHED=0"
          echo "APP_CONTAINER_RESTARTED=0"
          REMOTE

      - name: Verify required JS and CSS assets and affected routes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/vamcity-om-city-key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_ROOT="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/app"}}{{.Source}}{{end}}{{end}}' vamcity-stage-app)"
          python3 - "$APP_ROOT/wwwroot/js/app.e76ab352.js" "$APP_ROOT/wwwroot/js" "$APP_ROOT/wwwroot/css" <<'PY'
          import pathlib, re, sys
          app = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          js_root, css_root = pathlib.Path(sys.argv[2]), pathlib.Path(sys.argv[3])
          hashes = {}
          for name,digest in re.findall(r'"((?:views|layout|default|chunk)-[^"]+)":"([a-f0-9]{8})"', app):
              hashes.setdefault(name, []).append(digest)
          js_missing=[f"{n}.{v[0]}.js" for n,v in hashes.items() if not (js_root/f"{n}.{v[0]}.js").is_file() or (js_root/f"{n}.{v[0]}.js").stat().st_size==0]
          css_missing=[f"{n}.{v[1]}.css" for n,v in hashes.items() if len(v)>1 and (not (css_root/f"{n}.{v[1]}.css").is_file() or (css_root/f"{n}.{v[1]}.css").stat().st_size==0)]
          print(f"POST_RECOVERY_MISSING_JS={len(js_missing)}")
          print(f"POST_RECOVERY_MISSING_CSS={len(css_missing)}")
          for x in js_missing[:80]: print("STILL_MISSING_JS="+x)
          for x in css_missing[:80]: print("STILL_MISSING_CSS="+x)
          if js_missing or css_missing: raise SystemExit(1)
          PY
          for route in /admin/userLoanRequests/ /admin/loans/; do
            status="$(curl -k -sS -o /dev/null --max-time 15 -w '%{http_code}' "https://roofixo.ir$route" || true)"
            echo "LIVE_ROUTE_HTTP=$status PATH=$route"
          done
          echo "DATABASE_TOUCHED=0"
          echo "APP_CONTAINER_RESTARTED=0"
          REMOTE
