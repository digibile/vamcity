name: Publish VamCity on roofixo.ir
run-name: Configure roofixo.ir reverse proxy for VamCity

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-vamcity-roofixo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vamcity-roofixo-domain-publish
  cancel-in-progress: false

jobs:
  publish-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          PORT="${DEPLOY_PORT:-22}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          ssh-keyscan -T 10 -p "$PORT" "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "DEPLOY_PORT_EFFECTIVE=$PORT" >> "$GITHUB_ENV"
          echo "DEPLOY_HOST_EFFECTIVE=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_USER_EFFECTIVE=$DEPLOY_USER" >> "$GITHUB_ENV"

      - name: Back up settings and route roofixo.ir to VamCity
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/deploy_key" -p "$DEPLOY_PORT_EFFECTIVE" \
            -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER_EFFECTIVE@$DEPLOY_HOST_EFFECTIVE" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          DOMAIN_ROOT=/home/roofixo/domains/roofixo.ir
          BASE="$DOMAIN_ROOT/vamcity-app"
          PRIVATE="$BASE/private"
          CUSTOM=/usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.cust_nginx
          GENERATED=/usr/local/directadmin/data/users/roofixo/nginx.conf
          TEMPLATE_DIR=/usr/local/directadmin/data/templates/custom
          TEMPLATE_HTTP=nginx_server.conf.CUSTOM.4.post
          TEMPLATE_HTTPS=nginx_server_secure.conf.CUSTOM.4.post
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="$PRIVATE/rollback/roofixo-domain-$TS"
          mkdir -p "$BACKUP"
          chmod 700 "$PRIVATE" "$PRIVATE/rollback" "$BACKUP"

          echo "=== PRECHECKS ==="
          test -d "$DOMAIN_ROOT/public_html"
          test -s "$PRIVATE/app.env"
          docker container inspect vamcity-stage-app >/dev/null
          docker container inspect vamcity-stage-sql >/dev/null
          docker inspect -f '{{.State.Running}}' vamcity-stage-app | grep -qx true
          docker inspect -f '{{.State.Running}}' vamcity-stage-sql | grep -qx true
          HEALTH="$(curl -sS -o /dev/null --max-time 8 -w '%{http_code}' http://127.0.0.1:5187/ || true)"
          case "$HEALTH" in 200|301|302|307|308) ;; *) echo "VAMCITY_PRECHECK_FAILED=$HEALTH"; exit 1 ;; esac
          nginx -t

          echo "=== BACKUP ACTIVE DOMAIN SETTINGS ==="
          cp -a "$GENERATED" "$BACKUP/nginx.conf.before"
          cp -a /usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.conf "$BACKUP/roofixo.ir.conf.before"
          if [ -f "$CUSTOM" ]; then
            cp -a "$CUSTOM" "$BACKUP/roofixo.ir.cust_nginx.before"
            echo existing > "$BACKUP/custom-config-state"
          else
            echo absent > "$BACKUP/custom-config-state"
          fi
          cp -a "$PRIVATE/app.env" "$BACKUP/app.env.before"
          mkdir -p "$TEMPLATE_DIR"
          for t in "$TEMPLATE_HTTP" "$TEMPLATE_HTTPS"; do
            if [ -f "$TEMPLATE_DIR/$t" ]; then
              cp -a "$TEMPLATE_DIR/$t" "$BACKUP/$t.before"
              echo existing > "$BACKUP/$t.state"
            else
              echo absent > "$BACKUP/$t.state"
            fi
          done
          printf '%s\n' "$BACKUP" > "$PRIVATE/last-domain-rollback-path"
          chmod 600 "$PRIVATE/last-domain-rollback-path"

          rollback() {
            echo "DOMAIN_PUBLISH_FAILED; restoring previous custom nginx and app environment"
            cp -a "$BACKUP/app.env.before" "$PRIVATE/app.env"
            if [ "$(cat "$BACKUP/custom-config-state")" = existing ]; then
              cp -a "$BACKUP/roofixo.ir.cust_nginx.before" "$CUSTOM"
            else
              rm -f "$CUSTOM"
            fi
            for t in "$TEMPLATE_HTTP" "$TEMPLATE_HTTPS"; do
              if [ "$(cat "$BACKUP/$t.state")" = existing ]; then
                cp -a "$BACKUP/$t.before" "$TEMPLATE_DIR/$t"
              else
                rm -f "$TEMPLATE_DIR/$t"
              fi
            done
            /usr/local/directadmin/custombuild/build rewrite_confs >/dev/null 2>&1 || true
            nginx -t && systemctl reload nginx || true
            docker restart vamcity-stage-app >/dev/null 2>&1 || true
          }

          echo "=== SET PUBLIC BASE URL ==="
          if grep -q '^AppConfig__BaseUrl=' "$PRIVATE/app.env"; then
            sed -i 's#^AppConfig__BaseUrl=.*#AppConfig__BaseUrl=https://roofixo.ir#' "$PRIVATE/app.env"
          else
            printf 'AppConfig__BaseUrl=https://roofixo.ir\n' >> "$PRIVATE/app.env"
          fi
          if grep -q '^AppConfig__FrontUrl=' "$PRIVATE/app.env"; then
            sed -i 's#^AppConfig__FrontUrl=.*#AppConfig__FrontUrl=https://roofixo.ir#' "$PRIVATE/app.env"
          else
            printf 'AppConfig__FrontUrl=https://roofixo.ir\n' >> "$PRIVATE/app.env"
          fi
          chmod 600 "$PRIVATE/app.env"
          docker restart vamcity-stage-app >/dev/null
          APP_HEALTH=000
          for i in $(seq 1 24); do
            APP_HEALTH="$(curl -sS -o /dev/null --max-time 4 -w '%{http_code}' http://127.0.0.1:5187/ || true)"
            case "$APP_HEALTH" in 200|301|302|307|308) break ;; esac
            sleep 3
          done
          case "$APP_HEALTH" in 200|301|302|307|308) ;; *) docker logs --tail 80 vamcity-stage-app || true; rollback; exit 1 ;; esac

          echo "=== ENABLE SSL AND INSTALL PERSISTENT DOMAIN-ONLY NGINX ROUTE ==="
          DOMAIN_CONF=/usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.conf
          if grep -q '^ssl=' "$DOMAIN_CONF"; then
            sed -i 's/^ssl=.*/ssl=ON/' "$DOMAIN_CONF"
          else
            printf 'ssl=ON\n' >> "$DOMAIN_CONF"
          fi
          # This server is already using Nginx-only processing. Do not force a per-domain mode switch.
          sed -i '/^nginx=/d' "$DOMAIN_CONF"
          rm -f "$CUSTOM"
          mkdir -p "$TEMPLATE_DIR" /var/www/html/.well-known/acme-challenge
          chmod 755 /var/www/html/.well-known /var/www/html/.well-known/acme-challenge

          for t in "$TEMPLATE_HTTP" "$TEMPLATE_HTTPS"; do
            TARGET="$TEMPLATE_DIR/$t"
            if [ ! -f "$TARGET" ]; then : > "$TARGET"; fi
            if ! grep -q 'BEGIN VAMCITY ROOFIXO ROUTE' "$TARGET"; then
              cat >> "$TARGET" <<'NGINX'
          # BEGIN VAMCITY ROOFIXO ROUTE
          |*if DOMAIN="roofixo.ir"|
          location ^~ /.well-known/acme-challenge/ {
              alias /var/www/html/.well-known/acme-challenge/;
              default_type text/plain;
          }
          location / {
              proxy_pass http://127.0.0.1:5187;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header X-Forwarded-Host $host;
              proxy_connect_timeout 15s;
              proxy_send_timeout 120s;
              proxy_read_timeout 120s;
              proxy_redirect off;
          }
          |*endif|
          # END VAMCITY ROOFIXO ROUTE
          NGINX
            fi
            chmod 600 "$TARGET"
          done

          echo "=== ADD SAFE REDIRECTS FOR EMPTY LEGACY LOGIN ROUTES ==="
          python3 - <<'PY'
          from pathlib import Path
          for name in ("nginx_server.conf.CUSTOM.4.post", "nginx_server_secure.conf.CUSTOM.4.post"):
              path = Path("/usr/local/directadmin/data/templates/custom") / name
              text = path.read_text()
              marker = "# BEGIN VAMCITY ROOFIXO ROUTE"
              end = "# END VAMCITY ROOFIXO ROUTE"
              start_i = text.find(marker)
              end_i = text.find(end, start_i + len(marker))
              if start_i < 0 or end_i < 0:
                  raise SystemExit(f"VamCity route marker missing in {name}")
              block = text[start_i:end_i]
              if "VAMCITY AUTH ROUTE ALIASES" not in block:
                  target = "location / {"
                  pos = block.find(target)
                  if pos < 0:
                      raise SystemExit(f"proxy location missing in {name}")
                  aliases = """# VAMCITY AUTH ROUTE ALIASES
          location ~* ^/cl/(login|register)/?$ {
              return 302 /login/;
          }
          """
                  block = block[:pos] + aliases + block[pos:]
                  text = text[:start_i] + block + text[end_i:]
                  path.write_text(text)
          PY

          if ! /usr/local/directadmin/custombuild/build rewrite_confs; then
            rollback
            exit 1
          fi
          if ! nginx -t; then
            rollback
            exit 1
          fi
          if ! grep -q 'proxy_pass http://127.0.0.1:5187' "$GENERATED"; then
            echo "DIRECTADMIN_DID_NOT_INSERT_CUSTOM_NGINX; rolling back domain flags and custom route"
            rollback
            exit 1
          fi
          if ! systemctl reload nginx; then
            rollback
            exit 1
          fi

          echo "=== REQUEST LET'S ENCRYPT CERTIFICATE ==="
          if [ -x /usr/local/directadmin/scripts/letsencrypt.sh ]; then
            if /usr/local/directadmin/scripts/letsencrypt.sh request roofixo.ir 4096; then
              echo "LETSENCRYPT_REQUEST_RESULT=success"
              /usr/local/directadmin/custombuild/build rewrite_confs >/dev/null
              nginx -t
              systemctl reload nginx
            else
              echo "LETSENCRYPT_REQUEST_RESULT=failed; inspect DirectAdmin ACME logs"
              find /usr/local/directadmin/data/users/roofixo/domains/acme_provider_cert_logs -maxdepth 1 -type f -name 'roofixo.ir.log' -exec tail -n 30 {} \; 2>/dev/null || true
            fi
          else
            echo "LETSENCRYPT_SCRIPT_NOT_AVAILABLE"
          fi

          echo "=== VERIFY DOMAIN ROUTING LOCALLY THROUGH TLS VHOST ==="
          PUBLIC_HTTP=000
          for i in $(seq 1 10); do
            PUBLIC_HTTP="$(curl --resolve roofixo.ir:443:127.0.0.1 -k -sS -o /dev/null --max-time 8 -w '%{http_code}' https://roofixo.ir/ || true)"
            case "$PUBLIC_HTTP" in 200|301|302|307|308) break ;; esac
            sleep 2
          done
          case "$PUBLIC_HTTP" in 200|301|302|307|308) ;; *) rollback; exit 1 ;; esac

          echo "=== VERIFY PUBLIC HTTPS ==="
          EXT_HTTP="$(curl -k -sS -o /dev/null --max-time 12 -w '%{http_code}' https://roofixo.ir/ || true)"
          case "$EXT_HTTP" in 200|301|302|307|308) ;; *) echo "PUBLIC_HTTPS_CHECK_NOT_CONFIRMED=$EXT_HTTP";; esac

          echo "VAMCITY_APP_LOCAL_HTTP=$APP_HEALTH"
          echo "ROOFIXO_LOCAL_TLS_HTTP=$PUBLIC_HTTP"
          echo "ROOFIXO_PUBLIC_HTTPS_HTTP=$EXT_HTTP"
          echo "DOMAIN_CONFIG_BACKUP=$BACKUP"
          echo "VAMCITY_PUBLISHED_ON_ROOFIXO_IR=true"
          echo "NOTE=Existing public_html files were not deleted or overwritten; nginx routing can be rolled back from the saved backup."
          REMOTE
