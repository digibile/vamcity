name: Legacy VamCity domain publisher (retired)
run-name: Legacy publisher disabled in favor of the verified Roofixo vhost workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain replacement workflow
        shell: bash
        run: |
          echo "This legacy publisher is retired to prevent conflicting DirectAdmin Nginx rewrites."
          echo "Use .github/workflows/fix-roofixo-vhost.yml for the current, rollback-protected Roofixo domain configuration."
          echo "The VamCity live route audit is .github/workflows/vamcity-live-link-audit.yml."
