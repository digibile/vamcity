name: Inspect Publish.rar on server
run-name: Inspect uploaded Publish.rar archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-publish-rar.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find and inspect Publish.rar over SSH (read-only)
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/roofixo_key
          chmod 600 ~/.ssh/roofixo_key
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/roofixo_key -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          TMP="$(mktemp -d /tmp/publish-rar-inspect.XXXXXX)"
          trap 'rm -rf "$TMP"' EXIT
          echo "=== Ensure a RAR5 reader is available ==="
          if ! command -v 7z >/dev/null 2>&1 && ! command -v 7zz >/dev/null 2>&1 && ! command -v unrar >/dev/null 2>&1 && ! command -v bsdtar >/dev/null 2>&1 && ! command -v unar >/dev/null 2>&1; then
            if [ "$(id -u)" -eq 0 ] && command -v apt-get >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq 7zip unar || apt-get install -y -qq p7zip-full unar || true
            else
              echo "Cannot install archive reader automatically: SSH user is not root or apt-get is unavailable."
            fi
          fi
          echo "=== FIND Publish.rar (case-insensitive) ==="
          find /home -type f \( -iname 'publish.rar' -o -iname 'publish1.rar' -o -iname 'publish*.zip' \) -printf '%TY-%Tm-%Td %TH:%TM:%TS | %s bytes | %p\n' 2>/dev/null | head -100
          mapfile -d '' FILES < <(find /home -type f \( -iname 'publish.rar' -o -iname 'publish1.rar' -o -iname 'publish*.zip' \) -print0 2>/dev/null)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "PUBLISH_RAR_NOT_FOUND_UNDER_HOME"
            exit 0
          fi
          for F in "${FILES[@]}"; do
            echo "=== ARCHIVE: $F ==="
            file "$F" 2>/dev/null || true
            sha256sum "$F" 2>/dev/null || true
            echo "--- archive diagnostics ---"
            xxd -l 64 "$F" 2>/dev/null || od -An -tx1 -N64 "$F" 2>/dev/null || true
            strings -a "$F" | grep -Eio '([[:alnum:]_-]+\.)*vamcity\.com[^[:space:]"<>]*' | sort -fu | head -100 || true
            D="$TMP/extract-$(printf '%s' "$F" | sha256sum | cut -c1-10)"
            mkdir -p "$D"
            OK=0
            if command -v 7z >/dev/null 2>&1 || command -v 7zz >/dev/null 2>&1; then
              Z="$(command -v 7z || command -v 7zz)"
              "$Z" l -slt "$F" 2>&1 | head -100 || true
              if "$Z" t "$F" 2>&1 | tail -30; then
                if "$Z" x -y "-o$D" "$F" >/dev/null 2>&1; then OK=1; fi
              fi
            fi
            if [ "$OK" -eq 0 ] && command -v unar >/dev/null 2>&1; then
              echo "--- retry with unar (RAR5-compatible reader) ---"
              unar -q -o "$D" "$F" 2>&1 | head -80 || true
              if find "$D" -type f -print -quit | grep -q .; then OK=1; fi
            fi
            if [ "$OK" -eq 0 ] && command -v unrar >/dev/null 2>&1; then
              unrar lb "$F" 2>&1 | head -100 || true
              unrar x -o+ "$F" "$D/" 2>&1 | head -80 || true
              if find "$D" -type f -print -quit | grep -q .; then OK=1; fi
            fi
            if [ "$OK" -eq 0 ] && command -v bsdtar >/dev/null 2>&1; then
              bsdtar -tf "$F" 2>&1 | head -100 || true
              bsdtar -xf "$F" -C "$D" 2>&1 | head -80 || true
              if find "$D" -type f -print -quit | grep -q .; then OK=1; fi
            fi
            if [ "$OK" -eq 1 ]; then
              echo "--- files extracted / size inventory ---"
              find "$D" -type f -printf '%s bytes | %P\n' | sort -k1,1nr | head -150
              echo "--- URLs/domains related to vamcity (secrets excluded) ---"
              grep -RahoE '(https?://)?([[:alnum:]_-]+\.)*vamcity\.com([/:?#][^[:space:]"<>]*)?' "$D" 2>/dev/null | sed -E 's/[),.;]+$//' | sort -fu | head -300 || true
              echo "--- config and deployment filenames ---"
              find "$D" -type f | grep -Ei '(appsettings|web\.config|\.config$|\.json$|\.xml$|\.csproj$|\.sln$|\.dll$|\.deps\.json$|runtimeconfig|\.sql$|\.bak$|\.pfx$|\.pem$|\.key$)' | sed "s|$D/||" | head -250 || true
            else
              echo "ARCHIVE_UNREADABLE_OR_ENCRYPTED; see diagnostics above"
            fi
          done
          echo "=== INSPECTION COMPLETE; SOURCE ARCHIVE UNCHANGED ==="
          REMOTE
