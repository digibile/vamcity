name: Restore original VamCity UI on main site only
run-name: Roll back published UI theme and restore original VamCity app UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rollback-vamcity-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vamcity-roofixo-ui-only
  cancel-in-progress: false

jobs:
  rollback-original-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/deploy_key"
          if ! grep -q '^-----BEGIN ' "$RUNNER_TEMP/deploy_key" && [[ "$DEPLOY_SSH_KEY" == *'\n'* ]]; then
            printf '%b' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/deploy_key"
          fi
          chmod 600 "$RUNNER_TEMP/deploy_key"
          if ! ssh-keygen -y -f "$RUNNER_TEMP/deploy_key" >/dev/null 2>&1; then
            printf '%b' "$DEPLOY_SSH_KEY" | tr -d '\\r' > "$RUNNER_TEMP/deploy_key.escaped"
            if ssh-keygen -y -f "$RUNNER_TEMP/deploy_key.escaped" >/dev/null 2>&1; then
              mv "$RUNNER_TEMP/deploy_key.escaped" "$RUNNER_TEMP/deploy_key"
            elif printf '%s' "$DEPLOY_SSH_KEY" | base64 -d > "$RUNNER_TEMP/deploy_key.b64" 2>/dev/null && ssh-keygen -y -f "$RUNNER_TEMP/deploy_key.b64" >/dev/null 2>&1; then
              mv "$RUNNER_TEMP/deploy_key.b64" "$RUNNER_TEMP/deploy_key"
            else
              echo "DEPLOY_SSH_KEY_FORMAT_INVALID"
              exit 1
            fi
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/deploy_key" >/dev/null
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "DEPLOY_PORT_EFFECTIVE=$PORT" >> "$GITHUB_ENV"
          echo "DEPLOY_HOST_EFFECTIVE=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_USER_EFFECTIVE=$DEPLOY_USER" >> "$GITHUB_ENV"

      - name: Restore pre-theme backup on main app and verify protected preview
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/deploy_key" -p "$DEPLOY_PORT_EFFECTIVE" \
            -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER_EFFECTIVE@$DEPLOY_HOST_EFFECTIVE" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          DOMAIN_ROOT=/home/roofixo/domains/roofixo.ir
          BASE="$DOMAIN_ROOT/vamcity-app"
          BACKUPS="$BASE/private/ui-backups"
          PREVIEW="$DOMAIN_ROOT/public_html/vamcity-template-preview"
          APP_CONTAINER=vamcity-stage-app
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          EMERGENCY="$BASE/private/ui-backups/manual-rollback-$TS"

          echo "=== PRECHECKS ==="
          docker inspect -f '{{.State.Running}}' "$APP_CONTAINER" | grep -qx true
          APP_ROOT="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/app"}}{{.Source}}{{end}}{{end}}' "$APP_CONTAINER")"
          test -n "$APP_ROOT"
          test -s "$APP_ROOT/wwwroot/index.html"
          test -s "$APP_ROOT/wwwroot/js/app.e76ab352.js"
          test -d "$BACKUPS"
          test -d "$PREVIEW"
          test -s "$DOMAIN_ROOT/public_html/vamcity-public-home.html"

          PREVIEW_BEFORE="$(find "$PREVIEW" -type f -print0 | sort -z | xargs -0 -r sha256sum | sha256sum | awk '{print $1}')"
          HOME_BEFORE="$(sha256sum "$DOMAIN_ROOT/public_html/vamcity-public-home.html" | awk '{print $1}')"
          CURRENT_INDEX="$(sha256sum "$APP_ROOT/wwwroot/index.html" | awk '{print $1}')"

          echo "=== FIND A VERIFIED BACKUP FROM BEFORE THE THEME WAS INSTALLED ==="
          RESTORE=""
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            [ -s "$candidate/index.html" ] || continue
            [ -s "$candidate/js/app.e76ab352.js" ] || continue
            [ -s "$candidate/js/views-admin-UserLoanRequests.8e3264fe.js" ] || continue
            [ -s "$candidate/manifest.state" ] || continue
            [ -s "$candidate/modules.state" ] || continue
            grep -qx 'absent' "$candidate/manifest.state" || continue
            grep -qx 'absent' "$candidate/modules.state" || continue
            if grep -q 'vamcity-modern-theme.css' "$candidate/index.html"; then continue; fi
            RESTORE="$candidate"
            break
          done < <(find "$BACKUPS" -mindepth 2 -maxdepth 2 -type f -name index.html -printf '%T@ %h\n' | sort -nr | cut -d' ' -f2-)

          if [ -z "$RESTORE" ]; then
            echo "SAFE_PRE_THEME_BACKUP_NOT_FOUND; nothing changed"
            exit 2
          fi
          echo "RESTORE_SOURCE=$RESTORE"
          echo "RESTORE_INDEX_SHA256=$(sha256sum "$RESTORE/index.html" | awk '{print $1}')"
          echo "CURRENT_INDEX_SHA256=$CURRENT_INDEX"

          echo "=== SAVE EMERGENCY COPY OF CURRENT LIVE UI ==="
          mkdir -p "$EMERGENCY/css" "$EMERGENCY/js"
          cp -p "$APP_ROOT/wwwroot/index.html" "$EMERGENCY/index.html"
          cp -p "$APP_ROOT/wwwroot/js/app.e76ab352.js" "$EMERGENCY/js/app.e76ab352.js"
          cp -p "$APP_ROOT/wwwroot/js/views-admin-UserLoanRequests.8e3264fe.js" "$EMERGENCY/js/views-admin-UserLoanRequests.8e3264fe.js"
          if [ -s "$APP_ROOT/wwwroot/css/vamcity-modern-theme.css" ]; then
            cp -p "$APP_ROOT/wwwroot/css/vamcity-modern-theme.css" "$EMERGENCY/css/vamcity-modern-theme.css"
            echo present > "$EMERGENCY/manifest.state"
          else
            echo absent > "$EMERGENCY/manifest.state"
          fi
          if [ -d "$APP_ROOT/wwwroot/css/vamcity" ]; then
            cp -a "$APP_ROOT/wwwroot/css/vamcity" "$EMERGENCY/css/vamcity"
            echo present > "$EMERGENCY/modules.state"
          else
            echo absent > "$EMERGENCY/modules.state"
          fi
          chmod 700 "$EMERGENCY"
          chmod 600 "$EMERGENCY/index.html" "$EMERGENCY/js/"* "$EMERGENCY/manifest.state" "$EMERGENCY/modules.state"

          rollback_emergency() {
            echo "RESTORING_EMERGENCY_COPY"
            cp -p "$EMERGENCY/index.html" "$APP_ROOT/wwwroot/index.html"
            cp -p "$EMERGENCY/js/app.e76ab352.js" "$APP_ROOT/wwwroot/js/app.e76ab352.js"
            cp -p "$EMERGENCY/js/views-admin-UserLoanRequests.8e3264fe.js" "$APP_ROOT/wwwroot/js/views-admin-UserLoanRequests.8e3264fe.js"
            if [ "$(cat "$EMERGENCY/manifest.state")" = present ]; then
              cp -p "$EMERGENCY/css/vamcity-modern-theme.css" "$APP_ROOT/wwwroot/css/vamcity-modern-theme.css"
            else
              rm -f "$APP_ROOT/wwwroot/css/vamcity-modern-theme.css"
            fi
            rm -rf "$APP_ROOT/wwwroot/css/vamcity"
            if [ "$(cat "$EMERGENCY/modules.state")" = present ]; then
              cp -a "$EMERGENCY/css/vamcity" "$APP_ROOT/wwwroot/css/vamcity"
            fi
          }

          echo "=== RESTORE ORIGINAL APP HTML AND JS ==="
          cp -p "$RESTORE/index.html" "$APP_ROOT/wwwroot/index.html"
          cp -p "$RESTORE/js/app.e76ab352.js" "$APP_ROOT/wwwroot/js/app.e76ab352.js"
          cp -p "$RESTORE/js/views-admin-UserLoanRequests.8e3264fe.js" "$APP_ROOT/wwwroot/js/views-admin-UserLoanRequests.8e3264fe.js"
          if [ "$(cat "$RESTORE/manifest.state")" = absent ]; then
            rm -f "$APP_ROOT/wwwroot/css/vamcity-modern-theme.css"
          fi
          if [ "$(cat "$RESTORE/modules.state")" = absent ]; then
            rm -rf "$APP_ROOT/wwwroot/css/vamcity"
          fi

          if grep -q 'vamcity-modern-theme.css' "$APP_ROOT/wwwroot/index.html"; then
            rollback_emergency
            echo "ROLLBACK_VALIDATION_FAILED_THEME_STILL_REFERENCED"
            exit 3
          fi

          echo "=== VERIFY LIVE APP ROUTES AND ASSETS ==="
          for ROUTE in / /login/ /register/0/ /cl/plans/; do
            STATUS="$(curl -sS -o /tmp/vamcity-rollback-check.html --max-time 12 -w '%{http_code}' "http://127.0.0.1:5187$ROUTE" || true)"
            echo "APP_ROUTE=$ROUTE HTTP=$STATUS BYTES=$(wc -c < /tmp/vamcity-rollback-check.html)"
            case "$STATUS" in 200|301|302) ;; *) rollback_emergency; exit 4 ;; esac
          done
          JS_STATUS="$(curl -sS -o /dev/null --max-time 10 -w '%{http_code}' http://127.0.0.1:5187/js/app.e76ab352.js)"
          echo "ORIGINAL_APP_BUNDLE_HTTP=$JS_STATUS"
          if [ "$JS_STATUS" != 200 ]; then rollback_emergency; exit 5; fi

          PREVIEW_AFTER="$(find "$PREVIEW" -type f -print0 | sort -z | xargs -0 -r sha256sum | sha256sum | awk '{print $1}')"
          HOME_AFTER="$(sha256sum "$DOMAIN_ROOT/public_html/vamcity-public-home.html" | awk '{print $1}')"
          if [ "$PREVIEW_BEFORE" != "$PREVIEW_AFTER" ] || [ "$HOME_BEFORE" != "$HOME_AFTER" ]; then
            rollback_emergency
            echo "PROTECTED_PUBLIC_PAGE_CHANGED; emergency restore applied"
            exit 6
          fi

          echo "ORIGINAL_VAMCITY_UI_RESTORED=1"
          echo "MODERN_THEME_REMOVED_FROM_MAIN_APP=1"
          echo "TEMPLATE_PREVIEW_UNTOUCHED=1"
          echo "PUBLIC_HOME_UNTOUCHED=1"
          echo "DATABASE_UNTOUCHED=1"
          echo "APP_CONTAINER_RESTARTED=0"
          echo "EMERGENCY_BACKUP=$EMERGENCY"
          echo "ROLLBACK_COMPLETE"
          REMOTE
