name: Repair VamCity SuperAdmin access safely

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-vamcity-superadmin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Back up database and repair only an unambiguous existing owner account
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/vamcity-key"
          chmod 600 "$RUNNER_TEMP/vamcity-key"
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i "$RUNNER_TEMP/vamcity-key" -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PRIVATE=/home/roofixo/domains/roofixo.ir/vamcity-app/private
          SQL_CONTAINER=vamcity-stage-sql
          DB_NAME=vamcity_stage
          test -s "$PRIVATE/sql.env"
          SQL_PASSWORD="$(sed -n 's/^MSSQL_SA_PASSWORD=//p' "$PRIVATE/sql.env" | head -1)"
          test -n "$SQL_PASSWORD"
          SQLCMD="$(docker exec "$SQL_CONTAINER" bash -lc 'if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then echo /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then echo /opt/mssql-tools/bin/sqlcmd; fi' | tail -1)"
          test -n "$SQLCMD"
          docker exec -u 0 "$SQL_CONTAINER" mkdir -p /var/opt/mssql/backup
          docker exec -u 0 "$SQL_CONTAINER" chown 10001:0 /var/opt/mssql/backup
          BACKUP_FILE="/var/opt/mssql/backup/pre-owner-role-repair-$(date -u +%Y%m%dT%H%M%SZ).bak"
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "BACKUP DATABASE [$DB_NAME] TO DISK=N'$BACKUP_FILE' WITH COPY_ONLY, INIT, COMPRESSION;"
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "RESTORE VERIFYONLY FROM DISK=N'$BACKUP_FILE';"
          echo "VERIFIED_BACKUP_CREATED=yes"
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "
          SET ANSI_NULLS ON;
          SET QUOTED_IDENTIFIER ON;
          SET ANSI_PADDING ON;
          SET ANSI_WARNINGS ON;
          SET ARITHABORT ON;
          SET CONCAT_NULL_YIELDS_NULL ON;
          SET NUMERIC_ROUNDABORT OFF;
          SET NOCOUNT ON;
          SET XACT_ABORT ON;
          BEGIN TRY
            BEGIN TRANSACTION;
            DECLARE @roleId nvarchar(450);
            DECLARE @roleCount bigint;
            DECLARE @assignmentCount bigint;
            DECLARE @candidateCount bigint;
            DECLARE @candidateId nvarchar(450);
            DECLARE @ownerId nvarchar(450);
            SELECT @roleCount=COUNT_BIG(*) FROM [$DB_NAME].dbo.AspNetRoles WHERE UPPER(LTRIM(RTRIM(Name)))=N'SUPERADMIN';
            IF @roleCount<>1 THROW 51101, 'SuperAdmin role is missing or ambiguous; no changes made.', 1;
            SELECT @roleId=Id FROM [$DB_NAME].dbo.AspNetRoles WHERE UPPER(LTRIM(RTRIM(Name)))=N'SUPERADMIN';
            SELECT @assignmentCount=COUNT_BIG(*)
              FROM [$DB_NAME].dbo.AspNetUserRoles ur
              JOIN [$DB_NAME].dbo.AspNetRoles r ON r.Id=ur.RoleId
              WHERE UPPER(LTRIM(RTRIM(r.Name)))=N'SUPERADMIN';
            IF @assignmentCount>1 THROW 51102, 'Multiple SuperAdmin assignments found; no changes made.', 1;
            IF @assignmentCount=1
            BEGIN
              SELECT @ownerId=ur.UserId
                FROM [$DB_NAME].dbo.AspNetUserRoles ur
                JOIN [$DB_NAME].dbo.AspNetRoles r ON r.Id=ur.RoleId
                WHERE UPPER(LTRIM(RTRIM(r.Name)))=N'SUPERADMIN';
            END
            ELSE
            BEGIN
              SELECT @candidateCount=COUNT_BIG(*)
              FROM [$DB_NAME].dbo.AspNetUsers u
              WHERE u.CustomerId IS NULL
                AND NOT EXISTS (SELECT 1 FROM [$DB_NAME].dbo.AspNetUserRoles ur WHERE ur.UserId=u.Id);
              IF @candidateCount<>1 THROW 51103, 'No unique unassigned global owner account; no changes made.', 1;
              SELECT @candidateId=u.Id
              FROM [$DB_NAME].dbo.AspNetUsers u
              WHERE u.CustomerId IS NULL
                AND NOT EXISTS (SELECT 1 FROM [$DB_NAME].dbo.AspNetUserRoles ur WHERE ur.UserId=u.Id);
              INSERT INTO [$DB_NAME].dbo.AspNetUserRoles (UserId, RoleId) VALUES (@candidateId, @roleId);
              SET @ownerId=@candidateId;
            END;
            IF @ownerId IS NULL THROW 51104, 'Could not identify owner account; no changes made.', 1;
            IF EXISTS (
              SELECT UPPER(UserName) FROM [$DB_NAME].dbo.AspNetUsers
              WHERE UserName IS NOT NULL GROUP BY UPPER(UserName) HAVING COUNT_BIG(*)>1
            ) THROW 51105, 'Duplicate usernames prevent safe normalization; no changes made.', 1;
            IF EXISTS (
              SELECT UPPER(Name) FROM [$DB_NAME].dbo.AspNetRoles
              WHERE Name IS NOT NULL GROUP BY UPPER(Name) HAVING COUNT_BIG(*)>1
            ) THROW 51106, 'Duplicate role names prevent safe normalization; no changes made.', 1;
            UPDATE [$DB_NAME].dbo.AspNetUsers
              SET NormalizedUserName=UPPER(UserName),
                  NormalizedEmail=CASE WHEN Email IS NULL THEN NormalizedEmail ELSE UPPER(Email) END,
                  IsActive=1
              WHERE Id=@ownerId;
            UPDATE [$DB_NAME].dbo.AspNetRoles SET NormalizedName=UPPER(Name) WHERE Name IS NOT NULL;
            IF NOT EXISTS (
              SELECT 1 FROM [$DB_NAME].dbo.AspNetUsers u
              JOIN [$DB_NAME].dbo.AspNetUserRoles ur ON ur.UserId=u.Id
              JOIN [$DB_NAME].dbo.AspNetRoles r ON r.Id=ur.RoleId
              WHERE u.Id=@ownerId AND u.IsActive=1 AND UPPER(LTRIM(RTRIM(r.Name)))=N'SUPERADMIN'
            ) THROW 51107, 'Post-repair verification failed; transaction rolled back.', 1;
            COMMIT TRANSACTION;
            SELECT 'SUPERADMIN_ACTIVE_COUNT' AS check_name, COUNT_BIG(*) AS value
              FROM [$DB_NAME].dbo.AspNetUsers u
              JOIN [$DB_NAME].dbo.AspNetUserRoles ur ON ur.UserId=u.Id
              JOIN [$DB_NAME].dbo.AspNetRoles r ON r.Id=ur.RoleId
              WHERE UPPER(LTRIM(RTRIM(r.Name)))=N'SUPERADMIN' AND u.IsActive=1;
            SELECT 'OWNER_ROLE_REPAIR' AS check_name, 'SUCCESS' AS result;
          END TRY
          BEGIN CATCH
            IF @@TRANCOUNT>0 ROLLBACK TRANSACTION;
            THROW;
          END CATCH;"
          REMOTE
