name: Restore the supplied VamCity database backup
run-name: Restore original VamCity data on Roofixo
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-vamcity-source-database.yml"
permissions:
  contents: read
concurrency:
  group: vamcity-source-db-restore
  cancel-in-progress: false
jobs:
  restore-source-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Safely back up current staging DB and restore the supplied source backup
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/vamcity_key"
          chmod 600 "$RUNNER_TEMP/vamcity_key"
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -T 10 -p "$PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i "$RUNNER_TEMP/vamcity_key" -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          BASE=/home/roofixo/domains/roofixo.ir/vamcity-app
          PRIVATE="$BASE/private"
          ZIP=/home/roofixo/domains/roofixo.ir/public_html/vamcityc_aqayevamdb_2026-10-11_15-51-44.zip
          SQL_CONTAINER=vamcity-stage-sql
          APP_CONTAINER=vamcity-stage-app
          DB_NAME=vamcity_stage
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          SQL_PASSWORD="$(sed -n 's/^MSSQL_SA_PASSWORD=//p' "$PRIVATE/sql.env" | head -1)"
          SQLCMD="$(docker exec "$SQL_CONTAINER" bash -lc 'if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then echo /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then echo /opt/mssql-tools/bin/sqlcmd; fi' | tail -1)"
          test -s "$PRIVATE/backup/source.bak"
          test -n "$SQL_PASSWORD"
          test -n "$SQLCMD"
          docker inspect -f '{{.State.Running}}' "$SQL_CONTAINER" | grep -qx true
          docker inspect -f '{{.State.Running}}' "$APP_CONTAINER" | grep -qx true
          mkdir -p "$PRIVATE/backup"
          chmod 700 "$PRIVATE/backup"

          echo "=== BACK UP CURRENT STAGING DATABASE BEFORE REPLACEMENT ==="
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "BACKUP DATABASE [$DB_NAME] TO DISK=N'/var/opt/mssql/backup/pre-source-restore-$TS.bak' WITH INIT, COMPRESSION"
          docker cp "$SQL_CONTAINER:/var/opt/mssql/backup/pre-source-restore-$TS.bak" "$PRIVATE/backup/pre-source-restore-$TS.bak"
          chmod 600 "$PRIVATE/backup/pre-source-restore-$TS.bak"
          echo "PRE_RESTORE_BACKUP=$PRIVATE/backup/pre-source-restore-$TS.bak"

          echo "=== VERIFY SOURCE BACKUP IS READABLE ==="
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "RESTORE VERIFYONLY FROM DISK=N'/var/opt/mssql/backup/source.bak'"

          echo "=== GET SOURCE BACKUP FILE LIST ==="
          FILELIST="$(docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -h -1 -W -s "|" -Q "RESTORE FILELISTONLY FROM DISK=N'/var/opt/mssql/backup/source.bak';" | awk -F'|' 'NF>=3 {gsub(/^[ \t]+|[ \t]+$/, "", $1); gsub(/^[ \t]+|[ \t]+$/, "", $3); if ($1 != "" && ($3 == "D" || $3 == "L")) print $1 "|" $3}')"
          test -n "$FILELIST" || { echo "SOURCE_BACKUP_FILELIST_EMPTY"; exit 1; }
          RESTORE_SQL="ALTER DATABASE [$DB_NAME] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; RESTORE DATABASE [$DB_NAME] FROM DISK=N'/var/opt/mssql/backup/source.bak' WITH REPLACE, RECOVERY, STATS=5"
          DATA_N=0
          LOG_N=0
          while IFS='|' read -r LOGICAL TYPE; do
            [ -n "$LOGICAL" ] || continue
            if ! printf '%s' "$LOGICAL" | grep -Eq '^[A-Za-z0-9_. -]+$'; then
              echo "UNEXPECTED_LOGICAL_FILE_NAME; refusing unsafe restore"
              exit 1
            fi
            if [ "$TYPE" = "D" ]; then
              DATA_N=$((DATA_N + 1))
              if [ "$DATA_N" -eq 1 ]; then EXT=mdf; else EXT=ndf; fi
              DEST="/var/opt/mssql/data/vamcity_stage_source_data$DATA_N.$EXT"
            else
              LOG_N=$((LOG_N + 1))
              DEST="/var/opt/mssql/data/vamcity_stage_source_log$LOG_N.ldf"
            fi
            RESTORE_SQL="$RESTORE_SQL, MOVE N'$LOGICAL' TO N'$DEST'"
          done <<EOF
          $FILELIST
          EOF
          RESTORE_SQL="$RESTORE_SQL; ALTER DATABASE [$DB_NAME] SET MULTI_USER;"
          echo "=== RESTORE THE PROVIDED VAMCITY SOURCE DATABASE ==="
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "$RESTORE_SQL"
          echo "=== VERIFY RESTORED DATABASE ==="
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "SET NOCOUNT ON; SELECT name,state_desc FROM sys.databases WHERE name=N'$DB_NAME'; SELECT COUNT(*) AS user_tables FROM [$DB_NAME].sys.tables;"
          echo "=== RESTART APP AGAINST RESTORED DATABASE ==="
          docker restart "$APP_CONTAINER" >/dev/null
          HEALTH=000
          for i in $(seq 1 36); do
            HEALTH="$(curl -sS -o /dev/null --max-time 4 -w '%{http_code}' http://127.0.0.1:5187/cl/plans/ || true)"
            case "$HEALTH" in 200|301|302|307|308) break ;; esac
            sleep 3
          done
          echo "VAMCITY_PLANS_AFTER_SOURCE_RESTORE_HTTP=$HEALTH"
          case "$HEALTH" in 200|301|302|307|308) ;; *) docker logs --tail 100 "$APP_CONTAINER" || true; exit 1 ;; esac
          echo "SOURCE_DATABASE_RESTORE_COMPLETED"
          REMOTE
