name: Verify VamCity UI on Roofixo
run-name: Check live VamCity plans page, theme assets, and existing data

on:
  workflow_run:
    workflows:
      - "Deploy VamCity UI only (preserve app and database)"
      - "Repair Roofixo VamCity vhost and SSL"
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-vamcity-ui-only.yml"

permissions:
  contents: read

jobs:
  verify-live-ui:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify public app HTML, theme CSS, original bundle, and plans API
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://roofixo.ir
          HTML="$(mktemp)"
          CSS="$(mktemp)"
          API="$(mktemp)"
          trap 'rm -f "$HTML" "$CSS" "$API"' EXIT

          STATUS="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -L --max-time 30 -o "$HTML" -w '%{http_code}' "$BASE/plans.html")"
          echo "PLANS_PAGE_HTTP=$STATUS"
          test "$STATUS" = 200
          grep -Fq 'طرح‌های تسهیلات | وام‌سیتی' "$HTML"
          HOME="$(mktemp)"
          curl --retry 3 --retry-all-errors --retry-delay 2 -sS -L --max-time 25 -o "$HOME" "$BASE/"
          grep -Fq 'href="/plans.html"' "$HOME"
          grep -Fq 'href="/login/"' "$HOME"
          grep -Fq 'href="/register/0/"' "$HOME"
          LEGACY_URL="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -L --max-time 25 -o /dev/null -w '%{url_effective}' "$BASE/cl/plans/")"
          echo "LEGACY_PLANS_FINAL_URL=$LEGACY_URL"
          test "$LEGACY_URL" = "$BASE/plans.html"
          rm -f "$HOME"

          CSS_STATUS="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS --max-time 20 -o "$CSS" -w '%{http_code}' "$BASE/css/vamcity-modern-theme.css?v=7")"
          echo "THEME_CSS_HTTP=$CSS_STATUS"
          test "$CSS_STATUS" = 200
          grep -Fq 'tokens-base.css?v=7' "$CSS"

          JS_STATUS="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS --max-time 30 -o /dev/null -w '%{http_code}' "$BASE/js/app.e76ab352.js?v=otp-ui1")"
          echo "LEGACY_APP_BUNDLE_HTTP=$JS_STATUS"
          test "$JS_STATUS" = 200

          API_STATUS="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS --max-time 25 -o "$API" -w '%{http_code}' "$BASE/Loan/List/100")"
          echo "PUBLIC_PLANS_API_HTTP=$API_STATUS"
          test "$API_STATUS" = 200
          python3 - "$API" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              payload = json.load(f)
          success = payload.get("success", payload.get("Success"))
          data = payload.get("data", payload.get("Data"))
          if success is not True or not isinstance(data, list) or len(data) == 0:
              raise SystemExit("Plans API did not return a successful non-empty list")
          print(f"PUBLIC_PLANS_API_OK count={len(data)}")
          PY

      - name: Install Playwright browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Render plans page on desktop and mobile
        run: |
          mkdir -p artifacts
          cat > verify-ui.cjs <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            let failed = false;
            for (const viewport of [
              { name: 'desktop', width: 1440, height: 1000 },
              { name: 'mobile', width: 390, height: 844 }
            ]) {
              const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height } });
              const errors = [];
              page.on('pageerror', e => errors.push('PAGEERROR ' + e.message));
              page.on('requestfailed', r => errors.push('REQUEST_FAILED ' + r.url() + ' ' + (r.failure()?.errorText || 'unknown')));
              page.on('response', r => {
                if (r.status() >= 400 && new URL(r.url()).hostname === 'roofixo.ir') {
                  errors.push('HTTP_' + r.status() + ' ' + r.url());
                }
              });
              try {
                const response = await page.goto('https://roofixo.ir/plans.html', { waitUntil: 'commit', timeout: 20000 });
                await page.waitForTimeout(6000);
                const body = (await page.locator('body').innerText().catch(() => '')).replace(/\\s+/g, ' ').trim();
                const appLength = await page.locator('#app').innerText().then(t => t.length).catch(() => 0);
                const cards = await page.locator('.card').count().catch(() => 0);
                const title = await page.title();
                console.log('VIEWPORT=' + viewport.name + ' HTTP=' + (response?.status() ?? 'none'));
                console.log('TITLE=' + title);
                console.log('BODY_TEXT_LENGTH=' + body.length + ' APP_TEXT_LENGTH=' + appLength + ' PLAN_CARD_COUNT=' + cards);
                console.log('BODY_SAMPLE=' + body.slice(0, 700));
                console.log('BROWSER_ERRORS=' + JSON.stringify(errors.slice(0, 15)));
                await page.screenshot({ path: 'artifacts/' + viewport.name + '.png', fullPage: true }).catch(() => {});
                if (!response || response.status() !== 200 || body.length < 100 || !title.includes('طرح‌های تسهیلات')) failed = true;
                if (errors.some(e => e.startsWith('PAGEERROR') || e.startsWith('HTTP_'))) failed = true;
                if (cards < 1) failed = true;
              } catch (e) {
                console.log('VIEWPORT_ERROR=' + viewport.name + ' ' + e.message);
                failed = true;
              } finally {
                await page.close();
              }
            }
            for (const route of ['/login/', '/cl/login', '/cl/register']) {
              const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
              const errors = [];
              page.on('pageerror', e => errors.push('PAGEERROR ' + e.message));
              page.on('requestfailed', r => errors.push('REQUEST_FAILED ' + r.url()));
              const response = await page.goto('https://roofixo.ir' + route, { waitUntil: 'commit', timeout: 20000 });
              await page.waitForTimeout(3500);
              const body = (await page.locator('body').innerText().catch(() => '')).replace(/\\s+/g, ' ').trim();
              const inputs = await page.locator('input').count().catch(() => 0);
              const passwords = await page.locator('input[type="password"]').count().catch(() => 0);
              const buttons = await page.locator('button, .v-btn').count().catch(() => 0);
              console.log('AUTH_PAGE=' + route + ' HTTP=' + (response?.status() ?? 'none') + ' BODY_LENGTH=' + body.length + ' INPUTS=' + inputs + ' PASSWORD_FIELDS=' + passwords + ' BUTTONS=' + buttons);
              console.log('AUTH_BODY_SAMPLE=' + body.slice(0, 500));
              console.log('AUTH_BROWSER_ERRORS=' + JSON.stringify(errors.slice(0, 10)));
              await page.screenshot({ path: 'artifacts/auth-' + route.replace(/[^a-z0-9]+/gi, '-') + '.png', fullPage: true }).catch(() => {});
              if (!response || response.status() !== 200 || body.length < 50 || errors.length) failed = true;
              if ((route === '/login/' || route === '/cl/login') && passwords < 1) failed = true;
              if (route === '/cl/register' && inputs < 2) failed = true;
              await page.close();
            }

            await browser.close();
            if (failed) process.exit(1);
          })();
          NODE
          node verify-ui.cjs

      - name: Verify existing login modes and registration route
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            const response = await page.goto('https://roofixo.ir/login/', { waitUntil: 'commit', timeout: 20000 });
            await page.waitForTimeout(3000);
            const loginText = (await page.locator('body').innerText()).replace(/\\s+/g, ' ').trim();
            const inputCount = await page.locator('input').count();
            const passwordCount = await page.locator('input[type="password"]').count();
            console.log('LOGIN_PAGE_HTTP=' + (response?.status() ?? 'none'));
            console.log('LOGIN_INPUTS=' + inputCount + ' PASSWORD_FIELDS=' + passwordCount);
            console.log('LOGIN_BODY_SAMPLE=' + loginText.slice(0, 500));
            if (!response || response.status() !== 200 ||
                !loginText.includes('نام کاربری') ||
                !loginText.includes('کلمه عبور') ||
                !loginText.includes('کد امنیتی') ||
                !loginText.includes('ثبت نام کنید') ||
                inputCount < 3 || passwordCount < 1 || errors.length) {
              throw new Error('Username/password/captcha login form did not render correctly: ' + JSON.stringify(errors));
            }
            await page.screenshot({ path: 'artifacts/login-desktop.png', fullPage: true });

            const otpToggle = page.getByText('رمز یک‌بارمصرف (OTP)', { exact: false }).first();
            if (await otpToggle.count() < 1) throw new Error('Existing OTP sign-in option is missing');
            await otpToggle.click();
            await page.waitForTimeout(500);
            const otpText = (await page.locator('body').innerText()).replace(/\\s+/g, ' ').trim();
            console.log('LOGIN_OTP_INPUT_VISIBLE=' + otpText.includes('رمز پیامکی را اینجا وارد کنید'));
            if (!otpText.includes('رمز پیامکی را اینجا وارد کنید') || errors.length) {
              throw new Error('OTP sign-in UI did not open cleanly: ' + JSON.stringify(errors));
            }
            const otpInputs = page.locator('#login-view .otp-container input');
            const otpCount = await otpInputs.count();
            if (otpCount < 4) throw new Error('Expected at least four OTP digit boxes; got ' + otpCount);
            await otpInputs.nth(0).click();
            await otpInputs.nth(0).fill('7');
            const autoAdvanced = await otpInputs.nth(1).evaluate(el => document.activeElement === el);
            console.log('OTP_AUTO_ADVANCE=' + autoAdvanced + ' OTP_BOXES=' + otpCount);
            if (!autoAdvanced) throw new Error('OTP did not auto-advance to the next digit box');
            await otpInputs.nth(1).press('Backspace');
            const backspaceReturned = await otpInputs.nth(0).evaluate(el => document.activeElement === el);
            console.log('OTP_BACKSPACE_RETURN=' + backspaceReturned);
            if (!backspaceReturned) throw new Error('OTP Backspace navigation did not return to previous digit box');
            await page.screenshot({ path: 'artifacts/login-otp-desktop.png', fullPage: true });

            await page.goto('https://roofixo.ir/login/', { waitUntil: 'commit', timeout: 20000 });
            await page.waitForTimeout(1800);
            await page.getByText('ثبت نام کنید', { exact: false }).first().click();
            await page.waitForTimeout(2500);
            const registerText = (await page.locator('body').innerText()).replace(/\\s+/g, ' ').trim();
            const registerInputs = await page.locator('input').count();
            console.log('REGISTER_FINAL_URL=' + page.url());
            console.log('REGISTER_BODY_LENGTH=' + registerText.length + ' REGISTER_INPUTS=' + registerInputs);
            console.log('REGISTER_BODY_SAMPLE=' + registerText.slice(0, 500));
            if (!(registerText.includes('عضویت') || registerText.includes('ثبت نام')) || registerInputs < 2 || errors.length) {
              throw new Error('Registration form did not render correctly: ' + JSON.stringify(errors));
            }
            await page.screenshot({ path: 'artifacts/register-desktop.png', fullPage: true });
            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto('https://roofixo.ir/login/', { waitUntil: 'commit', timeout: 20000 });
            await page.waitForTimeout(2000);
            await page.screenshot({ path: 'artifacts/login-mobile.png', fullPage: true });
            console.log('LOGIN_REGISTER_BROWSER_ERRORS=' + JSON.stringify(errors));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Upload live UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vamcity-live-ui-desktop-mobile
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
