name: Publish integrated VamCity admin UI to canonical dashboard
run-name: Replace legacy admin dashboard with integrated modern VamCity UI

on:
  push:
    branches: [main]
    paths:
      - "template-management/vamcity-template-management.html"
      - ".github/workflows/deploy-vamcity-integrated-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vamcity-integrated-admin-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate integrated admin template
        shell: bash
        run: |
          set -euo pipefail
          FILE=template-management/vamcity-template-management.html
          test -s "$FILE"
          grep -qi '<html' "$FILE"
          grep -q 'id="overview"' "$FILE"
          grep -q 'id="live-customers-table"' "$FILE"
          grep -q 'id="live-requests-table"' "$FILE"
          grep -Fq "admin/userLoanRequest/list?start=" "$FILE"
          grep -Fq "/admin/member/DynamicListLight" "$FILE"
          grep -Fq "/superadmin/dashboard/get" "$FILE"
          grep -Fq 'href="/admin/appsettings/"' "$FILE"
          grep -Fq 'href="/admin/appbackup/"' "$FILE"
          grep -Fq 'href="/cl/agentregister/0/"' "$FILE"
          grep -Fq 'href="/plans.html"' "$FILE"
          grep -Fq "localStorage.getItem('user')" "$FILE"
          grep -Fq "window.location.replace('/login/?returnUrl='" "$FILE"
          grep -Fq 'href="/admin/loans/"' "$FILE"
          grep -Fq 'href="/admin/userLoanRequests/"' "$FILE"
          echo "INTEGRATED_ADMIN_TEMPLATE_VALID"

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          PORT="${DEPLOY_PORT:-22}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/vamcity_admin_key"
          chmod 600 "$RUNNER_TEMP/vamcity_admin_key"
          ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "PORT=$PORT" >> "$GITHUB_ENV"
          echo "HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "USER=$DEPLOY_USER" >> "$GITHUB_ENV"

      - name: Upload template with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if scp -i "$RUNNER_TEMP/vamcity_admin_key" -P "$PORT" \
              -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes \
              template-management/vamcity-template-management.html \
              "$USER@$HOST:/tmp/vamcity-admin-template-$GITHUB_SHA.html"; then
              echo "TEMPLATE_UPLOAD_OK attempt=$attempt"
              exit 0
            fi
            [ "$attempt" -eq 5 ] && { echo "::error::Template upload failed"; exit 1; }
            sleep 6
          done

      - name: Back up, publish and route the new admin shell
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/vamcity_admin_key" -p "$PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euxo pipefail
          SHA="$1"
          DOMAIN=/home/roofixo/domains/roofixo.ir
          PUBLIC="$DOMAIN/public_html"
          BASE="$DOMAIN/vamcity-app"
          SRC="/tmp/vamcity-admin-template-$SHA.html"
          CUSTOM=/usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.cust_nginx
          PRIVATE="$BASE/private"
          BACKUP="$PRIVATE/rollback/integrated-admin-$SHA"
          test -s "$SRC"
          test -s "$CUSTOM"
          test -s "$PUBLIC/vamcity-public-home.html"
          docker inspect -f '{{.State.Running}}' vamcity-stage-app | grep -qx true
          echo "REMOTE_PRECHECKS_OK"
          install -d -m 700 "$PRIVATE" "$PRIVATE/rollback" "$BACKUP"
          install -d -m 755 "$PUBLIC/vamcity-template-preview" "$PUBLIC/vamcity-admin" "$PUBLIC/vamcity-template-management"
          cp -p "$CUSTOM" "$BACKUP/roofixo.ir.cust_nginx.before"
          for p in "$PUBLIC/vamcity-template-preview/index.html" "$PUBLIC/vamcity-admin/index.html" "$PUBLIC/vamcity-template-management/index.html" "$PUBLIC/vamcity-template-management.html"; do
            if [ -f "$p" ]; then
              name="$(echo "$p" | sed "s#^$PUBLIC/##; s#/#__#g")"
              cp -p "$p" "$BACKUP/$name.before"
              echo present > "$BACKUP/$name.state"
            else
              name="$(echo "$p" | sed "s#^$PUBLIC/##; s#/#__#g")"
              echo absent > "$BACKUP/$name.state"
            fi
          done
          chmod 600 "$BACKUP"/*
          echo "REMOTE_BACKUP_OK=$BACKUP"
          grep -Fq "localStorage.getItem('user')" "$SRC"
          grep -Fq 'href="/admin/appsettings/"' "$SRC"
          grep -Fq 'href="/admin/appbackup/"' "$SRC"
          echo "REMOTE_TEMPLATE_CHECKS_OK"
          install -m 644 "$SRC" "$PUBLIC/vamcity-template-preview/.index-$SHA.tmp"
          install -m 644 "$SRC" "$PUBLIC/vamcity-admin/.index-$SHA.tmp"
          install -m 644 "$SRC" "$PUBLIC/vamcity-template-management/.index-$SHA.tmp"
          install -m 644 "$SRC" "$PUBLIC/.vamcity-template-management-$SHA.tmp"
          mv -f "$PUBLIC/vamcity-template-preview/.index-$SHA.tmp" "$PUBLIC/vamcity-template-preview/index.html"
          mv -f "$PUBLIC/vamcity-admin/.index-$SHA.tmp" "$PUBLIC/vamcity-admin/index.html"
          mv -f "$PUBLIC/vamcity-template-management/.index-$SHA.tmp" "$PUBLIC/vamcity-template-management/index.html"
          mv -f "$PUBLIC/.vamcity-template-management-$SHA.tmp" "$PUBLIC/vamcity-template-management.html"
          chown -R roofixo:roofixo "$PUBLIC/vamcity-template-preview" "$PUBLIC/vamcity-admin" "$PUBLIC/vamcity-template-management" "$PUBLIC/vamcity-template-management.html"
          chmod 755 "$PUBLIC/vamcity-template-preview" "$PUBLIC/vamcity-admin" "$PUBLIC/vamcity-template-management"
          chmod 644 "$PUBLIC/vamcity-template-preview/index.html" "$PUBLIC/vamcity-admin/index.html" "$PUBLIC/vamcity-template-management/index.html" "$PUBLIC/vamcity-template-management.html"
          echo "REMOTE_TEMPLATE_FILES_INSTALLED"

          echo "REMOTE_BEFORE_NGINX_ROUTE_EDIT"
          python3 - "$CUSTOM" "$PUBLIC" <<'PY'
          import re, sys
          path, public = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as f:
              lines = f.readlines()
          targets = {
              "/vamcity-template-preview", "/vamcity-template-preview/",
              "/admin/dashboard", "/admin/dashboard/",
              "/admin/Dashboard", "/admin/Dashboard/",
              "/admin", "/admin/",
              "/superadmin/dashboard", "/superadmin/dashboard/",
              "/superAdmin/dashboard", "/superAdmin/dashboard/",
          }
          out, removed, i = [], [], 0
          while i < len(lines):
              m = re.match(r"\s*location\s*=\s*(\S+)\s*\{", lines[i])
              if m and m.group(1) in targets:
                  target, depth, started = m.group(1), 0, False
                  while i < len(lines):
                      cur = lines[i]
                      depth += cur.count("{") - cur.count("}")
                      started = started or "{" in cur
                      i += 1
                      if started and depth == 0:
                          break
                  removed.append(target)
                  continue
              out.append(lines[i])
              i += 1
          block = f"""# VAMCITY_INTEGRATED_ADMIN_BEGIN
          location = /vamcity-template-preview {{
              return 302 /vamcity-template-preview/;
          }}
          location = /vamcity-template-preview/ {{
              alias {public}/vamcity-template-preview/index.html;
              default_type text/html;
              add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
              add_header Pragma "no-cache" always;
              expires -1;
          }}
          location = /admin {{
              return 302 /admin/dashboard;
          }}
          location = /admin/ {{
              return 302 /admin/dashboard;
          }}
          location = /admin/dashboard/ {{
              return 302 /admin/dashboard;
          }}
          location = /admin/dashboard {{
              alias {public}/vamcity-admin/index.html;
              default_type text/html;
              add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
              add_header Pragma "no-cache" always;
              expires -1;
          }}
          location = /admin/Dashboard/ {{
              return 302 /admin/dashboard;
          }}
          location = /admin/Dashboard {{
              alias {public}/vamcity-admin/index.html;
              default_type text/html;
              add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
              add_header Pragma "no-cache" always;
              expires -1;
          }}
          location = /superadmin/dashboard/ {{
              return 302 /admin/dashboard;
          }}
          location = /superadmin/dashboard {{
              alias {public}/vamcity-admin/index.html;
              default_type text/html;
              add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
              add_header Pragma "no-cache" always;
              expires -1;
          }}
          location = /superAdmin/dashboard/ {{
              return 302 /admin/dashboard;
          }}
          location = /superAdmin/dashboard {{
              alias {public}/vamcity-admin/index.html;
              default_type text/html;
              add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
              add_header Pragma "no-cache" always;
              expires -1;
          }}
          # VAMCITY_INTEGRATED_ADMIN_END
          """
          text = "".join(out)
          begin, end = "# VAMCITY_INTEGRATED_ADMIN_BEGIN", "# VAMCITY_INTEGRATED_ADMIN_END"
          if begin in text and end in text:
              a, b = text.index(begin), text.index(end) + len(end)
              text = text[:a] + text[b:]
          match = re.search(r"(?m)^\s*location\s*=\s*/\s*\{", text)
          if match:
              text = text[:match.start()] + block + "\n" + text[match.start():]
          else:
              text = text.rstrip() + "\n\n" + block + "\n"
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          print("ADMIN_ROUTE_BLOCK_INSTALLED=true")
          print("PREVIOUS_ADMIN_ROUTE_BLOCKS_REMOVED=" + ",".join(removed))
          PY
          chown roofixo:roofixo "$CUSTOM"
          chmod 644 "$CUSTOM"
          /usr/local/directadmin/custombuild/build rewrite_confs >/dev/null
          nginx -t
          grep -Fq "location = /admin/dashboard {" /usr/local/directadmin/data/users/roofixo/nginx.conf
          grep -Fq "location = /admin/Dashboard {" /usr/local/directadmin/data/users/roofixo/nginx.conf
          grep -Fq "location = /vamcity-template-preview/" /usr/local/directadmin/data/users/roofixo/nginx.conf
          systemctl reload nginx
          rm -f "$SRC"
          echo "INTEGRATED_ADMIN_PUBLISHED=true"
          echo "DATABASE_UNTOUCHED=true"
          echo "APP_CONTAINER_RESTARTED=false"
          echo "BACKUP=$BACKUP"
          REMOTE

      - name: Verify live admin and preview URLs
        shell: bash
        run: |
          set -euo pipefail
          for path in /admin/dashboard /admin/Dashboard /vamcity-template-preview/; do
            code="$(curl --retry 3 --retry-delay 2 -k -sS -o /tmp/admin-check.html -w '%{http_code}' "https://roofixo.ir$path?release=$GITHUB_SHA")"
            echo "LIVE_ROUTE=$path HTTP=$code BYTES=$(wc -c < /tmp/admin-check.html)"
            test "$code" = 200
            grep -Fq 'مرکز مدیریت وام‌سیتی' /tmp/admin-check.html
            grep -Fq 'href="/admin/appsettings/"' /tmp/admin-check.html
            grep -Fq 'href="/admin/appbackup/"' /tmp/admin-check.html
          done
          echo "LIVE_INTEGRATED_ADMIN_VERIFIED=true"
