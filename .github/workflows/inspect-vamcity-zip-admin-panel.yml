name: Inspect VamCity legacy ZIP admin panel
run-name: Locate original admin panel inside vamcity.zip

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-vamcity-zip-admin-panel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          PORT="${DEPLOY_PORT:-22}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          ssh-keyscan -T 10 -p "$PORT" "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "DEPLOY_PORT_EFFECTIVE=$PORT" >> "$GITHUB_ENV"
          echo "DEPLOY_HOST_EFFECTIVE=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_USER_EFFECTIVE=$DEPLOY_USER" >> "$GITHUB_ENV"
      - name: Inspect ZIP without changing production
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/deploy_key" -p "$DEPLOY_PORT_EFFECTIVE" \
            -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER_EFFECTIVE@$DEPLOY_HOST_EFFECTIVE" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ZIP="/home/roofixo/domains/roofixo.ir/public_html/vamcity.zip"
          test -f "$ZIP"
          echo "ZIP_PATH=$ZIP"
          stat -c 'ZIP_BYTES=%s ZIP_MTIME=%y' "$ZIP"
          echo "=== ADMIN / PANEL CANDIDATE PATHS ==="
          unzip -Z1 "$ZIP" | grep -Ei '(^|/)(admin|dashboard|panel|super-admin|management|backoffice)([^/]*)(/|\.|$)|(^|/)(admin|dashboard|panel|management)[^/]*\.html$' | head -250 || true
          echo "=== HTML FILES THAT LOOK LIKE ENTRY PAGES ==="
          unzip -Z1 "$ZIP" | grep -Ei '(^|/)(index|admin|dashboard|panel|login|home)[^/]*\.html$' | head -160 || true
          echo "=== FRONTEND SOURCE / PROJECT FILES ==="
          unzip -Z1 "$ZIP" | grep -Ei '(^|/)(App\.vue|main\.js|router/index\.js|package\.json|vue\.config\.js|.*\.csproj|.*\.sln)$' | head -100 || true
          echo "=== PUBLISHED ADMIN ASSETS ==="
          unzip -Z1 "$ZIP" | grep -Ei '(^|/)wwwroot/ui/(index\.html|js/app\.[^/]+\.js|css/app\.[^/]+\.css)$|(^|/)(admin|dashboard|panel)\.(html|js|css)$' | head -160 || true
          echo "ZIP_INSPECTION_COMPLETE_NO_PRODUCTION_CHANGES=1"
          REMOTE
