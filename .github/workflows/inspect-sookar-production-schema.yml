name: Read-only Sookar production schema inspection

on:
  push:
    paths:
      - .github/workflows/inspect-sookar-production-schema.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect active Sookar PostgreSQL without changing data
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          capture_stdout: true
          script: |
            set -euo pipefail
            echo "SOOKAR_POSTGRES_CONTAINER"
            docker inspect naf-sookar-postgres-1 --format '{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}|{{index .Config.Labels "com.docker.compose.project"}}'
            echo "SOOKAR_DATABASE_METADATA"
            docker exec naf-sookar-postgres-1 sh -lc '
              set -e
              psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -AtF "|" -c "SELECT current_database(); SHOW server_version;"
              echo "SOOKAR_TABLE_ESTIMATES"
              psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -AtF "|" -c "SELECT relname,n_live_tup FROM pg_stat_user_tables ORDER BY relname;"
              echo "SOOKAR_KEY_TABLE_EXACT_COUNTS"
              for table in tenants users user_tenants user_contact_methods lendtech_applications lendtech_scores lendtech_decisions lendtech_facilities lendtech_contracts lendtech_installments lendtech_repayments lendtech_delinquencies lendtech_events financing_brands financing_programs commerce_suppliers crm_customers crm_customer_identities support_tickets support_ticket_messages platform_attachments documents organizations companies accounting_documents ledger_accounts marketplace_orders products sellers stores seller_domains; do
                echo "TABLE=$table"
                psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT COUNT(*) FROM public.$table" || true
              done
              echo "SOOKAR_KEY_TABLE_COLUMNS"
              for table in tenants users user_tenants user_contact_methods lendtech_applications lendtech_facilities lendtech_contracts lendtech_installments lendtech_repayments lendtech_events; do
                echo "COLUMNS=$table"
                psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "\\d public.$table" || true
              done
            '
            echo "SOOKAR_READ_ONLY_INSPECTION_COMPLETE=1"
            echo "SOOKAR_TENANT_AND_ADMIN_ROLES"
            docker exec naf-sookar-postgres-1 sh -lc 'psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -AtF "|" -c "SELECT code,name,status,created_at FROM tenants ORDER BY created_at; SELECT hostname,t.code,verification_status FROM seller_domains d JOIN tenants t ON t.id=d.tenant_id ORDER BY hostname; SELECT role,COUNT(*) FROM users GROUP BY role ORDER BY role;"'
            echo "VAMCITY_MARIADB_LOOKUPS_AND_AGGREGATES"
            CONF="/usr/local/directadmin/conf/mysql.conf"
            DBUSER="$(awk -F= '$1=="user"{print substr($0,index($0,"=")+1); exit}' "$CONF")"
            DBPASS="$(awk -F= '$1=="passwd" || $1=="password"{print substr($0,index($0,"=")+1); exit}' "$CONF")"
            test -n "$DBUSER" && test -n "$DBPASS"
            export MYSQL_PWD="$DBPASS"
            mysql --protocol=socket -u"$DBUSER" -N -B vamcitydigibilepay -e "SELECT 'CUSTOMERS'; SELECT Id,Code,Name FROM Customers ORDER BY Code;"
            mysql --protocol=socket -u"$DBUSER" -N -B vamcitydigibilepay -e "SELECT 'SOURCE_USER_COUNTS'; SELECT CustomerId,COUNT(*),SUM(Email IS NULL OR Email='''),SUM(Mobile IS NULL OR Mobile=''') FROM AspNetUsers GROUP BY CustomerId ORDER BY CustomerId;"
            mysql --protocol=socket -u"$DBUSER" -N -B vamcitydigibilepay -e "SELECT 'SOURCE_REQUEST_COUNTS'; SELECT CustomerId,COUNT(*),COUNT(DISTINCT UserId),SUM(Amount),MIN(RequestDate),MAX(RequestDate) FROM UserLoanRequests GROUP BY CustomerId;"
            mysql --protocol=socket -u"$DBUSER" -N -B vamcitydigibilepay -e "SELECT 'SOURCE_LOAN_ACCOUNT_COUNTS'; SELECT l.CustomerId,COUNT(*),COUNT(DISTINCT u.UserId),SUM(u.Amount),SUM(u.Paid),SUM(u.Remain),SUM(u.PayableAmount) FROM UserLoans u JOIN Loans l ON l.Id=u.LoanId GROUP BY l.CustomerId;"
            mysql --protocol=socket -u"$DBUSER" -N -B vamcitydigibilepay -e "SELECT 'SOURCE_PAYMENT_COUNTS'; SELECT l.CustomerId,COUNT(*),SUM(p.Amount),SUM(p.InstallmentAmount),SUM(p.SumAmount),SUM(p.DelayPrice),SUM(p.Discount) FROM UserLoanPayments p JOIN UserLoans u ON u.Id=p.UserLoanId JOIN Loans l ON l.Id=u.LoanId GROUP BY l.CustomerId;"
            mysql --protocol=socket -u"$DBUSER" -N -B vamcitydigibilepay -e "SELECT 'SOURCE_STATUS_LABEL_COUNTS'; SELECT s.CustomerId,COALESCE(s.Title,'UNMAPPED'),s.SystemRequestStatus,s.StatusGroup,COUNT(*),SUM(r.Amount) FROM UserLoanRequests r LEFT JOIN LoanRequestStatuses s ON s.Id=r.StatusId GROUP BY s.CustomerId,s.Title,s.SystemRequestStatus,s.StatusGroup ORDER BY s.CustomerId,s.SystemRequestStatus,s.Title;"
            mysql --protocol=socket -u"$DBUSER" -N -B vamcitydigibilepay -e "SELECT 'LOAN_DEFINITIONS_BY_CUSTOMER'; SELECT CustomerId,COUNT(*),SUM(Disable=0),SUM(Disable<>0) FROM Loans GROUP BY CustomerId ORDER BY CustomerId;"
            mysql --protocol=socket -u"$DBUSER" -N -B vamcitydigibilepay -e "SELECT 'LOAN_DEFINITIONS'; SELECT CustomerId,Code,Title,ProfitPercent,MaxAmount,MaxMonthGap,AllowedInstallments,Disable,HasSponsore,DefaultSponsoreCheckoutDays,LoanProfitType,LEFT(CostsJson,500) FROM Loans ORDER BY CustomerId,Code;"
            mysql --protocol=socket -u"$DBUSER" -N -B vamcitydigibilepay -e "SELECT 'REQUEST_STATUS_DEFINITIONS'; SELECT CustomerId,Id,Title,StepCategory,SystemRequestStatus,StatusGroup,SystemAgentRequestStatus,AllowNewRequest FROM LoanRequestStatuses ORDER BY CustomerId,Id;"
            mysql --protocol=socket -u"$DBUSER" -N -B vamcitydigibilepay -e "SELECT 'REQUEST_STATUS_BY_TITLE'; SELECT s.CustomerId,COALESCE(s.Title,'UNMAPPED'),s.SystemRequestStatus,s.StatusGroup,COUNT(*),SUM(r.Amount),MIN(r.RequestDate),MAX(r.RequestDate) FROM UserLoanRequests r LEFT JOIN LoanRequestStatuses s ON s.Id=r.StatusId GROUP BY s.CustomerId,s.Title,s.SystemRequestStatus,s.StatusGroup ORDER BY s.CustomerId,s.SystemRequestStatus,s.Title;"
            mysql --protocol=socket -u"$DBUSER" -N -B vamcitydigibilepay -e "SELECT 'REQUEST_USER_COUNTS'; SELECT CustomerId,COUNT(*),COUNT(DISTINCT UserId) FROM UserLoanRequests GROUP BY CustomerId;"
            mysql --protocol=socket -u"$DBUSER" -N -B vamcitydigibilepay -e "SELECT 'USER_COUNTS_BY_CUSTOMER'; SELECT CustomerId,COUNT(*),COUNT(DISTINCT Id) FROM AspNetUsers GROUP BY CustomerId ORDER BY CustomerId;"
            mysql --protocol=socket -u"$DBUSER" -N -B vamcitydigibilepay -e "SELECT 'USER_LOAN_AGGREGATES'; SELECT l.CustomerId,u.LoanId,u.IsCanceled,COUNT(*),SUM(u.Amount),SUM(u.Paid),SUM(u.Remain),SUM(u.PayableAmount) FROM UserLoans u JOIN Loans l ON l.Id=u.LoanId GROUP BY l.CustomerId,u.LoanId,u.IsCanceled ORDER BY l.CustomerId,u.LoanId,u.IsCanceled;"
            mysql --protocol=socket -u"$DBUSER" -N -B vamcitydigibilepay -e "SELECT 'PAYMENT_AGGREGATES_BY_CUSTOMER'; SELECT l.CustomerId,COUNT(*),SUM(p.Amount),SUM(p.InstallmentAmount),SUM(p.SumAmount),SUM(p.DelayPrice),SUM(p.Discount) FROM UserLoanPayments p JOIN UserLoans u ON u.Id=p.UserLoanId JOIN Loans l ON l.Id=u.LoanId GROUP BY l.CustomerId;"
            mysql --protocol=socket -u"$DBUSER" -N -B vamcitydigibilepay -e "SELECT 'PAYMENT_REQUEST_AGGREGATES'; SELECT l.CustomerId,r.PaymentMethod,COUNT(*),SUM(r.Amount) FROM UserLoanPaymentRequests r JOIN UserLoanPayments p ON p.Id=r.UserLoanPaymentId JOIN UserLoans u ON u.Id=p.UserLoanId JOIN Loans l ON l.Id=u.LoanId GROUP BY l.CustomerId,r.PaymentMethod ORDER BY l.CustomerId,r.PaymentMethod;"
            mysql --protocol=socket -u"$DBUSER" -N -B vamcitydigibilepay -e "SELECT 'ASSURANCE_AGGREGATES'; SELECT l.CustomerId,a.AssuranceType,COUNT(*),SUM(a.FileSize),SUM(a.ReturnFileSize) FROM Assurances a JOIN UserLoans u ON u.Id=a.UserLoanId JOIN Loans l ON l.Id=u.LoanId GROUP BY l.CustomerId,a.AssuranceType ORDER BY l.CustomerId,a.AssuranceType;"
            mysql --protocol=socket -u"$DBUSER" -N -B vamcitydigibilepay -e "SELECT 'TICKET_AGGREGATES'; SELECT CustomerId,Role,TargetRole,COUNT(*) FROM Tickets GROUP BY CustomerId,Role,TargetRole ORDER BY CustomerId,Role,TargetRole;"
            mysql --protocol=socket -u"$DBUSER" -N -B vamcitydigibilepay -e "SELECT 'INSTALLMENT_SAMPLE'; SELECT InstallmentNumber,Amount,InstallmentAmount,SumAmount,TargetMonth,DelayDay,DelayPrice,PaymentMethod,Discount FROM UserLoanPayments ORDER BY TargetMonth LIMIT 5;"
            unset MYSQL_PWD DBPASS
            mysql --protocol=socket -u"$DBUSER" -N -B vamcitydigibilepay -e "SELECT 'USER_IDENTITY_QUALITY'; SELECT CustomerId,COUNT(*),SUM(COALESCE(CHAR_LENGTH(TRIM(Email)),0)=0),SUM(COALESCE(CHAR_LENGTH(TRIM(Mobile)),0)=0),SUM(COALESCE(CHAR_LENGTH(TRIM(NationalCode)),0)=0),COUNT(NULLIF(TRIM(Mobile),''))-COUNT(DISTINCT NULLIF(TRIM(Mobile),'')),COUNT(NULLIF(TRIM(NationalCode),''))-COUNT(DISTINCT NULLIF(TRIM(NationalCode),'')) FROM AspNetUsers GROUP BY CustomerId ORDER BY CustomerId;"
            mysql --protocol=socket -u"$DBUSER" -N -B vamcitydigibilepay -e "SELECT 'RELATED_SOURCE_TABLE_COUNTS'; SELECT 'UserLoanRequestStatusHistories',COUNT(*) FROM UserLoanRequestStatusHistories UNION ALL SELECT 'UserLoanRequestAuthorizationItems',COUNT(*) FROM UserLoanRequestAuthorizationItems UNION ALL SELECT 'UserLoanRequestAuthorizationItemAttachments',COUNT(*) FROM UserLoanRequestAuthorizationItemAttachments UNION ALL SELECT 'Tickets',COUNT(*) FROM Tickets UNION ALL SELECT 'TicketResponses',COUNT(*) FROM TicketResponses UNION ALL SELECT 'Assurances',COUNT(*) FROM Assurances;"
            docker exec naf-sookar-postgres-1 sh -lc 'psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -AtF "|" -c "SELECT code,title,status FROM financing_brands WHERE tenant_id=(SELECT id FROM tenants WHERE code=chr(100)||chr(105)||chr(103)||chr(105)||chr(98)||chr(105)||chr(108)||chr(101)) ORDER BY code; SELECT code,display_name,status FROM commerce_suppliers WHERE tenant_id=(SELECT id FROM tenants WHERE code=chr(100)||chr(105)||chr(103)||chr(105)||chr(98)||chr(105)||chr(108)||chr(101)) ORDER BY code;"'
            echo "VAMCITY_LOOKUP_RECONCILIATION_COMPLETE=1"
