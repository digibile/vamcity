name: Read-only Sookar production schema inspection

on:
  push:
    paths:
      - .github/workflows/inspect-sookar-production-schema.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect active Sookar PostgreSQL without changing data
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          capture_stdout: true
          script: |
            set -euo pipefail
            ROOT="/home/sookar/domains/sookar.ir/negar-platform"
            echo "ROOT_EXISTS=$(test -e "$ROOT" && echo yes || echo no)"
            echo "ACTIVE_POSTGRES_COMPOSE_LABELS"
            docker inspect naf-sookar-postgres-1 --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}|{{ index .Config.Labels "com.docker.compose.project.config_files" }}'
            COMPOSE_PATH="$(docker inspect naf-sookar-postgres-1 --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}' | cut -d, -f1)"
            test -s "$COMPOSE_PATH"
            STACK_DIR="$(dirname "$COMPOSE_PATH")"
            cd "$STACK_DIR"
            echo "ACTIVE_COMPOSE_PATH=$COMPOSE_PATH"
            docker compose -f "$COMPOSE_PATH" ps --format 'table {{.Service}}\t{{.State}}'
            echo "SOOKAR_DATABASE_METADATA"
            docker compose -f "$COMPOSE_PATH" exec -T postgres sh -lc '
              set -e
              psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -AtF "|" -c "SELECT current_database(); SHOW server_version;"
              echo "SOOKAR_TABLE_ESTIMATES"
              psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -AtF "|" -c "SELECT relname,n_live_tup FROM pg_stat_user_tables ORDER BY relname;"
              echo "SOOKAR_KEY_TABLE_EXACT_COUNTS"
              for table in tenants users user_tenants user_contact_methods lendtech_applications lendtech_scores lendtech_decisions lendtech_facilities lendtech_contracts lendtech_installments lendtech_repayments lendtech_delinquencies lendtech_events accounting_documents ledger_accounts marketplace_orders products sellers stores; do
                echo "TABLE=$table"
                psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT COUNT(*) FROM public.$table" || true
              done
              echo "SOOKAR_KEY_TABLE_COLUMNS"
              for table in tenants users user_tenants user_contact_methods lendtech_applications lendtech_facilities lendtech_contracts lendtech_installments lendtech_repayments lendtech_events; do
                echo "COLUMNS=$table"
                psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "\\d public.$table" || true
              done
            '
            echo "SOOKAR_READ_ONLY_INSPECTION_COMPLETE=1"
