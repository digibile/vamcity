name: One-time VamCity identity normalization and SuperAdmin repair
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-vamcity-superadmin-once.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vamcity-superadmin-activation
  cancel-in-progress: false
jobs:
  repair-existing-identity-records:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/vamcity_deploy_key
          chmod 600 ~/.ssh/vamcity_deploy_key
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "DEPLOY_PORT_EFFECTIVE=$PORT" >> "$GITHUB_ENV"
          echo "DEPLOY_HOST_EFFECTIVE=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_USER_EFFECTIVE=$DEPLOY_USER" >> "$GITHUB_ENV"

      - name: Backup and normalize existing identity records safely
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vamcity_deploy_key -p "$DEPLOY_PORT_EFFECTIVE" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER_EFFECTIVE@$DEPLOY_HOST_EFFECTIVE" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PRIVATE=/home/roofixo/domains/roofixo.ir/vamcity-app/private
          SQL_CONTAINER=vamcity-stage-sql
          DB_NAME=vamcity_stage
          test -s "$PRIVATE/sql.env"
          SQL_PASSWORD="$(sed -n 's/^MSSQL_SA_PASSWORD=//p' "$PRIVATE/sql.env" | head -1)"
          test -n "$SQL_PASSWORD"
          SQLCMD="$(docker exec "$SQL_CONTAINER" bash -lc 'if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then echo /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then echo /opt/mssql-tools/bin/sqlcmd; fi' | tail -1)"
          test -n "$SQLCMD"
          BACKUP_FILE="/var/opt/mssql/backup/pre-identity-repair-$(date -u +%Y%m%dT%H%M%SZ).bak"
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "BACKUP DATABASE [$DB_NAME] TO DISK = N'$BACKUP_FILE' WITH COPY_ONLY, INIT, COMPRESSION;"
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "RESTORE VERIFYONLY FROM DISK = N'$BACKUP_FILE';"
          echo "VERIFIED_PRE_REPAIR_BACKUP=yes"
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "
          SET ANSI_NULLS ON;
          SET QUOTED_IDENTIFIER ON;
          SET ANSI_PADDING ON;
          SET ANSI_WARNINGS ON;
          SET ARITHABORT ON;
          SET CONCAT_NULL_YIELDS_NULL ON;
          SET NUMERIC_ROUNDABORT OFF;
          SET NOCOUNT ON;
          BEGIN TRY
            BEGIN TRANSACTION;

            IF EXISTS (
              SELECT UPPER(Name) FROM [$DB_NAME].dbo.AspNetRoles
              WHERE Name IS NOT NULL GROUP BY UPPER(Name) HAVING COUNT_BIG(*) > 1
            ) THROW 51101, 'Role names collide after normalization; no changes made.', 1;

            IF EXISTS (
              SELECT UPPER(UserName) FROM [$DB_NAME].dbo.AspNetUsers
              WHERE UserName IS NOT NULL GROUP BY UPPER(UserName) HAVING COUNT_BIG(*) > 1
            ) THROW 51102, 'User names collide after normalization; no changes made.', 1;

            DECLARE @assigned bigint = (
              SELECT COUNT_BIG(*)
              FROM [$DB_NAME].dbo.AspNetUsers u
              JOIN [$DB_NAME].dbo.AspNetUserRoles ur ON ur.UserId=u.Id
              JOIN [$DB_NAME].dbo.AspNetRoles r ON r.Id=ur.RoleId
              WHERE r.Name=N'SuperAdmin'
            );
            DECLARE @active bigint = (
              SELECT COUNT_BIG(*)
              FROM [$DB_NAME].dbo.AspNetUsers u
              JOIN [$DB_NAME].dbo.AspNetUserRoles ur ON ur.UserId=u.Id
              JOIN [$DB_NAME].dbo.AspNetRoles r ON r.Id=ur.RoleId
              WHERE r.Name=N'SuperAdmin' AND u.IsActive=1
            );
            DECLARE @inactive bigint = (
              SELECT COUNT_BIG(*)
              FROM [$DB_NAME].dbo.AspNetUsers u
              JOIN [$DB_NAME].dbo.AspNetUserRoles ur ON ur.UserId=u.Id
              JOIN [$DB_NAME].dbo.AspNetRoles r ON r.Id=ur.RoleId
              WHERE r.Name=N'SuperAdmin' AND u.IsActive=0
            );
            IF @assigned <> 1 THROW 51103, 'Expected exactly one existing SuperAdmin assignment; no changes made.', 1;
            IF @active + @inactive <> @assigned THROW 51104, 'SuperAdmin activation state is ambiguous; no changes made.', 1;

            UPDATE [$DB_NAME].dbo.AspNetRoles
              SET NormalizedName=UPPER(Name)
              WHERE Name IS NOT NULL AND (NormalizedName IS NULL OR NormalizedName<>UPPER(Name));

            UPDATE [$DB_NAME].dbo.AspNetUsers
              SET NormalizedUserName=UPPER(UserName)
              WHERE UserName IS NOT NULL AND (NormalizedUserName IS NULL OR NormalizedUserName<>UPPER(UserName));

            UPDATE [$DB_NAME].dbo.AspNetUsers
              SET NormalizedEmail=UPPER(Email)
              WHERE Email IS NOT NULL AND (NormalizedEmail IS NULL OR NormalizedEmail<>UPPER(Email));

            UPDATE u SET IsActive=1
            FROM [$DB_NAME].dbo.AspNetUsers u
            JOIN [$DB_NAME].dbo.AspNetUserRoles ur ON ur.UserId=u.Id
            JOIN [$DB_NAME].dbo.AspNetRoles r ON r.Id=ur.RoleId
            WHERE r.Name=N'SuperAdmin' AND u.IsActive=0;

            COMMIT TRANSACTION;
          END TRY
          BEGIN CATCH
            IF @@TRANCOUNT > 0 ROLLBACK TRANSACTION;
            THROW;
          END CATCH;

          SELECT 'SUPERADMIN_ACTIVE_COUNT' AS check_name, COUNT_BIG(*) AS value
          FROM [$DB_NAME].dbo.AspNetUsers u
          JOIN [$DB_NAME].dbo.AspNetUserRoles ur ON ur.UserId=u.Id
          JOIN [$DB_NAME].dbo.AspNetRoles r ON r.Id=ur.RoleId
          WHERE r.NormalizedName=N'SUPERADMIN' AND u.IsActive=1;
          SELECT 'ROLE_NORMALIZATION_MISMATCHES' AS check_name, COUNT_BIG(*) AS value
          FROM [$DB_NAME].dbo.AspNetRoles WHERE NormalizedName IS NULL OR NormalizedName<>UPPER(Name);
          SELECT 'USERNAME_NORMALIZATION_MISMATCHES' AS check_name, COUNT_BIG(*) AS value
          FROM [$DB_NAME].dbo.AspNetUsers WHERE UserName IS NOT NULL AND (NormalizedUserName IS NULL OR NormalizedUserName<>UPPER(UserName));
          "
          REMOTE
