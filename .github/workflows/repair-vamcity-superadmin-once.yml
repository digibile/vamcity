name: One-time VamCity admin access repair
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-vamcity-superadmin-once.yml"

permissions:
  contents: write

jobs:
  repair-existing-superadmin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Activate the existing SuperAdmin account without changing credentials
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_PATH: .github/workflows/repair-vamcity-superadmin-once.yml
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\\n' "$DEPLOY_SSH_KEY" > ~/.ssh/vamcity_key
          chmod 600 ~/.ssh/vamcity_key
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/vamcity_key -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          SQL_PASSWORD="$(sed -n 's/^MSSQL_SA_PASSWORD=//p' /home/roofixo/domains/roofixo.ir/vamcity-app/private/sql.env | head -1)"
          SQLCMD="$(docker exec vamcity-stage-sql bash -lc 'if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then echo /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then echo /opt/mssql-tools/bin/sqlcmd; fi' 2>/dev/null | tail -1)"
          test -n "$SQL_PASSWORD"
          test -n "$SQLCMD"
          docker exec vamcity-stage-sql "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "
            SET NOCOUNT ON;
            DECLARE @assigned int = (
              SELECT COUNT_BIG(*)
              FROM dbo.AspNetUsers u
              JOIN dbo.AspNetUserRoles ur ON ur.UserId=u.Id
              JOIN dbo.AspNetRoles r ON r.Id=ur.RoleId
              WHERE r.NormalizedName=N'SUPERADMIN'
            );
            DECLARE @active int = (
              SELECT COUNT_BIG(*)
              FROM dbo.AspNetUsers u
              JOIN dbo.AspNetUserRoles ur ON ur.UserId=u.Id
              JOIN dbo.AspNetRoles r ON r.Id=ur.RoleId
              WHERE r.NormalizedName=N'SUPERADMIN' AND u.IsActive=1
            );
            IF @assigned <> 1 THROW 51001, 'Expected exactly one existing SuperAdmin account; no changes made.', 1;
            IF @active <> 0 THROW 51002, 'SuperAdmin account already active or role assignment ambiguous; no changes made.', 1;
            UPDATE u SET IsActive=1
            FROM dbo.AspNetUsers u
            JOIN dbo.AspNetUserRoles ur ON ur.UserId=u.Id
            JOIN dbo.AspNetRoles r ON r.Id=ur.RoleId
            WHERE r.NormalizedName=N'SUPERADMIN' AND u.IsActive=0;
            IF @@ROWCOUNT <> 1 THROW 51003, 'Could not activate exactly one existing SuperAdmin account.', 1;
            SELECT 'existing_superadmin_activated' AS result, COUNT_BIG(*) AS active_count
            FROM dbo.AspNetUsers u
            JOIN dbo.AspNetUserRoles ur ON ur.UserId=u.Id
            JOIN dbo.AspNetRoles r ON r.Id=ur.RoleId
            WHERE r.NormalizedName=N'SUPERADMIN' AND u.IsActive=1;
          "
          REMOTE
          # This is a one-shot maintenance workflow. Remove its own file after the database action.
          API="https://api.github.com/repos/$REPOSITORY/contents/$WORKFLOW_PATH"
          SHA="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API" | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          curl -fsSL -X DELETE "$API" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$(python -c 'import json,os; print(json.dumps({"message":"Remove one-time VamCity access repair workflow","sha":os.environ["SHA"],"branch":"main"}))')" \
            --fail-with-body
