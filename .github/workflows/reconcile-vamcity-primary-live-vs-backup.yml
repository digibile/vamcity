name: Reconcile VamCity primary live database against restored backup

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reconcile-vamcity-primary-live-vs-backup.yml

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only source and target preflight
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            SQLC="vamcity-stage-sql"
            CONF="/usr/local/directadmin/conf/mysql.conf"
            SQLIP="$(docker inspect "$SQLC" --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')"
            PASS="$(docker inspect "$SQLC" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^MSSQL_SA_PASSWORD=//p;s/^SA_PASSWORD=//p' | head -n 1)"
            DBUSER="$(awk -F= '$1=="user"{print substr($0,index($0,"=")+1); exit}' "$CONF")"
            DBPASS="$(awk -F= '$1=="passwd" || $1=="password"{print substr($0,index($0,"=")+1); exit}' "$CONF")"
            [ -n "$SQLIP" ] && [ -n "$PASS" ] && [ -n "$DBUSER" ] && [ -n "$DBPASS" ]
            export VAMCITY_SQLSERVER_IP="$SQLIP" VAMCITY_SQLSERVER_PASSWORD="$PASS"
            export VAMCITY_MARIADB_USER="$DBUSER" VAMCITY_MARIADB_PASSWORD="$DBPASS"
            python3 - <<'PY'
            import os,json,pymssql,pymysql,shutil
            host=os.environ["VAMCITY_SQLSERVER_IP"]; password=os.environ["VAMCITY_SQLSERVER_PASSWORD"]
            source_names=["vamcityc_vamcity","vamcityc_vamcity_import_20261028"]
            c=pymssql.connect(server=host,port="1433",user="sa",password=password,database="master",login_timeout=15,timeout=300,charset="UTF-8")
            cur=c.cursor(as_dict=True)
            report={}
            for db in source_names:
              cur.execute("SELECT DB_ID(%s) AS id",(db,))
              if not cur.fetchone()["id"]:
                report[db]={"exists":False};continue
              cur.execute(f"USE [{db}]")
              cur.execute("SELECT s.name schema_name,t.name table_name FROM sys.tables t JOIN sys.schemas s ON s.schema_id=t.schema_id ORDER BY s.name,t.name")
              tables=cur.fetchall(); counts={}
              for t in tables:
                q=f"SELECT COUNT_BIG(*) AS n FROM [{t['schema_name']}].[{t['table_name']}]"
                cur.execute(q); counts[t["schema_name"]+"."+t["table_name"]]=int(cur.fetchone()["n"])
              report[db]={"exists":True,"table_count":len(tables),"total_rows":sum(counts.values()),"tables":counts}
            c.close()
            mc=pymysql.connect(unix_socket="/var/lib/mysql/mysql.sock",user=os.environ["VAMCITY_MARIADB_USER"],password=os.environ["VAMCITY_MARIADB_PASSWORD"],database="vamcitydigibilepay",connect_timeout=15,read_timeout=60)
            with mc.cursor() as cur:
              cur.execute("SELECT VERSION()"); version=cur.fetchone()[0]
              cur.execute("SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='vamcitydigibilepay' AND TABLE_TYPE='BASE TABLE'")
              target_tables=int(cur.fetchone()[0])
              cur.execute("SELECT COALESCE(SUM(TABLE_ROWS),0) FROM information_schema.TABLES WHERE TABLE_SCHEMA='vamcitydigibilepay' AND TABLE_TYPE='BASE TABLE'")
              approx_rows=int(cur.fetchone()[0])
            mc.close()
            disk=shutil.disk_usage("/")
            out={"sources":report,"target":{"version":version,"persistent_tables":target_tables,"estimated_rows_information_schema":approx_rows},"disk":{"total_bytes":disk.total,"used_bytes":disk.used,"free_bytes":disk.free}}
            a=report.get(source_names[0],{});b=report.get(source_names[1],{})
            if a.get("exists") and b.get("exists"):
              keys=sorted(set(a["tables"])|set(b["tables"]))
              out["table_differences"]=[{"table":k,"live_rows":a["tables"].get(k,0),"restored_backup_rows":b["tables"].get(k,0),"delta":a["tables"].get(k,0)-b["tables"].get(k,0)} for k in keys if a["tables"].get(k,0)!=b["tables"].get(k,0)]
              out["total_delta_live_minus_restored"]=a["total_rows"]-b["total_rows"]
            print(json.dumps(out,ensure_ascii=False,indent=2))
            print("READ_ONLY_ROWCOUNT_RECONCILIATION_COMPLETE=1")
            PY
            # Compare primary-key membership between live SQL Server and the restored
            # backup. This is read-only and emits counts only, never customer values.
            python3 - <<'PY'
            import os,json,pymssql
            live="vamcityc_vamcity"
            backup="vamcityc_vamcity_import_20261028"
            conn=pymssql.connect(server=os.environ["VAMCITY_SQLSERVER_IP"],port="1433",user="sa",
              password=os.environ["VAMCITY_SQLSERVER_PASSWORD"],database="master",
              login_timeout=15,timeout=300,charset="UTF-8")
            cur=conn.cursor(as_dict=True)
            def qi(value):
              return "["+str(value).replace("]","]]" )+"]"
            def inventory(db):
              cur.execute("USE "+qi(db))
              cur.execute("""
                SELECT s.name AS schema_name,t.name AS table_name,c.name AS column_name,
                       ic.key_ordinal
                FROM sys.tables t
                JOIN sys.schemas s ON s.schema_id=t.schema_id
                JOIN sys.indexes i ON i.object_id=t.object_id AND i.is_primary_key=1 AND i.is_disabled=0
                JOIN sys.index_columns ic ON ic.object_id=i.object_id AND ic.index_id=i.index_id AND ic.key_ordinal>0
                JOIN sys.columns c ON c.object_id=t.object_id AND c.column_id=ic.column_id
                ORDER BY s.name,t.name,ic.key_ordinal
              """)
              out={}
              for row in cur.fetchall():
                out.setdefault((row["schema_name"],row["table_name"]),[]).append(row["column_name"])
              cur.execute("SELECT s.name AS schema_name,t.name AS table_name FROM sys.tables t JOIN sys.schemas s ON s.schema_id=t.schema_id")
              tables={(x["schema_name"],x["table_name"]) for x in cur.fetchall()}
              return tables,out
            live_tables,live_pk=inventory(live)
            backup_tables,backup_pk=inventory(backup)
            common=sorted(live_tables & backup_tables)
            differences=[]
            no_pk=[]
            for schema,table in common:
              key=(schema,table)
              a=live_pk.get(key); b=backup_pk.get(key)
              if not a or not b:
                no_pk.append(schema+"."+table); continue
              if a!=b:
                differences.append({"table":schema+"."+table,"kind":"primary_key_definition_mismatch"})
                continue
              cols=", ".join(qi(x) for x in a)
              live_ref=qi(live)+"."+qi(schema)+"."+qi(table)
              backup_ref=qi(backup)+"."+qi(schema)+"."+qi(table)
              cur.execute("SELECT COUNT_BIG(*) AS n FROM (SELECT "+cols+" FROM "+backup_ref+" EXCEPT SELECT "+cols+" FROM "+live_ref+") AS d")
              backup_only=int(cur.fetchone()["n"])
              cur.execute("SELECT COUNT_BIG(*) AS n FROM (SELECT "+cols+" FROM "+live_ref+" EXCEPT SELECT "+cols+" FROM "+backup_ref+") AS d")
              live_only=int(cur.fetchone()["n"])
              if backup_only or live_only:
                differences.append({"table":schema+"."+table,"backup_only_keys":backup_only,"live_only_keys":live_only})
            result={
              "live_table_count":len(live_tables),
              "backup_table_count":len(backup_tables),
              "common_tables_compared":len(common)-len(no_pk),
              "tables_missing_from_live":sorted(".".join(x) for x in backup_tables-live_tables),
              "tables_missing_from_backup":sorted(".".join(x) for x in live_tables-backup_tables),
              "tables_without_comparable_primary_key":no_pk,
              "tables_with_key_differences":differences,
              "backup_only_key_total":sum(x.get("backup_only_keys",0) for x in differences),
              "live_only_key_total":sum(x.get("live_only_keys",0) for x in differences),
              "note":"Primary-key membership only; changed column values for matching keys are not compared."
            }
            print("PRIMARY_KEY_MEMBERSHIP_RECONCILIATION="+json.dumps(result,ensure_ascii=False,sort_keys=True))
            conn.close()
            if len(live_tables)!=88 or len(backup_tables)!=88 or no_pk or live_tables!=backup_tables:
              raise SystemExit("PRIMARY_KEY_RECONCILIATION_SCHEMA_CHECK_FAILED")
            print("READ_ONLY_PRIMARY_KEY_RECONCILIATION_COMPLETE=1")
            PY
            unset PASS DBPASS VAMCITY_SQLSERVER_PASSWORD VAMCITY_MARIADB_PASSWORD
