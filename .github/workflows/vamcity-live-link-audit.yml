name: VamCity live link audit
# Refresh live route diagnostics after Linux staging was verified.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vamcity-live-link-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Crawl public routes and check rendered links
        run: |
          set -euo pipefail
          cat > audit.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const base = 'https://roofixo.ir';
            const starts = ['/', '/login/', '/cl/login/', '/cl/register/', '/cl/agentregister/0', '/plans/0/', '/cl/plans/', '/c/lplans/0/', '/clplans/0/', '/cl/ourplans/0'];
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({ignoreHTTPSErrors:true});
            const page = await context.newPage();
            const queue = [...starts], visited = new Set(), bad = [], errors = [], httpErrors = [], authRequired = [];
            page.on('pageerror', e => errors.push('PAGEERROR '+e.message));
            page.on('console', msg => { if (msg.type() === 'error') errors.push('CONSOLE '+msg.text()); });
            page.on('response', response => {
              const url = response.url();
              if (!url.startsWith(base)) return;
              const status = response.status();
              if (status === 401 || status === 403) authRequired.push({status,url});
              else if (status === 404 || status >= 500) httpErrors.push({status,url});
            });
            while (queue.length && visited.size < 80) {
              const path = queue.shift();
              if (visited.has(path)) continue;
              visited.add(path);
              try {
                const response = await page.goto(new URL(path,base).href, {waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(1800);
                const status = response?.status() ?? 0;
                const finalUrl = page.url();
                const bodyText = (await page.locator('body').innerText().catch(()=>'' )).replace(/\\s+/g,' ').trim();
                console.log('PAGE', status, path, 'FINAL', new URL(finalUrl).pathname, 'TEXT', bodyText.length);
                if (!status || status >= 400) bad.push({path,status});
                if (status < 400 && bodyText.length < 10) bad.push({path,issue:'empty-render'});
                const hrefs = await page.locator('a[href]').evaluateAll(els => els.map(a => ({href:a.getAttribute('href'),text:(a.innerText||a.getAttribute('aria-label')||'').trim()})));
                for (const a of hrefs) {
                  if (!a.href || a.href.startsWith('javascript:') || a.href === '#') continue;
                  try {
                    const u = new URL(a.href, base);
                    if (u.origin === base) {
                      const next = u.pathname + u.search;
                      if (!visited.has(next) && queue.length < 120) queue.push(next);
                    }
                  } catch {}
                }
                const disabledButtons = await page.locator('button:disabled,[role=button][aria-disabled="true"]').count().catch(()=>0);
                if (disabledButtons) console.log('DISABLED_CONTROLS', path, disabledButtons);
              } catch(e) {
                console.log('NAV_ERROR',path,e.message);
                bad.push({path,error:e.message});
              }
            }
            console.log('PAGES_VISITED',visited.size);
            console.log('BROWSER_PAGE_ERRORS',JSON.stringify(errors));
            console.log('HTTP_404_AND_5XX',JSON.stringify([...new Map(httpErrors.map(x => [x.status+' '+x.url,x])).values()]));
            console.log('AUTH_REQUIRED_401_AND_403',JSON.stringify([...new Map(authRequired.map(x => [x.status+' '+x.url,x])).values()]));
            console.log('BROKEN_LINKS',JSON.stringify(bad));
            await browser.close();
            if (bad.length || errors.length || httpErrors.length) process.exitCode = 1;
          })();
          NODE
          node audit.cjs