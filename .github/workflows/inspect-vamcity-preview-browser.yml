name: Inspect rendered VamCity template preview
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-vamcity-preview-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Inspect preview and admin page rendering
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1000}});
            page.on('console', m => { if(m.type()==='error') console.log('CONSOLE_ERROR='+m.text()); });
            page.on('pageerror', e => console.log('PAGE_ERROR='+e.message));
            for (const path of ['/vamcity-template-preview/','/login/','/admin/','/cl/plans/']) {
              const url = 'https://roofixo.ir'+path;
              try {
                const response = await page.goto(url,{waitUntil:'networkidle',timeout:45000});
                await page.waitForTimeout(2500);
                console.log('=== PATH '+path+' ===');
                console.log('HTTP='+(response ? response.status() : 'none'));
                console.log('FINAL_URL='+page.url());
                console.log('TITLE='+await page.title());
                console.log('BODY_TEXT='+(await page.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').slice(0,4500));
                console.log('LINKS='+JSON.stringify(await page.locator('a').evaluateAll(as=>as.slice(0,100).map(a=>({text:(a.innerText||a.getAttribute('aria-label')||'').trim().slice(0,90),href:a.getAttribute('href')}))));
                if(path==='/vamcity-template-preview/') await page.screenshot({path:'/tmp/vamcity-template-preview.png',fullPage:true});
              } catch(e) { console.log('PATH_ERROR='+path+' '+e.message); }
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload preview screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vamcity-template-preview-inspection
          path: /tmp/vamcity-template-preview.png
          if-no-files-found: ignore
