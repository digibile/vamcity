# Production re-publish 2026-10-16T06:25+03:30: deploy latest integrated admin shell, full legacy sidebar, SuperAdmin navigation, settings and backup/restore routes to canonical dashboard.
name: Deploy independent VamCity template management
run-name: Publish VamCity template management preview
# Deployment refresh 2026-10-13: republish the new admin template at /admin/dashboard and verify preserved legacy feature links, login redirect compatibility, and static route response.
# Final production refresh 2026-10-13: republish integrated management shell to the existing admin URL and rerun live route/navigation checks.
# Production re-publish 2026-10-13: force a fresh deploy after browser reported stale admin UI; verify canonical /admin/dashboard and /admin/Dashboard routes.
# Reliability fix 2026-10-16: retry transient SSH resets during upload and atomic publish.
# Navigation fix 2026-10-16: route the global ticket menu to the existing admin tickets page; the legacy SuperAdmin tickets route is not registered in the Vue router.

on:
  push:
    branches: [main]
    paths:
      - "template-management/vamcity-template-management.html"
      - ".github/workflows/deploy-template-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vamcity-template-management-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Validate independent admin template
        run: |
          set -euo pipefail
          FILE="template-management/vamcity-template-management.html"
          test -s "$FILE"
          grep -qi '<html' "$FILE"
          grep -q 'id="overview"' "$FILE"
          grep -q 'مرکز مدیریت' "$FILE"
          grep -q 'class="footer-links"' "$FILE"
          grep -Fq 'href="/admin/appsettings/"' "$FILE"
          grep -Fq 'href="/admin/appbackup/"' "$FILE"
          grep -q 'id="superadmin-nav-group"' "$FILE"
          grep -Fq 'href="/superadmin/dashboard"' "$FILE"
          grep -Fq 'href="/superAdmin/customers"' "$FILE"
          grep -Fq 'href="/admin/tickets/"' "$FILE"
          grep -Fq 'href="/superAdmin/marketers"' "$FILE"
          grep -Fq 'href="/superAdmin/consultants"' "$FILE"
          grep -Fq 'href="/superAdmin/purchases"' "$FILE"
          grep -Fq 'href="/superAdmin/inquirymanagement"' "$FILE"
          grep -Fq 'href="/superAdmin/smsmanagement"' "$FILE"
          grep -Fq 'href="/superAdmin/smsPatterns/"' "$FILE"
          grep -q 'href="/cl/agentregister/0/"' "$FILE"
          grep -q 'href="/plans.html"' "$FILE"
          # The original VamCity app remains the source of operational features.
          # Validate that dashboard shortcuts open real /admin/* routes, not root-level fallbacks.
          grep -Fq 'loans:["/admin/loans/"' "$FILE"
          grep -Fq 'applications:["/admin/userLoanRequests/"' "$FILE"
          grep -Fq 'stores:["/admin/contacts/"' "$FILE"
          grep -Fq 'products:["/admin/customerOrders/"' "$FILE"
          grep -Fq 'transactions:["/admin/loanPaymentRequests"' "$FILE"
          grep -Fq 'settings:["/admin/appsettings/"' "$FILE"
          grep -Fq 'backup:["/admin/appbackup/"' "$FILE"
          echo "Independent admin template and shared navigation validated."

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY secret}"
          PORT="${DEPLOY_PORT:-22}"
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/template_preview_key
          chmod 600 ~/.ssh/template_preview_key
          ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          echo "PORT=$PORT" >> "$GITHUB_ENV"
          echo "HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "USER=$DEPLOY_USER" >> "$GITHUB_ENV"

      - name: Upload independent admin template with SSH retry
        shell: bash
        run: |
          set -euo pipefail
          DEST="$USER@$HOST:/tmp/vamcity-template-management-$GITHUB_SHA.html"
          for attempt in 1 2 3 4 5; do
            if scp -i ~/.ssh/template_preview_key -P "$PORT" \
              -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes \
              template-management/vamcity-template-management.html "$DEST"; then
              echo "TEMPLATE_UPLOAD_SUCCEEDED_ON_ATTEMPT=$attempt"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Template upload failed after 5 attempts"
              exit 1
            fi
            echo "SSH upload reset; retrying in 8 seconds (attempt $attempt/5)"
            sleep 8
          done

      - name: Publish to isolated web paths
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if ssh -i ~/.ssh/template_preview_key -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes "$USER@$HOST" \
              "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          SHA="$1"
          SRC="/tmp/vamcity-template-management-$SHA.html"
          ROOT="/home/roofixo/domains/roofixo.ir/public_html"
          DEST="$ROOT/vamcity-template-management"
          PREVIEW="$ROOT/vamcity-template-preview"
          ADMIN="$ROOT/vamcity-admin"
          test -s "$SRC"
          grep -qi '<html' "$SRC"
          grep -q 'id="overview"' "$SRC"
          grep -q 'class="footer-links"' "$SRC"
          grep -q 'href="/cl/agentregister/0/"' "$SRC"
          grep -q 'href="/plans.html"' "$SRC"
          grep -Fq "localStorage.getItem('user')" "$SRC"
          grep -Fq "window.location.replace('/login/')" "$SRC"
          install -d -m 755 "$DEST" "$PREVIEW" "$ADMIN"
          install -m 644 "$SRC" "$DEST/index.html.new"
          install -m 644 "$SRC" "$ROOT/vamcity-template-management.html.new"
          install -m 644 "$SRC" "$PREVIEW/index.html.new"
          install -m 644 "$SRC" "$ADMIN/index.html.new"
          mv -f "$DEST/index.html.new" "$DEST/index.html"
          mv -f "$ROOT/vamcity-template-management.html.new" "$ROOT/vamcity-template-management.html"
          mv -f "$PREVIEW/index.html.new" "$PREVIEW/index.html"
          mv -f "$ADMIN/index.html.new" "$ADMIN/index.html"
          test -s "$DEST/index.html"
          test -s "$ROOT/vamcity-template-management.html"
          test -s "$PREVIEW/index.html"
          test -s "$ADMIN/index.html"
          cmp -s "$SRC" "$ADMIN/index.html"
          grep -Fq "localStorage.getItem('user')" "$ADMIN/index.html"
          grep -Fq "window.location.replace('/login/')" "$ADMIN/index.html"
          rm -f "$SRC"
          echo "PUBLISHED=$ADMIN/index.html"
          echo "PUBLISHED=$DEST/index.html"
          echo "PUBLISHED=$ROOT/vamcity-template-management.html"
          echo "PUBLISHED=$PREVIEW/index.html"
          REMOTE
            then
              echo "REMOTE_PUBLISH_SUCCEEDED_ON_ATTEMPT=$attempt"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "REMOTE_PUBLISH_FAILED_AFTER_RETRIES"
              exit 1
            fi
            echo "Remote SSH reset; retrying publish in 8 seconds (attempt $attempt/5)"
            sleep 8
          done

      - name: Verify requested preview URL and expected navigation
        run: |
          set -euo pipefail
          URL="https://roofixo.ir/vamcity-template-preview/?build=$GITHUB_SHA"
          CODE="$(curl -k -sS -L --max-time 25 -o /tmp/vamcity-template-check.html -w '%{http_code}' "$URL" || true)"
          SIZE="$(wc -c < /tmp/vamcity-template-check.html 2>/dev/null || echo 0)"
          echo "$URL HTTP $CODE bytes=$SIZE"
          test "$CODE" = "200"
          test "$SIZE" -gt 30000
          grep -qi '<html' /tmp/vamcity-template-check.html
          grep -q 'id="overview"' /tmp/vamcity-template-check.html
          grep -q 'تنظیمات اپلیکیشن' /tmp/vamcity-template-check.html
          grep -q 'پشتیبان‌گیری و بازیابی' /tmp/vamcity-template-check.html
          echo "REQUESTED_PREVIEW_VERIFIED=$URL"
          grep -q "مرکز مدیریت وام‌سیتی" /tmp/vamcity-template-check.html
          grep -Fq "localStorage.getItem('user')" /tmp/vamcity-template-check.html
          echo "AUTH_GUARDED_ADMIN_TEMPLATE_VERIFIED=true"

          echo "=== VERIFY REPLACED ADMIN DASHBOARD ROUTE ==="
          ADMIN_URL="https://roofixo.ir/admin/dashboard?build=$GITHUB_SHA"
          ADMIN_CODE="$(curl -k -sS -L --max-time 25 -o /tmp/vamcity-admin-check.html -w '%{http_code}' "$ADMIN_URL")"
          ADMIN_SIZE="$(wc -c < /tmp/vamcity-admin-check.html)"
          echo "$ADMIN_URL HTTP $ADMIN_CODE bytes=$ADMIN_SIZE"
          test "$ADMIN_CODE" = "200"
          test "$ADMIN_SIZE" -gt 30000
          grep -q 'id="overview"' /tmp/vamcity-admin-check.html
          grep -q "تنظیمات اپلیکیشن" /tmp/vamcity-admin-check.html
          grep -q "پشتیبان‌گیری و بازیابی" /tmp/vamcity-admin-check.html
          grep -q "مرکز مدیریت وام‌سیتی" /tmp/vamcity-admin-check.html
          grep -q 'vamcity-admin-ui-release" content="2026-10-16-integrated-admin-v5-live-links"' /tmp/vamcity-admin-check.html
          grep -Fq "localStorage.getItem('user')" /tmp/vamcity-admin-check.html
          echo "=== VERIFY THE LEGACY CAPITALIZED LOGIN REDIRECT ROUTE ==="
          LEGACY_ADMIN_URL="https://roofixo.ir/admin/Dashboard?build=$GITHUB_SHA"
          LEGACY_ADMIN_CODE="$(curl -k -sS -L --max-time 25 -o /tmp/vamcity-admin-capital-check.html -w '%{http_code}' "$LEGACY_ADMIN_URL")"
          LEGACY_ADMIN_SIZE="$(wc -c < /tmp/vamcity-admin-capital-check.html)"
          echo "$LEGACY_ADMIN_URL HTTP $LEGACY_ADMIN_CODE bytes=$LEGACY_ADMIN_SIZE"
          test "$LEGACY_ADMIN_CODE" = "200"
          test "$LEGACY_ADMIN_SIZE" -gt 30000
          grep -q 'id="overview"' /tmp/vamcity-admin-capital-check.html
          grep -q 'vamcity-admin-ui-release" content="2026-10-16-integrated-admin-v5-live-links"' /tmp/vamcity-admin-capital-check.html
          grep -q 'href="/admin/appsettings/"' /tmp/vamcity-admin-capital-check.html
          grep -q 'href="/admin/appbackup/"' /tmp/vamcity-admin-capital-check.html
          echo "LOWERCASE_AND_LEGACY_CAPITALIZED_ADMIN_ROUTES_SERVE_V3=true"
          echo "=== VERIFY SUPERADMIN DASHBOARD USES THE SAME NEW UI ==="
          SUPERADMIN_URL="https://roofixo.ir/superadmin/dashboard?build=$GITHUB_SHA"
          SUPERADMIN_CODE="$(curl -k -sS -L --max-time 25 -o /tmp/vamcity-superadmin-check.html -w '%{http_code}' "$SUPERADMIN_URL")"
          SUPERADMIN_SIZE="$(wc -c < /tmp/vamcity-superadmin-check.html)"
          echo "$SUPERADMIN_URL HTTP $SUPERADMIN_CODE bytes=$SUPERADMIN_SIZE"
          test "$SUPERADMIN_CODE" = "200"
          test "$SUPERADMIN_SIZE" -gt 30000
          grep -q 'id="superadmin-nav-group"' /tmp/vamcity-superadmin-check.html
          grep -q 'href="/superAdmin/customers"' /tmp/vamcity-superadmin-check.html
          grep -q 'href="/superAdmin/smsPatterns/"' /tmp/vamcity-superadmin-check.html
          grep -q 'href="/admin/appsettings/"' /tmp/vamcity-superadmin-check.html
          grep -q 'href="/admin/appbackup/"' /tmp/vamcity-superadmin-check.html
          echo "SUPERADMIN_NEW_UI_ROUTE_VERIFIED=true"
          grep -q 'href="/admin/reports/"' /tmp/vamcity-admin-check.html
          grep -q 'href="/admin/loans/"' /tmp/vamcity-admin-check.html
          grep -q 'href="/admin/userLoanRequests/"' /tmp/vamcity-admin-check.html
          grep -q 'href="/admin/tickets/"' /tmp/vamcity-admin-check.html
          grep -q 'href="/admin/appbackup/"' /tmp/vamcity-admin-check.html
          grep -q 'href="#email"' /tmp/vamcity-admin-check.html
          grep -q 'id="email"' /tmp/vamcity-admin-check.html
          grep -q 'href="/admin/appsettings/"' /tmp/vamcity-admin-check.html
          grep -Fq 'href="/admin/appsettings/"' /tmp/vamcity-admin-check.html
          grep -Fq 'href="/admin/appbackup/"' /tmp/vamcity-admin-check.html
          grep -q 'class="footer-links"' /tmp/vamcity-admin-check.html
          grep -q 'href="/cl/agentregister/0/"' /tmp/vamcity-admin-check.html
          grep -q 'href="/plans.html"' /tmp/vamcity-admin-check.html
          echo "=== VERIFY ADMIN SIDEBAR TARGETS HIT THE LEGACY SPA, NOT THE PUBLIC ROOT ==="
          for ROUTE in /admin/loans/ /admin/userLoanRequests/ /admin/loanPaymentRequests /admin/members/ /admin/users/ /admin/tickets/ /admin/reports/ /admin/loanStatistics /admin/report-member-loans /admin/report-installments-month /admin/wallet-transactions /admin/checkoutThisMonth /admin/checkouted-members /admin/latestMembers /admin/remainInstallmentCount /admin/report-members /admin/report-paid-installments-month /admin/report-saveMonies-month /admin/report-monthly-balance /admin/iran-validity-reports /admin/organization-duedated-reports /admin/assurances-report /admin/agentFactors /admin/savedMoneyimport /admin/installmentsimport /admin/remainComparer /admin/contacts/ /admin/customerOrders/ /admin/inquirymanagement /admin/smslist /admin/expense /admin/appsettings/ /admin/appbackup/; do
            ROUTE_FILE="$(mktemp)"
            ROUTE_STATUS="$(curl -k -sS -L --max-time 15 -o "$ROUTE_FILE" -w '%{http_code}' "https://roofixo.ir$ROUTE?navcheck=$GITHUB_SHA" || true)"
            APP_BUNDLE="$(grep -Eo '/js/app\.[a-f0-9]+\.js' "$ROUTE_FILE" | head -1 || true)"
            echo "SIDEBAR_ROUTE=$ROUTE HTTP=$ROUTE_STATUS APP_BUNDLE=$APP_BUNDLE"
            test "$ROUTE_STATUS" = "200"
            test -n "$APP_BUNDLE"
            rm -f "$ROUTE_FILE"
          done
          echo "=== VERIFY EXISTING SUPERADMIN OPERATIONS STILL REACH THE LEGACY APP ==="
          for ROUTE in /superAdmin/customers /superAdmin/tickets /superAdmin/marketers /superAdmin/consultants /superAdmin/purchases /superAdmin/inquirymanagement /superAdmin/smsmanagement /superAdmin/smsPatterns/; do
            ROUTE_FILE="$(mktemp)"
            ROUTE_STATUS="$(curl -k -sS -L --max-time 15 -o "$ROUTE_FILE" -w '%{http_code}' "https://roofixo.ir$ROUTE?navcheck=$GITHUB_SHA" || true)"
            APP_BUNDLE="$(grep -Eo '/js/app\.[a-f0-9]+\.js' "$ROUTE_FILE" | head -1 || true)"
            echo "SUPERADMIN_LEGACY_ROUTE=$ROUTE HTTP=$ROUTE_STATUS APP_BUNDLE=$APP_BUNDLE"
            test "$ROUTE_STATUS" = "200"
            test -n "$APP_BUNDLE"
            rm -f "$ROUTE_FILE"
          done
          echo "ADMIN_DASHBOARD_NEW_UI_LEGACY_LINKS_AND_GLOBAL_NAV_VERIFIED=true"
