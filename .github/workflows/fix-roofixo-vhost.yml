name: Repair Roofixo VamCity vhost and SSL
run-name: Install persistent Roofixo VamCity routing and valid HTTPS
# Production route re-assertion 2026-10-13: reapply exact lower/upper-case admin dashboard aliases after the user reported the old UI still appearing.
# The Vue login redirects to /admin/dashboard; /admin/Dashboard must resolve to the identical standalone management shell.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-roofixo-vhost.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vamcity-roofixo-domain-publish
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          PORT="${DEPLOY_PORT:-22}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          ssh-keyscan -T 10 -p "$PORT" "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "DEPLOY_PORT_EFFECTIVE=$PORT" >> "$GITHUB_ENV"
          echo "DEPLOY_HOST_EFFECTIVE=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_USER_EFFECTIVE=$DEPLOY_USER" >> "$GITHUB_ENV"
      - name: Configure persistent per-domain Nginx template and SSL
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/deploy_key" -p "$DEPLOY_PORT_EFFECTIVE" \
            -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER_EFFECTIVE@$DEPLOY_HOST_EFFECTIVE" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          DOMAIN=roofixo.ir
          DOMAIN_CONF=/usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.conf
          GENERATED=/usr/local/directadmin/data/users/roofixo/nginx.conf
          TEMPLATE_DIR=/usr/local/directadmin/data/templates/custom
          HTTP_BASE=/usr/local/directadmin/data/templates/nginx_server.conf
          HTTPS_BASE=/usr/local/directadmin/data/templates/nginx_server_secure.conf
          CUSTOM=/usr/local/directadmin/data/users/roofixo/domains/roofixo.ir.cust_nginx
          POST_HTTP="$TEMPLATE_DIR/nginx_server.conf.CUSTOM.4.post"
          POST_HTTPS="$TEMPLATE_DIR/nginx_server_secure.conf.CUSTOM.4.post"
          CUSTOM_HTTP="$TEMPLATE_DIR/nginx_server.conf"
          CUSTOM_HTTPS="$TEMPLATE_DIR/nginx_server_secure.conf"
          BASE=/home/roofixo/domains/roofixo.ir/vamcity-app
          PRIVATE="$BASE/private"
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="$PRIVATE/rollback/roofixo-vhost-$TS"
          mkdir -p "$BACKUP" "$TEMPLATE_DIR"
          chmod 700 "$PRIVATE" "$PRIVATE/rollback" "$BACKUP"

          echo "=== PRECHECKS ==="
          test -s "$DOMAIN_CONF"
          docker inspect -f '{{.State.Running}}' vamcity-stage-app | grep -qx true
          docker inspect -f '{{.State.Running}}' vamcity-stage-sql | grep -qx true
          APP_HTTP="$(curl -sS -o /dev/null --max-time 8 -w '%{http_code}' http://127.0.0.1:5187/ || true)"
          case "$APP_HTTP" in 200|301|302|307|308) ;; *) echo "VAMCITY_APP_NOT_HEALTHY=$APP_HTTP"; exit 1 ;; esac
          DNS_IP="$(getent ahostsv4 roofixo.ir | awk 'NR==1 {print $1}')"
          DOMAIN_IP="$(awk -F= '$1=="ip" {print $2; exit}' "$DOMAIN_CONF")"
          echo "DNS_MATCHES_DIRECTADMIN_DOMAIN_IP=$([ -n "$DNS_IP" ] && [ "$DNS_IP" = "$DOMAIN_IP" ] && echo yes || echo no)"
          if [ -z "$DNS_IP" ] || [ "$DNS_IP" != "$DOMAIN_IP" ]; then
            echo "DNS_IP_MISMATCH; stopping without changing domain"
            exit 1
          fi
          nginx -t

          echo "=== DIAGNOSE BACKEND AUTH ROUTES BEFORE VHOST CHANGES ==="
          for ROUTE in /login/ /cl/login /cl/register; do
            DIAG_HEADERS="$(mktemp)"
            DIAG_BODY="$(mktemp)"
            DIAG_STATUS="$(curl -sS -D "$DIAG_HEADERS" -H 'Host: roofixo.ir' -o "$DIAG_BODY" --max-time 12 -w '%{http_code}' "http://127.0.0.1:5187$ROUTE" || true)"
            echo "BACKEND_AUTH_ROUTE=$ROUTE HTTP=$DIAG_STATUS LOCATION=$(grep -i '^location:' "$DIAG_HEADERS" | tail -1 | tr -d '\r' || true) TITLE=$(grep -oE '<title>[^<]*</title>' "$DIAG_BODY" | head -1 || true) BYTES=$(wc -c < "$DIAG_BODY") APP_BUNDLE=$(grep -Eo '/js/app\.[a-f0-9]+\.js' "$DIAG_BODY" | head -1 || true)"
            rm -f "$DIAG_HEADERS" "$DIAG_BODY"
          done

          echo "=== BACKUP CURRENT DOMAIN AND TEMPLATE STATE ==="
          cp -a "$DOMAIN_CONF" "$BACKUP/domain.conf.before"
          cp -a "$GENERATED" "$BACKUP/nginx.conf.before"
          for p in "$CUSTOM" "$POST_HTTP" "$POST_HTTPS" "$CUSTOM_HTTP" "$CUSTOM_HTTPS"; do
            name="$(basename "$p")"
            if [ -e "$p" ]; then cp -a "$p" "$BACKUP/$name.before"; echo existing > "$BACKUP/$name.state"; else echo absent > "$BACKUP/$name.state"; fi
          done
          printf '%s\n' "$BACKUP" > "$PRIVATE/last-domain-rollback-path"
          chmod 600 "$PRIVATE/last-domain-rollback-path"

          rollback_config() {
            echo "ROLLBACK_DOMAIN_AND_CUSTOM_TEMPLATES"
            cp -a "$BACKUP/domain.conf.before" "$DOMAIN_CONF"
            for p in "$CUSTOM" "$POST_HTTP" "$POST_HTTPS" "$CUSTOM_HTTP" "$CUSTOM_HTTPS"; do
              name="$(basename "$p")"
              if [ "$(cat "$BACKUP/$name.state")" = existing ]; then cp -a "$BACKUP/$name.before" "$p"; else rm -f "$p"; fi
            done
            /usr/local/directadmin/custombuild/build rewrite_confs >/dev/null 2>&1 || true
            nginx -t && systemctl reload nginx || true
          }

          echo "=== ENABLE SSL VHOST ==="
          if grep -q '^ssl=' "$DOMAIN_CONF"; then sed -i 's/^ssl=.*/ssl=ON/' "$DOMAIN_CONF"; else printf 'ssl=ON\n' >> "$DOMAIN_CONF"; fi
          if grep -q '^nginx=' "$DOMAIN_CONF"; then sed -i 's/^nginx=.*/nginx=1/' "$DOMAIN_CONF"; else printf 'nginx=1\n' >> "$DOMAIN_CONF"; fi
          rm -f "$CUSTOM" "$POST_HTTP" "$POST_HTTPS"
          mkdir -p /var/www/html/.well-known/acme-challenge
          chmod 755 /var/www/html/.well-known /var/www/html/.well-known/acme-challenge

          echo "=== WRITE DIRECTADMIN PER-DOMAIN NGINX CONFIG ==="
          cat > "$CUSTOM" <<'NGINX'
          location ^~ /.well-known/acme-challenge/ {
              alias /var/www/html/.well-known/acme-challenge/;
              default_type text/plain;
          }
          # The domain root must serve the actual VamCity public landing page,
          # including the installment calculator and all original landing sections.
          # The default location below proxies the application on port 5187.
          # Authentication and registration routes must reach the existing Vue application.
          # Do not redirect these paths to the public homepage; the app owns their behavior.
          # Legacy plans URLs must land on the working plans listing.
          location = /plans/0 {
              return 302 /cl/plans/;
          }
          location = /plans/0/ {
              return 302 /cl/plans/;
          }
          location = /clplans/0 {
              return 302 /cl/plans/;
          }
          location = /clplans/0/ {
              return 302 /cl/plans/;
          }
          location = /c/lplans/0 {
              return 302 /cl/plans/;
          }
          location = /c/lplans/0/ {
              return 302 /cl/plans/;
          }
          # Serve the new standalone VamCity admin template at its preview URL.
          # Keep this isolated path static; all authentication and legacy application routes remain proxied below.
          location = /vamcity-template-preview {
              return 301 /vamcity-template-preview/;
          }
          location = /vamcity-template-preview/ {
              root /home/roofixo/domains/roofixo.ir/public_html;
              try_files /vamcity-template-preview/index.html =404;
              default_type text/html;
              add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
              add_header Pragma "no-cache" always;
              expires -1;
          }
          # Replace only the authenticated admin dashboard landing route with the new UI.
          # Other /admin/* routes remain on the existing Vue application so current features stay reachable.
          location = /admin/dashboard {
              alias /home/roofixo/domains/roofixo.ir/public_html/vamcity-admin/index.html;
              default_type text/html;
              add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
              add_header Pragma "no-cache" always;
              expires -1;
          }
          location = /admin/dashboard/ {
              return 302 /admin/dashboard;
          }
          # Vue's legacy login redirects administrators to /admin/Dashboard (capital D).
          # Nginx exact locations are case-sensitive, so map both legacy spellings to the new UI.
          location = /admin/Dashboard {
              alias /home/roofixo/domains/roofixo.ir/public_html/vamcity-admin/index.html;
              default_type text/html;
              add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
              add_header Pragma "no-cache" always;
              expires -1;
          }
          location = /admin/Dashboard/ {
              return 302 /admin/dashboard;
          }
          # SuperAdmin's existing login handler redirects to lowercase /superadmin/dashboard.
          # Serve the same new management shell there, without changing the legacy SuperAdmin feature routes.
          location = /superadmin/dashboard {
              alias /home/roofixo/domains/roofixo.ir/public_html/vamcity-admin/index.html;
              default_type text/html;
              add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
              add_header Pragma "no-cache" always;
              expires -1;
          }
          location = /superadmin/dashboard/ {
              return 302 /superadmin/dashboard;
          }
          # Preserve case-compatible bookmarks from the original Vue application.
          location = /superAdmin/dashboard {
              alias /home/roofixo/domains/roofixo.ir/public_html/vamcity-admin/index.html;
              default_type text/html;
              add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
              add_header Pragma "no-cache" always;
              expires -1;
          }
          location = /superAdmin/dashboard/ {
              return 302 /superadmin/dashboard;
          }
          location = /admin {
              return 302 /admin/dashboard;
          }
          location = /admin/ {
              return 302 /admin/dashboard;
          }
          # Serve the dedicated public VamCity landing page at the domain root.
          # Do not send public visitors into the legacy Vue application.
          location = / {
              root /home/roofixo/domains/roofixo.ir/public_html;
              try_files /vamcity-public-home.html =404;
              default_type text/html;
              add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
              add_header Pragma "no-cache" always;
              expires -1;
          }
          # Keep the standalone public plans page alive even when this vhost workflow runs.
          # The homepage deploy workflow also manages these routes; both workflows must agree.
          location = /plans.html {
              alias /home/roofixo/domains/roofixo.ir/public_html/plans.html;
              default_type text/html;
              add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
              add_header Pragma "no-cache" always;
              expires -1;
          }
          location = /plans {
              return 302 /plans.html;
          }
          location = /plans/ {
              return 302 /plans.html;
          }
          location = /cl/plans {
              return 302 /plans.html;
          }
          location = /cl/plans/ {
              return 302 /plans.html;
          }
          # Legacy bookmarks are mapped to the real Vue SPA route names.
          location = /cl/login {
              return 302 /login/;
          }
          location = /cl/login/ {
              return 302 /login/;
          }
          location = /cl/register {
              return 302 /register/;
          }
          location = /cl/register/ {
              return 302 /register/;
          }
          # Keep the canonical login POST path exact so Nginx cannot auto-redirect
          # POST /api/token to /api/token/ (301 can drop the POST body in clients).
          # Both forms are proxied directly to the backend's canonical token endpoint.
          location = /api/token {
              proxy_pass http://127.0.0.1:5187/api/token;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header X-Forwarded-Host $host;
              proxy_connect_timeout 15s;
              proxy_send_timeout 120s;
              proxy_read_timeout 120s;
              proxy_redirect off;
          }
          # Normalize the legacy trailing-slash token endpoint as well.
          location = /api/token/ {
              proxy_pass http://127.0.0.1:5187/api/token;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header X-Forwarded-Host $host;
              proxy_connect_timeout 15s;
              proxy_send_timeout 120s;
              proxy_read_timeout 120s;
              proxy_redirect off;
          }
          location / {
              proxy_pass http://127.0.0.1:5187;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header X-Forwarded-Host $host;
              proxy_connect_timeout 15s;
              proxy_send_timeout 120s;
              proxy_read_timeout 120s;
              proxy_redirect off;
          }
          NGINX
          chown roofixo:roofixo "$CUSTOM"
          chmod 644 "$CUSTOM"
          rm -f "$POST_HTTP" "$POST_HTTPS" "$CUSTOM_HTTP" "$CUSTOM_HTTPS"

          echo "=== REWRITE THIS DIRECTADMIN USER VHOST ==="
          printf 'action=rewrite&value=nginx&user=roofixo\n' >> /usr/local/directadmin/data/task.queue
          /usr/local/directadmin/dataskq d
          if ! nginx -t; then rollback_config; exit 1; fi
          echo "=== ACTIVE AUTH LOCATIONS AFTER REWRITE ==="
          grep -n -E -A2 -B1 'location = /(login|cl/login|cl/register)|location ~.*(login|register)|return 302 /;' "$GENERATED" || true
          nginx -T 2>/dev/null | grep -n -E -B2 -A4 'location = /(login|cl/login|cl/register)|location ~.*(login|register)|return 302 /;' | head -100 || true
          if ! grep -q 'proxy_pass http://127.0.0.1:5187' "$GENERATED"; then
            echo "PER_DOMAIN_CUST_NGINX_NOT_INSERTED_IN_GENERATED_CONFIG"
            echo "CUSTOM_FILE_OWNER=$(stat -c '%U:%G %a' "$CUSTOM")"
            rollback_config
            exit 1
          fi
          if ! systemctl reload nginx; then rollback_config; exit 1; fi

          echo "=== VERIFY NEW ADMIN DASHBOARD ROUTE AND PRESERVED LEGACY MODULES ==="
          ADMIN_BODY="$(mktemp)"
          ADMIN_STATUS="$(curl -k -sS -o "$ADMIN_BODY" --max-time 15 -w '%{http_code}' "https://roofixo.ir/admin/dashboard?route-check=$TS")"
          echo "NEW_ADMIN_DASHBOARD_HTTP=$ADMIN_STATUS"
          echo "NEW_ADMIN_DASHBOARD_BYTES=$(wc -c < "$ADMIN_BODY")"
          grep -q "localStorage.getItem" "$ADMIN_BODY"
          grep -q "مرکز مدیریت وام‌سیتی" "$ADMIN_BODY"
          test "$ADMIN_STATUS" = "200"
          rm -f "$ADMIN_BODY"
          echo "=== VERIFY SUPERADMIN LOGIN LANDING ROUTE ==="
          SUPERADMIN_BODY="$(mktemp)"
          SUPERADMIN_STATUS="$(curl -k -sS -o "$SUPERADMIN_BODY" --max-time 15 -w '%{http_code}' "https://roofixo.ir/superadmin/dashboard?route-check=$TS")"
          echo "SUPERADMIN_NEW_DASHBOARD_HTTP=$SUPERADMIN_STATUS"
          test "$SUPERADMIN_STATUS" = "200"
          grep -q "مرکز مدیریت وام‌سیتی" "$SUPERADMIN_BODY"
          grep -q 'id="superadmin-nav-group"' "$SUPERADMIN_BODY"
          grep -q 'href="/superAdmin/smsPatterns/"' "$SUPERADMIN_BODY"
          grep -q 'href="/admin/appbackup/"' "$SUPERADMIN_BODY"
          rm -f "$SUPERADMIN_BODY"
          for ROUTE in /admin/appSettings /admin/appBackup; do
            LEGACY_BODY="$(mktemp)"
            LEGACY_STATUS="$(curl -k -sS -o "$LEGACY_BODY" --max-time 15 -w '%{http_code}' "https://roofixo.ir$ROUTE?route-check=$TS" || true)"
            LEGACY_BUNDLE="$(grep -Eo '/js/app\.[a-f0-9]+\.js' "$LEGACY_BODY" | head -1 || true)"
            echo "PRESERVED_LEGACY_ROUTE=$ROUTE HTTP=$LEGACY_STATUS APP_BUNDLE=$LEGACY_BUNDLE"
            if [ "$LEGACY_STATUS" != "200" ] || [ -z "$LEGACY_BUNDLE" ]; then
              rm -f "$LEGACY_BODY"
              echo "LEGACY_ADMIN_MODULE_ROUTE_FAILED=$ROUTE"
              exit 1
            fi
            rm -f "$LEGACY_BODY"
          done
          echo "NEW_ADMIN_UI_ROUTE_AND_LEGACY_MODULES_VERIFIED=true"

          echo "=== VERIFY LOGIN AND REGISTRATION ROUTES REACH THE APP ==="
          AUTH_FAILED=0
          for ROUTE in /login/ /cl/login /cl/register; do
            AUTH_HEADERS="$(mktemp)"
            AUTH_BODY="$(mktemp)"
            AUTH_STATUS="$(curl -k -L --resolve "roofixo.ir:443:$DOMAIN_IP" -sS -D "$AUTH_HEADERS" -o "$AUTH_BODY" --max-time 20 -w '%{http_code}' "https://roofixo.ir$ROUTE?route-check=$TS" || true)"
            AUTH_HAS_APP="$(grep -Eo '/js/app\.[a-f0-9]+\.js' "$AUTH_BODY" | head -1 || true)"
            echo "AUTH_ROUTE=$ROUTE HTTP=$AUTH_STATUS LOCATION=$(grep -i '^location:' "$AUTH_HEADERS" | tail -1 | tr -d '\r' || true) TITLE=$(grep -oE '<title>[^<]*</title>' "$AUTH_BODY" | head -1 || true) BYTES=$(wc -c < "$AUTH_BODY") APP_BUNDLE=$AUTH_HAS_APP"
            if [ "$AUTH_STATUS" != "200" ] || [ -z "$AUTH_HAS_APP" ]; then AUTH_FAILED=1; fi
            rm -f "$AUTH_HEADERS" "$AUTH_BODY"
          done
          if [ "$AUTH_FAILED" = "1" ]; then
            echo "AUTH_ROUTE_CHECK_FAILED; restoring previous Nginx configuration"
            rollback_config
            exit 1
          fi

          echo "=== VERIFY HTTP AND HTTPS ROUTES WITHOUT HIDING REDIRECTS ==="
          HTTP_BODY="$(mktemp)"
          HTTP_STATUS="$(curl --resolve "roofixo.ir:80:$DOMAIN_IP" -sS -o "$HTTP_BODY" --max-time 15 -w '%{http_code}' http://roofixo.ir/cl/plans/ || true)"
          echo "ROOFIXO_HTTP_PLANS_STATUS=$HTTP_STATUS"
          echo "ROOFIXO_HTTP_PLANS_BODY_BYTES=$(wc -c < "$HTTP_BODY")"
          echo "ROOFIXO_HTTP_PLANS_TITLE=$(grep -oE '<title>[^<]*</title>' "$HTTP_BODY" | head -1 || true)"
          HTTPS_PRECHECK_BODY="$(mktemp)"
          HTTPS_PRECHECK_STATUS="$(curl -k --resolve "roofixo.ir:443:$DOMAIN_IP" -sS -o "$HTTPS_PRECHECK_BODY" --max-time 15 -w '%{http_code}' https://roofixo.ir/cl/plans/ || true)"
          echo "ROOFIXO_HTTPS_PLANS_PRECHECK_STATUS=$HTTPS_PRECHECK_STATUS"
          echo "ROOFIXO_HTTPS_PLANS_PRECHECK_BYTES=$(wc -c < "$HTTPS_PRECHECK_BODY")"
          echo "ROOFIXO_HTTPS_PLANS_PRECHECK_TITLE=$(grep -oE '<title>[^<]*</title>' "$HTTPS_PRECHECK_BODY" | head -1 || true)"
          echo "NOTE=Keep the recovered route in place while diagnostics run; do not roll back to the known broken default vhost."
          rm -f "$HTTP_BODY" "$HTTPS_PRECHECK_BODY"

          echo "=== CHECK EXISTING HTTPS CERTIFICATE BEFORE REQUESTING ANOTHER ==="
          LE_RESULT=failed
          LE_ACTION=not-run
          CERT_SUMMARY="$(echo | openssl s_client -connect "$DOMAIN_IP:443" -servername roofixo.ir 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>&1 || true)"
          if echo "$CERT_SUMMARY" | grep -q 'DNS:roofixo.ir' &&
             echo "$CERT_SUMMARY" | grep -q 'DNS:www.roofixo.ir' &&
             echo | openssl s_client -connect "$DOMAIN_IP:443" -servername roofixo.ir 2>/dev/null | openssl x509 -noout -checkend 1209600 >/dev/null 2>&1; then
            LE_RESULT=success
            LE_ACTION=skipped-valid-existing-certificate
            echo "EXISTING_CERTIFICATE_VALID_FOR_AT_LEAST_14_DAYS=true"
          else
            LE_ACTION=requested
            if [ -x /usr/local/directadmin/scripts/letsencrypt.sh ]; then
              if timeout 180 /usr/local/directadmin/scripts/letsencrypt.sh request roofixo.ir 4096; then LE_RESULT=success; fi
            fi
          fi
          echo "LETSENCRYPT_REQUEST_RESULT=$LE_ACTION"
          if [ "$LE_RESULT" != success ]; then
            find /usr/local/directadmin/data/users/roofixo/domains/acme_provider_cert_logs -maxdepth 1 -type f -name 'roofixo.ir.log' -exec tail -n 50 {} \\; 2>/dev/null || true
          fi

          /usr/local/directadmin/custombuild/build rewrite_confs >/dev/null
          nginx -t
          systemctl reload nginx

          echo "=== FINAL HTTPS CERTIFICATE AND PAGE TEST ==="
          CERT_SUMMARY="$(echo | openssl s_client -connect "$DOMAIN_IP:443" -servername roofixo.ir 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>&1 || true)"
          printf '%s\n' "$CERT_SUMMARY"
          HTTPS_BODY="$(mktemp)"
          HTTPS_STATUS="$(curl --resolve "roofixo.ir:443:$DOMAIN_IP" -k -sS -L -o "$HTTPS_BODY" --max-time 25 -w '%{http_code}' https://roofixo.ir/cl/plans/ || true)"
          echo "ROOFIXO_HTTPS_PLANS_STATUS=$HTTPS_STATUS"
          echo "ROOFIXO_HTTPS_BODY_BYTES=$(wc -c < "$HTTPS_BODY")"
          echo "ROOFIXO_HTTPS_TITLE=$(grep -oE '<title>[^<]*</title>' "$HTTPS_BODY" | head -1 || true)"
          if [ "$LE_RESULT" != success ]; then echo "WARNING=HTTPS certificate issuance did not succeed; domain proxy remains configured for troubleshooting."; fi
          echo "DOMAIN_CONFIG_BACKUP=$BACKUP"
          echo "VAMCITY_APP_LOCAL_HTTP=$APP_HTTP"
          echo "VAMCITY_DOMAIN_PROXY_CONFIGURED=true"
          rm -f "$HTTPS_BODY"
          if [ "$HTTPS_STATUS" != 200 ]; then
            echo "VAMCITY_ROOFIXO_HTTPS_LIVE=false"
            exit 1
          fi
          if [ "$LE_RESULT" != success ]; then echo "WARNING=Certificate renewal did not report success; HTTPS route itself returned 200 with certificate verification disabled."; fi
          echo "VAMCITY_ROOFIXO_HTTPS_LIVE=true"

          echo "=== VERIFY MAIN DOMAIN ROOT AND PUBLIC DATA API ==="
          ROOT_BODY="$(mktemp)"
          ROOT_STATUS="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS -L --max-time 25 -o "$ROOT_BODY" -w '%{http_code}' https://roofixo.ir/)"
          echo "ROOFIXO_ROOT_STATUS=$ROOT_STATUS"
          echo "ROOFIXO_ROOT_BYTES=$(wc -c < "$ROOT_BODY")"
          echo "ROOFIXO_ROOT_TITLE=$(grep -oE '<title>[^<]*</title>' "$ROOT_BODY" | head -1 || true)"
          test "$ROOT_STATUS" = "200"
          grep -Eqi '<html' "$ROOT_BODY"
          grep -Fq '<title>وام‌سیتی | طرح‌های واقعی و خرید اقساطی</title>' "$ROOT_BODY"
          grep -q 'id="principal"' "$ROOT_BODY"
          rm -f "$ROOT_BODY"

          API_BODY="$(mktemp)"
          API_STATUS="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS --max-time 25 -o "$API_BODY" -w '%{http_code}' https://roofixo.ir/Loan/List/100)"
          echo "ROOFIXO_PUBLIC_LOAN_DATA_API_STATUS=$API_STATUS"
          test "$API_STATUS" = "200"
          python3 - "$API_BODY" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              payload = json.load(f)
          success = payload.get("success", payload.get("Success"))
          data = payload.get("data", payload.get("Data"))
          if success is not True or not isinstance(data, list) or not data:
              raise SystemExit("Public loan data API returned no valid loan records")
          print(f"ROOFIXO_PUBLIC_LOAN_DATA_OK count={len(data)}")
          PY
          rm -f "$API_BODY"
          echo "ROOFIXO_ROOT_AND_PUBLIC_DATA_VERIFIED=true"

          echo "=== VERIFY NEW ADMIN DASHBOARD ON ALL LOGIN LANDING SPELLINGS ==="
          for ADMIN_PATH in /admin/dashboard /admin/dashboard/ /admin/Dashboard /admin/Dashboard/; do
            ADMIN_BODY="$(mktemp)"
            ADMIN_STATUS="$(curl --retry 2 --retry-all-errors --retry-delay 1 -sS -L -o "$ADMIN_BODY" --max-time 15 -w '%{http_code}' "https://roofixo.ir$ADMIN_PATH")"
            ADMIN_BYTES="$(wc -c < "$ADMIN_BODY")"
            echo "ADMIN_PATH=$ADMIN_PATH HTTP=$ADMIN_STATUS BYTES=$ADMIN_BYTES"
            test "$ADMIN_STATUS" = "200"
            test "$ADMIN_BYTES" -gt 30000
            grep -q 'id="overview"' "$ADMIN_BODY"
            grep -q "مرکز مدیریت وام‌سیتی" "$ADMIN_BODY"
            grep -Fq "localStorage.getItem('user')" "$ADMIN_BODY"
            rm -f "$ADMIN_BODY"
          done
          ADMIN_ROOT_URL="$(curl -sS -L --max-time 15 -o /dev/null -w '%{url_effective}' https://roofixo.ir/admin/)"
          echo "ADMIN_ROOT_FINAL_URL=$ADMIN_ROOT_URL"
          test "$ADMIN_ROOT_URL" = "https://roofixo.ir/admin/dashboard"
          echo "NEW_ADMIN_DASHBOARD_ROUTE_VERIFIED=true"
          echo "ROOFIXO_AUTH_ROUTES_VERIFIED=true"
          echo "ROOFIXO_PUBLIC_LANDING_AT_ROOT=true"
          REMOTE
