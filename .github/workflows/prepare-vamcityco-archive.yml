name: Prepare VamCityCo archive copy on roofixo server
run-name: Create private vamcityco workspace and preserve original ZIP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-vamcityco-archive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vamcityco-archive-copy
  cancel-in-progress: false

jobs:
  prepare-private-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/vamcity_deploy_key
          chmod 600 ~/.ssh/vamcity_deploy_key
          PORT="${DEPLOY_PORT:-22}"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && test -s ~/.ssh/known_hosts; then
              break
            fi
            echo "SSH key scan failed; retrying ($attempt/5)"
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "DEPLOY_PORT_EFFECTIVE=$PORT" >> "$GITHUB_ENV"
          echo "DEPLOY_HOST_EFFECTIVE=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_USER_EFFECTIVE=$DEPLOY_USER" >> "$GITHUB_ENV"

      - name: Copy old ZIP into a new private vamcityco directory
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vamcity_deploy_key -p "$DEPLOY_PORT_EFFECTIVE" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER_EFFECTIVE@$DEPLOY_HOST_EFFECTIVE" 'bash -s' <<'REMOTE'
          set -euo pipefail
          DOMAIN_ROOT="/home/roofixo/domains/roofixo.ir"
          SOURCE="$DOMAIN_ROOT/public_html/vamcity.zip"
          DEST_DIR="$DOMAIN_ROOT/vamcityco"
          DEST="$DEST_DIR/vamcityco.zip"
          TEMP="$DEST_DIR/.vamcityco.zip.copying"

          test -s "$SOURCE"
          mkdir -p "$DEST_DIR"
          chmod 700 "$DEST_DIR"
          echo "SOURCE=$SOURCE"
          echo "SOURCE_BYTES=$(stat -c %s "$SOURCE")"
          echo "DESTINATION=$DEST"
          echo "DISK_BEFORE=$(df -h "$DOMAIN_ROOT" | tail -1)"
          if [ -e "$DEST" ]; then
            echo "DESTINATION_ALREADY_EXISTS=1"
            echo "DESTINATION_BYTES=$(stat -c %s "$DEST")"
            if [ "$(stat -c %s "$SOURCE")" = "$(stat -c %s "$DEST")" ] && cmp -s "$SOURCE" "$DEST"; then
              echo "COPY_ALREADY_VERIFIED=1"
              exit 0
            fi
            echo "ERROR: destination exists and differs; refusing to overwrite it."
            exit 2
          fi
          NEED="$(stat -c %s "$SOURCE")"
          FREE="$(df -PB1 "$DOMAIN_ROOT" | awk 'NR==2 {print $4}')"
          if [ "$FREE" -lt "$NEED" ]; then
            echo "ERROR: insufficient free disk space for a safe copy."
            exit 3
          fi
          rm -f "$TEMP"
          cp -p -- "$SOURCE" "$TEMP"
          test "$(stat -c %s "$SOURCE")" = "$(stat -c %s "$TEMP")"
          cmp -s "$SOURCE" "$TEMP"
          mv -- "$TEMP" "$DEST"
          chmod 600 "$DEST"
          echo "COPY_COMPLETE=1"
          echo "ORIGINAL_ZIP_PRESERVED=1"
          echo "DESTINATION_BYTES=$(stat -c %s "$DEST")"
          echo "DESTINATION_SHA256=$(sha256sum "$DEST" | awk '{print $1}')"
          echo "DISK_AFTER=$(df -h "$DOMAIN_ROOT" | tail -1)"
          echo "VAMCITYCO_PRIVATE_COPY_READY=1"
          REMOTE
