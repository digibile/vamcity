name: Inspect VamCity MariaDB mapping plan

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/inspect-vamcity-migration-plan.yml

permissions:
  contents: read

jobs:
  inspect-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Validate SSH configuration
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing repository secret: $name"; exit 1; fi
          done
      - name: Inspect exact mapping edge cases (metadata only)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            python3 - <<'PY'
            import json
            p=json.load(open("/home/digibail/.vamcity-migration/plan.json",encoding="utf-8"))
            cols={(c["schema_name"],c["table_name"],c["column_name"]):c for c in p["columns"]}
            filtered=[{"schema":i["schema"],"table":i["table"],"name":i["name"],"filter":i["filter"],"columns":[c["name"] for c in i["columns"]]} for i in p["indexes"] if i["filter"]]
            disabled_indexes=[i["name"] for i in p["indexes"] if i["disabled"]]
            index_types={}
            long_index_cols=[]
            for i in p["indexes"]:
                index_types[i["type"]]=index_types.get(i["type"],0)+1
                for c in i["columns"]:
                    x=cols.get((i["schema"],i["table"],c["name"]))
                    if x and x["type_name"].lower() in ("nvarchar","nchar","varchar","char") and int(x["max_length"])>768:
                        long_index_cols.append({"table":i["schema"]+"."+i["table"],"index":i["name"],"column":c["name"],"max_length_bytes":x["max_length"]})
            disabled_fks=[f["name"] for f in p["foreign_keys"] if f["disabled"]]
            actions={}
            for f in p["foreign_keys"]:
                k=f["delete"]+"/"+f["update"];actions[k]=actions.get(k,0)+1
            scales={}
            for c in p["columns"]:
                if c["type_name"].lower() in ("datetime2","datetimeoffset","time"):
                    k=c["type_name"].lower()+":"+str(c["scale"]);scales[k]=scales.get(k,0)+1
            defaults={}
            for c in p["columns"]:
                if c.get("mysql_default") is not None:
                    k=c["mysql_default"];defaults[k]=defaults.get(k,0)+1
            print(json.dumps({
              "source":p["source_database"],"target":p["target_database"],
              "table_count":len(p["tables"]),"rows":sum(t["source_rows"] for t in p["tables"]),
              "index_types":index_types,"filtered_indexes":filtered,"disabled_indexes":disabled_indexes,
              "long_index_columns_over_768_bytes":long_index_cols,
              "disabled_foreign_keys":disabled_fks,"foreign_key_actions":actions,
              "datetime_time_scales":scales,"mapped_default_expressions":defaults
            },ensure_ascii=False,indent=2))
            PY

      - name: Inspect current vamcitydigibilepay MariaDB contents without changing data
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            CONF="/usr/local/directadmin/conf/mysql.conf"
            DBUSER="$(awk -F= '$1=="user"{print substr($0,index($0,"=")+1); exit}' "$CONF")"
            DBPASS="$(awk -F= '$1=="passwd" || $1=="password"{print substr($0,index($0,"=")+1); exit}' "$CONF")"
            [ -n "$DBUSER" ] && [ -n "$DBPASS" ] || { echo "BLOCKED: DirectAdmin MariaDB credentials unavailable"; exit 20; }
            export MYSQL_PWD="$DBPASS"
            DB="vamcitydigibilepay"
            echo "=== TARGET DATABASE EXISTENCE ==="
            mysql --protocol=socket -u"$DBUSER" -Nse "SELECT SCHEMA_NAME FROM information_schema.SCHEMATA WHERE SCHEMA_NAME='$DB';"
            echo "=== OBJECT COUNTS ==="
            mysql --protocol=socket -u"$DBUSER" -Nse "SELECT 'base_tables',COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='$DB' AND TABLE_TYPE='BASE TABLE'; SELECT 'views',COUNT(*) FROM information_schema.VIEWS WHERE TABLE_SCHEMA='$DB'; SELECT 'routines',COUNT(*) FROM information_schema.ROUTINES WHERE ROUTINE_SCHEMA='$DB'; SELECT 'triggers',COUNT(*) FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA='$DB'; SELECT 'events',COUNT(*) FROM information_schema.EVENTS WHERE EVENT_SCHEMA='$DB'; SELECT 'foreign_keys',COUNT(*) FROM information_schema.REFERENTIAL_CONSTRAINTS WHERE CONSTRAINT_SCHEMA='$DB';"
            echo "=== EXACT TABLE ROW COUNTS (NO ROW VALUES) ==="
            TABLES="$(mysql --protocol=socket -u"$DBUSER" -Nse "SELECT TABLE_NAME FROM information_schema.TABLES WHERE TABLE_SCHEMA='$DB' AND TABLE_TYPE='BASE TABLE' ORDER BY TABLE_NAME;")"
            TOTAL=0
            if [ -n "$TABLES" ]; then
              while IFS= read -r T; do
                [ -n "$T" ] || continue
                Q="$(printf '%s' "$T" | sed 's/`/``/g')"
                N="$(mysql --protocol=socket -u"$DBUSER" -Nse "SELECT COUNT(*) FROM `$DB`.`$Q`;")"
                echo "TABLE_ROWS=$T|$N"
                TOTAL=$((TOTAL+N))
              done <<EOF
            $TABLES
            EOF
            fi
            echo "TOTAL_TARGET_ROWS=$TOTAL"
            echo "=== INDEX AND CONSTRAINT COUNTS ==="
            mysql --protocol=socket -u"$DBUSER" -Nse "SELECT 'indexes',COUNT(*) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA='$DB'; SELECT 'columns',COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='$DB'; SELECT 'primary_keys',COUNT(*) FROM information_schema.TABLE_CONSTRAINTS WHERE TABLE_SCHEMA='$DB' AND CONSTRAINT_TYPE='PRIMARY KEY'; SELECT 'unique_constraints',COUNT(*) FROM information_schema.TABLE_CONSTRAINTS WHERE TABLE_SCHEMA='$DB' AND CONSTRAINT_TYPE='UNIQUE';"
            unset MYSQL_PWD DBPASS
            echo "VAMCITYDIGIBILEPAY_READ_ONLY_INSPECTION_COMPLETE=1"
