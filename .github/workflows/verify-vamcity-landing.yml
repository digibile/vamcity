name: Verify VamCity public landing route

on:
  workflow_run:
    workflows: ["Deploy VamCity Linux staging on Roofixo"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-vamcity-landing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-plans-landing:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the exact requested page and its assets
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://roofixo.ir"
          PAGE="/plans/0/"
          BODY="$(mktemp)"
          HEADERS="$(mktemp)"
          trap 'rm -f "$BODY" "$HEADERS"' EXIT

          echo "=== EXACT LANDING ROUTE ==="
          STATUS="$(curl --retry 4 --retry-all-errors --retry-delay 3 -sS --max-time 25 -L -D "$HEADERS" -o "$BODY" -w '%{http_code}' "$BASE$PAGE")"
          echo "VAMCITY_LANDING_URL=$BASE$PAGE"
          echo "VAMCITY_LANDING_HTTP=$STATUS"
          test "$STATUS" = "200"
          grep -Eqi '<html[^>]*lang="fa"|<html[^>]*dir="rtl"' "$BODY"
          grep -Eqi '<title>[^<]*وام سیتی|وام سیتی' "$BODY"
          grep -Eqi 'app\.[a-f0-9]+\.js|/js/app\.' "$BODY"
          echo "VAMCITY_LANDING_HTML_OK"

          echo "=== CHECK MAIN APPLICATION ASSET ==="
          APP_JS="$(grep -Eo 'src="[^"]*app\.[a-f0-9]+\.js[^"]*"' "$BODY" | head -1 | sed -E 's/^src="//; s/"$//')"
          if [ -z "$APP_JS" ]; then
            APP_JS="$(grep -Eo 'src="[^"]*/js/app\.[^"]+\.js[^"]*"' "$BODY" | head -1 | sed -E 's/^src="//; s/"$//')"
          fi
          test -n "$APP_JS"
          ASSET_STATUS="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS --max-time 20 -o /dev/null -w '%{http_code}' "$BASE$APP_JS")"
          echo "VAMCITY_APP_JS=$APP_JS HTTP=$ASSET_STATUS"
          test "$ASSET_STATUS" = "200"

          for ASSET in /logo-wide.png /iranyekanweb.ttf /myStyle.css; do
            ASSET_STATUS="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS --max-time 20 -o /dev/null -w '%{http_code}' "$BASE$ASSET")"
            echo "VAMCITY_ASSET path=$ASSET http=$ASSET_STATUS"
            test "$ASSET_STATUS" = "200"
          done

          echo "=== PUBLIC PLANS API ==="
          API_BODY="$(mktemp)"
          trap 'rm -f "$BODY" "$HEADERS" "$API_BODY"' EXIT
          API_STATUS="$(curl --retry 3 --retry-all-errors --retry-delay 2 -sS --max-time 25 -o "$API_BODY" -w '%{http_code}' "$BASE/Loan/List/100")"
          echo "VAMCITY_PUBLIC_PLANS_API_HTTP=$API_STATUS"
          test "$API_STATUS" = "200"
          python3 - "$API_BODY" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              payload = json.load(f)
          success = payload.get("success", payload.get("Success"))
          data = payload.get("data", payload.get("Data"))
          if success is not True or not isinstance(data, list) or not data:
              raise SystemExit("Public plans API did not return a non-empty successful plan list")
          print(f"VAMCITY_PUBLIC_PLANS_API_OK count={len(data)}")
          PY
          echo "VAMCITY_LANDING_SMOKE_TEST_OK"
