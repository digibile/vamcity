name: Diagnose restored VamCity source database
run-name: Find available original database backups safely

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-restored-vamcity-db.yml"
      - ".github/workflows/deploy-vamcity-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: List backup file names and inspect safe database metadata
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -T 10 -p "$PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i "$RUNNER_TEMP/key" -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== BACKUP FILE INVENTORY (NAMES AND SIZES ONLY) ==="
          find /home/roofixo/domains/roofixo.ir -type f \( -iname '*.bak' -o -iname '*.zip' -o -iname '*.sql' -o -iname '*.7z' \) -printf '%TY-%Tm-%Td %TH:%TM %s %p\n' 2>/dev/null | sort -r | head -100
          echo "=== LIVE DATABASE SAFE SUMMARY ONLY ==="
          SQL_CONTAINER=vamcity-stage-sql
          SQL_PASSWORD="$(sed -n 's/^MSSQL_SA_PASSWORD=//p' /home/roofixo/domains/roofixo.ir/vamcity-app/private/sql.env | head -1)"
          SQLCMD="$(docker exec "$SQL_CONTAINER" bash -lc 'if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then echo /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then echo /opt/mssql-tools/bin/sqlcmd; fi' | tail -1)"
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "SET NOCOUNT ON; SELECT name,state_desc FROM sys.databases WHERE name=N'vamcity_stage'; SELECT COUNT(*) AS table_count FROM [vamcity_stage].sys.tables; SELECT COUNT(*) AS active_plan_count FROM [vamcity_stage].dbo.Loans WHERE Disable=0;" 
          echo "=== SAFE BUSINESS DATA COUNTS ==="
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -W -Q "USE [vamcity_stage]; SET NOCOUNT ON; SELECT N'Customers' AS Entity, COUNT_BIG(*) AS TotalRows FROM dbo.Customers UNION ALL SELECT N'AppSettings', COUNT_BIG(*) FROM dbo.AppSettings UNION ALL SELECT N'Users', COUNT_BIG(*) FROM dbo.AspNetUsers UNION ALL SELECT N'Roles', COUNT_BIG(*) FROM dbo.AspNetRoles UNION ALL SELECT N'Loans', COUNT_BIG(*) FROM dbo.Loans UNION ALL SELECT N'UserLoans', COUNT_BIG(*) FROM dbo.UserLoans; SELECT N'CustomersWithoutSettings' AS CheckName, COUNT_BIG(*) AS TotalRows FROM dbo.Customers c LEFT JOIN dbo.AppSettings a ON a.CustomerId=c.Id WHERE a.Id IS NULL; SELECT name AS PlanRelatedTable FROM sys.tables WHERE name LIKE N'%Plan%' OR name LIKE N'%Purchase%';"

          echo "=== ACTIVE PLAN TITLES ONLY ==="
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -W -Q "USE [vamcity_stage]; SELECT Title, PlanTitle, Disable, MaxAmount, MaxMonthGap, AllowedInstallments FROM dbo.Loans ORDER BY Title;"
          echo "=== BRAND HITS BY TABLE/COLUMN ONLY ==="
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -W -Q "USE [vamcity_stage]; SET NOCOUNT ON; DECLARE @q nvarchar(max)=N''; SELECT @q=@q+N'IF EXISTS(SELECT 1 FROM '+QUOTENAME(s.name)+N'.'+QUOTENAME(t.name)+N' WHERE TRY_CONVERT(nvarchar(max),'+QUOTENAME(c.name)+N') LIKE N''%آقای وام%'') PRINT N''HIT '+s.name+N'.'+t.name+N'.'+c.name+N'''; ' FROM sys.tables t JOIN sys.schemas s ON s.schema_id=t.schema_id JOIN sys.columns c ON c.object_id=t.object_id JOIN sys.types ty ON ty.user_type_id=c.user_type_id WHERE ty.name IN(N'nvarchar',N'varchar',N'nchar',N'char',N'text',N'ntext'); EXEC sp_executesql @q;"
          REMOTE
