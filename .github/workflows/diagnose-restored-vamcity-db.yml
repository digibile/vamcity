name: Diagnose restored VamCity source database
run-name: Find available original database backups safely

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-restored-vamcity-db.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: List backup file names and inspect safe database metadata
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/key"
          chmod 600 "$RUNNER_TEMP/key"
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -T 10 -p "$PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i "$RUNNER_TEMP/key" -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== BACKUP FILE INVENTORY (NAMES AND SIZES ONLY) ==="
          find /home/roofixo/domains/roofixo.ir -type f \( -iname '*.bak' -o -iname '*.zip' -o -iname '*.sql' -o -iname '*.7z' \) -printf '%TY-%Tm-%Td %TH:%TM %s %p\n' 2>/dev/null | sort -r | head -100
          echo "=== LIVE DATABASE BRAND AND PLAN TITLES ONLY ==="
          SQL_CONTAINER=vamcity-stage-sql
          SQL_PASSWORD="$(sed -n 's/^MSSQL_SA_PASSWORD=//p' /home/roofixo/domains/roofixo.ir/vamcity-app/private/sql.env | head -1)"
          SQLCMD="$(docker exec "$SQL_CONTAINER" bash -lc 'if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then echo /opt/mssql-tools18/bin/sqlcmd; elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then echo /opt/mssql-tools/bin/sqlcmd; fi' | tail -1)"
          docker exec "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -P "$SQL_PASSWORD" -C -b -Q "SET NOCOUNT ON; SELECT c.Name AS configured_brand FROM [vamcity_stage].dbo.AppSettings a JOIN [vamcity_stage].dbo.Customers c ON c.Id=a.CustomerId; SELECT Title,PlanTitle,IncludePlan,Disable FROM [vamcity_stage].dbo.Loans ORDER BY Code; IF OBJECT_ID(N'[vamcity_stage].dbo.AspNetUsers',N'U') IS NOT NULL AND OBJECT_ID(N'[vamcity_stage].dbo.AspNetRoles',N'U') IS NOT NULL AND OBJECT_ID(N'[vamcity_stage].dbo.AspNetUserRoles',N'U') IS NOT NULL SELECT u.Id,u.UserName,u.Email,u.PhoneNumber,u.FirstName,u.LastName,r.Name AS RoleName FROM [vamcity_stage].dbo.AspNetUsers u LEFT JOIN [vamcity_stage].dbo.AspNetUserRoles ur ON ur.UserId=u.Id LEFT JOIN [vamcity_stage].dbo.AspNetRoles r ON r.Id=ur.RoleId WHERE r.Name LIKE '%admin%' OR r.Name LIKE '%super%' OR u.UserName LIKE '%admin%' OR u.Email LIKE '%admin%' ORDER BY r.Name,u.UserName; ELSE SELECT N'Identity tables not found under default names' AS note;"
          REMOTE
