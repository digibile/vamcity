services:
  vamcity-postgres:
    image: postgres:16-alpine
    container_name: vamcity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vamcity}
      POSTGRES_USER: ${POSTGRES_USER:-vamcity_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/linux-postgresql/.env}
      TZ: UTC
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - vamcity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vamcity_app} -d ${POSTGRES_DB:-vamcity}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  vamcity_pgdata:
