<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب من | دیجی بال پی</title><style>
:root{color-scheme:light;--bg:#f7f4fb;--paper:#fff;--ink:#24163a;--muted:#756986;--line:#e8e0f0;--brand:#3b1f6b;--accent:#f5a400;--danger:#b4233b;--ok:#13795b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 10%,#efe6fb,transparent 42%),var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink);direction:rtl}
a{color:var(--brand)}.shell{width:min(100%,480px)}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:22px;font-weight:900;margin-bottom:20px}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--brand);color:var(--accent);font-size:24px}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,5vw,34px);box-shadow:0 24px 70px #29134312}h1{font-size:26px;margin:0 0 8px}p{color:var(--muted);line-height:1.9;margin:0 0 22px}.field{margin:15px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}.field input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 13px;font:inherit;outline:none;background:#fff;color:var(--ink)}.field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #3b1f6b15}.btn{width:100%;height:50px;border:0;border-radius:12px;background:var(--accent);color:#281900;font:inherit;font-weight:900;cursor:pointer;margin-top:10px}.btn:disabled{opacity:.6;cursor:wait}.hint{font-size:13px;margin-top:12px;min-height:20px;line-height:1.8;color:var(--danger)}.hint.ok{color:var(--ok)}.switch{text-align:center;margin:20px 0 0;font-size:14px}.fine{font-size:12px;margin-top:18px}.otp{display:flex;gap:8px;direction:ltr;margin:18px 0}.otp input{width:20%;height:54px;text-align:center;font-size:22px;border:1px solid var(--line);border-radius:12px}.hidden{display:none!important}.toplink{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px;font-size:13px}.badge{display:inline-block;border-radius:99px;padding:4px 10px;background:#f3edf9;color:var(--brand);font-size:12px}
.card{width:100%}.data{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{padding:14px;border:1px solid var(--line);border-radius:12px;overflow-wrap:anywhere}.item small{display:block;color:var(--muted);margin-bottom:6px}.item b{font-size:14px}.btn.secondary{background:#f1ebf9;color:var(--brand)}@media(max-width:500px){.data{grid-template-columns:1fr}}</style></head><body><main class="shell"><a class="brand" href="/"><span class="mark">د</span><span>دیجی بال پی</span></a><section class="card"><div class="toplink"><a href="/">صفحه اصلی</a><span class="badge">حساب مشتری</span></div><h1>حساب من</h1><p>اطلاعات این بخش از سرویس احراز هویت خوانده می‌شود؛ دادهٔ نمونه نمایش داده نمی‌شود.</p><div id="status" class="hint" role="status">در حال بررسی نشست…</div><div id="data" class="data hidden"></div><button id="logout" class="btn secondary" type="button">خروج از حساب</button></section></main><script>
(async function(){var status=document.getElementById('status'),data=document.getElementById('data');function out(){try{localStorage.removeItem('token');}catch(e){}location.replace('/login.html');}document.getElementById('logout').onclick=out;var token=null;try{token=localStorage.getItem('token');}catch(e){}if(!token){out();return;}try{var r=await fetch('/api/v1/Auth/me',{headers:{Authorization:'Bearer '+token},credentials:'same-origin'});var j=await r.json().catch(function(){return {};});if(!r.ok){if(r.status===401||r.status===403){out();return;}throw new Error('دریافت اطلاعات حساب ناموفق بود (HTTP '+r.status+').');}var d=j.data||j;var fields=[['نام و نام خانوادگی',d.fullName||d.name],['شماره موبایل',d.phoneNumber||d.phone],['کد ملی',d.nationalCode],['وضعیت حساب',d.status||d.accountStatus],['شناسه کاربر',d.id||d.userId]];data.innerHTML=fields.filter(function(x){return x[1]!==undefined&&x[1]!==null&&x[1]!=='';}).map(function(x){return '<div class="item"><small>'+x[0]+'</small><b></b></div>';}).join('');fields.filter(function(x){return x[1]!==undefined&&x[1]!==null&&x[1]!=='';}).forEach(function(x,i){data.children[i].querySelector('b').textContent=String(x[1]);});if(!data.children.length){data.innerHTML='<div class="item"><small>وضعیت</small><b>نشست معتبر است؛ اطلاعات کاربر در پاسخ سرویس نبود.</b></div>';}data.classList.remove('hidden');status.textContent='اطلاعات از سرور دریافت شد.';status.className='hint ok';}catch(e){status.textContent=e.message||'ارتباط با سرویس برقرار نشد.';}})();
</script></body></html>
