<script>
document.documentElement.dir='rtl';document.documentElement.lang='fa';
const fa=n=>Number(n).toLocaleString('fa-IR').replace(/,/g,'٬');
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M=n=>fa(n)+' م.ت'; // million toman shorthand
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}

/* ---------- configurable statuses & SMS rules ---------- */
const ENT={LoanApplication:'وام‌ها',Installment:'اقساط',Merchant:'پذیرنده‌ها',Agent:'نمایندگان',Kyc:'احراز هویت',FraudCheck:'بررسی تقلب'};
const FIELD={'':'بدون شرط',Amount:'مبلغ',Months:'مدت'};const OPS={gte:'≥',lte:'≤',eq:'='};
const S={
 LoanApplication:[['pending','در انتظار بررسی','p',1,0],['approved','تأیید شده','a',0,0],['issued','صدور وام','a',0,0],['completed','اتمام','m',0,1],['rejected','رد شده','r',0,1]],
 Installment:[['due','سررسید نشده','m',1,0],['paid','پرداخت شده','a',0,1],['overdue','معوق','r',0,0]],
 Merchant:[['pending','در انتظار','p',1,0],['approved','فعال','a',0,0],['rejected','رد شده','r',0,1]],
 Agent:[['pending','در انتظار','p',1,0],['approved','فعال','a',0,0],['suspended','تعلیق','r',0,0]],
 Kyc:[['pending','در انتظار','p',1,0],['verified','تأیید هویت','a',0,1],['failed','ناموفق','r',0,1]],

function lineChart(labels,series){
  const W=560,H=230,L=46,R=14,T=12,B=26,max=Math.ceil(Math.max(...series.flatMap(s=>s.v))/50)*50,n=labels.length;
  const x=i=>L+(W-L-R)*i/(n-1),y=v=>T+(H-T-B)*(1-v/max);
  let g='';for(let k=0;k<=4;k++){const v=max*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" opacity=".7"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${fa(v)}</text>`}
  const xl=labels.map((t,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" style="font-family:var(--f-body)">${t}</text>`).join('');
  const paths=series.map((s,si)=>{const d=s.v.map((v,i)=>(i?'L':'M')+x(i)+' '+y(v)).join(' ');
    const area=si===0?`<path d="${d} L${x(n-1)} ${y(0)} L${x(0)} ${y(0)} Z" fill="${s.c}" opacity=".12"/>`:'';
    const last=s.v.length-1;return area+`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(last)}" cy="${y(s.v[last])}" r="4.5" fill="${s.c}" stroke="var(--surface)" stroke-width="2"/>`}).join('');
  const hit=labels.map((t,i)=>`<rect x="${x(i)-(W-L-R)/(n-1)/2}" y="${T}" width="${(W-L-R)/(n-1)}" height="${H-T-B}" fill="transparent" data-tip="${t}||${series.map(s=>s.n+': '+fa(s.v[i])+' م.ت').join('||')}"/>`).join('');
  return `<div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')}</div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="نمودار خطی ماهانه">${g}${xl}${paths}${hit}</svg>`}
function hbars(items,color){const mx=Math.max(...items.map(i=>i[1]));return items.map(i=>`<div class="hb" data-tip="${i[0]}||${fa(i[1])} ${i[2]||''}"><span>${i[0]}</span><div class="t"><i style="width:${i[1]/mx*100}%;${color?`background:${color}`:''}"></i></div><b>${fa(i[1])}</b></div>`).join('')}

 `<div class="cols"><div class="panel"><h3>مبلغ معوق بر اساس سن (میلیون تومان)</h3>${hbars([['۱ تا ۷ روز',3],['۸ تا ۳۰ روز',5],['۳۱ تا ۶۰ روز',2],['۶۱ تا ۹۰ روز',2],['بیش از ۹۰ روز',1]],'var(--s2)')}</div></div>
 <div class="panel"><h3>فهرست معوقات</h3>`+tbl([['مشتری',o=>o[0]],['قسط',o=>o[1]],['مبلغ',o=>fa(o[2])+' ت','n'],['تأخیر',o=>`<span class="${o[3]>60?'dn':''} n">${fa(o[3])} روز</span>`],['',(o,i)=>`<button class="btn" data-co="sms:${i}">یادآوری پیامکی</button> <button class="btn" data-co="promise:${i}">ثبت وعده</button>`]],overdue)+'</div>';

V.wallet=()=>head('کیف پول و تراکنش‌ها')+tiles([['مجموع موجودی کیف پول‌ها','۸۴ م.ت'],['واریز امروز','۱۲ م.ت'],['تراکنش امروز',fa(86)]])+`<div class="panel"><div class="bar">${search('جستجو در تراکنش‌ها')}</div>`+tbl([['نوع',t=>t[0]],['طرف حساب',t=>esc(t[1])],['مبلغ',t=>`<span class="${t[3]==='+'?'up':'dn'}">${t[3]==='+'?'+':'−'}${fa(t[2])}</span>`,'n']],tx)+'</div>';

V.settle=()=>head('تسویه با پذیرنده‌ها','مانده‌ی قابل پرداخت بعد از کسر کارمزد')+`<div class="panel">`+tbl([['فروشگاه',m=>esc(m.name)],['مانده',m=>M(m.due/1e6),'n'],['کارمزد',m=>fa(m.pct)+'٪','n'],['وضعیت',m=>m.settled?'<span class="pill a">تسویه شده</span>':'<span class="pill p">آماده‌ی پرداخت</span>'],['',(m,i)=>m.settled?'':`<button class="btn solid" data-se="${i}">ثبت تسویه</button>`]],merchants.filter(m=>m.st==='approved'))+'</div>';

V.comm=()=>{const pane={rules:smsRules,logs:smsLogs}[state.cTab]();
 return head('پیامک و اعلان‌ها','وقتی وضعیت چیزی عوض شد و شرط برقرار بود، پیامک برود')+`<div class="tabs">${[['rules','قوانین'],['logs','سابقه‌ی ارسال']].map(x=>`<button class="tab" data-ct="${x[0]}" aria-selected="${state.cTab===x[0]}">${x[1]}</button>`).join('')}</div>`+pane};
function entSel(id){return `<select id="${id}">`+Object.keys(ENT).map(k=>`<option value="${k}" ${k===state.ent?'selected':''}>${ENT[k]}</option>`).join('')+'</select>'}
function smsRules(){const rows=RULES.map((r,i)=>`<tr><td>${ENT[r.ent]}<br>${pill(r.ent,r.st)}</td><td>${r.field?FIELD[r.field]+' '+OPS[r.op]+' '+fa(r.val):'همیشه'}</td><td>${r.to}</td><td style="min-width:200px">${esc(r.tpl)}</td><td><button class="btn ${r.on?'ok':''}" data-tg="${i}">${r.on?'فعال':'خاموش'}</button> <button class="btn bad" data-ds="${i}">حذف</button></td></tr>`).join('');
 const sts=S[state.ent].map(s=>`<option value="${s[0]}">${esc(s[1])}</option>`).join('');
 return `<div class="panel"><div class="scroll"><table style="min-width:680px"><thead><tr><th>وقتی</th><th>شرط</th><th>گیرنده</th><th>متن</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
 <label>قانون جدید</label><div class="frow">${entSel('entSel')}<select id="rSt">${sts}</select><select id="rCf"><option value="">بدون شرط</option><option value="Amount">مبلغ</option><option value="Months">مدت</option></select><select id="rOp"><option value="gte">≥</option><option value="lte">≤</option><option value="eq">=</option></select><input id="rVl" placeholder="مقدار" style="max-width:130px" inputmode="numeric"><select id="rTo"><option>مشتری</option><option>پذیرنده</option><option>مدیر</option></select></div>
 <label for="rTp">متن پیامک (متغیرها: {نام} {مبلغ} {مدت} {وضعیت} {کدپیگیری})</label><textarea id="rTp" rows="2" style="width:100%"></textarea><p><button class="btn solid" id="addRule">افزودن قانون</button></p></div>`}
function smsLogs(){return `<div class="panel">`+tbl([['زمان',l=>l.time],['گیرنده',l=>l.to],['مرجع',l=>esc(l.ref)],['متن',l=>esc(l.msg)],['وضعیت',l=>`<span class="pill m">${l.st}</span>`]],LOGS)+`<p class="sub">تا وصل شدن درگاه پیامک، پیام‌ها فقط در صف ثبت می‌شوند. برای دیدن نمونه، وضعیت یک وام را در بخش «درخواست‌های وام» تغییر دهید.</p></div>`}

V.tickets=()=>head('پشتیبانی','تیکت‌های مشتریان')+`<div class="panel">`+tbl([['کد',t=>t[0],'n'],['موضوع',t=>t[1]],['مشتری',t=>t[2]],['اولویت',t=>`<span class="pill ${t[3]==='بالا'?'r':t[3]==='متوسط'?'p':'m'}">${t[3]}</span>`],['وضعیت',t=>({open:'<span class="pill p">باز</span>',wip:'<span class="pill b">در حال بررسی</span>',closed:'<span class="pill m">بسته</span>'})[t[4]]],['',(t,i)=>t[4]!=='closed'?`<button class="btn" data-tk="${i}">بستن</button>`:'']],tickets)+'</div>';

V.users=()=>head('کاربران و نقش‌ها','دسترسی هر نقش به بخش‌های پنل')+`<div class="panel perm"><div class="scroll"><table><thead><tr><th>دسترسی</th>${roles.map(r=>`<th>${r}</th>`).join('')}</tr></thead><tbody>${perms.map((p,pi)=>`<tr><td>${p[0]}</td>${p[1].map((v,ri)=>`<td><input type="checkbox" data-pm="${pi}:${ri}" ${v?'checked':''} ${ri===0?'disabled':''} aria-label="${p[0]} ${roles[ri]}"></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;

V.reports=()=>head('گزارش‌ها')+`<div class="cards">${[['پرتفوی وام','مانده، سررسید و تمرکز به تفکیک محصول'],['وصول و معوقات','نرخ وصول و سن اقساط'],['عملکرد پذیرنده‌ها','فروش، کارمزد و تسویه'],['شبکه‌ی نمایندگان','مشتریان و کمیسیون هر سطح'],['ریسک و تقلب','امتیاز، علائم و تصمیم‌ها'],['صورت مالی ماهانه','درآمد کارمزد و هزینه‌ها']].map((r,i)=>`<div class="card"><h3>${r[0]}</h3><p class="sub">${r[1]}</p><button class="btn" data-rp="${r[0]}">نمایش گزارش</button></div>`).join('')}</div>`;

V.audit=()=>head('گزارش فعالیت‌ها','هر تغییر مهم با نام کاربر ثبت می‌شود')+`<div class="panel">`+tbl([['کاربر',a=>a[0]],['اقدام',a=>a[1]],['زمان',a=>a[2],'n']],audit)+'</div>';

V.settings=()=>{const t=[['tpl','قالب و محتوا'],['status','وضعیت‌ها'],['slider','اسلایدر صفحه اصلی'],['ctpl','قالب قرارداد'],['foot','تماس و فوتر'],['params','پارامترهای وام'],['gw','درگاه‌ها']];
 return head('تنظیمات')+`<div class="tabs">${t.map(x=>`<button class="tab" data-st="${x[0]}" aria-selected="${state.sTab===x[0]}">${x[1]}</button>`).join('')}</div>`+({tpl:tplPane,status:statusPane,slider:sliderPane,ctpl:ctplPane,foot:footPane,params:paramPane,gw:gwPane}[state.sTab])()};
function tplPane(){return `<div class="panel"><b>قالب صفحه اصلی</b><div class="tpl" style="margin-top:10px"><button data-t="1" aria-pressed="${state.tpl===1}">قالب ۱<small>طراحی ساده و کلاسیک</small></button><button data-t="2" aria-pressed="${state.tpl===2}">قالب ۲<small>طراحی جدید با محاسبه‌گر قسط</small></button></div>
 <label for="hero">عنوان اصلی صفحه</label><input id="hero" style="width:100%" value="همین حالا بخرید، ماه‌به‌ماه پرداخت کنید"><label for="sub">متن زیر عنوان</label><textarea id="sub" rows="3" style="width:100%">خرید اقساطی از فروشگاه‌های طرف قرارداد، بدون ضامن و بدون چک.</textarea><p><button class="btn solid" id="save">ذخیره تغییرات</button></p></div>`}
function statusPane(){const rows=S[state.ent].map((s,i)=>`<tr><td>${pill(state.ent,s[0])}</td><td class="n">${esc(s[0])}</td><td>${s[3]?'اولیه ':''}${s[4]?'پایانی':''}</td><td><button class="btn bad" data-del="${i}">حذف</button></td></tr>`).join('');
 return `<div class="panel"><label for="entSel" style="margin-top:0">وضعیت‌های کدام بخش؟</label>${entSel('entSel')}<div class="scroll" style="margin-top:12px"><table><thead><tr><th>عنوان</th><th>کلید</th><th>نوع</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
 <label>افزودن وضعیت</label><div class="frow"><input id="nsT" placeholder="عنوان، مثلاً در انتظار مدارک"><input id="nsK" placeholder="کلید انگلیسی، مثلاً docs"><select id="nsC"><option value="p">زرد</option><option value="a">سبز</option><option value="r">قرمز</option><option value="m">خاکستری</option><option value="b">آبی</option></select><label class="chk"><input type="checkbox" id="nsF"> پایانی</label><button class="btn solid" id="addSt">افزودن</button></div></div>`}
function paramPane(){return `<div class="panel"><div class="cols" style="margin:0">${[['نرخ کارمزد پیش‌فرض ماهانه (٪)','2.5'],['جریمه‌ی دیرکرد روزانه (٪)','0.1'],['مهلت بدون جریمه (روز)','3'],['حداکثر وام فعال برای هر مشتری','3'],['سقف اعتبار اولیه (م.ت)','5'],['حداقل پیش‌پرداخت (٪)','0']].map((p,i)=>`<div><label for="pp${i}">${p[0]}</label><input id="pp${i}" value="${fa(p[1])}" style="width:100%"></div>`).join('')}</div><p><button class="btn solid" id="save">ذخیره پارامترها</button></p></div>`}
function gwPane(){return `<div class="panel"><div class="cols" style="margin:0">${[['درگاه پیامک (کلید API)','kavenegar'],['درگاه پرداخت','zarinpal'],['استعلام هویت (شاهکار)','shahkar'],['اعتبارسنجی بانکی','credit-bureau']].map((g,i)=>`<div><label for="gw${i}">${g[0]}</label><input id="gw${i}" type="password" placeholder="کلید را وارد کنید" style="width:100%"><span class="sub">${g[1]} · متصل نیست</span></div>`).join('')}</div><p><button class="btn solid" id="save">ذخیره کلیدها</button></p></div>`}

/* ---------- drawer ---------- */
function openLoan(i){const l=loans[i];const d=$('#drawer');d.hidden=false;
 d.innerHTML=`<div class="top"><h2>وام #${fa(l.id)}</h2><button class="btn" id="closeD">بستن</button></div>${pill('LoanApplication',l.st)}
 <div class="kv"><span>مشتری</span><b>${esc(l.name)}</b><span>موبایل</span><b class="n">${l.phone}</b><span>پذیرنده</span><b>${esc(l.merchant)}</b><span>مبلغ</span><b class="n">${fa(l.amount)} تومان</b><span>مدت</span><b>${fa(l.months)} ماه</b><span>امتیاز اعتباری</span><b class="n">${fa(l.score)}</b></div>
 <h3>تغییر وضعیت</h3><div class="frow">${S.LoanApplication.filter(s=>s[0]!==l.st).map(s=>`<button class="btn" data-ls="${s[0]}:${i}">${esc(s[1])}</button>`).join('')}</div>
 <h3 style="margin-top:16px">سابقه</h3><ul class="tl">${l.tl.slice().reverse().map(t=>`<li>${esc(t[0])}<small>${t[1]}</small></li>`).join('')}</ul>`}
function openCust(i){const c=custs[i];const d=$('#drawer');d.hidden=false;
 d.innerHTML=`<div class="top"><h2>${esc(c.name)}</h2><button class="btn" id="closeD">بستن</button></div>${pill('Kyc',c.kyc)}
 <div class="kv"><span>موبایل</span><b class="n">${c.phone}</b><span>سقف اعتبار</span><b class="n">${fa(c.limit)} تومان</b><span>وام فعال</span><b class="n">${fa(c.active)}</b><span>امتیاز ریسک</span><b class="n">${fa(c.risk)}</b></div>
 <h3>وام‌های این مشتری</h3>${tbl([['کد',l=>fa(l.id),'n'],['مبلغ',l=>M(l.amount/1e6),'n'],['وضعیت',l=>pill('LoanApplication',l.st)]],loans.filter(l=>l.name===c.name))}`}

/* ---------- shell ---------- */
const NAV=[['نمای کلی',[['dash','داشبورد']]],['وام',[['loans','درخواست‌های وام'],['products','محصولات وام'],['scoring','موتور اعتبارسنجی'],['fraud','ریسک و تقلب'],['contracts','قراردادها'],['beta','طرح بتا (بانک رفاه)']]],
 ['مشتریان',[['customers','مشتریان'],['kyc','احراز هویت'],['binder','زونکن دیجیتال']]],['شبکه‌ی فروش',[['merchants','پذیرنده‌ها'],['agents','نمایندگان'],['orgs','سازمان‌ها']]],
 ['مالی',[['collect','اقساط و وصول'],['wallet','کیف پول'],['gate','درگاه داخلی'],['settle','تسویه']]],['ارتباطات',[['comm','پیامک و اعلان'],['tickets','پشتیبانی']]],
 ['اتصال‌ها',[['hub','مرکز اتصال‌ها'],['docs','مستندات']]],['سازنده‌ها',[['forms','فرم‌ساز'],['pages','صفحه‌ساز'],['stories','استوری‌ساز'],['repb','گزارش‌ساز']]],['سیستم',[['reports','گزارش‌ها'],['users','کاربران و نقش‌ها'],['audit','گزارش فعالیت‌ها'],['settings','تنظیمات']]]];
const BADGE={loans:()=>loans.filter(l=>l.st==='pending').length,kyc:()=>custs.filter(c=>c.kyc==='pending').length,fraud:()=>fraud.filter(f=>f[4]==='review').length,merchants:()=>merchants.filter(m=>m.st==='pending').length};
function render(){
 $('#nav').innerHTML='<div class="brand">دیجی‌بایل پی<button class="btn nvx" data-nvclose="1" aria-label="بستن منو">×</button><button class="btn dcol" data-ncoll="1" style="float:left;min-height:30px;padding:0 10px" aria-label="جمع کردن منو" title="جمع/باز کردن منو">⇔</button></div>'+NAV.map(g=>`<div class="grp">${g[0]}</div>`+g[1].map(i=>`<button data-v="${i[0]}" aria-current="${state.view===i[0]}">${i[1]}${BADGE[i[0]]&&BADGE[i[0]]()?`<span class="cnt">${fa(BADGE[i[0]]())}</span>`:''}</button>`).join('')).join('');
 $('#main').innerHTML=V[state.view]();
}
$('#nav').onclick=e=>{if(e.target.closest('[data-nvclose]')){setNav(0);return}if(e.target.closest('[data-ncoll]')){const a=document.querySelector('.app');a.classList.toggle('coll');try{localStorage.setItem('gcoll',a.classList.contains('coll')?1:0)}catch(_){}return}const b=e.target.closest('[data-v]');if(b){setNav(0);state.view=b.dataset.v;$('#drawer').hidden=true;render();window.scrollTo(0,0)}};
$('#main').addEventListener('input',e=>{
 if(e.target.id==='q'){const q=e.target.value.trim();document.querySelectorAll('#main tbody tr').forEach(tr=>tr.hidden=q&&!tr.textContent.includes(q));return}
 if(e.target.id==='inc'){state.sim.inc=+e.target.value;render();$('#inc').focus();return}
 if(e.target.id==='age'){state.sim.age=+e.target.value;render();$('#age').focus()}});
$('#main').addEventListener('change',e=>{const t=e.target;
 if(t.id==='entSel'){state.ent=t.value;render();return}
 if(t.id==='skyc'){state.sim.kyc=t.checked?1:0;render();return}
 if(t.id==='slate'){state.sim.late=t.checked?1:0;render();return}
 if(t.dataset.sc){scoring[+t.dataset.sc][2]=t.checked?1:0;return}
 if(t.dataset.pm){const[p,r]=t.dataset.pm.split(':').map(Number);perms[p][1][r]=t.checked?1:0;toast('دسترسی به‌روز شد')}});
function act(e){const t=e.target,c=s=>t.closest(s);let x;
 if(c('[data-open]')&&!c('button')){const[k,i]=c('[data-open]').dataset.open.split(':');({loan:openLoan,cust:openCust,merch:openMerch,tk:openTk}[k])(+i);return}
 if(x=c('[data-lf]')){state.lf=x.dataset.lf;render();return}
 if(x=c('[data-ls]')){const[k,i]=x.dataset.ls.split(':');const l=loans[+i];if(k==='issued'&&l.ct!=='signed'){toast('قبل از صدور وام، قرارداد باید امضا شود');return}if(k==='approved'&&l.docs.some(d=>d[1]!=='ok')){toast('همه‌ی مدارک باید تأیید شوند');return}l.st=k;l.tl.push([stDef('LoanApplication',k)[1],'همین الان']);
   const n=notify('LoanApplication',k,{name:l.name,amount:l.amount,months:l.months},'وام #'+fa(l.id));openLoan(+i);render();toast('وضعیت تغییر کرد'+(n?` · ${fa(n)} پیامک در صف`:''));return}
 if(x=c('[data-prod]')){products[+x.dataset.prod].on=!products[+x.dataset.prod].on;render();return}
 if(t.id==='addProd'){products.push({n:'محصول جدید',min:1,max:20,m:6,fee:2.5,down:10,on:false});render();toast('محصول اضافه شد');return}
 if(x=c('[data-fr]')){const[k,i]=x.dataset.fr.split(':');fraud[+i][4]=k;render();toast('ثبت شد');return}
 if(x=c('[data-ky]')){const[k,i]=x.dataset.ky.split(':');custs[+i].kyc=k;render();toast('ثبت شد');return}
 if(x=c('[data-mr]')){const[k,i]=x.dataset.mr.split(':');merchants[+i].st=k;const n=notify('Merchant',k,{},merchants[+i].name);render();toast('ثبت شد'+(n?` · ${fa(n)} پیامک در صف`:''));return}
 if(x=c('[data-cp]')){const u='https://ghestine.ir/register.html?ref='+x.dataset.cp;try{navigator.clipboard.writeText(u).then(()=>toast('لینک کپی شد'),()=>toast(u))}catch(_){toast(u)}return}
 if(x=c('[data-co]')){const[k,i]=x.dataset.co.split(':');if(k==='sms'){const o=overdue[+i];notify('Installment','overdue',{name:o[0],amount:o[2]},o[0]);toast('یادآوری در صف پیامک قرار گرفت')}else toast('وعده‌ی پرداخت ثبت شد');return}
 if(x=c('[data-se]')){const m=merchants.filter(m=>m.st==='approved')[+x.dataset.se];m.settled=true;render();toast('تسویه ثبت شد');return}
 if(x=c('[data-tk]')){tickets[+x.dataset.tk][4]='closed';render();toast('تیکت بسته شد');return}
 if(x=c('[data-rp]')){toast('گزارش «'+x.dataset.rp+'» در نسخه‌ی اصلی از سرور ساخته می‌شود');return}
 if(x=c('[data-ct]')){state.cTab=x.dataset.ct;render();return}
 if(x=c('[data-st]')){state.sTab=x.dataset.st;render();return}
 if(x=c('[data-t]')){state.tpl=+x.dataset.t;render();toast('قالب '+fa(state.tpl)+' انتخاب شد');return}
 if(x=c('[data-del]')){S[state.ent].splice(+x.dataset.del,1);render();toast('وضعیت حذف شد');return}
 if(x=c('[data-tg]')){RULES[+x.dataset.tg].on=!RULES[+x.dataset.tg].on;render();return}
 if(x=c('[data-ds]')){RULES.splice(+x.dataset.ds,1);render();return}

function slHtml(){const o=SL.opts,s=SL.slides,n=s.length;if(!n)return '<div class="empty">اسلایدی وجود ندارد.</div>';const cur=state.sli%n;

 ${o.arrows?`<button class="sld-a r" data-b="sl:step:-1" aria-label="قبلی">›</button><button class="sld-a l" data-b="sl:step:1" aria-label="بعدی">‹</button>`:''}

(()=>{
const TK=()=>window.__PTOK;
const toLogin=()=>{};
function jwt(){try{const p=TK().split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(p))))}catch(_){return null}}
const J=jwt();
if(!J||(J.exp&&J.exp*1000<Date.now())){toLogin();return}
const nm=J['http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name']||J.name||'مدیر';
const roles=[].concat(J['http://schemas.microsoft.com/ws/2008/06/identity/claims/role']||J.role||[]);
if(!roles.some(r=>r==='Admin'||r==='SuperAdmin')){document.body.innerHTML='<div style="max-width:420px;margin:15vh auto;text-align:center;font-family:inherit"><h2>دسترسی ندارید</h2><p>این پنل فقط برای مدیران است.</p><a href="/">بازگشت به سایت</a></div>';return}

 const r=await fetch(u,{method:m,headers:h,body:b?JSON.stringify(b):undefined});
 if(r.status===401){toLogin();throw new Error('نشست منقضی شد')}if(r.status===403)throw new Error('دسترسی این بخش را ندارید');
 if(raw)return r;const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&(j.message||j.title))||'خطا '+r.status);return j}

V.binder=view('d',async()=>{S.dc=await api('GET','/api/v1/admin/documents');
 return head('زونکن دیجیتال','مدارک بارگذاری‌شده‌ی مشتریان؛ فایل‌ها رمزنگاری‌شده نگهداری می‌شوند')+`<div class="panel">`+
 tbl([['نوع',d=>esc(d.kind)],['فایل',d=>esc(d.fileName)],['متن OCR',d=>d.ocrText?'دارد':'—'],['وضعیت',d=>pill(DS,d.status)],['تاریخ',d=>new Date(d.createdOn).toLocaleDateString('fa-IR')],['',d=>`<button class="btn" data-l="dview" data-i="${d.id}">بررسی</button>`]],S.dc)+`</div>`});
async function dview(id){const d=S.dc.find(x=>x.id===id);D(`<h2>${esc(d.kind)}</h2><p class="sub">${esc(d.fileName)}</p><div id="dimg" class="sub">در حال بارگذاری عکس…</div>
 <label>متن استخراج‌شده (قابل ویرایش)</label><textarea id="d_t" style="width:100%;min-height:90px">${esc(d.ocrText||'')}</textarea><label>یادداشت بررسی</label><input id="d_n" value="${esc(d.reviewNote||'')}" style="width:100%">
 <p><button class="btn solid" data-l="drev" data-i="${id}" data-k="Verified">تأیید مدرک</button> <button class="btn" data-l="drev" data-i="${id}" data-k="Rejected">رد مدرک</button></p>`);
 try{const r=await api('GET','/api/v1/admin/documents/'+id+'/file',null,true);if(!r.ok)throw 0;const u=URL.createObjectURL(await r.blob());$('#dimg').innerHTML=`<img src="${u}" alt="${esc(d.kind)}" style="max-width:100%;border-radius:10px">`}catch(e){$('#dimg').textContent='عکس در دسترس نیست'}}

V.tenants=view('t',async()=>{if(!SUPER)return head('مستأجرها و دامنه‌ها','')+'<div class="panel">این بخش فقط برای سوپرادمین است.</div>';
 S.tn=await api('GET','/api/v1/admin/tenants');
 return head('مستأجرها و دامنه‌ها','هر دامنه یک برند جدا دارد؛ بعد از افزودن، DNS و SSL را طبق راهنما تنظیم کنید','<button class="btn solid" data-l="tadd">مستأجر جدید</button>')+`<div class="panel">`+
 tbl([['نام',t=>esc(t.name)+(t.isDefault?' <span class="pill b">پیش‌فرض</span>':'')],['شناسه',t=>`<code>${esc(t.slug)}</code>`],['دامنه‌ها',t=>t.domains.map(d=>`<code>${esc(d.host)}</code> <button class="btn" data-l="ddel" data-i="${t.id}" data-k="${d.id}" aria-label="حذف دامنه">×</button>`).join('<br>')||'—'],['وضعیت',t=>`<span class="pill ${t.isActive?'a':'m'}">${t.isActive?'فعال':'غیرفعال'}</span>`],['',t=>`<button class="btn" data-l="dadd" data-i="${t.id}">افزودن دامنه</button>`]],S.tn)+`</div>`});

function sheet(t,fields,act){D(`<h2>${t}</h2>`+fields.map(f=>`<label>${f[1]}</label><input id="s_${f[0]}" style="width:100%;direction:ltr" value="${f[2]||''}">`).join('')+`<p><button class="btn solid" data-l="${act[0]}" data-i="${act[1]||''}">ثبت</button></p>`)}

document.addEventListener('click',ok(async e=>{const b=e.target.closest('[data-l]');if(!b)return;const a=b.dataset.l,i=b.dataset.i,k=b.dataset.k;
 if(a==='close'){$('#ldr').hidden=true}
 else if(a==='padd')pform();else if(a==='pedit')pform(i);else if(a==='psave')await psave(i);
 else if(a==='ptog'){await api('POST','/api/v1/admin/loan-products/'+i+'/toggle');reload()}
 else if(a==='seed'){await api('POST','/api/v1/admin/loan-products/seed');toast('ساخته شد');reload()}
 else if(a==='cview')await cview(i);else if(a==='cissue')cissue();
 else if(a==='cdo'){await api('POST','/api/v1/admin/virtual-cards/issue',{loanId:$('#i_l').value.trim(),userId:$('#i_u').value.trim(),holderName:$('#i_h').value,limit:+toEn($('#i_s').value)});toast('کارت صادر شد');$('#ldr').hidden=true;reload()}
 else if(a==='cact'){await api('POST','/api/v1/admin/virtual-cards/'+i+'/'+k);S.cd=await api('GET','/api/v1/admin/virtual-cards');await cview(i);reload()}
 else if(a==='clim'){await api('PUT','/api/v1/admin/virtual-cards/'+i+'/limit',{limit:+toEn($('#c_lim').value),perTxnLimit:+toEn($('#c_per').value)});toast('ثبت شد');S.cd=await api('GET','/api/v1/admin/virtual-cards');await cview(i)}
 else if(a==='dview')await dview(i);
 else if(a==='drev'){await api('PUT','/api/v1/admin/documents/'+i+'/review',{status:k,note:$('#d_n').value,ocrText:$('#d_t').value});toast('ثبت شد');$('#ldr').hidden=true;reload()}
 else if(a==='tadd')sheet('مستأجر جدید',[['name','نام برند','' ],['slug','شناسه‌ی انگلیسی','']],['tdo']);
 else if(a==='tdo'){await api('POST','/api/v1/admin/tenants',{name:$('#s_name').value,slug:$('#s_slug').value.trim(),brand:{logoText:($('#s_name').value||'د').charAt(0)},isActive:true});toast('ساخته شد');$('#ldr').hidden=true;reload()}
 else if(a==='dadd')sheet('افزودن دامنه',[['host','نام دامنه (مثال: pay.example.ir)','']],['ddo',i]);
 else if(a==='ddo'){const r=await api('POST','/api/v1/admin/tenants/'+i+'/domains',{host:$('#s_host').value,isPrimary:false});toast(r.nextSteps||'افزوده شد');$('#ldr').hidden=true;reload()}
 else if(a==='ddel'){if(confirm('این دامنه حذف شود؟')){await api('DELETE','/api/v1/admin/tenants/'+i+'/domains/'+k);reload()}}}));
addEventListener('keydown',e=>{if(e.key==='Escape'){const d=$('#ldr');if(d)d.hidden=true}});

/* منو: بخش‌های واقعی اضافه می‌شوند، بقیه‌ی بخش‌ها با برچسب «نمونه» می‌مانند */
const fin=NAV.find(g=>g[0]==='مالی');if(fin&&!fin[1].some(x=>x[0]==='cards'))fin[1].splice(1,0,['cards','کارت‌های مجازی']);
const sys=NAV.find(g=>g[0]==='سیستم');if(sys&&SUPER&&!sys[1].some(x=>x[0]==='tenants'))sys[1].push(['tenants','مستأجرها و دامنه‌ها']);
const LIVEV=new Set(['products','cards','binder','tenants','tplx']);
V.tplx=()=>head('قالب صفحه اصلی','انتخاب نسخه‌ی صفحه‌ی اصلی سایت')+'<div class="panel"><p>انتخاب قالب صفحه‌ی اصلی (نسخه‌ی اول، دوم و ...) در صفحه‌ی قبلی مدیریت انجام می‌شود و دست‌نخورده مانده است.</p></div>';
const sy=NAV.find(g=>g[0]==='سیستم');if(sy&&!sy[1].some(x=>x[0]==='tplx'))sy[1].unshift(['tplx','قالب صفحه اصلی']);
Object.keys(V).forEach(k=>{if(LIVEV.has(k))return;const f=V[k];V[k]=(...a)=>`<div class="panel" style="border-color:var(--warn)"><b>نمونه</b> <span class="sub">این بخش هنوز به API واقعی وصل نیست؛ اعداد و فهرست‌ها نمونه‌اند و چیزی ذخیره نمی‌شود.</span></div>`+f(...a)});
Object.keys(BADGE).forEach(k=>delete BADGE[k]);
const u=document.getElementById('tbUser');if(u)u.innerHTML=`<span class="av">${esc(nm.charAt(0))}</span><span><b>${esc(nm)}</b><small>${SUPER?'سوپرادمین':'مدیر'}</small></span>`;
openUser=function(){if(confirm('از پنل خارج می‌شوید؟')){['token','accessToken','jwt'].forEach(k=>{try{localStorage.removeItem(k)}catch(_){}});toast('در پیش‌نمایش خروج غیرفعال است')}};
const sl=document.querySelector('.tb-actions a[href^="https://ghestine.ir"]');if(sl)sl.href='/';
render();
})();

</script>
