<div style="font-family:tahoma;text-align:center;width: 90%;background-color: #eee;display: flex;justify-content: center;padding: 10px;direction:rtl">
    <div style="width:90%;margin: auto;">
        <div style="padding:15px;min-height:70px;text-align: center;">
            <img src="@URL/logo.png" style="height:70px" />
            <div style="font-weight: bold;">@TITLE</div>
        </div>
        <div style="white-space: pre-line;margin-bottom:20px;padding:15px;background-color:#fff;border:1px solid #eee;border-radius:10px;min-height:300px;color:grey;text-align:right">
            @CONTENT
        </div>
        <div style="min-height:70px;padding:15px;color:#aaaaaa;font-size:13px;">
            <div style="border-bottom: 1px solid #ddd;padding: 10px 0;margin-bottom: 20px;">
                این ایمیل از طرف پشتیبانی @TITLE ارسال شده است
            </div>
            <div style="margin-bottom: 5px;">
                @SOCIALS
            </div>
            <a href="@URL" style="color:#aaaaaa;text-decoration:none;" target="_blank">@URLNOHTTP</a>
        </div>
    </div>
</div>
